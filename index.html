  }

  /* Velocidade entre dois difusores vizinhos à distância A, na profundidade H1 (diagramas v_H1).
   * B = espaçamento entre fileiras (Infinity se fileira única). */
  function vEntre(b, A, B, H1, r, rotulo) {
    var fam = b.fam, t = b.t, notas = [], v, det, nomeDiag;
    if (fam.vh1Lei) { // VD: faixa 0,15–0,30 m/s dos diagramas 9/11/13/15, interpolada/extrapolada em log
      var l = fam.vh1Lei, Ac = A;
      if (A < l.aMin) notas.push('Espaçamento ' + F.num(A, 2) + ' m menor que o mínimo do diagrama (' + l.aMin + ' m): extrapolação');
      if (A > l.aMax) Ac = l.aMax;
      var fh = interp(l.fH, Math.max(H1, 0.1));
      if (H1 < fam.h1ref) { fh = fam.h1ref / H1; notas.push('H1 = ' + F.num(H1, 2) + ' m abaixo do diagrama (mín. ' + fam.h1ref + ' m): extrapolação por 1/H1'); }
      v = t.c * Math.pow(b.V, l.expV) * Math.pow(Ac / l.aRef, -l.expA) * fh * b.fm;
      nomeDiag = 'diagrama de espaçamento (faixa 0,15–0,30 m/s)';
      det = 'v = ' + F.num(t.c * 1e4, 2) + '·10⁻⁴ · ' + F.num(b.V, 0) + '^1,2 · (' + F.num(Ac, 2) + '/2)^−1,2 · ' + F.num(fh, 3) + ' · ' + F.num(b.fm, 2);
      if (v > 0.30 || v < 0.15) notas.push('v_H1 fora da faixa 0,15–0,30 m/s do diagrama do VD: valor extrapolado pelas fronteiras da faixa');
    } else {
      var quad = t.quad && isFinite(B) && Math.abs(A - B) <= 0.15 * Math.max(A, B);
      var multi = !quad && isFinite(B) && B < fam.bUnica;
      var chave = quad ? 'quad' : (multi ? 'multi' : 'unica'), g = t[chave], grade = g.A || t.A, vref, niv;
      nomeDiag = quad ? 'arranjo quadrado (A = B)' : (multi ? 'várias fileiras (B ≈ ' + F.num((fam.bMulti[0] + fam.bMulti[1]) / 2, 1) + ' m)' : 'fileira única ou B ≥ ' + F.num(fam.bUnica, 0) + ' m');
      if (multi && (B < fam.bMulti[0] - 1e-9 || B > fam.bMulti[1] + 1e-9)) notas.push('Distância entre fileiras B = ' + F.num(B, 2) + ' m fora da faixa do diagrama de várias fileiras (' + F.num(fam.bMulti[0], 1) + '–' + F.num(fam.bMulti[1], 1) + ' m)');
      if (A < grade[0] - 1e-9) notas.push('Espaçamento ' + F.num(A, 2) + ' m menor que o mínimo do diagrama (' + F.num(grade[0], 1) + ' m): usado o valor do extremo');
      if (quad) { // tabela por vazão
        var cs = g.curvas;
        vref = nivel(cs.map(function (c) { return [c[0], interp(pares(grade, c[1]), A)]; }), b.V, notas, b.un); niv = 1;
      } else {
        vref = interp(pares(grade, g.v), A);
        niv = nivel(g.niv, b.V, notas, b.un);
      }
      var exp = fam.expH1[chave], fh2 = fH1(t.h1ref, t.h1max, exp, H1, notas);
      v = vref * niv * fh2 * b.fm;
      det = 'v = ' + F.num(vref, 3) + (quad ? '' : ' · ' + F.num(niv, 3)) + ' · (' + F.num(t.h1ref, 1) + '/' + F.num(Math.min(H1, t.h1max), 2) + ')^' + F.num(exp, 2) + ' · ' + F.num(b.fm, 2);
    }
    if (r) {
      r.passo({ grupo: 'zona', titulo: 'Velocidade entre dois difusores (v_H1) — ' + rotulo, formula: 'v_H1 = f(V, A, H1) — ' + nomeDiag, subst: det + ' ; A = ' + F.num(A, 2) + ' m' + (isFinite(B) ? ', B = ' + F.num(B, 2) + ' m' : '') + ', H1 = ' + F.num(H1, 2) + ' m', valor: v, unidade: 'm/s', casas: 3,
        fonte: fam.fonte + ', ' + fam.pagJato + ' — ' + b.famId + ' ' + t.rotulo + (t.pag ? ' (p. ' + t.pag + ')' : '') + '; ' + fam.notaMontagem });
      notas.forEach(function (n) { r.estimado('Velocidade entre difusores: ' + n); });
    }
    return { v: v, notas: notas };
  }

  D.motor.altaInducao = { familia: familia, terminal: terminal, fA: fA, transversal: transversal, vParede: vParede, vEntre: vEntre, interp: interp, ENT: ENT };
})(window.Difusores);

</script>
<script>
/* ==== js/motor/verificacoes.js ==== */
/* Verificações normativas: cada item traz critério, valor, limite, folga,
 * situação (atende / alerta / reprova / na) e norma de origem. */
(function (D) {
  'use strict';
  var F = D.util.fmt;

  /* Monta um item de verificação.
   * o = { id, criterio, valor, limite, tipo: 'max'|'min'|'faixa', min, max,
   *       casas, unidade, falha: 'reprova'|'alerta', fonte, obs } */
  function item(o) {
    var sit = 'atende', folga = null, lim = '';
    var casas = o.casas === undefined ? 2 : o.casas, u = o.unidade || '';
    if (o.valor === null || o.valor === undefined || isNaN(o.valor)) {
      sit = 'na';
    } else if (o.tipo === 'max') {
      lim = '≤ ' + F.numU(o.limite, casas, u);
      folga = (o.limite - o.valor) / Math.abs(o.limite || 1);
      if (o.valor > o.limite + 1e-12) sit = o.falha || 'reprova';
    } else if (o.tipo === 'min') {
      lim = '≥ ' + F.numU(o.limite, casas, u);
      folga = (o.valor - o.limite) / Math.abs(o.limite || 1);
      if (o.valor < o.limite - 1e-12) sit = o.falha || 'reprova';
    } else if (o.tipo === 'faixa') {
      lim = F.num(o.min, casas) + ' a ' + F.numU(o.max, casas, u);
      if (o.valor > o.max + 1e-12) sit = o.falhaAcima || o.falha || 'reprova';
      else if (o.valor < o.min - 1e-12) sit = o.falhaAbaixo || o.falha || 'alerta';
    } else if (o.tipo === 'info') {
      sit = o.situacao || 'alerta';
      lim = o.limiteTxt || '';
    }
    return {
      id: o.id, criterio: o.criterio, valor: o.valor, valorTxt: o.valorTxt || (o.valor == null ? '—' : F.numU(o.valor, casas, u)),
      limiteTxt: o.limiteTxt || lim, folga: folga, situacao: sit, fonte: o.fonte || '', obs: o.obs || ''
    };
  }

  function resumo(lista) {
    var r = { reprova: [], alerta: [], atende: [], na: [] };
    lista.forEach(function (v) { (r[v.situacao] || r.na).push(v); });
    return r;
  }

  D.motor.verificacoes = { item: item, resumo: resumo };
})(window.Difusores);

</script>
<script>
/* ==== js/motor/indice.js ==== */
/* Índice global (0–100), fatores e selo — metodologia de referência, seção 9,
 * com as parcelas revistas para privilegiar soluções de engenharia:
 * - zona ocupada: pontuação cheia com folga de 25 % em relação ao limite (não premia v → 0);
 * - velocidade na boca: neutra entre a mínima e o máximo da aplicação (v2.1.2, item B3);
 * - economia de peças relativa à área do ambiente;
 * - retorno: distribuição (mínimo, fragmentação, cobertura, grelhas vazias) e curto-circuito;
 *   velocidade de face com nota cheia numa faixa (v2.1.2, item A4).
 * Ordem do insuflamento (v2.1.2, item A1): entre candidatos a poucos pontos do líder vence o de menos
 * peças, desde que não tenha mais alertas que o líder. As folgas que dão a parcela cheia, a faixa do
 * desempate e os fatores são números de config.js.
 * v2.1.3 (quadro de 2026-10-07, critério do app, sem norma): peso do T50/L 20 e das peças 20 (as faixas de
 * T50/L só têm fonte secundária e a seleção da TROX não usa T50/L); faixa do desempate de 5 pontos; o alerta
 * de corrente de ar (id draft) não conta na guarda do desempate, porque o limite que vale é o de velocidade da
 * NBR 16401-2:2024, 6.3.2.4 (segue no fator de 3 % por alerta); acima do máximo da faixa de T50/L a nota cai
 * de 0,5 a 0 até máx ÷ 0,7 (Fundamentals 2021, cap. 20, p. 20.5: redução de 30 % na zona 4). */
(function (D) {
  'use strict';
  var F = D.util.fmt;

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  // Limite de cima do T50/L para a nota e para o alerta: máximo da faixa ÷ t50LReducaoZona4 (sem o número: o próprio máximo)
  function limSupT50L(faixa) {
    var k = D.motor.config.indice.t50LReducaoZona4;
    return k > 0 && k < 1 ? faixa.max / k : faixa.max;
  }

  // Aderência à faixa recomendada de T50/L (Titus 2018, Tabela 4, fonte secundária): 1 no ótimo, 0,5 nas bordas, 0 abaixo do mínimo;
  // acima do máximo cai em linha reta de 0,5 a 0 até o limite de cima (v2.1.3) e é 0 depois
  function fT50L(r, faixa) {
    if (r == null || isNaN(r)) return null;
    if (r < faixa.min - 1e-12) return 0; // mesma tolerância da verificação (selecao.js)
    if (r > faixa.max + 1e-12) { var lim = limSupT50L(faixa); return lim > faixa.max && r <= lim ? 0.5 * (lim - r) / (lim - faixa.max) : 0; }
    var lado = r < faixa.otimo ? (faixa.otimo - faixa.min) : (faixa.max - faixa.otimo);
    return 1 - 0.5 * Math.abs(r - faixa.otimo) / (lado || 1);
  }

  function selo(verifs, marcas) {
    var reprova = verifs.filter(function (v) { return v.situacao === 'reprova'; });
    if (reprova.length) return 'reprovado';
    if (marcas.estimados.length || marcas.estendidos.length) return 'ressalva';
    return 'aprovado';
  }

  /* ignora: ids de verificação que não entram na contagem (guarda do desempate) */
  function nAlertas(x, ignora) { return x.verifs.filter(function (v) { return v.situacao === 'alerta' && !(ignora && ignora.indexOf(v.id) >= 0); }).length; }

  /* fEst: fator de "dado estimado" (1 = a marca fica só no selo, sem mexer na nota) */
  function aplicarFatores(base, verifs, marcas, cfg, parcelas, fEst) {
    var total = base, fatores = [];
    if (verifs.some(function (v) { return v.situacao === 'reprova'; })) { total *= cfg.fatorReprova; fatores.push({ nome: 'Reprovação em verificação', fator: cfg.fatorReprova }); }
    var nAl = verifs.filter(function (v) { return v.situacao === 'alerta'; }).length;
    if (nAl && cfg.fatorAlerta < 1) { var fa = Math.pow(cfg.fatorAlerta, nAl); total *= fa; fatores.push({ nome: 'Alerta(s) em verificação (' + nAl + ')', fator: fa }); }
    if (marcas.estimados.length && fEst !== 1) { total *= fEst; fatores.push({ nome: 'Dado estimado', fator: fEst }); }
    if (marcas.estendidos.length) { total *= cfg.fatorEstendido; fatores.push({ nome: 'Regra estendida', fator: cfg.fatorEstendido }); }
    return { total: total, base: base, parcelas: parcelas, fatores: fatores };
  }

  /* m: métricas do candidato de insuflamento; ctx: contexto do ambiente (dbaMax, dpMax, vzoMax, area) */
  function insuflamento(m, ctx, verifs, marcas) {
    var cfg = D.motor.config.indice, c = D.motor.config, p = [];
    var w = cfg.pesosInsuflamento;
    // T50/L nos dois eixos: vale a pior aderência entre a razão mínima e a máxima
    var tMax = m.t50LMax == null ? m.t50L : m.t50LMax, fMin = fT50L(m.t50L, m.faixaT50L), fMax = fT50L(tMax, m.faixaT50L);
    var f1 = m.altaInducao ? cfg.t50LAltaInducao : (fMin === null || fMax === null ? null : Math.min(fMin, fMax));
    p.push({ nome: 'Aderência T50/L à faixa recomendada', max: w.t50L, f: f1 === null ? 0.5 : f1, det: m.altaInducao ? 'alta indução: ADPI × T50/L não tabelado para jato rotacional — nota fixa ' + F.num(cfg.t50LAltaInducao, 2) + ' (a distribuição é verificada por v_L e v_H1 do catálogo)' : m.t50L == null ? 'sem valor — neutro' : 'T50/L = ' + F.num(m.t50L, 2) + (Math.abs(tMax - m.t50L) > 1e-9 ? ' a ' + F.num(tMax, 2) + ' (menor e maior entre as direções; vale a pior aderência)' : '') + ' (faixa ' + F.num(m.faixaT50L.min, 1) + '–' + F.num(m.faixaT50L.max, 1) + ', ótimo ' + F.num(m.faixaT50L.otimo, 1) + (limSupT50L(m.faixaT50L) > m.faixaT50L.max ? '; acima do máximo a nota cai de 0,5 a 0 até ' + F.num(limSupT50L(m.faixaT50L), 2) : '') + ')' });
    var fa = clamp((ctx.dbaMax - m.lp) / cfg.folgaAcustica, 0, 1);
    p.push({ nome: 'Folga acústica', max: w.acustica, f: fa, det: 'Lp = ' + F.num(m.lp, 1) + ' dB(A) × limite ' + F.num(ctx.dbaMax, 0) + ' dB(A) (1,0 com ' + F.num(cfg.folgaAcustica, 0) + ' dB de folga)' });
    var fd = clamp((1 - m.dp / ctx.dpMax) / cfg.folgaDp, 0, 1);
    p.push({ nome: 'Folga de perda de carga', max: w.dp, f: fd, det: 'Δp = ' + F.num(m.dp, 2) + ' × limite ' + F.num(ctx.dpMax, 2) + ' mmCA' + (cfg.folgaDp < 1 ? ' (1,0 até ' + F.num((1 - cfg.folgaDp) * 100, 0) + ' % do limite)' : '') });
    var mz = cfg.margemZona, fz = m.alturaOk ? clamp((ctx.vzoMax - m.vzo) / (mz * ctx.vzoMax), 0, 1) : 0;
    p.push({ nome: 'Zona ocupada e altura', max: w.zona, f: fz, det: 'v_zo = ' + F.num(m.vzo, 2) + ' × limite ' + F.num(ctx.vzoMax, 2) + ' m/s (1,0 até ' + F.num((1 - mz) * 100, 0) + ' % do limite, 0 no limite); alcance ' + (m.alturaOk ? 'dentro' : 'fora') + ' do limite de altura' });
    var cl = m.faixaFace.classe, fc;
    if (m.faixaFace.info) fc = 1; else if (m.vFace == null) fc = 0.5; else if (m.vFace >= cl.min && m.vFace <= cl.max) fc = 1; else if (m.vFace >= m.faixaFace.min && m.vFace < cl.min) fc = 0.5; else fc = 0;
    // parcela neutra: não distingue quem está entre a velocidade mínima e o máximo da aplicação
    var neutra = cfg.velocidadeBocaNeutra && !m.altaInducao;
    if (neutra && m.vFace != null && m.vFace >= m.faixaFace.min && m.vFace <= cl.max) fc = 1;
    p.push({ nome: 'Velocidade efetiva na boca (prática de projeto)', max: w.velocidade, f: fc, det: m.faixaFace.info ? 'alta indução: vazão dentro da faixa do catálogo (seleção pelo fabricante — NBR 16401-1, p. 22, l. 26)' : m.vFace == null ? 'não avaliada' : F.num(m.vFace, 2) + ' m/s; faixa da aplicação ' + F.num(cl.min, 1) + '–' + F.num(cl.max, 1) + ' m/s (' + (neutra ? '1,0 entre ' + F.num(m.faixaFace.min, 1) + ' m/s e o máximo da aplicação; 0 fora' : '1,0 dentro; 0,5 abaixo, até ' + F.num(m.faixaFace.min, 1) + ' m/s; 0 fora') + ')' });
    var nRef = Math.max(1, Math.ceil((ctx.area || 0) / c.arranjo.areaRefPorDifusor)), fp = m.n <= nRef ? 1 : nRef / m.n;
    p.push({ nome: 'Economia de peças', max: w.pecas, f: fp, det: m.n + ' peça(s); referência ' + nRef + ' (1 difusor por ' + c.arranjo.areaRefPorDifusor + ' m²): 1,0 até a referência, depois n_ref/n' });
    return fechar(p, verifs, marcas, cfg, cfg.fatorEstimadoInsuflamento);
  }

  /* Retorno: sem "economia de peças"; entram distribuição e afastamento dos jatos. */
  function retorno(m, ctx, verifs, marcas) {
    var cfg = D.motor.config.indice, cr = D.motor.config.retorno, p = [], w = cfg.pesosRetorno;
    p.push({ nome: 'Folga acústica', max: w.acustica, f: clamp((ctx.dbaMax - m.lp) / 10, 0, 1), det: 'Lp = ' + F.num(m.lp, 1) + ' dB(A) × limite ' + F.num(ctx.dbaMax, 0) + ' dB(A) (1,0 com 10 dB de folga)' });
    p.push({ nome: 'Folga de perda de carga', max: w.dp, f: clamp(1 - m.dp / ctx.dpMax, 0, 1), det: 'Δp = ' + F.num(m.dp, 2) + ' × limite ' + F.num(ctx.dpMax, 2) + ' mmCA' });
    var vmax = m.faixaFace.max, fv = m.vFace <= 0.75 * vmax ? 1 : (m.vFace <= vmax ? 1 - 0.5 * (m.vFace - 0.75 * vmax) / (0.25 * vmax) : 0);
    if (m.faixaFace.min !== undefined && m.vFace < m.faixaFace.min) fv = 0.5;
    // retorno acima da zona ocupada: nota cheia dentro da faixa; abaixo cai em proporção (grelha grande demais)
    var fx = cfg.retornoFaixaCheia, naFaixa = !!fx && m.faixaFace.min === undefined;
    if (naFaixa) fv = m.vFace < fx.min ? m.vFace / fx.min : (m.vFace <= fx.max ? 1 : (m.vFace <= vmax ? 1 - 0.5 * (m.vFace - fx.max) / (vmax - fx.max) : 0));
    p.push({ nome: 'Velocidade de face moderada (ruído e pressão)', max: w.velocidade, f: fv, det: F.num(m.vFace, 2) + ' m/s × recomendado ≤ ' + F.num(vmax, 1) + ' m/s (' + (naFaixa ? '1,0 entre ' + F.num(fx.min, 1) + ' e ' + F.num(fx.max, 1) + ' m/s; abaixo, em proporção' : '1,0 até 75 % do máximo') + ')' });
    var fd = Math.min(1, m.n / m.nMin), extra = Math.max(0, m.n - m.nMin), det = m.n + ' grelha(s), mínimo ' + m.nMin;
    if (extra) { fd *= 1 / (1 + cr.penalGrelhaExtra * extra); det += ' (+' + extra + ' além do mínimo: fragmentação)'; }
    if (m.maxDist != null) { fd *= Math.min(1, m.dMax / m.maxDist); det += '; difusor mais afastado a ' + F.num(m.maxDist, 1) + ' m (limite ' + F.num(m.dMax, 1) + ')'; }
    det += '; ' + F.num(m.areaPorGrelha, 0) + ' m² por grelha';
    var vazias = m.grupos ? m.grupos.filter(function (g) { return g === 0; }).length : 0;
    if (vazias) { fd *= Math.pow(0.8, vazias); det += '; ' + vazias + ' grelha(s) sem difusor atendido'; }
    if (m.modularPenal) { fd *= cr.penalNaoModular; det += '; tamanho não modular'; }
    p.push({ nome: 'Distribuição das grelhas', max: w.distribuicao, f: fd, det: det });
    var fc = m.vJato <= 0.125 ? 1 : clamp(1 - (m.vJato - 0.125) / (m.vReprova - 0.125), 0, 1);
    p.push({ nome: 'Afastamento dos jatos de insuflamento (curto-circuito)', max: w.curto, f: fc, det: 'jato na grelha ' + F.num(m.vJato, 2) + ' m/s (1,0 até 0,125; fim do jato 0,25 m/s; 0 em ' + F.num(m.vReprova, 2) + ')' });
    return fechar(p, verifs, marcas, cfg, cfg.fatorEstimado);
  }

  function fechar(p, verifs, marcas, cfg, fEst) {
    var base = 0;
    p.forEach(function (x) { x.pts = x.max * x.f; base += x.pts; });
    var r = aplicarFatores(base, verifs, marcas, cfg, p, fEst);
    r.selo = selo(verifs, marcas);
    return r;
  }

  /* Ordena a lista no lugar. tipo: 'insuflamento' ou 'retorno'.
   * Chave: nota + bônus do selo "aprovado". No insuflamento, com a faixa de desempate ligada, cada uma
   * das primeiras posições fica com o candidato de menos peças entre os que estão a até `faixa` pontos
   * do líder, não reprovados e (guarda) sem mais alertas que o líder; empate em peças: maior chave.
   * Na guarda não contam os alertas das verificações listadas em desempate.guardaIgnora (padrão: draft). */
  function ordenar(lista, tipo) {
    var ci = D.motor.config.indice, ins = tipo === 'insuflamento';
    var bonus = ins ? ci.bonusAprovadoInsuflamento : ci.faixaEquivalencia;
    function chave(x) { return x.indice.total + (x.indice.selo === 'aprovado' ? bonus : 0); }
    lista.sort(function (a, b) { return chave(b) - chave(a); });
    var d = ins ? ci.desempate : null;
    if (!d || !(d.faixa > 0)) return lista;
    var out = [], rest = lista.slice();
    for (var i = 0; i < d.posicoes && rest.length; i++) {
      var lider = chave(rest[0]), alLider = nAlertas(rest[0], d.guardaIgnora);
      var grupo = rest.filter(function (x) { return chave(x) >= lider - d.faixa && x.indice.selo !== 'reprovado' && (!d.guardaAlertas || nAlertas(x, d.guardaIgnora) <= alLider); });
      if (!grupo.length) grupo = [rest[0]];
      grupo.sort(function (a, b) { return a.n - b.n || chave(b) - chave(a); });
      out.push(grupo[0]); rest.splice(rest.indexOf(grupo[0]), 1);
    }
    out = out.concat(rest);
    for (var k = 0; k < out.length; k++) lista[k] = out[k];
    return lista;
  }

  D.motor.indice = { insuflamento: insuflamento, retorno: retorno, ordenar: ordenar, selo: selo, fT50L: fT50L, limSupT50L: limSupT50L, nAlertas: nAlertas };
})(window.Difusores);

</script>
<script>
/* ==== js/motor/arranjos.js ==== */
/* Geração de arranjos de insuflamento em planta.
 * Origem (0,0) no canto inferior esquerdo da planta; x ao longo do comprimento C,
 * y ao longo da largura L (W). Coordenadas em metros, no centro de cada peça.
 * (O posicionamento das grelhas de retorno está em retorno.js.) */

   * orient 'x': grelhas na parede x = 0, jato em +x ao longo do comprimento C; 'y': parede y = 0, jato em +y ao longo da largura.

    var ade = D.dados.trox.ADE, comps = ade.comprimentos.concat([1500, 2000]);
    ['ADE-1', 'ADE-2'].forEach(function (variante) {
      if (!fams[variante === 'ADE-1' ? 'ADE1' : 'ADE2']) return;
      var abs = Object.keys(ade.alturas[variante === 'ADE-1' ? 'ade1' : 'ade2']).map(Number);
      comps.forEach(function (comp) {
        D.motor.arranjos.linhasLineares(amb.C, amb.W, variante, comp, c).forEach(function (arr) {
          abs.forEach(function (ab) { out.push({ familia: 'ADE', variante: variante, ab: ab, comp: comp, arranjo: arr }); });
        });

    return out;
  }

  /* ---------- retorno ---------- */
  function contextoRetorno(e, amb, sup) {
    var c = cfg(), posicao = e.retorno.posicao || 'forro';
    var ctx = { sup: sup, posicao: posicao, altoNivel: retornoAlto(e), campo: RT.campoJato(sup), cache: {} };
    ctx.cand = RT.candidatos(amb, posicao, c);
    ctx.cand.forEach(function (p) { p.v = ctx.altoNivel ? ctx.campo(p) : 0; });

    var nDif = sup ? sup.n : 0;
    ctx.nDif = nDif;
    ctx.nMinDif = nDif ? Math.ceil(nDif / c.retorno.difusoresPorGrelha) : (amb.Q > 0 ? 1 : 0);   // só exaustão (v3.6.0): ⌈0/k⌉ = 0; o máx(1; …) garante uma grelha
    ctx.nMinArea = c.retorno.areaMaxPorGrelha > 0 ? Math.ceil(amb.area / c.retorno.areaMaxPorGrelha) : 1;
    ctx.nMinRegra = Math.max(1, ctx.nMinDif, ctx.nMinArea);

    ctx.nRecMax = Math.max(ctx.nMin, nDif || 1);

  }

  function avaliarRetorno(cand, e, amb, ctx, completo, posManual) {
    var r = completo ? new Rastro() : new RastroLeve();
    var base = D.dados.trox.grelhasRetorno, n = cand.n, Qp = amb.Qret / n, c = cfg().retorno;
    var HL = cand.chave.split('x'), H = +HL[0], L = +HL[1];
    // v3.6.0 (V7–V9): exaustão pelas mesmas grelhas e tabelas do retorno; muda só o nome; sem insuflamento, sem Ez
    var exa = amb.papelSaida === 'exaustao', nomeSai = exa ? 'exaustão' : 'retorno', semIns = !(amb.Q > 0);
    var res = { cand: cand, n: n, rastro: r, verifs: [], Qp: Qp, H: H, L: L, papel: exa ? 'exaustao' : 'retorno' };
    r.passo({ grupo: 'produto', titulo: 'Vazão por grelha', formula: exa ? 'Q_p = Q_e / n' : 'Q_p = Q_r / n', subst: 'Q_p = ' + F.num(amb.Qret, 0) + ' / ' + n, valor: Qp, unidade: 'm³/h', casas: 0, fonte: 'Arranjo de ' + nomeSai + ' com ' + n + ' grelha(s)' });
    var t = T.grelha(cand.familia, cand.chave, Qp, r);
    if (!t) return null;
    res.dp = t.dp; res.ln = t.ln; res.fonte = t.fonte;
    var areaBruta = H * L / 1e6;
    res.areaBruta = areaBruta;
    res.vFace = Qp / 3600 / areaBruta;
    r.passo({ grupo: 'produto', titulo: 'Velocidade de face (área bruta)', formula: 'v_f = Q_p / (3600 · H · L)', subst: 'v_f = ' + F.num(Qp, 0) + ' / (3600 · ' + F.num(areaBruta, 4) + ')', valor: res.vFace, unidade: 'm/s', casas: 2, fonte: 'Continuidade, área nominal H × L' });
    var pos = ctx.posicao, faixa = D.dados.normas.bocas.retornoFace[pos];
    res.faixaFace = faixa; res.posicao = pos;
    var dist = ctx.altoNivel ? Math.max(0.7, amb.Hinst - cfg().alturaOuvido) : 1.0;
    r.passo({ grupo: 'acustica', titulo: 'Distância da grelha ao ouvinte', formula: '—', subst: 'r = ' + F.num(dist, 2) + ' m (' + faixa.nome + ')', valor: dist, unidade: 'm', casas: 2, fonte: 'Posição da grelha' });
    var At = D.motor.acustica.atenuacao(dist, amb.volume, e.crit.tratamento || 'normal', r);
    res.lp = D.motor.acustica.pressaoAmbiente(res.ln, n, At, r, exa ? 'exaustão' : 'retorno');
    // insuflamento e retorno soam ao mesmo tempo: o nível do ambiente é a soma das duas parcelas
    res.lpSup = ctx.sup && ctx.sup.lp != null && !isNaN(ctx.sup.lp) ? ctx.sup.lp : null;
    res.lpTotal = res.lpSup === null ? null : D.motor.acustica.somaNiveis(res.lpSup, res.lp, r);

    // posições e métricas de distribuição
    res.pos = posManual || ctx.posicoes(n);
    var m = RT.metricas(res.pos, ctx.sup, ctx.campo, ctx.altoNivel);
    res.maxDist = m.maxDist; res.vJato = m.vJato; res.grupos = m.grupos; res.espMin = m.espMin;
    res.nMin = ctx.nMin; res.nRecMax = ctx.nRecMax; res.dMax = c.distMaxDifusor; res.vReprova = c.vJatoReprova;
    res.areaPorGrelha = amb.area / n;
    res.modularPenal = !!(e.retorno.modular && c.modularPreferidos.indexOf(cand.chave) < 0);
    r.passo({ grupo: 'produto', titulo: 'Número mínimo de grelhas (distribuição do ' + (exa ? 'ar de exaustão' : 'retorno') + ')', formula: 'n_mín = máx(1; ⌈n_dif / ' + c.difusoresPorGrelha + '⌉; ⌈A / ' + c.areaMaxPorGrelha + ' m²⌉)', subst: 'n_mín = máx(1; ⌈' + ctx.nDif + '/' + c.difusoresPorGrelha + '⌉ = ' + ctx.nMinDif + '; ⌈' + F.num(amb.area, 0) + '/' + c.areaMaxPorGrelha + '⌉ = ' + ctx.nMinArea + ')', valor: ctx.nMin, unidade: 'grelhas', casas: 0, fonte: 'Regra de projeto; NBR 16401-1, p. 22, l. 19' });
    r.passo({ grupo: 'produto', titulo: 'Posição das grelhas', formula: semIns ? 'distribuídas pela área do ambiente (sem insuflamento)' : 'pontos de menor velocidade de jato, distribuídos pelos grupos de difusores', subst: res.pos.map(function (p, i) { return (exa ? 'E' : 'R') + (i + 1) + ' (' + F.num(p.x, 2) + '; ' + F.num(p.y, 2) + ')'; }).join('; ') + (posManual ? ' — ajustadas manualmente' : ''), valor: null, fonte: 'ASHRAE Fundamentals 2021, p. 20.5; NBR 16401-1, p. 22, l. 19' });
    if (m.maxDist != null) r.passo({ grupo: 'produto', titulo: 'Difusor mais afastado da grelha mais próxima', formula: 'máx_i mín_j dist(difusor_i, grelha_j)', subst: 'd_máx = ' + F.num(m.maxDist, 2) + ' m; difusores por grelha: ' + m.grupos.join(' / '), valor: m.maxDist, unidade: 'm', casas: 2, fonte: 'Regra de projeto' });
    if (ctx.altoNivel && ctx.sup) r.passo({ grupo: 'produto', titulo: 'Velocidade do jato de insuflamento na posição da grelha (pior caso)', formula: 'v = v_t · X_vt / dist  (Eq. 4, por setor de descarga)', subst: 'v_jato = ' + F.num(m.vJato, 3) + ' m/s' + (m.iPior >= 0 ? ' (grelha R' + (m.iPior + 1) + ')' : ''), valor: m.vJato, unidade: 'm/s', casas: 2, fonte: 'ASHRAE Fundamentals 2021, p. 20.5, l. 24; NBR 16401-1, p. 22, l. 19' });
    var ezRes = semIns ? null : N.ez({ aquecimento: amb.dT < 0, dT: Math.abs(amb.dT), retornoAlto: ctx.altoNivel, v14: ctx.sup ? ctx.sup.v14 : null }, r);
    res.ez = ezRes;

    // verificações
    var vs = res.verifs, lim = limiteAcustico(e);
    vs.push(V.item({ id: 'acustica', criterio: 'Nível sonoro ' + (exa ? 'da exaustão' : 'do retorno') + ' no ambiente (' + lim.rotulo + ')', valor: res.lp, limite: e.crit.dbaMax, tipo: 'max', casas: 1, unidade: 'dB(A)', fonte: lim.fonte + '; TROX C2-005, p. 5' }));
    if (res.lpTotal !== null) vs.push(V.item({ id: 'acusticaTotal', criterio: 'Nível sonoro somado de insuflamento e ' + nomeSai + ' (' + lim.rotulo + ')', valor: res.lpTotal, limite: e.crit.dbaMax, tipo: 'max', casas: 1, unidade: 'dB(A)', fonte: lim.fonte + '; soma logarítmica', obs: 'Insuflamento ' + F.num(res.lpSup, 1) + ' + ' + nomeSai + ' ' + F.num(res.lp, 1) + ' dB(A); cada parcela no ponto mais desfavorável (ouvinte sob o terminal), a favor da segurança' }));
    vs.push(V.item({ id: 'dp', criterio: 'Perda de carga', valor: res.dp, limite: e.crit.dpMax, tipo: 'max', casas: 2, unidade: 'mmCA', fonte: 'Limite de projeto' }));
    if (faixa.min !== undefined) vs.push(V.item({ id: 'face', criterio: 'Velocidade de face recomendada — ' + faixa.nome, valor: res.vFace, min: faixa.min, max: faixa.max, tipo: 'faixa', casas: 2, unidade: 'm/s', falhaAcima: 'reprova', falhaAbaixo: 'alerta', fonte: D.dados.normas.bocas.retornoFace.fonteCurta }));
    else vs.push(V.item({ id: 'face', criterio: 'Velocidade de face recomendada — ' + faixa.nome, valor: res.vFace, limite: faixa.max, tipo: 'max', casas: 2, unidade: 'm/s', falha: 'alerta', fonte: D.dados.normas.bocas.retornoFace.fonteCurta, obs: faixa.nota }));
    vs.push(V.item({ id: 'nGrelhas', criterio: 'Número de grelhas ≥ mínimo (1 por ' + c.difusoresPorGrelha + ' difusores; ' + c.areaMaxPorGrelha + ' m² por grelha)', valor: n, limite: ctx.nMin, tipo: 'min', casas: 0, unidade: '', fonte: 'Regra de projeto; NBR 16401-1, p. 22, l. 19; NBR 16401-1, p. 23, l. 1; NBR 16401-1, p. 29, l. 34', obs: F.num(res.areaPorGrelha, 0) + ' m² por grelha; ' + ctx.nDif + ' difusor(es)' }));
    if (ctx.nMinRegra > ctx.nMin) r.alerta('A regra de distribuição pede ' + ctx.nMinRegra + ' grelhas, acima do máximo configurado (' + c.maxPecas + '): aumente "Máximo de grelhas" em Projeto, Mais opções, ou divida o retorno');
    if (m.maxDist != null) vs.push(V.item({ id: 'distMax', criterio: 'Difusor mais afastado a ≤ ' + F.num(c.distMaxDifusor, 0) + ' m da grelha mais próxima', valor: m.maxDist, limite: c.distMaxDifusor, tipo: 'max', casas: 2, unidade: 'm', falha: 'alerta', fonte: 'Regra de projeto' }));
    if (n > 1.5 * ctx.nRecMax) vs.push(V.item({ id: 'fragment', criterio: 'Número de grelhas excessivo (fragmentação do retorno)', valor: n, valorTxt: n + ' grelhas', limiteTxt: '≤ ' + Math.floor(1.5 * ctx.nRecMax), tipo: 'info', situacao: 'alerta', fonte: 'Regra de projeto' }));
    if (ctx.altoNivel && ctx.sup) vs.push(V.item({ id: 'curto', criterio: 'Grelha fora do alcance dos jatos de insuflamento (curto-circuito)', valor: m.vJato, valorTxt: 'jato na grelha ' + F.num(m.vJato, 2) + ' m/s', limiteTxt: '≤ 0,25 m/s (fim do jato); > 0,5 m/s reprova (critério do app)', tipo: 'info', situacao: m.vJato > c.vJatoReprova ? 'reprova' : (m.vJato > c.vJatoAlerta ? 'alerta' : 'atende'), fonte: 'NBR 16401-1, p. 22, l. 19; ASHRAE Fundamentals 2021, p. 20.5' }));
    if (ezRes) vs.push(V.item({ id: 'ez', criterio: 'Eficácia da distribuição de ar Ez com ' + (exa ? 'esta exaustão' : 'este retorno'), valor: ezRes.valor, valorTxt: 'Ez = ' + F.num(ezRes.valor, 1), limiteTxt: '1,0', tipo: 'info', situacao: ezRes.valor >= 1 ? 'atende' : 'alerta', fonte: ezRes.fonte, obs: ezRes.texto + (amb.dT < 0 && ctx.altoNivel && Math.abs(amb.dT) >= 8 ? ' — recomenda-se retorno baixo no aquecimento' : '') }));
    var prop = L / H;
    vs.push(V.item({ id: 'formato', criterio: 'Proporção L/H da grelha ≤ ' + c.proporcaoMax, valor: prop, limite: c.proporcaoMax, tipo: 'max', casas: 1, unidade: '', falha: 'alerta', fonte: 'Prática de projeto' }));
    if (e.retorno.hMax && H > e.retorno.hMax) vs.push(V.item({ id: 'hmax', criterio: 'Altura nominal H ≤ máximo disponível', valor: H, limite: e.retorno.hMax, tipo: 'max', casas: 0, unidade: 'mm', fonte: 'Restrição de projeto' }));
    if (e.retorno.lMax && L > e.retorno.lMax) vs.push(V.item({ id: 'lmax', criterio: 'Largura nominal L ≤ máximo disponível', valor: L, limite: e.retorno.lMax, tipo: 'max', casas: 0, unidade: 'mm', fonte: 'Restrição de projeto' }));
    if (e.retorno.modular) vs.push(V.item({ id: 'modular', criterio: 'Tamanho compatível com forro modular 625 mm', valor: res.modularPenal ? 0 : 1, valorTxt: cand.chave.replace('x', '×') + (res.modularPenal ? ' (não modular)' : ' (modular)'), limiteTxt: c.modularPreferidos.join(', '), tipo: 'info', situacao: res.modularPenal ? 'alerta' : 'atende', fonte: 'Preferência de projeto' }));
    if (e.retorno.tipo === 'plenum') vs.push(V.item({ id: 'balanceamento', criterio: 'Retorno por plenum: grelhas iguais e distribuídas (a posição define o caminho do ar no entreforro); regulagem na própria grelha', valor: 1, valorTxt: n + ' grelha(s) iguais', limiteTxt: 'plenum acessível e limpo', tipo: 'info', situacao: 'atende', fonte: 'NBR 16401-1, p. 22, l. 19; NBR 16401-3, p. 22, l. 22' }));
    else vs.push(V.item({ id: 'balanceamento', criterio: 'Balanceamento: grelhas iguais, um ramal por grelha com registro, TAB ±10 %', valor: 1, valorTxt: n + ' ramal(is) iguais', limiteTxt: 'registro ≤ 50 %', tipo: 'info', situacao: 'atende', fonte: 'NBR 16401-1, p. 23, l. 1; NBR 16401-1, p. 29, l. 32 e 34; NBR 16401-1, p. 38, l. 16' }));

    var ctxI = { dbaMax: e.crit.dbaMax, dpMax: e.crit.dpMax };
    res.indice = D.motor.indice.retorno(res, ctxI, vs, r);
    res.selo = res.indice.selo;
    var famNome = base.familias[cand.familia].nome.split(' — ')[0];
    if (cand.familia === 'AT_VAT') famNome = H === 75 ? 'VAT' : 'AT / VAT';    res.modelo = famNome; res.dimensao = H + ' × ' + L + ' mm (H × L)';
    res.titulo = famNome + ' ' + H + '×' + L + ' — ' + n + ' grelha(s)';
    return res;
  }

  function candidatosRetorno(e, amb) {
    var out = [], base = D.dados.trox.grelhasRetorno, fams = e.retorno.familias || {};
    Object.keys(base.dados).forEach(function (f) {
      if (!fams[f]) return;
      Object.keys(base.dados[f]).forEach(function (chave) {
        var HL = chave.split('x'), H = +HL[0], L = +HL[1];
        if (e.retorno.hMax && H > e.retorno.hMax) return;
        if (e.retorno.lMax && L > e.retorno.lMax) return;
        for (var n = 1; n <= cfg().retorno.maxPecas; n++) out.push({ familia: f, chave: chave, n: n });

  function selecionarRetorno(e, amb, sup) {

      D.motor.indice.ordenar(ret, 'retorno');
    }
    var top = ret.slice(0, cfg().alternativas).map(function (s) { return avaliarRetorno(s.cand, e, amb, ctx, true); });
    return { lista: top, total: ret.length, ctx: ctx };
  }

  /* ---------- seleção completa ---------- */
  function selecionar(e) {

    // entrada sem ΔT, sem vazão ou com a instalação dentro da zona ocupada: não há cálculo (nenhum valor é adotado no lugar)

    var semAprovada = sup.length && sup.every(function (s) { return s.selo === 'reprovado'; }) ? D.motor.avisos.semAprovada(amb, sup.length, topSup[0]) : null;
    return { amb: amb, rastroAmb: rAmb, insuflamento: topSup, totalInsuflamento: sup.length, retorno: rr.lista, totalRetorno: rr.total, ctxRet: rr.ctx, avisos: av, semAprovada: semAprovada };
  }

  D.motor.selecao = { selecionar: selecionar, selecionarRetorno: selecionarRetorno, avaliarInsuflamento: avaliarInsuflamento, avaliarRetorno: avaliarRetorno, contextoRetorno: contextoRetorno, candidatosInsuflamento: candidatosInsuflamento, candidatosRetorno: candidatosRetorno, corrigir: corrigir, classeVelocidade: classeVelocidade };
})(window.Difusores);

<!-- App: adaptador de ambiente, alternativa adotada e arquivo de projeto (formato 4) -->
<script>
/* ==== js/util/adaptador.js ==== */
/* Adaptador de ambiente (v3.0.0). O projeto novo guarda { projeto, ambientes[] } (formato de arquivo 4); o motor continua
 * recebendo a entrada `e` de um ambiente só, como na v2.1.3. Aqui ficam as duas conversões e o cálculo por ambiente:
 *   ambienteParaEntrada(amb, projeto) → e          o que selecao.selecionar(e) recebe
 *   entradaParaAmbiente(e, original)  → amb        usado ao abrir arquivo (formatos 1 a 3 e validação do 4)
 *   pendencias(e)                     → { campo: texto }   as regras de preenchimento da tela da v2.1.3 (entradas.validar)
 *   calcular(amb, projeto)            → { e, erros, avisos, res, sup, ret }   com memória por entrada + configuração
 * Regras de "acompanha o padrão" (valor vazio no ambiente): zona ocupada = altura da postura; limite de ruído = o da
 * aplicação; temperatura operativa = padrão de dados\normas\nbr16401-1.js; umidade relativa = 50 %.
 * Perda de carga máxima: o ambiente guarda Pa (crit.dpMaxPa); o motor recebe mmCA (crit.dpMax), 1 mmCA = 9,80665 Pa.
 * Nenhum número do motor muda aqui. Sem DOM. */
(function (D) {
  'use strict';
  var PA_POR_MMCA = 9.80665, UR_PADRAO = 50;
  var FAMILIAS = ['ADLQ', 'ADLR', 'ADE1', 'ADE2', 'FD', 'VDW', 'VD', 'ATVAT', 'AHAF'], FAMILIAS_RET = ['AT_VAT', 'AR', 'AGS_T', 'AE'];

  function vazio(v) { return v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v)); }
  function nn(v) { return vazio(v) ? NaN : v; }          // vazio do projeto → NaN, como a tela antiga entregava ao motor
  function nulo(v) { return vazio(v) ? null : v; }       // vazio da entrada → null, que o JSON guarda
  function mapa(o, chaves) { var r = {}; o = o || {}; chaves.forEach(function (k) { r[k] = o[k]; }); return r; }

  function alturaPostura(postura) { var z = D.dados.normas.nbr16401_2.zonaOcupada; return postura === 'sentado' ? z.alturaSentado : z.alturaEmPe; }
  function aplicacao(id) { return D.dados.normas.nbr10152.aplicacoes.filter(function (a) { return a.id === id; })[0] || null; }
  function limiteRuido(id) { var a = aplicacao(id); return a ? a.dba : NaN; }
  function toPadrao(dT) { var ci = D.dados.normas.nbr16401_1.condicoesInternas; return dT < 0 ? ci.toPadraoAquecimento : ci.toPadraoResfriamento; }
  // 9 casas em mmCA devolvem o valor de origem (4 mmCA → 39,2266 Pa → 4 mmCA); 6 casas em Pa deixam o arquivo legível
  function paParaMmca(pa) { return vazio(pa) ? NaN : Math.round(pa / PA_POR_MMCA * 1e9) / 1e9; }
  function mmcaParaPa(mm) { return vazio(mm) ? null : Math.round(mm * PA_POR_MMCA * 1e6) / 1e6; }

  /* Bloco `ar` da entrada. As chaves do modo "Vazões da ventilação" (v3.6.0: Qsai, papelSaida, isotermico) só existem nesse
   * modo: os ambientes dos outros modos ficam iguais aos da v3.5.0 (arquivo e memória). */
  function arEntrada(a, p) {
    var o = { modo: a.modo, Q: nn(a.Q), qs: nn(a.qs), dT: nn(a.dT), to: vazio(a.to) ? toPadrao(a.dT) : a.to, ur: vazio(a.ur) ? UR_PADRAO : a.ur, z: nn(p.altitude) || 0, retornoPct: nn(a.retornoPct) };
    // papelSaida e isotermico vão como estão: a abertura do arquivo (projeto.js) valida e põe a linha no relatório; o motor lê só 'exaustao' e true
    if (a.modo === 'ventilacao') { o.Qsai = nn(a.Qsai); o.papelSaida = a.papelSaida; o.isotermico = a.isotermico; }
    return o;
  }
  function arAmbiente(a, to, ur) {

  function calcular(amb, projeto) {

    if (memoria[chave]) return memoria[chave];

    D.motor.config = projeto.config;

<script>
/* ==== js/util/escolha.js ==== */
/* Alternativa adotada e posições ajustadas à mão (v3.0.0, sessão T2). Sem DOM.

 *   amb.manual    = null | { cand: { familia, tam } ou { familia: 'ADE', variante, ab, comp },
 *                            arranjo: { tipo: 'grade', nx, ny } ou { tipo: 'linear', orient, nr, m },
 *                            pos: null | [{ x, y }],            (pos nulo = posições do arranjo)
 *                            seguir: true }                     (só quando a 1ª opção do app foi arrastada sem ser adotada:
 *                                                                as posições valem enquanto ela for a 1ª opção)
 *   amb.manualRet = null | { cand: { familia, chave, n }, pos: null | [{ x, y, parede }] }
 * null = segue a 1ª opção do app. Trocar ou mover o insuflamento refaz o retorno e limpa a escolha de retorno, como na

 * selecionarRetorno, avaliarRetorno) e de D.motor.indice.ordenar, chamados como selecao.selecionar os chama.
 *   resolver(amb, projeto)      → { r, primeira, sup, ret, retLista, totalRetorno, ctxRet, adotada, ajustada, retAdotada, retAjustada, avisos }
 *   listaCompleta(amb, projeto) → todas as combinações viáveis, na ordem do motor (as primeiras são as de selecionar)
 *   equivalentes, melhorPorFamilia, porQuantidade → as listas da tela Seleção
 *   adotar, adotarRet, voltarPrimeira, restaurar, restaurarRet, mover, moverRet → alteram amb.manual e amb.manualRet

  // ---------------------------------------------------------------- identidade
  function idCand(c) { return c.familia === 'ADE' ? { familia: 'ADE', variante: c.variante, ab: +c.ab, comp: +c.comp } : { familia: c.familia, tam: String(c.tam) }; }
  function idArranjo(a) {

  function sCand(c) { return c.familia === 'ADE' ? ['ADE', c.variante, +c.ab, +c.comp].join('|') : [c.familia, String(c.tam)].join('|'); }

  // ---------------------------------------------------------------- listas da tela
  /* Todas as combinações viáveis na ordem do motor: os mesmos três passos de selecao.selecionar. Guarda só a do último
   * ambiente pedido (cada item traz as verificações; guardar a de todos os ambientes pesaria na memória). */

  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }

  function recusa(m) { return { ok: false, projeto: null, relatorio: [], versaoOrigem: 0, versaoAppOrigem: '', motivo: m }; }
  function linha(rel, nivel, onde, campo, valorArquivo, valorAdotado, motivo) {
    rel.push({ nivel: nivel, onde: onde, campo: campo, valorArquivo: String(valorArquivo), valorAdotado: String(valorAdotado), motivo: motivo });
  }
  function ondeAmb(nome) { return 'Ambiente: ' + nome; }
  // As linhas de D.util.projeto.abrir falam em "Entradas" e "Planta": aqui passam a dizer de qual ambiente
  function trocarOnde(rel, nome) {
    return rel.map(function (x) {
      var y = clonar(x);
      if (y.onde === 'Entradas') y.onde = ondeAmb(nome); else if (y.onde === 'Planta') y.onde = ondeAmb(nome) + ' (planta)';
      return y;
    });
  }
  function familiasBool(o, chaves, padrao) {
    var r = {}; o = ehObj(o) ? o : {};
    chaves.forEach(function (k) { r[k] = typeof o[k] === 'boolean' ? o[k] : (typeof padrao === 'boolean' ? padrao : padrao[k]); });
    return r;
  }

  function montar(projeto, ambientes) { return { formato: FORMATO, versaoFormato: VERSAO_FORMATO, versaoApp: D.versao, projeto: projeto, ambientes: ambientes }; }

  // Projeto de um ambiente a partir de uma entrada do motor (formatos 1 a 3, exemplo)
  function deEntrada(e, config, manual, manualRet, nomeProjeto) {
    var amb = A.entradaParaAmbiente(e, null), p = e.projeto || {};
    amb.nome = amb.nome || 'Ambiente 1';
    amb.manual = manual || null; amb.manualRet = manualRet || null;
    return montar({ nome: nomeProjeto || p.nome || '', responsavel: p.responsavel || '', revisao: '0', altitude: vazio(e.ar.z) ? 0 : e.ar.z,
      padroes: { familias: clonar(amb.familias), retornoFamilias: clonar(amb.retorno.familias) }, config: config }, [amb]);
  }

  // O exemplo da v2.1.3 (app.exemplo da tela antiga), com a umidade relativa que a tela preenchia (50 %)
  function entradaExemplo() {
    return { projeto: { nome: 'Exemplo', ambiente: 'Sala 6 × 3 m', responsavel: '' },
      geo: { C: 6, W: 3, H: 2.7, Hinst: 2.7, zo: 1.8, postura: 'emPe', montagem: 'forro', montagemGrelha: 'junto', paredesExternas: {} },
      ar: { modo: 'vazao', Q: 500, qs: 1842, dT: 11, to: 24, ur: 50, z: 0, retornoPct: 90 },
      crit: { aplicacao: 'escritorioPrivado', dbaMax: 40, dpMax: 4, vzoModo: 'nbr', vzoMax: 0.25, controleLocal: false, registro: 'sem', regulagemRamal: true, entradaAI: 'H', acessorio: 'nenhum', tratamento: 'normal' },
      retorno: { posicao: 'forro', tipo: 'dutado', hMax: null, lMax: null, modular: false, familias: { AT_VAT: true, AR: true, AGS_T: true, AE: true } },
      familias: { ADLQ: true, ADLR: true, ADE1: true, ADE2: true, FD: false, VDW: false, VD: false, ATVAT: false, AHAF: false } };
  }
  function exemplo() {
    var r = P3.abrir({ app: APP3, versaoFormato: 3, entrada: entradaExemplo() });   // passa pela mesma validação de um arquivo
    return deEntrada(r.projeto.entrada, r.projeto.config, null, null, 'Exemplo');
  }

  // Ambiente novo: como app.vazio da v2.1.3 (faltam comprimento, largura e vazão), com as famílias padrão do projeto
  function novoAmbiente(projeto, nome) {
    var amb = exemplo().ambientes[0], pd = (projeto && projeto.padroes) || {};
    amb.nome = nome || 'Ambiente novo';
    amb.geo.C = null; amb.geo.W = null; amb.ar.Q = null; amb.ar.qs = null;
    amb.familias = familiasBool(pd.familias, A.FAMILIAS, FAM_PADRAO);
    amb.retorno.familias = familiasBool(pd.retornoFamilias, A.FAMILIAS_RET, true);
    return amb;
  }
  /* Altitude com que um projeto novo começa: Brasília, 1.160 m desde a v3.3.1 (C4; era 1.060 m): a elevação da estação 867150
   * na ficha de clima do ASHRAE Fundamentals 2025, a mesma da carga térmica e das redes. É valor inicial da tela, não padrão de
   * arquivo: a altitude gravada abre como está (1.060 m abre com 1.060 m), arquivo sem altitude continua abrindo ao nível do
   * mar (0 m), e o exemplo da v2.1.3 segue a 0 m. */
  var ALTITUDE_PADRAO = 1160;
  // Fonte da altitude padrão (texto aprovado, TA1 e TA2 da 3.3.1): campo Altitude e Referências
  var ALTITUDE_FONTE = 'Premissa de projeto: a elevação da estação 867150 (BRASILIA, 2000-2023) na ficha de clima do ASHRAE Fundamentals 2025; ' +
    'a mesma da carga térmica e das redes - CONFERIR com a folha oficial (o PDF é impressão de página web de terceiro).';
  function novoProjeto() {
    var p = exemplo();
    p.projeto.nome = ''; p.projeto.altitude = ALTITUDE_PADRAO; p.ambientes = [novoAmbiente(p.projeto, 'Ambiente 1')];
    return p;
  }

  function num(v, casas, unidade) { return F.num(v, casas).replace(/,0+$/, '') + (unidade ? ' ' + unidade : ''); }

  /* Alternativa adotada e posições ajustadas (util\escolha.js). Os formatos 1 a 3 gravavam a posição na lista
   * ({ selSup, pos }, { selRet, pos }): aqui ela vira a identidade da peça e do arranjo, com o ambiente calculado pela
   * configuração do arquivo. Devolve as linhas do relatório; `projeto` já tem de trazer a configuração validada. */
  function ehEscolha(m) { return ehObj(m) && ehObj(m.cand); }
  function converterEscolha(amb, projeto) {
    var rel = [], m = amb.manual, mr = amb.manualRet;
    if (!(ehObj(m) && tem(m, 'selSup')) && !(ehObj(mr) && tem(mr, 'selRet'))) return rel;
    var conv = D.util.escolha.deLegado(amb, projeto);
    amb.manual = conv.manual; amb.manualRet = conv.manualRet;
    conv.linhas.forEach(function (x) { linha(rel, x.nivel, ondeAmb(amb.nome) + ' (planta)', x.campo, x.valorArquivo, x.valorAdotado, x.motivo); });
    return rel;
  }

  /* Formatos 1, 2 e 3: r3 = o devolvido por D.util.projeto.abrir (já convertido ao formato 3 e validado). */
  function deFormato3(r3) {
    var p = r3.projeto, e = p.entrada, rel = [], proj = deEntrada(e, p.config, p.manual, p.manualRet, p.nome), amb = proj.ambientes[0], onde = ondeAmb(amb.nome);
    linha(rel, 'info', 'Arquivo', 'Formato', 'versão ' + r3.versaoOrigem + (r3.versaoAppOrigem ? ' (app v' + r3.versaoAppOrigem + ')' : ''), 'versão ' + VERSAO_FORMATO,
      'Na v3.0.0 o projeto guarda vários ambientes: este arquivo abre como projeto de um ambiente ("' + amb.nome + '"). O nome do ambiente, a altitude e as configurações ' +
      'mudam de lugar (o nome vai para o ambiente; a altitude e as configurações, para o projeto). Nenhum valor de cálculo muda por causa disso.');
    rel = rel.concat(trocarOnde(r3.relatorio, amb.nome));
    if (e.crit.dpMax > 0) linha(rel, 'convertido', onde, 'Perda de carga máxima no difusor', num(e.crit.dpMax, 3, 'mmCA'), num(amb.crit.dpMaxPa, 2, 'Pa'),
      'a tela passa a usar Pa (1 mmCA = 9,80665 Pa); o limite é o mesmo');
    if (amb.geo.zo === null && e.geo.zo > 0) linha(rel, 'info', onde, 'Zona ocupada', num(e.geo.zo, 2, 'm'), 'acompanha a postura (' + num(e.geo.zo, 2, 'm') + ')',
      'igual à altura da postura escolhida: passa a acompanhá-la (mudar a postura muda a zona ocupada)');
    if (amb.crit.dbaMax === null && e.crit.dbaMax > 0) linha(rel, 'info', onde, 'Limite de ruído no ambiente', num(e.crit.dbaMax, 1, 'dB(A)'), 'acompanha a aplicação (' + num(e.crit.dbaMax, 1, 'dB(A)') + ')',
      'igual ao valor da aplicação escolhida: passa a acompanhá-la (mudar a aplicação muda o limite)');
    if (amb.ar.to === null && !vazio(e.ar.to)) linha(rel, 'info', onde, 'Temperatura operativa de projeto', num(e.ar.to, 1, '°C'), 'acompanha o padrão (' + num(e.ar.to, 1, '°C') + ')', 'igual ao padrão do app: passa a acompanhá-lo');
    if (amb.ar.ur === null && !vazio(e.ar.ur)) linha(rel, 'info', onde, 'Umidade relativa do ambiente', num(e.ar.ur, 0, '%'), 'acompanha o padrão (' + num(e.ar.ur, 0, '%') + ')', 'igual ao padrão do app: passa a acompanhá-lo');
    rel = rel.concat(converterEscolha(amb, proj.projeto));
    return { ok: true, projeto: proj, relatorio: rel, versaoOrigem: r3.versaoOrigem, versaoAppOrigem: r3.versaoAppOrigem, motivo: '' };
  }

  /* Formato 4. Cada ambiente passa pela validação de D.util.projeto.abrir, na forma da entrada do motor. */
  function deFormato4(obj) {
    var rel = [], pr = ehObj(obj.projeto) ? obj.projeto : {}, vApp = str(obj.versaoApp), cfg = null;
    var proj = { nome: str(pr.nome), responsavel: str(pr.responsavel), revisao: typeof pr.revisao === 'number' ? String(pr.revisao) : (str(pr.revisao) || '0'), altitude: 0, padroes: null, config: null };
    var alt = typeof pr.altitude === 'string' ? F.ler(pr.altitude) : pr.altitude;
    if (vazio(pr.altitude)) proj.altitude = 0;
    else if (typeof alt === 'number' && isFinite(alt) && alt >= 0) proj.altitude = alt;
    else linha(rel, 'substituido', 'Projeto', 'Altitude', JSON.stringify(pr.altitude), '0 m', 'valor inválido: adotado o nível do mar');
    var pd = ehObj(pr.padroes) ? pr.padroes : {};
    proj.padroes = { familias: familiasBool(pd.familias, A.FAMILIAS, FAM_PADRAO), retornoFamilias: familiasBool(pd.retornoFamilias, A.FAMILIAS_RET, true) };

    var lista = obj.ambientes.filter(ehObj), ambientes = [];
    if (lista.length < obj.ambientes.length) linha(rel, 'substituido', 'Ambientes', 'Lista de ambientes', obj.ambientes.length + ' itens', lista.length + ' ambientes', 'itens que não são ambientes foram descartados');
    if (!lista.length) { linha(rel, 'substituido', 'Ambientes', 'Lista de ambientes', '(vazia)', 'Ambiente 1 (a preencher)', 'o projeto precisa de pelo menos um ambiente'); lista = [novoAmbiente(proj, 'Ambiente 1')]; }
    lista.forEach(function (bruto, i) {
      var amb = clonar(bruto), nome = str(amb.nome) || 'Ambiente ' + (i + 1);
      ['geo', 'ar', 'crit', 'retorno', 'familias'].forEach(function (k) { if (!ehObj(amb[k])) amb[k] = {}; });
      amb.nome = nome;
      // a escolha gravada pela identidade (T2) é validada aqui; a gravada pela posição na lista segue pela validação da v2.1.3
      var novoIns = ehEscolha(amb.manual), novoRet = ehEscolha(amb.manualRet);
      var r3 = P3.abrir({ app: APP3, versaoFormato: 3, versaoApp: vApp, entrada: A.ambienteParaEntrada(amb, proj), config: cfg || pr.config,
        manual: novoIns ? null : amb.manual, manualRet: novoRet ? null : amb.manualRet });
      if (!r3.ok) { linha(rel, 'substituido', ondeAmb(nome), 'Ambiente', '(ilegível)', '(a preencher)', r3.motivo); ambientes.push(novoAmbiente(proj, nome)); return; }
      var lin = trocarOnde(r3.relatorio, nome);
      if (cfg) lin = lin.filter(function (x) { return x.onde !== 'Configurações'; });   // as configurações são do projeto: validadas com o 1º ambiente
      rel = rel.concat(lin);
      cfg = cfg || r3.projeto.config;
      var novo = A.entradaParaAmbiente(r3.projeto.entrada, amb);
      novo.nome = nome;
      if (typeof amb.areaCT === 'number' && isFinite(amb.areaCT) && amb.areaCT > 0) novo.areaCT = amb.areaCT;   // dica da importação da carga térmica; inválido: descartado em silêncio
      if (typeof amb.areaVent === 'number' && isFinite(amb.areaVent) && amb.areaVent > 0) novo.areaVent = amb.areaVent;   // idem, da importação da ventilação (v3.6.0)
      novo.manual = novoIns ? D.util.escolha.validarIns(amb.manual) : r3.projeto.manual;
      novo.manualRet = novoRet ? D.util.escolha.validarRet(amb.manualRet) : r3.projeto.manualRet;
      if (novoIns && !novo.manual) linha(rel, 'substituido', ondeAmb(nome) + ' (planta)', 'Alternativa adotada e posições dos difusores', '(registro ilegível)', '1ª opção do app', 'a escolha gravada no arquivo não pôde ser lida');
      if (novoRet && !novo.manualRet) linha(rel, 'substituido', ondeAmb(nome) + ' (planta)', 'Grelha adotada e posições das grelhas', '(registro ilegível)', '1ª opção de retorno', 'a escolha gravada no arquivo não pôde ser lida');
      ambientes.push(novo);
    });
    proj.config = cfg || D.motor.configPadrao();
    ambientes.forEach(function (amb) { rel = rel.concat(converterEscolha(amb, proj)); });
    return { ok: true, projeto: montar(proj, ambientes), relatorio: rel, versaoOrigem: VERSAO_FORMATO, versaoAppOrigem: vApp, motivo: '' };
  }

  /* Abre um projeto (texto do arquivo ou objeto já lido). Nunca lança erro. */
  function abrir(conteudo) {
    try {
      var obj = conteudo;
      if (typeof conteudo === 'string') {
        try { obj = JSON.parse(conteudo); } catch (e0) { return recusa('O arquivo não é um JSON válido (' + e0.message + ').'); }
      }
      if (!ehObj(obj)) return recusa('O arquivo não contém um projeto (esperado um objeto JSON).');
      if (Array.isArray(obj.ambientes)) {   // envelope comum (formato 4 em diante)
        if (tem(obj, 'formato') && obj.formato !== FORMATO) return recusa('O arquivo escolhido não é um projeto deste app (Difusores TROX).');
        var vf = vazio(obj.versaoFormato) ? VERSAO_FORMATO : Number(obj.versaoFormato);
        if (!(vf >= VERSAO_FORMATO)) return recusa('Versão de formato não reconhecida (' + String(obj.versaoFormato) + ').');
        if (vf > VERSAO_FORMATO) return recusa('Arquivo gravado por versão mais nova do app (formato ' + obj.versaoFormato + '). Atualize o app para abri-lo.');
        return deFormato4(obj);
      }
      var r3 = P3.abrir(obj);
      return r3.ok ? deFormato3(r3) : recusa(r3.motivo);
    } catch (err) {
      return recusa('Não foi possível ler o arquivo (' + (err && err.message ? err.message : err) + ').');
    }
  }

  function contar(rel, nivel) { var n = 0; (rel || []).forEach(function (x) { if (x.nivel === nivel) n++; }); return n; }
  var NIVEL = { convertido: 'CONVERTIDO', mantido: 'MANTIDO', substituido: 'SUBSTITUÍDO', info: 'INFO' };
  // Relatório de importação em texto puro (.txt); r = { relatorio, versaoOrigem } (o que a casca guarda da última abertura)
  function texto(r, nomeArquivo) {
    var NL = '\r\n', rel = r.relatorio || [];
    var s = 'Relatório de importação — Difusores TROX v' + D.versao + NL + 'Arquivo: ' + (nomeArquivo || '(sem nome)') + NL +
      'Formato de origem: versão ' + r.versaoOrigem + ' → versão ' + VERSAO_FORMATO + ' · ' + contar(rel, 'convertido') + ' conversões · ' + contar(rel, 'mantido') +
      ' valores seus mantidos · ' + contar(rel, 'substituido') + ' substituições' + NL + NL;
    if (!rel.length) return s + 'Nenhuma alteração.' + NL;
    rel.forEach(function (x) {
      s += '[' + (NIVEL[x.nivel] || x.nivel) + '] ' + x.onde + ' · ' + x.campo + NL + '  No arquivo: ' + x.valorArquivo + NL + '  Adotado: ' + x.valorAdotado + NL + '  Motivo: ' + x.motivo + NL + NL;
    });
    return s;
  }

  D.util.formato4 = { FORMATO: FORMATO, VERSAO_FORMATO: VERSAO_FORMATO, ALTITUDE_PADRAO: ALTITUDE_PADRAO, ALTITUDE_FONTE: ALTITUDE_FONTE, abrir: abrir, texto: texto, exemplo: exemplo, entradaExemplo: entradaExemplo, novoAmbiente: novoAmbiente, novoProjeto: novoProjeto,
    deEntrada: deEntrada, NIVEL: NIVEL };
})(window.Difusores);

</script>
<script>
/* ==== js/util/importa_ct.js ==== */
/* Importação de ambientes do app de carga térmica (v3.0.0, sessão T3, etapa 2b; calor sensível na D1, v3.0.1). Sem DOM.
 *   D.util.importaCT.importar(obj, E) → { ok, ambientes, relatorio, versaoOrigem, motivo }
 * Lê o arquivo do app de carga térmica (formato 'hvac-carga-termica', versões 1, 2 e 3) e devolve ambientes novos (a partir de
 * D.util.formato4.novoAmbiente) com nome, pé-direito, temperatura e umidade. Comprimento e largura ficam para digitar
 * (a área vai em amb.areaCT, só como dica para larguraSugerida).
 * Formato 3 em diante (carga térmica v0.5.1): lê resultados.ambientes[k] (k = posição do ambiente no arquivo) e grava amb.ar.qs com
 * o calor sensível do ambiente (sensivelAmbienteW como está no arquivo (1 casa decimal), sem novo arredondamento), com mês, dia e hora na linha do relatório. Não altera E: quem chama acrescenta os ambientes ao projeto. Linhas do relatório no formato de formato4.js:
 * { nivel ('info' | 'convertido' | 'substituido'), onde, campo, valorArquivo, valorAdotado, motivo }.
 * O ambiente importado fica em modo 'carga'; nos formatos 1 e 2, que não trazem resultado, com o calor sensível vazio. */
(function (D) {
  'use strict';
  var F = D.util.fmt, AD = D.util.adaptador, F4 = D.util.formato4;
  var FORMATO_CT = 'hvac-carga-termica', VERSAO_CONHECIDA = 3;

  function ehObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }
  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }
  function numero(x) {   // número, ou texto numérico (vírgula ou ponto); senão NaN
    if (typeof x === 'number') return isFinite(x) ? x : NaN;
    if (typeof x === 'string') { var n = F.ler(x); return typeof n === 'number' && isFinite(n) ? n : NaN; }
    return NaN;
  }
  function txt(v) {
    if (v === undefined) return '(ausente)';
    if (v === null || v === '') return '(vazio)';
    if (typeof v === 'number') return String(v).replace('.', ',');
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }
  function recusa(m) { return { ok: false, ambientes: [], relatorio: [], versaoOrigem: 0, motivo: m }; }
  function linha(rel, nivel, onde, campo, valorArquivo, valorAdotado, motivo) {
    rel.push({ nivel: nivel, onde: onde, campo: campo, valorArquivo: String(valorArquivo), valorAdotado: String(valorAdotado), motivo: motivo });
  }
  function ehAmbienteCT(a) { return ehObj(a) && typeof a.nome === 'string' && a.pd !== undefined; }

  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var DIAS = { tbs: 'dia de tbs máxima', tbu: 'dia de tbu máxima', umi: 'dia de umidade máxima' };
  function inteiroEm(x, a, b) { return typeof x === 'number' && isFinite(x) && Math.floor(x) === x && x >= a && x <= b; }

  // Calor sensível do ambiente de resultados.ambientes[k] (formato 3 em diante); grava amb.ar.qs e a linha do relatório
  function calorSensivel(rel, onde, amb, res, nomeOrig) {
    var CAMPO = 'Calor sensível do ambiente';
    if (!ehObj(res) || (typeof res.nome === 'string' ? res.nome.trim() : '') !== nomeOrig) {
      linha(rel, 'substituido', onde, CAMPO, ehObj(res) ? 'resultado de "' + (typeof res.nome === 'string' ? res.nome : '') + '"' : '(ausente)', '(vazio)',
        'o resultado gravado nesta posição não é deste ambiente (arquivo alterado depois de salvo): abra-o na carga térmica, salve de novo e importe, ou digite o calor sensível');
      return;
    }
    var v = res.sensivelAmbienteW;
    if (typeof v !== 'number' || !isFinite(v)) {
      linha(rel, 'substituido', onde, CAMPO, txt(v), '(vazio)', 'valor ilegível: digite o calor sensível do ambiente ou a vazão');
      return;
    }
    if (v <= 0) {
      linha(rel, 'substituido', onde, CAMPO, F.num(v, 1) + ' W', '(vazio)',
        'valor nulo ou negativo: o ambiente não tem ganho de calor sensível na janela de ocupação; digite o calor sensível do ambiente ou a vazão');
      return;
    }
    amb.ar.qs = v;
    var quando = inteiroEm(res.mes, 1, 12) && DIAS[res.dia] && inteiroEm(res.hora, 1, 24) ?
      MESES[res.mes - 1] + ', ' + DIAS[res.dia] + ', ' + res.hora + ' h' : 'mês, dia e hora não informados';
    linha(rel, 'info', onde, CAMPO, F.num(v, 1) + ' W (' + quando + ')', F.num(v, 1) + ' W',
      'maior valor do ano na janela de ocupação, com a infiltração sensível incluída, sem ar exterior, sem latente, sem calor ao retorno e sem fator de segurança; a vazão sai com a massa específica do ar na altitude deste projeto');
  }

  // Largura que, com o comprimento C, dá a área da carga térmica (m, arredondada a 0,01); null se faltar dado
  function larguraSugerida(area, C) {
    if (typeof area !== 'number' || typeof C !== 'number' || !isFinite(area) || !isFinite(C) || !(area > 0) || !(C > 0)) return null;
    return Math.round(area / C * 100) / 100;
  }

  // C × W fora de ± 1 % da área da carga térmica? (só decide se a frase da tela aparece; critério do app, sem norma)
  function areaDifere(area, C, W) {
    function pos(x) { return typeof x === 'number' && isFinite(x) && x > 0; }
    return pos(area) && pos(C) && pos(W) && Math.abs(C * W - area) > 0.01 * area;
  }

  function importar(obj, E) {
    try {

          'a NBR 7256 pede insuflamento que minimize a turbulência sobre a mesa (por exemplo, fluxo unidirecional de 0,2 a 0,3 m/s) e cerca de 70 % do retorno nos cantos, com a borda inferior da grelha a 20 cm do piso (NBR 7256, p. 11); o app escolhe difusores de mistura e grelhas no forro: confira');
        novos.push(amb);
        // revisor D1: a exaustão de um ambiente que também tem retorno vira um 2º ambiente, com a mesma área e o mesmo pé-direito
        if (separa !== null && separa > 0) {
          var usados2 = existentes.concat(novos.map(function (x) { return x.nome; })), nomeExa = final + ' (exaustão)';
          for (var n2 = 2; usados2.indexOf(nomeExa) >= 0; n2++) nomeExa = final + ' (exaustão) (' + n2 + ')';
          var ex = JSON.parse(JSON.stringify(amb));
          ex.nome = nomeExa; ex.ar.Q = 0; ex.ar.Qsai = separa; ex.ar.papelSaida = 'exaustao'; ex.ar.isotermico = false; ex.ar.dT = null;
          linha(rel, 'info', onde, 'Saída de ar', 'retorno ' + m3h(qr) + '; exaustão ' + m3h(separa), 'retorno aqui; exaustão em "' + nomeExa + '"',
            'o Difusores trata uma saída de ar por ambiente: a exaustão foi para o ambiente "' + nomeExa + '", com a mesma área e o mesmo pé-direito');
          linha(rel, 'info', 'Ambiente: ' + nomeExa, 'Vazão de exaustão', m3h(separa), m3h(separa),
            'exaustão do ambiente "' + final + '", que também tem retorno; sem insuflamento: o app escolhe só as grelhas' + fonte(a, 'Q_exa_m3h'));
          novos.push(ex);
        } else if (separa === 0) linha(rel, 'info', onde, 'Saída de ar', 'retorno ' + m3h(qr) + '; exaustão ' + m3h(qe), 'retorno',
          'a exaustão é toda da coifa: o ambiente fica com o retorno');
      });

      if (!novos.length) return recusa('Nenhum ambiente do arquivo tem vazão a distribuir.');
      var alt = numero(pj.altitude_m);
      if (projetoE && isFinite(alt) && Math.abs(alt - projetoE.altitude) > 0.5) {
        linha(rel, 'info', 'Projeto', 'Altitude', F.num(alt, 0) + ' m', F.num(projetoE.altitude, 0) + ' m',
          'a ventilação calculou a ' + F.num(alt, 0) + ' m; este projeto está a ' + F.num(projetoE.altitude, 0) + ' m e não foi alterado (as vazões em m³/h entram como estão)');
      }
      return { ok: true, ambientes: novos, relatorio: rel, versaoOrigem: vf, motivo: '' };
    } catch (err) {
      return recusa('Não foi possível ler o arquivo (' + (err && err.message ? err.message : err) + ').');
    }
  }

  // Relatório em texto puro (.txt), no desenho de importaCT.texto
  var NIVEL = { convertido: 'CONVERTIDO', substituido: 'SUBSTITUÍDO', info: 'INFO' };
  function texto(r, nomeArquivo) {
    var NL = '\r\n', rel = r.relatorio || [];
    var s = 'Importação da ventilação — Difusores TROX v' + D.versao + NL + 'Arquivo: ' + (nomeArquivo || '(sem nome)') + NL;
    if (!r.ok) return s + 'Arquivo recusado: ' + r.motivo + NL;
    s += r.ambientes.length + (r.ambientes.length === 1 ? ' ambiente acrescentado' : ' ambientes acrescentados') + NL + NL;
    rel.forEach(function (x) {
      s += '[' + (NIVEL[x.nivel] || x.nivel) + '] ' + x.onde + ' · ' + x.campo + NL + '  No arquivo: ' + x.valorArquivo + NL + '  Adotado: ' + x.valorAdotado + NL + '  Motivo: ' + x.motivo + NL + NL;
    });
    return s;
  }

  D.util.importaVent = { importar: importar, texto: texto, FORMATO_VENT: FORMATO_VENT, VERSAO_CONHECIDA: VERSAO_CONHECIDA };
})(window.Difusores);

<script>
/* ==== plataforma v0.6.1: js/interface/componentes.js ==== */
/* Plataforma HVAC. Componentes do guia de interface: campo com estado, selos, valor calculado, seletor, segmentado, passos,
   cabeçalho de tela, indicador, bloco recolhível, barras, tabela de passos e, desde a v0.4.0, a lista de cartões do celular.
   Só montam HTML; não conhecem app nem motor.
   O estado da tela (H.ui.U: erros, aprender, aberto) é da casca; sem ela (página avulsa), os componentes funcionam com o estado vazio. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc;
  function daTela() { return H.ui.U || {}; }   // estado da tela guardado pela casca

  function selo(tipo, texto, fonte) {
    if (fonte) return '<button type="button" class="selo ' + tipo + '" data-acao="fonte" data-fonte="' + esc(fonte) + '" title="Ver a fonte">' + esc(texto) + '</button>';
    return '<span class="selo ' + tipo + '">' + esc(texto) + '</span>';
  }

  /* Campo numérico. o = { id, caminho, rotulo, valor, unidade, casas, min, max, faixa (texto do aviso),
     padrao (valor da norma; undefined = sem padrão), alterado (bool), fonte, inteiro, fixo (texto do selo),
     negativo (bool: aceita número abaixo de zero, como temperatura), anulavel (bool: aceita vazio),
     erro (texto; quando ausente, vale o erro que a casca guardou para o id do campo) } */
  function campo(o) {
    var erro = o.erro !== undefined ? o.erro : (daTela().erros || {})[o.id], aviso = '';
    var casas = o.casas === undefined ? 2 : o.casas;
    if (!erro && !o.fixo && o.valor !== null && o.valor !== undefined &&
        ((o.min !== undefined && o.valor < o.min) || (o.max !== undefined && o.valor > o.max))) {
      aviso = o.faixa || ('Fora da faixa usual (' + f.num(o.min, casas) + ' a ' + f.num(o.max, casas) + (o.unidade ? ' ' + o.unidade : '') + '). Confira.');
    }
    var estado = '';
    if (o.fixo) estado = selo('demo', o.fixo, o.fonte);
    else if (o.padrao !== undefined) {
      estado = o.alterado
        ? selo('alterado', 'alterado por você') + '<button type="button" class="voltar" data-acao="voltar" data-caminho="' + o.caminho +
          '" title="' + esc(o.fonte || '') + '">Voltar ao padrão (' + (o.textoPadrao || f.num(o.padrao, casas).replace(/,0+$/, '')) + ')</button>'
        : selo('norma', o.seloPadrao || 'padrão da norma', o.fonte);
    } else if (o.fonte) estado = selo('norma', 'fonte', o.fonte);
    return '<div class="campo' + (erro ? ' invalido' : '') + '">' +
      '<label for="' + o.id + '">' + esc(o.rotulo) + '</label>' +
      '<div class="entrada' + (o.fixo ? ' fixo' : '') + '">' +
        '<input class="num" id="' + o.id + '" type="text" inputmode="decimal" autocomplete="off" value="' + f.campo(o.valor, casas) + '"' +
        (o.fixo ? ' readonly' : ' data-caminho="' + o.caminho + '" data-tipo="' + (o.inteiro ? 'int' : 'num') + '"' + (o.padrao !== undefined || o.anulavel ? ' data-anulavel="1"' : '') +
          (o.negativo ? ' data-negativo="1"' : '')) + '>' +
        (o.unidade ? '<span class="un">' + esc(o.unidade) + '</span>' : '') +
      '</div>' +
      '<div class="estado">' + estado + '</div>' +
      (erro || aviso ? '<div class="msg" role="alert">' + esc(erro || aviso) + '</div>' : '') +
    '</div>';
  }

  function texto(o) {
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<input id="' + o.id + '" type="text" autocomplete="off" value="' + esc(o.valor) + '" placeholder="' + esc(o.dica || '') +
      '" data-caminho="' + o.caminho + '" data-tipo="txt"></div>' +
      (o.nota ? '<div class="fraco">' + esc(o.nota) + '</div>' : '') + '</div>';
  }

  function seletor(o) {
    var ops = o.opcoes.map(function (op) {
      var v = typeof op === 'string' ? op : op.v, t = typeof op === 'string' ? op : op.t;
      return '<option value="' + esc(v) + '"' + (v === o.valor ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<select id="' + o.id + '"' + (o.caminho ? ' data-caminho="' + o.caminho + '" data-tipo="sel"' : '') + (o.acaoSel ? ' data-acao-sel="' + o.acaoSel + '"' : '') + '>' + ops + '</select></div>' +
      '<div class="estado">' + (o.fonte ? selo('norma', o.seloTexto || 'fonte', o.fonte) : '') + '</div>' +
      (o.nota ? '<div class="fraco">' + esc(o.nota) + '</div>' : '') + '</div>';
  }

  function segmentado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div><div class="seg" role="group" aria-label="' + esc(o.rotulo) + '">' +
      o.opcoes.map(function (op) {
        return '<button type="button" data-acao="' + (o.acao || 'definir') + '" data-caminho="' + o.caminho + '"' + (o.campo ? ' data-campo="' + o.campo + '"' : '') + ' data-valor="' + esc(op.v) + '"' +
          (o.numerico ? ' data-numerico="1"' : '') + (o.booleano ? ' data-booleano="1"' : '') + ' aria-pressed="' + (op.v === o.valor) + '">' + esc(op.t) + '</button>';
      }).join('') + '</div></div>' + (o.fonte ? '<div class="estado">' + selo('norma', 'fonte', o.fonte) + '</div>' : '') + '</div>';
  }

  // Valor calculado: não se edita, e o clique abre a conta
  function calculado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div>' +
      '<button type="button" class="valor-calc num" data-acao="' + (o.chave ? 'conta' : 'fonte') + '"' +
      (o.chave ? ' data-chave="' + o.chave + '"' : ' data-fonte="' + esc(o.fonte || '') + '"') + '>' + esc(o.valor) +
      (o.unidade ? ' <small>' + esc(o.unidade) + '</small>' : '') + '</button></div>' +
      '<div class="estado">' + selo('calc', 'calculado') + (o.demo ? selo('demo', typeof o.demo === 'string' ? o.demo : 'valor do exemplo') : '') + '</div></div>';
  }

  function passos(lista) {
    return lista.map(function (p) {
      return '<div class="passo"><div class="q"><span>' + esc(p.passo) + '</span><span class="num">' + esc(p.resultado) + '</span></div>' +
        (p.formula ? '<div class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</div>' : '') +
        (p.fonte ? '<div class="fo">' + esc(p.fonte) + '</div>' : '') + '</div>';
    }).join('');
  }

  function aprender(html) {
    return daTela().aprender ? '<div class="aprender"><b>Por quê?</b> ' + html + '</div>' : '';
  }

  // Cabeçalho de tela: linha de contexto, título e texto de apoio (o texto aceita HTML do app)
  function cabeca(sobre, titulo, texto) {
    return '<div class="cabeca"><div class="sobre">' + esc(sobre) + '</div><h1>' + esc(titulo) + '</h1>' + (texto ? '<p>' + texto + '</p>' : '') + '</div>';
  }

  // Indicador: rótulo, valor e, se houver, uma linha de apoio
  function kpi(rotulo, valor, sub) {
    return '<div class="kpi-c"><span>' + rotulo + '</span><b class="num">' + valor + '</b>' + (sub ? '<span class="fraco">' + sub + '</span>' : '') + '</div>';
  }

  /* Bloco recolhível com frase-resumo. id (chave em U.aberto), n (número), titulo, frase, carga (valor à direita), rotuloCarga,
     corpo (função que devolve o HTML; só é chamada com o bloco aberto) */
  function bloco(id, n, titulo, frase, carga, rotuloCarga, corpo) {
    var aberto = !!(daTela().aberto || {})[id];
    return '<section class="bloco' + (aberto ? ' aberto' : '') + '" id="bloco-' + id + '">' +
      '<button type="button" class="bloco-cab" data-acao="bloco" data-bloco="' + id + '" aria-expanded="' + aberto + '">' +
        '<span class="n">' + n + '</span><span><span class="tit">' + titulo + '</span><span class="frase">' + esc(frase) + '</span></span>' +
        '<span class="carga num">' + carga + (rotuloCarga ? '<small>' + rotuloCarga + '</small>' : '') + '</span><span class="seta" aria-hidden="true">›</span>' +
      '</button>' + (aberto ? '<div class="bloco-corpo">' + corpo() + '</div>' : '') + '</section>';
  }

  /* Barras ordenadas da maior para a menor; cada linha abre a conta. lista = [{ chave, nome, valor }]; total = base do percentual;
     unidade = texto depois do valor; casas = casas decimais do valor (padrão 0) */
  function barras(lista, total, unidade, casas) {
    var max = 0, min = 0;
    lista.forEach(function (c) { max = Math.max(max, c.valor); min = Math.min(min, c.valor); });
    var faixa = (max - min) || 1, zero = (-min / faixa) * 100;
    var ordenado = lista.slice().sort(function (a, b) { return b.valor - a.valor; });
    return '<div class="barras">' + ordenado.map(function (c) {
      var larg = Math.abs(c.valor) / faixa * 100;
      var estilo = c.valor >= 0 ? 'left:' + zero.toFixed(2) + '%;width:' + larg.toFixed(2) + '%' : 'left:' + (zero - larg).toFixed(2) + '%;width:' + larg.toFixed(2) + '%';
      return '<div class="linha-b" data-acao="conta" data-chave="' + c.chave + '" role="button" tabindex="0" title="Abrir a conta">' +
        '<span class="nome">' + esc(c.nome) + '</span>' +
        '<span class="trilho"><span class="eixo" style="left:' + zero.toFixed(2) + '%"></span><span class="barra' + (c.valor < 0 ? ' neg' : '') + '" style="' + estilo + '"></span></span>' +
        '<span class="v">' + f.num(c.valor, casas || 0) + (unidade ? ' ' + unidade : '') + '</span><span class="p">' + f.num(c.valor / total * 100, 0) + ' %</span></div>';
    }).join('') + '</div>';
  }

  // Os mesmos passos da gaveta, em tabela, para a folha do memorial
  function tabPassos(lista) {
    return '<table class="passos-t"><thead><tr><th>Passo</th><th>Fórmula e valores</th><th class="num">Resultado</th><th>Fonte</th></tr></thead><tbody>' +
      lista.map(function (p) {
        return '<tr><td>' + esc(p.passo) + '</td><td class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</td><td class="num">' + esc(p.resultado) + '</td><td>' + esc(p.fonte) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* Lista de cartões do celular (v0.4.0): oculta no computador (o app desenha também a tabela, marcada com .so-computador).
     itens = [{ href (tela que o cartão abre; sem href o cartão não é link), titulo, sub (texto depois do título),
     valores: [{ r (rótulo), v (valor já formatado), u (unidade) }] (valor vazio ou "—" não aparece), situacao (HTML do app),
     destaque (bool: barra lateral, como o circuito crítico) }] */
  function cartoes(itens) {
    return '<ul class="cel-cartoes">' + itens.map(function (x) {
      var vals = (x.valores || []).filter(function (v) { return v && v.v !== undefined && v.v !== null && v.v !== '' && v.v !== '—'; }).map(function (v) {
        return '<span><small>' + esc(v.r) + '</small>' + esc(v.v) + (v.u ? ' ' + esc(v.u) : '') + '</span>';
      }).join('');
      var tag = x.href ? 'a' : 'div', corpo = '<span class="cel-c-tit"><b>' + esc(x.titulo) + '</b>' + (x.sub ? ' <span>· ' + esc(x.sub) + '</span>' : '') + '</span>' +
        (x.href ? '<span class="cel-c-seta" aria-hidden="true">›</span>' : '') + (vals ? '<span class="cel-c-vals num">' + vals + '</span>' : '') +
        (x.situacao ? '<span class="cel-c-sit">' + x.situacao + '</span>' : '');
      return '<li><' + tag + ' class="cel-cartao' + (x.destaque ? ' destaque' : '') + '"' + (x.href ? ' href="' + esc(x.href) + '"' : '') + '>' + corpo + '</' + tag + '></li>';
    }).join('') + '</ul>';
  }

  H.ui.c = { selo: selo, campo: campo, texto: texto, seletor: seletor, segmentado: segmentado, calculado: calculado, passos: passos, aprender: aprender,
             cabeca: cabeca, kpi: kpi, bloco: bloco, barras: barras, tabPassos: tabPassos, cartoes: cartoes };
})(window.HVAC);

</script>
<script>
/* ==== plataforma v0.6.1: js/interface/casca.js ==== */
/* Plataforma HVAC. Casca comum dos apps: estado, armazenamento, rotas, trilha, faixa de resultado, gaveta, janela, paleta de comandos,
   tema, modo aprendizado, arquivo de projeto com relatório de importação e impressão do memorial; desde a v0.4.0, o celular
   (Menu, barra de passos, Voltar, dica por toque, tabelas que rolam, memorial em escala, teclado), só com a tela estreita.
   Tudo o que é próprio do app vem do manifesto H.app (contrato em docs\GUIA_INTERFACE.md). A casca não conhece motor nenhum:
   só chama as funções do manifesto. Carrega depois de componentes.js e antes dos arquivos do app; o manifesto é lido em iniciar(). */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc;
  var CHAVE_PREF = 'hvac.preferencias.v1';     // tema e modo aprendizado: a mesma chave em todos os apps

  var A = null;                               // manifesto do app (H.app)
  var E = null;                               // projeto (o que vai para o arquivo)
  var U = H.ui.U = {                          // estado da tela (não vai para o arquivo); o app acrescenta os seus campos em H.app.estado
    tela: 'inicio', temIndice: false, aberto: {}, aprender: false, tema: 'claro', erros: {}, delta: 0, sobre: null, paleta: null
  };
  var clicarDepois = null;                    // seletor do parâmetro de teste ?clicar=, à espera do próximo desenho
  var digitarDepois = null;                   // "<id>:<valor>" do parâmetro de teste ?digitar=, à espera do próximo desenho
  var despejar = false;                       // parâmetro de teste ?despejar=1: o texto do arquivo vai para a página a cada desenho
  function tem(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }

  // ------------------------------------------------------------ armazenamento (o app funciona sem ele)
  function guardar() { try { localStorage.setItem(A.chave, JSON.stringify(E)); } catch (e) { /* sem armazenamento: segue em memória */ } }
  function guardarPref() { try { localStorage.setItem(CHAVE_PREF, JSON.stringify({ aprender: U.aprender, tema: U.tema })); } catch (e) { /* idem */ } }
  function contar(rel, nivel) { var n = 0; rel.forEach(function (x) { if (x.nivel === nivel) n++; }); return n; }
  // O relatório abre sozinho quando o arquivo veio de formato anterior ou quando algum valor foi substituído
  function pedeRelatorio(r) { return r.versaoOrigem < A.arquivo.versao || contar(r.relatorio, 'substituido') > 0; }
  function carregar() {
    try {
      var p = JSON.parse(localStorage.getItem(CHAVE_PREF) || 'null');
      if (p) { U.aprender = !!p.aprender; U.tema = p.tema === 'escuro' ? 'escuro' : 'claro'; }
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) U.tema = 'escuro';
      var s = JSON.parse(localStorage.getItem(A.chave) || 'null');
      if (s) {
        var r = A.arquivo.abrir(s);
        if (r.ok) {
          // mesmo caminho de importarTexto: relatório guardado e aberto na primeira tela quando houve conversão de formato ou substituição
          U.mostrarNaAbertura = pedeRelatorio(r);
          if (U.mostrarNaAbertura) U.importacao = { nome: 'projeto guardado no navegador', versaoOrigem: r.versaoOrigem, relatorio: r.relatorio, quando: fmtQuando() };
          return r.projeto;
        }
      }
    } catch (e) { /* dado ilegível: abre o exemplo */ }
    return A.arquivo.exemplo();
  }

  // ------------------------------------------------------------ importação (arquivo de projeto e parâmetro de teste ?importar=)
  function fmtQuando() {
    var d = new Date(), z = function (n) { return ('0' + n).slice(-2); };
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  function htmlNaoAbriu(motivo) {
    return '<h2>Não foi possível abrir</h2><p>' + esc(motivo) + '</p><div class="acoes" style="margin-top:12px"><button class="botao prim" data-acao="fechar">Fechar</button></div>';
  }
  /* Abre o projeto lido do texto do arquivo. opc.semGuardar: não grava no localStorage (parâmetro de teste); opc.irParaProjeto: navega
     à rota de abertura do app (A.arquivo.rotaAoAbrir, padrão "projeto"). Devolve true quando abriu. */
  function importarTexto(texto, nome, opc) {
    opc = opc || {};
    var obj, r, destino = A.arquivo.rotaAoAbrir || 'projeto';
    try { obj = JSON.parse(texto); } catch (e) { U.sobre = { tipo: 'janela', html: htmlNaoAbriu('O arquivo escolhido não é um arquivo JSON válido.') }; return false; }
    r = A.arquivo.abrir(obj);
    if (!r.ok) { U.sobre = { tipo: 'janela', html: htmlNaoAbriu(r.motivo) }; return false; }
    E = r.projeto; U.delta = 0; U.erros = {};
    U.importacao = { nome: nome || 'arquivo', versaoOrigem: r.versaoOrigem, relatorio: r.relatorio, quando: fmtQuando() };
    if (!opc.semGuardar) guardar();
    var mostrar = pedeRelatorio(r);
    if (opc.irParaProjeto && U.tela !== destino) { U.mostrarImportacao = mostrar; location.hash = '#/' + destino; }
    else if (mostrar) U.sobre = { tipo: 'janela', html: htmlImportacao() };
    return true;
