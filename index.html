/* Plataforma HVAC: tokens de tema, base e componentes comuns aos apps.
   Regra do guia: nenhum valor de cor fora dos blocos de tokens. Cor própria de um app entra no CSS do app.
   Direção visual (v0.5.0, docs\DESIGN.md): folha de dados técnica. Papel frio e branco, canto vivo no que é documento,
   cor por função em tom suave e cor forte só para erro e alerta. O @import acima é expandido pelo embutir.ps1. */
:root {
  --fundo: #eef1f3; --sup: #ffffff; --sup2: #f5f7f8; --linha: #d0d7dc; --linha-forte: #8e9aa3;
  --tinta: #142027; --tinta2: #44535c; --tinta3: #5f6d76;
  --prim: #0e5f59; --prim-tinta: #ffffff; --prim-suave: #dcebe8;
  --norma-f: #e6ecd6; --norma-t: #42511c;
  --alt-f: #fbe7c2; --alt-t: #744600;
  --calc-f: #e6eaed; --calc-t: #44535c;
  --demo-f: #e7e0f3; --demo-t: #4a3879;
  --erro: #b3261e; --alerta: #8a5200; --ok: #2c6b2f;
  /* sombra só no que flutua sobre a tela (gaveta, janela, balões); nada de sombra em cartão ou bloco */
  --sombra: 0 6px 20px rgba(20, 32, 39, .18);
  /* canto: vivo no que é documento (cartão, bloco, campo, tabela, selo); um pouco maior no que se toca (botão) */
  --raio: 2px; --raio-toque: 4px; --raio-folha-sobe: 8px;
  --fonte: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fonte-titulo: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --fonte-dado: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  --fonte-rotulo: var(--fonte-titulo);
  /* Cores que valem igual nos dois temas: véu das janelas, variação da faixa e a folha do memorial (papel branco). */
  --veu: rgba(10, 16, 16, .45); --faixa-delta: rgba(127, 127, 127, .3);
  --folha-fundo: #fff; --folha-tinta: #1b1b1b; --folha-tinta2: #555; --folha-linha: #d5d5d5;
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --fundo: #11171b; --sup: #182025; --sup2: #1e272d; --linha: #2c3840; --linha-forte: #50606b;
  --tinta: #e6ecef; --tinta2: #b2bec5; --tinta3: #8c9aa2;
  --prim: #5fc4b8; --prim-tinta: #0b1f1d; --prim-suave: #1d3734;
  --norma-f: #2c3520; --norma-t: #c9d8a2;
  --alt-f: #45330f; --alt-t: #f3cf8a;
  --calc-f: #263036; --calc-t: #b2bec5;
  --demo-f: #2f2945; --demo-t: #cbbdf0;
  --erro: #ff8a80; --alerta: #f0b862; --ok: #8fd694;
  --sombra: 0 6px 20px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.5 var(--fonte); padding-bottom: 76px; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 600; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
a { color: var(--prim); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--prim); outline-offset: 2px; border-radius: var(--raio-toque); }
/* quem pede menos movimento no sistema não vê transição (P10, v0.5.1) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}
.num { font-variant-numeric: tabular-nums; }
.suave { color: var(--tinta2); }
.fraco { color: var(--tinta3); font-size: 13px; }
.oculto { display: none !important; }

/* ---------- Topo e trilha ---------- */
.topo { position: sticky; top: 0; z-index: 20; background: var(--sup); border-bottom: 1px solid var(--linha); }
.topo-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 8px; font-family: var(--fonte-titulo); font-weight: 700; text-decoration: none; color: var(--tinta); white-space: nowrap; }
.marca svg { width: 26px; height: 26px; }
.marca small { font-weight: 500; color: var(--tinta3); font-size: 12px; }
.topo-acoes { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icone { background: none; border: 1px solid transparent; border-radius: var(--raio-toque); padding: 6px 10px; color: var(--tinta2); font-size: 13px; white-space: nowrap; }
.icone:hover { background: var(--sup2); border-color: var(--linha); }
.icone[aria-pressed="true"] { background: var(--prim-suave); color: var(--prim); border-color: transparent; font-weight: 600; }
kbd { font: 11px var(--fonte-dado); border: 1px solid var(--linha-forte); border-bottom-width: 2px; border-radius: var(--raio); padding: 0 5px; color: var(--tinta2); background: var(--sup); }

.trilha { max-width: 1040px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 4px; list-style: none; overflow-x: auto; }
.trilha li { flex: 1 1 0; min-width: 118px; }
.trilha a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--raio); text-decoration: none; color: var(--tinta2); border: 1px solid transparent; }
.trilha a:hover { background: var(--sup2); }
/* o passo é uma sequência real: número em quadro de canto vivo, como a etapa de um carimbo (não em círculo) */
.trilha .n { flex: none; width: 24px; height: 24px; border-radius: var(--raio); border: 1.5px solid var(--linha-forte); display: grid; place-items: center; font: 500 12px var(--fonte-dado); }
.trilha .t { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; }
.trilha .s { display: block; font-size: 12px; color: var(--tinta3); white-space: nowrap; }
.trilha a[aria-current="page"] { background: var(--prim-suave); color: var(--tinta); }
.trilha a[aria-current="page"] .n { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.trilha .pend .s { color: var(--alerta); }

/* ---------- Estrutura da tela ---------- */
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; }
main.larga { max-width: 1040px; }
.cabeca { margin-bottom: 20px; }
/* linha de contexto ("Passo 1 de 4"): referência em fonte de dado, sem caixa alta espaçada */
.cabeca .sobre { font: 500 12.5px var(--fonte-dado); color: var(--tinta2); margin-bottom: 6px; }
.cabeca p { color: var(--tinta2); margin-top: 6px; max-width: 62ch; }
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; margin-bottom: 14px; }
/* título de seção da folha: régua escura embaixo, como num memorial */
.cartao > h2 { margin-bottom: 12px; padding-bottom: 4px; border-bottom: 1.5px solid var(--tinta); }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade:not(.g2) > .campo { max-width: 300px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.botao { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha-forte); background: var(--sup); border-radius: var(--raio-toque); padding: 8px 14px; font-weight: 600; text-decoration: none; color: var(--tinta); }
.botao:hover { border-color: var(--prim); }
.botao.prim { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.botao.leve { border-color: transparent; background: none; color: var(--prim); padding: 6px 8px; }
.botao.perigo:hover { border-color: var(--erro); color: var(--erro); }
/* aviso e "Por quê?": nota em quadro de traço fino, sem a barra lateral grossa e sem o fundo pastel */
.aviso { border: 1px solid var(--demo-t); background: var(--sup); color: var(--demo-t); border-radius: var(--raio); padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.aprender { border-top: 1.5px solid var(--prim); border-bottom: 1px solid var(--linha); background: var(--sup2); border-radius: 0; padding: 10px 14px; font-size: 14px; margin: 0 0 14px; }
.aprender b { color: var(--prim); }

/* ---------- Campo com estado ---------- */
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo label, .rotulo { font-size: 13px; font-weight: 600; color: var(--tinta2); }
.entrada { display: flex; align-items: stretch; border: 1px solid var(--linha-forte); border-radius: var(--raio); background: var(--sup); overflow: hidden; }
.entrada:focus-within { border-color: var(--prim); box-shadow: 0 0 0 3px var(--prim-suave); }
.entrada input, .entrada select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 11px; outline: none; font-size: 15px; }
.entrada input.num { text-align: right; font-weight: 600; }
.entrada .un { display: grid; place-items: center; padding: 0 10px; font: 13px var(--fonte-dado); color: var(--tinta3); background: var(--sup2); border-left: 1px solid var(--linha); white-space: nowrap; }
.entrada.fixo { background: var(--sup2); border-style: dashed; }
.entrada.fixo input { color: var(--tinta2); }
.campo.invalido .entrada { border-color: var(--erro); }
.estado { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 22px; }
/* selo de origem: etiqueta de canto vivo em tom suave (a cor diz a função, o texto sempre presente); não é pílula */
.selo { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: var(--raio); padding: 2px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo.norma { background: var(--norma-f); color: var(--norma-t); }
.selo.alterado { background: var(--alt-f); color: var(--alt-t); }
.selo.calc { background: var(--calc-f); color: var(--calc-t); }
.selo.demo { background: var(--demo-f); color: var(--demo-t); }
.selo.mantido { background: var(--prim-suave); color: var(--prim); }
button.selo:hover { filter: brightness(.95); text-decoration: underline; }
.voltar { border: 0; background: none; color: var(--tinta2); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.msg { font-size: 12.5px; color: var(--alerta); }
.campo.invalido .msg { color: var(--erro); }
.seg { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: var(--raio-toque); overflow: hidden; background: var(--sup); }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 14px; border-right: 1px solid var(--linha); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--prim); color: var(--prim-tinta); font-weight: 600; }
.valor-calc { display: inline-flex; align-items: baseline; gap: 6px; border: 1px dashed var(--linha-forte); background: var(--sup2); border-radius: var(--raio); padding: 8px 11px; font-weight: 650; color: var(--tinta); text-align: left; }
.valor-calc:hover { border-color: var(--prim); }
.valor-calc small { font-weight: 500; color: var(--tinta3); }

/* ---------- Bloco recolhível (frase-resumo) ---------- */
.bloco { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.bloco-cab { width: 100%; display: grid; grid-template-columns: 30px 1fr auto 18px; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; border-radius: var(--raio); }
.bloco-cab:hover { background: var(--sup2); }
.bloco-cab .n { width: 28px; height: 28px; border-radius: var(--raio); border: 1.5px solid var(--prim); color: var(--prim); display: grid; place-items: center; font: 500 13px var(--fonte-dado); }
.bloco-cab .tit { font-weight: 600; font-size: 16px; display: block; }
.bloco-cab .frase { color: var(--tinta2); font-size: 14px; display: block; }
.bloco-cab .carga { text-align: right; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bloco-cab .carga small { display: block; font-weight: 500; color: var(--tinta3); font-size: 12px; }
.bloco-cab .seta { color: var(--tinta3); transition: transform .15s; }
.bloco.aberto .bloco-cab .seta { transform: rotate(90deg); }
.bloco.aberto { border-color: var(--linha-forte); }
.bloco-corpo { padding: 4px 16px 18px 58px; }
.sub { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linha); }
.sub > h3 { margin-bottom: 10px; }
details.mais { margin-top: 16px; border-top: 1px solid var(--linha); padding-top: 12px; }
details.mais > summary { cursor: pointer; font-weight: 600; color: var(--prim); font-size: 14px; }
details.mais > .grade { margin-top: 12px; }

/* ---------- Lista de ambientes (linha: nome, indicadores e ações; o app pode trocar as colunas) ---------- */
.amb-item { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.amb-item:hover { border-color: var(--prim); }
.amb-item a.nome { font-weight: 600; font-size: 16px; color: var(--tinta); text-decoration: none; }
.amb-item a.nome:hover { color: var(--prim); text-decoration: underline; }
.amb-item .kpi { text-align: right; }
.amb-item .kpi b { font-size: 18px; }

/* ---------- Tabelas ---------- */
.tabela-rolo { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
/* cabeçalho de tabela: o único lugar (com o carimbo) em que a caixa alta é permitida, em fonte estreita */
th { font-family: var(--fonte-rotulo); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta2); font-weight: 600; white-space: nowrap; border-bottom-color: var(--linha-forte); }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; border-top: 2px solid var(--linha-forte); }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: var(--sup2); }
.x { border: 0; background: none; color: var(--tinta3); font-size: 18px; padding: 6px; border-radius: var(--raio-toque); }
.x:hover { color: var(--erro); background: var(--sup2); }

/* ---------- Número em destaque, indicadores, barras, cartões e lista de pendências ---------- */
.heroi-res { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.numero { font-family: var(--fonte-titulo); font-size: 64px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.numero small { font-size: 24px; font-weight: 600; color: var(--tinta2); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi-c { border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px 12px; background: var(--sup); text-align: left; }
button.kpi-c:hover { border-color: var(--prim); }
.kpi-c span { display: block; font-size: 12px; color: var(--tinta3); font-weight: 600; }
.kpi-c b { font-size: 18px; font-variant-numeric: tabular-nums; }
.barras { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 84px 52px; gap: 6px 12px; align-items: center; font-size: 14px; }
.barras .linha-b { display: contents; cursor: pointer; }
.barras .linha-b:hover .nome { color: var(--prim); text-decoration: underline; }
.barras .trilho { height: 14px; position: relative; }
.barras .barra { position: absolute; top: 0; bottom: 0; background: var(--prim); border-radius: 0; min-width: 2px; }
.barras .barra.neg { background: var(--tinta3); border-radius: 0; }
.barras .eixo { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--linha-forte); }
.barras .v, .barras .p { text-align: right; font-variant-numeric: tabular-nums; }
.barras .p { color: var(--tinta3); }
.pesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.peso { border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px; }
.peso b { display: block; font-size: 22px; font-family: var(--fonte-titulo); font-variant-numeric: tabular-nums; }
.pend { list-style: none; padding: 0; margin: 0; }
.pend li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.pend li:last-child { border-bottom: 0; }

/* ---------- Faixa de resultado ---------- */
.faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--tinta); color: var(--fundo); }
.faixa-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.faixa .item span { display: block; font-size: 11.5px; opacity: .75; }
.faixa .item b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.faixa .delta { font-size: 13px; border-radius: var(--raio); padding: 3px 8px; background: var(--faixa-delta); font-variant-numeric: tabular-nums; }
.faixa a { margin-left: auto; color: inherit; font-weight: 600; text-decoration: none; border: 1px solid currentColor; border-radius: var(--raio-toque); padding: 7px 12px; }

/* ---------- Gaveta, paleta e janela ---------- */
.veu { position: fixed; inset: 0; background: var(--veu); z-index: 40; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--sup); z-index: 41; box-shadow: var(--sombra); display: flex; flex-direction: column; }
.gaveta header { padding: 18px 20px 12px; border-bottom: 1px solid var(--linha); display: flex; gap: 12px; align-items: flex-start; }
.gaveta header div { flex: 1; }
.gaveta .corpo { padding: 16px 20px 28px; overflow: auto; }
.gaveta .valor-g { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.passo { border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px 12px; margin-bottom: 8px; }
.passo .q { font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.passo .f { font-family: var(--fonte-dado); font-size: 13px; color: var(--tinta2); margin-top: 2px; overflow-wrap: anywhere; }
.passo .fo { font-size: 12.5px; color: var(--tinta3); margin-top: 4px; }
.janela { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); max-height: 76vh; overflow: auto; background: var(--sup); z-index: 41; border-radius: var(--raio-toque); box-shadow: var(--sombra); padding: 16px; }
.janela h2 { margin-bottom: 10px; }
.paleta input { width: 100%; border: 1px solid var(--linha-forte); border-radius: var(--raio); padding: 10px 12px; background: var(--sup); font-size: 16px; }
.paleta ul { list-style: none; margin: 10px 0 0; padding: 0; }
.paleta li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: var(--raio); display: flex; justify-content: space-between; gap: 10px; }
.paleta li button.ativo, .paleta li button:hover { background: var(--prim-suave); }

@media (max-width: 760px) {
  h1 { font-size: 23px; }
  .trilha .s { display: none; }
  .trilha li { min-width: 0; }
  .trilha .t { font-size: 13px; }
  .topo-acoes .txt { display: none; }
  .bloco-corpo { padding-left: 16px; }
  .bloco-cab { grid-template-columns: 30px 1fr 18px; }
  .bloco-cab .carga { grid-column: 2; text-align: left; }
  .bloco-cab .carga small { display: inline; margin-left: 6px; }
  .heroi-res { grid-template-columns: 1fr; gap: 14px; }
  .numero { font-size: 48px; }
  .barras { display: block; }
  .barras .linha-b { display: grid; grid-template-columns: 1fr auto 44px; gap: 3px 10px; margin-bottom: 10px; }
  .barras .trilho { grid-column: 1 / -1; grid-row: 2; }
  .faixa-linha { gap: 14px; }
  .faixa .item.sec { display: none; }
  .amb-item { grid-template-columns: 1fr; }
  .amb-item .kpi { text-align: left; }
}

/* ---------- Celular (v0.4.0; especificação aprovada na sessão M0, itens C1 a C17) ----------
   Regra que muda elemento que já existe: só sob @media screen and (max-width: 760px). O "screen" é obrigatório: sem ele o
   navegador aplica a regra também na impressão e o PDF muda (achado da M0). A regra estreita acima (sem "screen") fica como está.
   Elemento novo (cel-*) nasce oculto aqui e só aparece em tela estreita: no computador não ocupa nenhum pixel. */
.cel-menu, .cel-passos, .cel-dica, .cel-cartoes, .cel-rolar { display: none; }
/* .so-celular: só em tela estreita (some no computador e no papel); .so-computador: some em tela estreita */
@media not screen and (max-width: 760px) { .so-celular { display: none !important; } }
/* Seletor de arquivo de projeto sobre um botão, invisível (input[type=file][data-arquivo-projeto] dentro de .arquivo-projeto):
   o seletor escondido com display:none e acionado por código falha em alguns celulares */
.arquivo-projeto { position: relative; overflow: hidden; cursor: pointer; }
.arquivo-projeto input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }

@media screen and (max-width: 760px) {
  .so-computador { display: none !important; }

  /* página e área segura (entalhe do iPhone, barra de gestos; o app põe viewport-fit=cover no index.html) (C11) */
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  body:has(#faixa.faixa) { padding-bottom: calc(124px + env(safe-area-inset-bottom)); }
  main { padding: 16px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  .cartao { padding: 14px; }
  button, a, input, select, textarea, summary, label { touch-action: manipulation; }   /* sem o atraso do toque duplo (C16) */

  /* topo: marca e um botão Menu; o rótulo de versão vai para o Menu e a trilha desce para a barra de passos (C1) */
  .topo { padding-top: env(safe-area-inset-top); }
  .topo-linha { padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left)); gap: 8px; }
  .marca { min-width: 0; min-height: 44px; }
  .marca span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .marca small { display: none; }
  .topo-acoes > :not(.cel-menu) { display: none; }
  .cel-menu { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; border-color: var(--linha); font-weight: 600; color: var(--tinta); }
  .topo .trilha { display: none; }
  .cel-lista-menu { display: grid; gap: 8px; }   /* Menu (C2) */
  .cel-lista-menu .botao { justify-content: flex-start; width: 100%; }

  /* barra de passos embaixo: passo anterior, passo atual (abre a lista dos passos) e próximo (C3) */
  .cel-passos { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 16;
    background: var(--sup); border-top: 1px solid var(--linha); padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .cel-passos > * { min-height: 56px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none;
    color: var(--prim); background: none; border: 0; padding: 4px 2px; font-size: 22px; line-height: 1; }
  .cel-passos small { font-size: 11px; color: var(--tinta3); margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cel-passos .vazio { visibility: hidden; }
  .cel-passos .atual { color: var(--tinta); font-size: 15px; border-left: 1px solid var(--linha); border-right: 1px solid var(--linha); }
  .cel-passos .atual small { margin: 0; }
  .cel-passos .atual b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cel-passos .atual .pend { color: var(--alerta); }
  .cel-trilha { flex-direction: column; max-width: none; padding: 0; gap: 4px; overflow: visible; }   /* lista dos passos, na janela */
  .cel-trilha li { flex: none; }
  .cel-trilha a { min-height: 52px; }
  .cel-trilha .s { display: block; white-space: normal; }

  /* faixa de resultado: uma linha, logo acima da barra de passos; a variação vira um balão acima dela (C4) */
  .faixa { bottom: calc(57px + env(safe-area-inset-bottom)); }
  .faixa-linha { position: relative; padding: 6px 12px; gap: 12px; flex-wrap: nowrap; }
  .faixa .item { min-width: 0; }
  .faixa .item span { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .faixa .item b { font-size: 15px; white-space: nowrap; }
  .faixa .delta { position: absolute; right: 12px; top: -34px; background: var(--tinta); box-shadow: var(--sombra); }
  .faixa a { display: inline-flex; align-items: center; padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  /* com um campo em edição (teclado aberto), a barra de passos e a faixa somem (C15) */
  body.cel-digitando .cel-passos, body.cel-digitando .faixa { display: none; }

  /* campos: letra de 16 px (abaixo disso o iPhone amplia a tela ao tocar) e 44 px de altura; o campo ocupa a largura (C5) */
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]), select, textarea { font-size: 16px; }
  .entrada input, .entrada select { min-height: 44px; }
  .grade:not(.g2) > .campo { max-width: none; }
  /* grade só de números (digitados ou calculados): duas colunas; com texto, lista ou segmentado, uma (C6) */
  .grade:has(> .campo):not(:has(input[data-tipo="txt"], select, textarea, .seg)) { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .valor-calc { max-width: 100%; flex-wrap: wrap; }
  .estado .selo { white-space: normal; }

  /* alvos de toque de 44 px; selo e "voltar ao padrão" mantêm o desenho e a área de toque cresce para fora (C7) */
  .botao, .seg button, .valor-calc, .faixa a, .paleta li button { min-height: 44px; }
  .x { min-width: 44px; min-height: 44px; }
  button.selo, .voltar { position: relative; }
  button.selo::after, .voltar::after { content: ""; position: absolute; inset: -11px -4px; }
  .voltar { padding: 4px; }

  /* gaveta da conta e janelas (relatório, ajuda, Menu, comandos): folha que sobe de baixo (C8) */
  .gaveta { top: auto; left: 0; right: 0; width: 100%; max-height: 88vh; max-height: 88dvh; border-radius: var(--raio-folha-sobe) var(--raio-folha-sobe) 0 0; padding-bottom: env(safe-area-inset-bottom); }
  .gaveta header { position: relative; padding: 24px 16px 12px; }
  .gaveta header::before, .janela::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--linha-forte); }
  .gaveta .corpo { padding: 14px 16px 24px; }
  .gaveta .valor-g { font-size: 26px; }

/* v0.6.1 (Francisco, 2026-11-17): sem o cabeçalho e o rodapé do navegador (data, título, endereço da página). O navegador os
   imprime na margem da página; com a margem zero não há onde pô-los, e a margem do papel passa a ser o recuo da folha, repetido

@page { margin: 0; }

}

/* Formatação numérica (padrão brasileiro: vírgula decimal) e utilidades de texto. */
(function (H) {
  'use strict';

  function num(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (casas === undefined) casas = 2;
    var s = Math.abs(Number(v)).toFixed(casas);
    var partes = s.split('.');
    partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var negativo = Number(v) < 0 && Number(s) !== 0;
    return (negativo ? '−' : '') + partes.join(',');
  }

  function numU(v, casas, unidade) {
    return num(v, casas) + (unidade ? ' ' + unidade : '');
  }

  // Valor para dentro de um <input>: sem separador de milhar, sem zeros à direita
  function campo(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '';
    var s = Number(v).toFixed(casas === undefined ? 2 : casas);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }

  // Lê número digitado com vírgula ou ponto decimal
  function ler(texto) {
    if (typeof texto === 'number') return texto;
    if (texto === null || texto === undefined) return NaN;
    var s = String(texto).trim().replace(/\s/g, '').replace('−', '-');
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    return s === '' ? NaN : Number(s);
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function pct(v, casas) { return num(v * 100, casas === undefined ? 0 : casas) + ' %'; }

  H.util.fmt = { num: num, numU: numU, campo: campo, ler: ler, esc: esc, pct: pct };
})(window.HVAC);

<script>
/* ==== js/util/interpolacao.js ==== */
/* Interpolação em tabelas de catálogo — sem extrapolação.
 * Retorna também os pontos usados, para o memorial de cálculo.
 */
(function (D) {
  'use strict';

  function lin(x, x0, x1, y0, y1) {
    if (x1 === x0) return y0;
    return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }

  // modo: 'lin' (y linear em x), 'loglog' (log y linear em log x),
  //       'semilog' (y linear em log x — adequado para dB)
  function interp(x, x0, x1, y0, y1, modo) {
    if (modo === 'loglog' && x0 > 0 && x1 > 0 && y0 > 0 && y1 > 0 && x > 0) {
      return Math.exp(lin(Math.log(x), Math.log(x0), Math.log(x1), Math.log(y0), Math.log(y1)));
    }
    if (modo === 'semilog' && x0 > 0 && x1 > 0 && x > 0) {
      return lin(Math.log(x), Math.log(x0), Math.log(x1), y0, y1);
    }
    return lin(x, x0, x1, y0, y1);
  }

  /* Localiza o intervalo de x numa lista de pontos ordenada por x.
   * pts: array de arrays; ix: índice da coluna x.
   * Retorna { i0, i1, exato } ou null se x estiver fora do domínio publicado. */
  function intervalo(pts, x, ix) {
    var n = pts.length;
    if (!n) return null;
    var eps = 1e-9;
    if (x < pts[0][ix] - eps || x > pts[n - 1][ix] + eps) return null;
    for (var i = 0; i < n; i++) {
      if (Math.abs(pts[i][ix] - x) <= eps) return { i0: i, i1: i, exato: true };
    }
    for (var j = 0; j < n - 1; j++) {
      if (x > pts[j][ix] && x < pts[j + 1][ix]) return { i0: j, i1: j + 1, exato: false };
    }
    return null;
  }

  /* Interpola a coluna iy em x (coluna ix). */
  function naTabela(pts, x, ix, iy, modo) {
    var it = intervalo(pts, x, ix);
    if (!it) return null;
    var p0 = pts[it.i0], p1 = pts[it.i1];
    if (p0[iy] == null || p1[iy] == null) return null;
    var y = it.exato ? p0[iy] : interp(x, p0[ix], p1[ix], p0[iy], p1[iy], modo);
    return { valor: y, p0: p0, p1: p1, exato: it.exato, modo: modo };
  }

  D.util.interp = { lin: lin, interp: interp, intervalo: intervalo, naTabela: naTabela };
})(window.Difusores);

</script>

<script>
/* ==== js/util/rastro.js ==== */
/* Rastro de cálculo — base do memorial auditável.
 * Cada passo registra: fórmula, valores substituídos, resultado, unidade e fonte.
 * O motor recebe um Rastro opcional; sem rastro (null) os cálculos rodam sem
 * registrar passos (mais rápido para varrer centenas de alternativas).
 */
(function (D) {
  'use strict';

  function Rastro() {
    this.passos = [];
    this.estimados = [];   // itens decididos com dado estimado (geram "com ressalva")
    this.estendidos = [];  // regras estendidas de outra família/condição
    this.alertas = [];     // avisos que não mudam o selo
    this.metodos = [];     // notas de método, comuns a todos os candidatos (não mudam o selo nem a nota)
  }

  /* p = { grupo, titulo, formula, subst, valor, unidade, casas, fonte, tipo } */
  Rastro.prototype.passo = function (p) {
    this.passos.push(p);
    return p.valor;
  };

  Rastro.prototype.estimado = function (txt) {
    if (this.estimados.indexOf(txt) < 0) this.estimados.push(txt);
  };
  Rastro.prototype.estendido = function (txt) {
    if (this.estendidos.indexOf(txt) < 0) this.estendidos.push(txt);
  };
  Rastro.prototype.alerta = function (txt) {
    if (this.alertas.indexOf(txt) < 0) this.alertas.push(txt);
  };
  Rastro.prototype.metodo = function (txt) {
    if (this.metodos.indexOf(txt) < 0) this.metodos.push(txt);
  };

  // Rastro "nulo": mesma interface, não guarda passos (mas guarda as marcações,
  // que são necessárias para o selo e o índice de todas as alternativas).
  function RastroLeve() { Rastro.call(this); }
  RastroLeve.prototype = Object.create(Rastro.prototype);
  RastroLeve.prototype.passo = function (p) { return p.valor; };

  D.util.Rastro = Rastro;
  D.util.RastroLeve = RastroLeve;
})(window.Difusores);

</script>
<script>
/* ==== js/util/sanear.js ==== */
/* Células não monótonas das tabelas de catálogo.
 * Desde a v2.1.2 as tabelas TROX entram no cálculo como impressas (item B5 do quadro de decisão de
 * 2026-10-07): nenhum valor é corrigido. Este módulo só LISTA as células em que a grandeza diminui
 * quando Q aumenta, com o valor que a tendência dos vizinhos daria, para a conferência contra o
 * catálogo (célula a célula, com os vizinhos como referência). A lista sai do mesmo algoritmo que, até a v2.1.1, substituía
 * esses valores. */
(function (D) {
  'use strict';
  var I = D.util.interp;

  function arred(v, casas) { var f = Math.pow(10, casas); return Math.round(v * f) / f; }

  function estimar(pts, k, ix, iy, modo) {
    var a = k - 1, b = k + 1;
    while (a >= 0 && pts[a][iy] == null) a--;
    while (b < pts.length && pts[b][iy] == null) b++;
    if (a >= 0 && b < pts.length) return I.interp(pts[k][ix], pts[a][ix], pts[b][ix], pts[a][iy], pts[b][iy], modo);
    if (a >= 0) return pts[a][iy];
    if (b < pts.length) return pts[b][iy];
    return null;
  }

  function tx(v, modo) { return modo === 'lin' ? v : Math.log(v); }
  function ty(v, modo) { return modo === 'loglog' ? Math.log(v) : v; }

/* ==== js/motor/metodologia.js ==== */
/* Regras genéricas da metodologia de referência (seções 2 a 6).
 * Regra do ClimaApp (fator 0,75 de montagem suspensa) usada só nos testes de validação; o app usa 0,707 e não chama este módulo.
 * Validadas contra as saídas do ClimaApp nos testes (fixtures com coeficientes Tropical, só em teste).
 */
(function (D) {
  'use strict';

  var M = {
    // Seção 4 — número de direções: (1/n)^0,45
    fatorDirecoes: function (n) { return Math.pow(1 / n, 0.45); },
    // Seção 4 — repartição do alcance em difusores retangulares (r = lado maior / lado menor)
    fatorRetangularMaior: function (r) { return 0.9734 * Math.pow(r, 0.2341); },
    fatorRetangularMenor: function (r) { return 0.9115 * Math.pow(r, -0.4675); },
    // Seção 4 — sem efeito Coandă (duto aparente / livre suspenso)
    fatorSuspenso: 0.75,
    // Seção 2 — registro de lâminas opostas
    fatorRegistroAberto: 1.10,
    fatorRegistroRegulado: 1.25,
    // Seção 3 — soma de n fontes iguais
    somaFontes: function (nivel, n) { return nivel + 10 * Math.log10(n); },
    // Seção 6 — regra do catálogo DI (Tropical) para v na zona ocupada, por eixo:
    //   L ≥ Xmáx → 0,10 ; Xmín ≤ L < Xmáx → interpolação 0,25…0,10 ; L < Xmín → 0,25·(Xmín/L)
    vzoRegraReferencia: function (L, xmin, xmax) {
      if (L >= xmax) return 0.10;
      if (L >= xmin) return 0.25 - (L - xmin) / (xmax - xmin) * 0.15;
      return 0.25 * (xmin / L);
    },
    // Seção 9 — economia de peças
    pontosPecas: function (n) { return 10 / (1 + (n - 1) / 6); }
  };

  D.motor.metodologia = M;
})(window.Difusores);

/* Funções normativas auditáveis (NBR 16401-2/-3, ASHRAE cap. 9). Cada função devolve o valor

(function (D) {
  'use strict';

  /* Limite de velocidade do ar na zona ocupada — NBR 16401-2:2024, 6.3.2.4 (sem controle local; abaixo de 22,5 °C,

  function limiteVzo(to, controleLocal, r) {
    var n = D.dados.normas.nbr16401_2.velocidade, s = n.semControle, res;
    if (controleLocal) {
      res = { valor: n.controleLocal.maxFig4, clausula: '6.3.2.3', formula: 'sem limite superior na norma (6.3.2.3); alerta acima de 1,6 m/s (critério do app: fim do eixo da Figura 4)', subst: 'controle local da velocidade disponível (1 controle por 6 ocupantes ou por 84 m²)', semLimite: true };
    } else if (to < s.t1) {
      res = { valor: s.abaixo23, clausula: '6.3.2.4 c)', formula: 'v_máx = 0,20 m/s (t_o < 23 °C)', subst: 't_o = ' + F.num(to, 1) + ' °C' };

        res.alerta = { valor: n.corpoFrio.vMax, clausula: n.corpoFrio.clausula };
        res.formula = 'v_máx = 0,20 m/s (t_o < 23 °C); abaixo de 22,5 °C, alerta acima de 0,15 m/s (F.4, Anexo F, informativo)';
        res.subst = 't_o = ' + F.num(to, 1) + ' °C < 22,5 °C';

      var v = s.eq2[0] + s.eq2[1] * to + s.eq2[2] * to * to;
      var vFinal = Math.min(s.acima255, Math.max(s.abaixo23, v));
      res = { valor: vFinal, clausula: '6.3.2.4 b), Equação (2)', formula: 'v = 50,49 − 4,4047·t_o + 0,096425·t_o² (23 ≤ t_o ≤ 25,5 °C), limitado a 0,20–0,8 m/s', subst: 'v = 50,49 − 4,4047·' + F.num(to, 1) + ' + 0,096425·' + F.num(to, 1) + '² = ' + F.num(v, 3) };

      res = { valor: s.acima255, clausula: '6.3.2.4 a)', formula: 'v_máx = 0,8 m/s (t_o > 25,5 °C)', subst: 't_o = ' + F.num(to, 1) + ' °C' };

  /* Eficácia da distribuição de ar Ez — NBR 16401-3:2024, Tabela 3.
   * o = { aquecimento, dT (K, módulo), retornoAlto, v14 (m/s a 1,4 m do piso) } */

    var t = D.dados.normas.nbr16401_3.ez, linha;

    else if (!o.retornoAlto) linha = 'quenteForroRetPiso';
    else if (o.dT >= t.dtLimite) linha = 'quente8ForroRetForro';
    else linha = (o.v14 != null && o.v14 >= t.vRef) ? 'quenteMenos8Rapido' : 'quenteMenos8Lento';
    var l = t.linhas.filter(function (x) { return x.id === linha; })[0];
    var res = { valor: l.valor, texto: l.texto, clausula: t.clausula, fonte: 'NBR 16401-3, p. 12, l. 9' };
    if (r) r.passo({ grupo: 'zona', titulo: 'Eficácia da distribuição de ar (Ez)', formula: 'Tabela 3 — configuração insuflamento/retorno', subst: l.texto + (o.aquecimento && o.retornoAlto && o.dT < t.dtLimite ? ' (v a 1,4 m = ' + F.num(o.v14, 2) + ' m/s)' : ''), valor: l.valor, unidade: '', casas: 2, fonte: res.fonte });

  /* Corrente de ar (draft) — ASHRAE Fundamentals 2021 cap. 9 (Fanger et al. 1989). */
  function draft(v, ta, Tu, r) {
    var d = D.dados.normas.ashrae.draft;
    var vv = Math.max(v, d.vMin);

<script>
/* ==== js/motor/ar.js ==== */
/* Grandezas do ar e do ambiente. */
(function (D) {
  'use strict';
  var F = D.util.fmt;
  var CP_AR = 1006, CP_VAPOR = 1860; // J/(kg·K): ar seco e vapor d'água (ASHRAE Fundamentals 2021 cap. 1, Eq. 30)
  var UR_PADRAO = 50;                // %, quando a entrada não traz a umidade relativa do ambiente

  // Pressão de saturação do vapor sobre água líquida (Pa): ASHRAE Fundamentals 2021 cap. 1, Eq. (6)
  function pws(tC) {
    var T = tC + 273.15;
    return Math.exp(-5.8002206e3 / T + 1.3914993 - 4.8640239e-2 * T + 4.1764768e-5 * T * T - 1.4452093e-8 * T * T * T + 6.5459673 * Math.log(T));
  }

  // Temperatura operativa de projeto: a informada ou o padrão da NBR 16401-1 (resfriamento ou aquecimento)
  function tempOperativa(e) {
    var to = e.ar.to, ci = D.dados.normas.nbr16401_1.condicoesInternas;
    // v3.6.0: isotérmico ou só exaustão não usa o ΔT gravado (um ΔT negativo antigo não troca o padrão para aquecimento)
    var semDT = isotermico(e) || (e.ar.modo === 'ventilacao' && !(e.ar.Q > 0));
    if (to === undefined || to === null || isNaN(to)) to = !semDT && e.ar.dT < 0 ? ci.toPadraoAquecimento : ci.toPadraoResfriamento;
    return to;
  }

  /* Umidade absoluta e calor específico do ar úmido do ambiente, pela temperatura, pela umidade
   * relativa (e.ar.ur, em %; padrão 50) e pela pressão da altitude. */
  function umidade(e, r) {
    var z = e.ar.z || 0, to = tempOperativa(e), ur = e.ar.ur > 0 && e.ar.ur <= 100 ? e.ar.ur : UR_PADRAO;
    var p = 101325 * Math.pow(1 - 2.25577e-5 * z, 5.2559), ps = pws(to), pv = ur / 100 * ps;
    var w = 0.621945 * pv / (p - pv), cp = CP_AR + CP_VAPOR * w;
    if (r) r.passo({
      grupo: 'ar', titulo: 'Umidade absoluta do ar do ambiente',
      formula: 'w = 0,621945 · pv / (p − pv);  pv = UR · pws(t)',
      subst: 'pws(' + F.num(to, 1) + ' °C) = ' + F.num(ps, 0) + ' Pa; pv = ' + F.num(ur, 0) + ' % · ' + F.num(ps, 0) + ' = ' + F.num(pv, 0) + ' Pa; p = ' + F.num(p, 0) + ' Pa (' + F.num(z, 0) + ' m)',
      valor: w, unidade: 'kg/kg', casas: 5, fonte: 'ASHRAE Fundamentals 2021, p. 1.1, l. 84; Eq. (6) e (20)'
    });
    if (r) r.passo({
      grupo: 'ar', titulo: 'Calor específico do ar úmido',
      formula: 'cp = 1006 + 1860 · w',
      subst: 'cp = 1006 + 1860 · ' + F.num(w, 5),
      valor: cp, unidade: 'J/(kg·°C)', casas: 1, fonte: 'ASHRAE Fundamentals 2021, p. 1.10, l. 41'
    });
    return { w: w, cp: cp, pws: ps, p: p, ur: ur, to: to };
  }

  // Massa específica do ar do ambiente: 1,2 kg/m³ ao nível do mar, corrigida pela pressão barométrica
  // da altitude (o ar do recinto está na temperatura de projeto, não na da atmosfera padrão)
  function rho(z, r) {
    var v = 1.2 * Math.pow(1 - 2.25577e-5 * z, 5.2559);
    if (r) r.passo({
      grupo: 'ar', titulo: 'Massa específica do ar do ambiente (altitude)',
      formula: 'ρ = 1,2 · p/p₀ = 1,2 · (1 − 2,25577·10⁻⁵ · z)^5,2559',
      subst: 'ρ = 1,2 · (1 − 2,25577·10⁻⁵ · ' + F.num(z, 0) + ')^5,2559',
      valor: v, unidade: 'kg/m³', casas: 3, fonte: 'ASHRAE Fundamentals 2021, p. 1.1, l. 84'
    });
    return v;
  }

  /* Calcula as grandezas do ambiente a partir da entrada. */
  function ambiente(e, r) {
    var g = {}, N = D.motor.normas;
    g.C = e.geo.C; g.W = e.geo.W; g.H = e.geo.H; g.Hinst = e.geo.Hinst;
    g.zona = N ? N.zonaOcupada(e.geo.postura || 'emPe', e.geo.paredesExternas) : { altura: 1.8, recuo: {} };
    g.zo = e.geo.zo > 0 ? e.geo.zo : g.zona.altura;
    g.area = g.C * g.W;
    g.volume = g.area * g.H;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Área do ambiente', formula: 'A = C · L', subst: 'A = ' + F.num(g.C, 2) + ' · ' + F.num(g.W, 2), valor: g.area, unidade: 'm²', casas: 2, fonte: 'Geometria' });
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Volume do ambiente', formula: 'V = A · H', subst: 'V = ' + F.num(g.area, 2) + ' · ' + F.num(g.H, 2), valor: g.volume, unidade: 'm³', casas: 1, fonte: 'Geometria' });
    g.rho = rho(e.ar.z || 0, r);
    // v3.6.0 (E3): modo "Vazões da ventilação"; isotérmico = ar insuflado à temperatura do ambiente (ΔT = 0 nas contas)
    g.ventilacao = e.ar.modo === 'ventilacao';
    g.isotermico = isotermico(e);
    g.papelSaida = g.ventilacao && e.ar.papelSaida === 'exaustao' ? 'exaustao' : 'retorno';
    // só exaustão (insuflamento 0): sem ar insuflado, o ΔT não entra em conta nenhuma
    g.dT = g.isotermico || (g.ventilacao && !(e.ar.Q > 0)) ? 0 : e.ar.dT;
    var um = umidade(e, r);
    g.w = um.w; g.cp = um.cp; g.ur = um.ur;
    if (e.ar.modo === 'carga') {
      // ΔT vazio ou zero: sem vazão (NaN). Nenhum valor é adotado no lugar; o aviso sai de motor\avisos.js
      var dtAbs = Math.abs(g.dT);
      g.Q = dtAbs > 0 ? e.ar.qs * 3600 / (g.rho * g.cp * dtAbs) : NaN;
      if (r) r.passo({
        grupo: 'ambiente', titulo: 'Vazão de insuflamento pelo calor sensível do ambiente',
        formula: 'Q = Qs · 3600 / (ρ · cp · |ΔT|)',
        subst: 'Q = ' + F.num(e.ar.qs, 0) + ' · 3600 / (' + F.num(g.rho, 3) + ' · ' + F.num(g.cp, 1) + ' · ' + F.num(dtAbs, 1) + ')',
        valor: g.Q, unidade: 'm³/h', casas: 0, fonte: 'Balanço de energia sensível'
      });
    } else {

      if (r) r.passo({ grupo: 'ambiente', titulo: 'Vazão total de insuflamento (informada)', formula: 'Q', subst: 'Q = ' + F.num(g.Q, 0), valor: g.Q, unidade: 'm³/h', casas: 0, fonte: 'Dado de entrada' });

    // revisor D3 (2026-11-23, opção "pela exaustão"): só exaustão (insuflamento 0) → vazão específica e renovação pela exaustão
    var soExa = g.ventilacao && !(g.Q > 0) && g.papelSaida === 'exaustao', qRef = soExa ? (e.ar.Qsai > 0 ? e.ar.Qsai : 0) : g.Q, sQ = soExa ? 'Qe' : 'Q';
    g.qEsp = qRef / g.area;

    if (r) r.passo({ grupo: 'ambiente', titulo: 'Zona ocupada', formula: 'altura e recuos das paredes', subst: 'altura ' + F.num(g.zo, 2) + ' m (' + (e.geo.postura === 'sentado' ? 'sentado' : 'em pé') + '); recuos: x=0 ' + F.num(g.zona.recuo['-x'] || 0.3, 1) + ' m, x=C ' + F.num(g.zona.recuo['+x'] || 0.3, 1) + ' m, y=0 ' + F.num(g.zona.recuo['-y'] || 0.3, 1) + ' m, y=L ' + F.num(g.zona.recuo['+y'] || 0.3, 1) + ' m', valor: g.zo, unidade: 'm', casas: 2, fonte: 'NBR 16401-2, p. 8, l. 11' });
    g.H1 = g.Hinst - g.zo;

/* ==== js/motor/acustica.js ==== */
/* Acústica: potência sonora TROX (LN) → nível de pressão no ambiente. */
(function (D) {
  'use strict';
  var F = D.util.fmt;

  /* Atenuação natural do ambiente — modelo do gráfico C2-005 pág. 5. */
  function atenuacao(dist, volume, tratamento, r) {
    var g = D.dados.trox.graficos.atenuacao;
    var fv = D.dados.trox.graficos.fatorVolume[tratamento] || 1;
    var Vl = volume * fv;
    var R = g.c * Math.pow(Vl, 2 / 3);
    var termo = g.Q / (4 * Math.PI * dist * dist) + 4 / R;
    var A = -10 * Math.log10(termo);
    if (r) {
      r.passo({ grupo: 'acustica', titulo: 'Volume acústico equivalente', formula: "V' = V · f_trat", subst: "V' = " + F.num(volume, 1) + ' · ' + F.num(fv, 1) + ' (' + tratamento + ')', valor: Vl, unidade: 'm³', casas: 1, fonte: 'TROX C2-005, p. 5' });
      r.passo({
        grupo: 'acustica', titulo: 'Atenuação natural do ambiente',
        formula: "A = −10 · log₁₀[ 2/(4π·r²) + 4/(0,732 · V'^(2/3)) ]",
        subst: 'A = −10 · log₁₀[ 2/(4π·' + F.num(dist, 2) + '²) + 4/(0,732 · ' + F.num(Vl, 1) + '^(2/3)) ]',
        valor: A, unidade: 'dB(A)', casas: 1,
        fonte: 'TROX C2-005, p. 5'   // v3.3.4: citação curta; o modelo e o erro ficam nas premissas (Seleção e Referências)
      });
      if (dist < g.faixaR[0] || dist > g.faixaR[1] || Vl < g.faixaV[0] || Vl > g.faixaV[1]) {
        r.estimado("Atenuação do ambiente fora da faixa do gráfico TROX (r = 0,7–5 m; V' = 20–2000 m³)");
      }
    }
    return A;
  }

  /* Soma de n fontes iguais e desconto da atenuação. */
  function pressaoAmbiente(LN, n, A, r, rotulo) {
    var soma = 10 * Math.log10(n);
    var Lp = LN + soma - A;
    if (r) r.passo({
      grupo: 'acustica', titulo: 'Nível de pressão sonora no ambiente' + (rotulo ? ' — ' + rotulo : ''),
      formula: 'Lp = LN + 10·log₁₀(n) − A',
      subst: 'Lp = ' + F.num(LN, 1) + ' + 10·log₁₀(' + n + ') − ' + F.num(A, 1),
      valor: Lp, unidade: 'dB(A)', casas: 1,
      fonte: 'TROX C2-005, p. 5'
    });
    return Lp;
  }

  /* Soma logarítmica de dois níveis de pressão sonora (insuflamento + retorno no mesmo ambiente). */
  function somaNiveis(L1, L2, r) {
    var Lt = 10 * Math.log10(Math.pow(10, L1 / 10) + Math.pow(10, L2 / 10));
    if (r) r.passo({
      grupo: 'acustica', titulo: 'Nível de pressão sonora somado — insuflamento + retorno',
      formula: 'Lp,total = 10·log₁₀(10^(Lp,ins/10) + 10^(Lp,ret/10))',
      subst: 'Lp,total = 10·log₁₀(10^(' + F.num(L1, 1) + '/10) + 10^(' + F.num(L2, 1) + '/10))',
      valor: Lt, unidade: 'dB(A)', casas: 1,
      fonte: 'Soma logarítmica; NBR 10152, p. 12, l. 20'
    });
    return Lt;
  }

  D.motor.acustica = { atenuacao: atenuacao, pressaoAmbiente: pressaoAmbiente, somaNiveis: somaNiveis };
})(window.Difusores);

</script>
<script>
/* ==== js/motor/alcance.js ==== */
/* Alcance, comprimento característico L e velocidade na zona ocupada. */
(function (D) {
  'use strict';
  var F = D.util.fmt;
  var NOMES = { '+x': 'direção +x (comprimento)', '-x': 'direção −x (comprimento)', '+y': 'direção +y (largura)', '-y': 'direção −y (largura)' };
  var PAREDE = { '+x': 'parede x = C', '-x': 'parede x = 0', '+y': 'parede y = L', '-y': 'parede y = 0' };

  /* L por direção de cada terminal: distância à parede ou fração da distância
   * ao terminal à frente (plano de encontro dos jatos) — ASHRAE Fundamentals cap. 20. */
  function direcoes(pos, C, W, dirs, fracao) {
    if (fracao === undefined) fracao = 0.5;
    return pos.map(function (p, i) {
      var res = { x: p.x, y: p.y, dirs: {} };
      (p.d ? [p.d] : dirs).forEach(function (d) {   // p.d: grelha de parede, um jato só (v3.4.0)
        var eixo = d.charAt(1), sinal = d.charAt(0) === '+' ? 1 : -1;
        var parede = eixo === 'x' ? (sinal > 0 ? C - p.x : p.x) : (sinal > 0 ? W - p.y : p.y);
        var melhor = { L: parede, tipo: 'parede', dist: parede };
        pos.forEach(function (q, j) {
          if (i === j) return;
          var da = eixo === 'x' ? (q.x - p.x) * sinal : (q.y - p.y) * sinal;
          var dt = eixo === 'x' ? Math.abs(q.y - p.y) : Math.abs(q.x - p.x);
          if (da > 0.01 && dt <= 0.5 * da && da * fracao < melhor.L) melhor = { L: da * fracao, tipo: 'jato', dist: da };
        });
        res.dirs[d] = melhor;
      });
      return res;
    });
  }

  /* Velocidade vertical de dois jatos opostos (gráfico C2-005 pág. 4). */
  function velocidadeVertical(vL, H1, r) {
    var g = D.dados.trox.graficos.velocidadeVertical;
    var Huso = H1, notas = [];
    if (H1 > g.faixaH1[1]) { Huso = g.faixaH1[1]; notas.push('H1 = ' + F.num(H1, 2) + ' m acima do gráfico (máx. 2,0 m): usado o valor em 2,0 m como limite superior'); }
    if (H1 < g.faixaH1[0]) notas.push('H1 = ' + F.num(H1, 2) + ' m abaixo do gráfico (mín. 0,8 m): extrapolação');
    if (vL < g.faixaVL[0] || vL > g.faixaVL[1]) notas.push('v_L = ' + F.num(vL, 2) + ' m/s fora do gráfico (0,4–0,8 m/s): extrapolação proporcional');
    var vH = g.v0 * (vL / g.vL0) * Math.pow(Math.max(Huso, 0.05) / g.H0, g.exp);
    if (r) {
      r.passo({
        grupo: 'zona', titulo: 'Velocidade vertical no encontro dos jatos (zona ocupada)',
        formula: 'v_H = 0,22 · (v_L / 0,4) · (H1 / 1,0)^(−0,93)',
        subst: 'v_H = 0,22 · (' + F.num(vL, 3) + ' / 0,4) · (' + F.num(Huso, 2) + ' / 1,0)^(−0,93)',
        valor: vH, unidade: 'm/s', casas: 3,
        fonte: g.fonte + ' — modelo ajustado, erro ' + g.erro
      });
      notas.forEach(function (n) { r.estimado('Velocidade na zona ocupada: ' + n); });
    }
    return { vH: vH, notas: notas };
  }

  /* Velocidade do jato ao entrar na zona ocupada numa direção.
   * X: alcance (m) até a velocidade terminal vt — decaimento v ∝ 1/x (ASHRAE cap. 20, Eq. 4).
   * Parede: o jato percorre o teto até a parede (L) e desce por ela até o topo da zona ocupada (H1):
   *         trajeto = L + H1 [TROX C2-005: "L = A + B"]. A fronteira da zona ocupada fica a
   *         0,3 m (interna) ou 1,0 m (externa) da parede — NBR 16401-2:2024, 3.55 —, portanto a
   *         velocidade no eixo do jato descendente é o limite superior da velocidade na fronteira.
   * Jato oposto: v_L no plano de encontro → gráfico v_H da TROX. */
  function velocidadeZona(X, vt, dir, H1, r, rotulo, grafEstendido, recuo, dirKey) {
    recuo = recuo || 0;
    if (dir.tipo === 'parede') {
      var trajeto = dir.L + H1;
      var v = vt * X / trajeto;
      if (r) {
        r.passo({ grupo: 'zona', titulo: 'Trajeto do jato até a zona ocupada (' + (PAREDE[dirKey] || 'parede') + ') — ' + rotulo, formula: 'L_t = L + H1  (A + B)', subst: 'L_t = ' + F.num(dir.L, 2) + ' + ' + F.num(H1, 2) + (recuo ? '; fronteira da zona ocupada a ' + F.num(recuo, 1) + ' m da parede — velocidade na fronteira ≤ velocidade no eixo do jato descendente' : ''), valor: trajeto, unidade: 'm', casas: 2, fonte: 'TROX C2-005, p. 4; NBR 16401-2, p. 8, l. 11' });
        r.passo({ grupo: 'zona', titulo: 'Velocidade do jato ao entrar na zona ocupada — ' + rotulo, formula: 'v = v_t · X_vt / L_t  (v ∝ 1/x)', subst: 'v = ' + F.num(vt, 2) + ' · ' + F.num(X, 2) + ' / ' + F.num(trajeto, 2), valor: v, unidade: 'm/s', casas: 3, fonte: 'ASHRAE Fundamentals 2021, p. 20.5, l. 24; alcance publicado pela TROX' });
      }
      return { v: v, modo: 'parede', trajeto: trajeto };
    }
    var vL = vt * X / dir.L;
    if (r) r.passo({ grupo: 'zona', titulo: 'Velocidade do jato no plano de encontro — ' + rotulo, formula: 'v_L = v_t · X_vt / L', subst: 'v_L = ' + F.num(vt, 2) + ' · ' + F.num(X, 2) + ' / ' + F.num(dir.L, 2), valor: vL, unidade: 'm/s', casas: 3, fonte: 'ASHRAE Fundamentals 2021, p. 20.5, l. 24 e "jatos múltiplos"; alcance publicado pela TROX' });
    if (r && grafEstendido) r.estendido('Velocidade na zona ocupada: gráfico de jatos opostos da C2-005 (difusores de teto) aplicado a esta família');
    var vv = velocidadeVertical(vL, H1, r);
    return { v: vv.vH, modo: 'jato', vL: vL, notas: vv.notas };
  }

  D.motor.alcance = { direcoes: direcoes, velocidadeVertical: velocidadeVertical, velocidadeZona: velocidadeZona, NOMES: NOMES, PAREDE: PAREDE };
})(window.Difusores);

</script>
<script>
/* ==== js/motor/terminais.js ==== */
/* Leitura dos catálogos TROX no ponto de operação (sem extrapolação). */
(function (D) {
  'use strict';
  var F = D.util.fmt, I = D.util.interp;
  var MODO_TXT = { lin: 'interpolação linear', loglog: 'interpolação log-log', semilog: 'interpolação em log(x)' };

  function passoInterp(r, titulo, res, rotX, uX, rotY, uY, casas, fonte) {
    if (!r || !res) return;
    var subst;
    if (res.exato) subst = 'ponto publicado: ' + rotX + ' = ' + F.num(res.p0[0], 0) + ' ' + uX;
    else subst = MODO_TXT[res.modo] + ' entre (' + F.num(res.p0x, 0) + ' ' + uX + ' → ' + F.num(res.y0, casas) + ') e (' + F.num(res.p1x, 0) + ' ' + uX + ' → ' + F.num(res.y1, casas) + ')';
    r.passo({ grupo: 'produto', titulo: titulo, formula: rotY + ' = f(' + rotX + ') — tabela do catálogo', subst: subst, valor: res.valor, unidade: uY, casas: casas, fonte: fonte, tipo: 'interp' });
  }

  function tab(pts, x, ix, iy, modo) {
    var res = I.naTabela(pts, x, ix, iy, modo);
    if (!res) return null;
    res.p0x = res.p0[ix]; res.p1x = res.p1[ix]; res.y0 = res.p0[iy]; res.y1 = res.p1[iy];
    return res;
  }

  function avisosConfirmar(lista, filtro, r) {
    if (!r || !lista) return;
    lista.forEach(function (a) { if (filtro(a)) r.alerta('Dado do catálogo interpretado (' + a.campo + ', ' + a.original + '): ' + a.motivo); });
  }

  /* Difusor de teto com tabela de seleção por tamanho (ADLQ e ADLR):
   * pontos [Q, Veff, Δp, LN, X0,5, X0,3], registro aberto, pé-direito de 3 m. */
  function tabelaTeto(fam, tam, q, r, fonte) {
    var pts = fam.pontos[tam];
    if (!pts) return null;
    var v = tab(pts, q, 0, 1, 'lin');
    if (!v) return null;
    var dp = tab(pts, q, 0, 2, 'loglog'), ln = tab(pts, q, 0, 3, 'semilog');
    var x0 = tab(pts, q, 0, 4, 'lin'), x1 = tab(pts, q, 0, 5, 'lin');
    passoInterp(r, 'Velocidade efetiva Veff', v, 'Q', 'm³/h', 'Veff', 'm/s', 2, fonte);
    passoInterp(r, 'Perda de carga Δp', dp, 'Q', 'm³/h', 'Δp', 'mmCA', 2, fonte);
    passoInterp(r, 'Nível de potência sonora LN', ln, 'Q', 'm³/h', 'LN', 'dB(A)', 1, fonte + ' — nível de potência (TROX C2-005, p. 5)');
    passoInterp(r, 'Alcance a 0,5 m/s (mínimo publicado)', x0, 'Q', 'm³/h', 'X₀,₅', 'm', 2, fonte + ' — pé-direito 3 m');
    passoInterp(r, 'Alcance a 0,3 m/s (máximo publicado)', x1, 'Q', 'm³/h', 'X₀,₃', 'm', 2, fonte + ' — pé-direito 3 m');
    avisosConfirmar(fam.aConfirmar, function (a) { return a.tam === +tam && (a.q === v.p0[0] || a.q === v.p1[0]); }, r);
    return { veff: v.valor, dp: dp.valor, ln: ln.valor, xMin: x0.valor, xMax: x1.valor, vtMin: fam.vtMin, vtMax: fam.vtMax, fonte: fonte };
  }

  /* ADLQ — tabela C2-007 pág. 1 */
  function adlq(tam, q, r) { return tabelaTeto(D.dados.trox.ADLQ, tam, q, r, 'TROX C2-007, p. 1 — ADLQ tam. ' + tam + ' (registro aberto)'); }

  /* ADLR — tabela C2-006 pág. 1 */
  function adlr(tam, q, r) { return tabelaTeto(D.dados.trox.ADLR, tam, q, r, 'TROX C2-006, p. 1 — ADLR tam. ' + tam + ' (registro aberto)'); }

  /* Famílias de teste: terminal que não é da TROX, registrado só por testes.js (o Tropical DI das
   * fixtures do ClimaApp), para exercitar selecao.selecionar de ponta a ponta com dados conhecidos.
   * O app não registra nenhuma. def = { nome, tamanhos: { id: rótulo }, faixaT50L, dirs,
   *   terminal(tam, q, e, r) → { veff, dp, ln, xMin, xMax, vtMin, vtMax, fonte } já com as correções próprias } */
  var deTeste = {};
  function registrarTeste(id, def) { deTeste[id] = def; }
  function removerTeste(id) { delete deTeste[id]; }
  function familiaTeste(id) { return deTeste[id] || null; }
  function familiasTeste() { return Object.keys(deTeste); }

  /* ADE — tabela C2-007 pág. 2. qDir = vazão por direção (m³/h). */
  function ade(ab, comp, qDir, r) {
    var fam = D.dados.trox.ADE, lin = fam.tabela[ab] && fam.tabela[ab][comp];
    if (!lin) return null;
    // trecho válido: vazões presentes e crescentes
    var pts = [];
    for (var i = 0; i < fam.veff.length; i++) {
      if (lin.q[i] == null || lin.alc[i] == null) break;
      if (pts.length && lin.q[i] <= pts[pts.length - 1][0]) break;
      pts.push([lin.q[i], fam.veff[i], fam.dp[i], fam.db[i], lin.alc[i][0], lin.alc[i][1]]);
    }
    var v = tab(pts, qDir, 0, 1, 'lin');
    if (!v) return null;

    var fonte = 'TROX C2-007, p. 2 — ADE ' + ab + ' aberturas, comprimento ' + comp + ' mm (registro aberto; alcance a 0,5 m/s; pé-direito 3 m)';
    passoInterp(r, 'Velocidade efetiva Veff (por direção)', v, 'Q', 'm³/h', 'Veff', 'm/s', 2, fonte);
    passoInterp(r, 'Perda de carga Δp', dp, 'Veff', 'm/s', 'Δp', 'mmCA', 2, fonte);
    passoInterp(r, 'Nível de potência sonora LN (por direção)', db, 'Veff', 'm/s', 'LN', 'dB(A)', 1, fonte);
    passoInterp(r, 'Alcance mínimo a 0,5 m/s', x0, 'Veff', 'm/s', 'X₀,₅ mín', 'm', 2, fonte);

  /* Grelhas de retorno — tabelas C1-004 / C1-005 */

    passoInterp(r, 'Perda de carga Δp', dp, 'Q', 'm³/h', 'Δp', 'mmCA', 2, fonte);

    passoInterp(r, 'Alcance a 0,5 m/s (jato junto ao forro)', x0, 'Q', 'm³/h', 'X₀,₅', 'm', 2, fonte);

    if (feff < fx.Feff[0] || feff > fx.Feff[1]) fora.push('Feff ' + F.num(feff, 3) + ' m² fora do eixo');
    // v3.5.0 E3 (revisor, item 3a): com Feff, Veff e L dentro, o y/ΔtZ ainda pode sair da escala do gráfico (0,01 a 1 m/°C)
    var escala = (ydt < fx.yDt[0] || ydt > fx.yDt[1]) ? 'y/ΔtZ ' + F.num(ydt, 3) + ' m/°C fora da escala do nomograma (' + F.num(fx.yDt[0], 2) + ' a ' + F.num(fx.yDt[1], 0) + ' m/°C)' : '';

      r.passo({ grupo: 'alcance', titulo: 'Desvio do jato frio sem forro, por °C de ΔT (y/ΔtZ)', formula: 'y/ΔtZ = f(Feff, Veff, L) — construção do nomograma',
        subst: 'Feff = ' + F.num(feff, 3) + ' m²; Veff = ' + F.num(veff, 2) + ' m/s; L = ' + F.num(L, 2) + ' m (interpolação em log entre as retas ' + F.num(pv.a[0], 0) + ' e ' + F.num(pv.b[0], 0) + ' m/s e ' + F.num(pl.a[0], 0) + ' e ' + F.num(pl.b[0], 0) + ' m)',

  /* ΔtZ máximo de insuflamento em resfriamento para o jato não descolar do forro — TROX C1-006, p. 4 (retas de Veff 1,0 a

        subst: 'ΔtZ máx = ' + F.num(g.k, 4) + ' · ' + F.num(vUso, 2) + '^' + F.num(g.a, 3) + ' · ' + F.num(feff, 3) + '^(' + F.num(g.b, 3) + ')' + (veff > g.veff[1] ? ' (Veff ' + F.num(veff, 2) + ' m/s acima do diagrama: usada a reta de 4,0 m/s)' : '') + (v > g.dt[1] ? '; acima do topo do diagrama (' + F.num(g.dt[1], 0) + ' °C)' : ''),

  D.motor.terminais = { adlq: adlq, adlr: adlr, ade: ade, grelha: grelha, grelhaInsuflamento: grelhaInsuflamento, dtzMax: dtzMax, desvioY: desvioY, rotuloGrelhaIns: rotuloGrelhaIns, ehGrelhaParede: ehGrelhaParede, regrasGrelha: regrasGrelha, GRELHAS_PAREDE: GRELHAS_PAREDE, registrarTeste: registrarTeste, removerTeste: removerTeste, familiaTeste: familiaTeste, familiasTeste: familiasTeste };

<script>
/* ==== js/motor/altaInducao.js ==== */
/* Difusores de alta indução (VD, FD, VDW): leitura dos diagramas TROX digitalizados.
 * Os catálogos dão diretamente a velocidade na parede (v_L, com L = distância horizontal + H1)
 * e a velocidade entre dois difusores (v_H1), em função da vazão, do espaçamento e de H1. */
(function (D) {
  'use strict';
  var F = D.util.fmt;
  var PA_MMCA = 9.80665;
  var ENT = { H: 'lateral (H)', V: 'superior (V)' };

  function base() { return D.dados.trox.altaInducao || {}; }
  function familia(id) { return base()[id] || null; }
  function unTxt(fam) { return fam.un === 'ls' ? 'l/s' : 'm³/h'; }

  // interpolação log-log numa tabela [[x, y], ...] crescente em x; fora da tabela devolve o extremo
  function interp(tab, x) {
    if (x <= tab[0][0]) return tab[0][1];
    for (var i = 1; i < tab.length; i++) {
      if (x <= tab[i][0]) {
        var f = Math.log(x / tab[i - 1][0]) / Math.log(tab[i][0] / tab[i - 1][0]);
        return tab[i - 1][1] * Math.pow(tab[i][1] / tab[i - 1][1], f);
      }
    }
    return tab[tab.length - 1][1];
  }
  // nível da curva de vazão V em relação à de referência; fora das curvas do diagrama extrapola por V^1,2 (lei medida entre curvas)
  function nivel(tab, V, notas, un) {
    var a = tab[0], z = tab[tab.length - 1];
    if (V > z[0] * 1.0001) { notas.push('Vazão ' + F.num(V, 0) + ' ' + un + ' acima da última curva de v_H1 (' + F.num(z[0], 0) + ' ' + un + '): extrapolada por V^1,2'); return z[1] * Math.pow(V / z[0], 1.2); }
    if (V < a[0] * 0.9999) { notas.push('Vazão ' + F.num(V, 0) + ' ' + un + ' abaixo da primeira curva de v_H1 (' + F.num(a[0], 0) + ' ' + un + '): extrapolada por V^1,2'); return a[1] * Math.pow(V / a[0], 1.2); }

  /* Ponto de operação de uma peça. q em m³/h; entrada 'H' | 'V'; montagem 'forro' | 'suspenso'. */

    var fam = familia(famId), t = fam && fam.tamanhos[tam];

    var ent = t.ent[entrada] ? entrada : 'H', e = t.ent[ent];
    var dpPa = e.dp[0] * Math.pow(V / e.dp[1], e.dp[2]);

    var veff = t.aeff ? q / 3600 / t.aeff : null;
    var fonte = fam.fonte + ' — ' + famId + ' ' + t.rotulo + ', entrada ' + ENT[ent];
    if (r) {
      if (fam.un === 'ls') r.passo({ grupo: 'produto', titulo: 'Vazão por peça em l/s (unidade do catálogo)', formula: 'V = Q_p / 3,6', subst: 'V = ' + F.num(q, 0) + ' / 3,6', valor: V, unidade: 'l/s', casas: 1, fonte: 'Conversão de unidade' });
      r.passo({ grupo: 'produto', titulo: 'Vazão dentro da faixa do catálogo', formula: 'V_mín ≤ V ≤ V_máx', subst: F.num(t.vMin, 0) + ' ≤ ' + F.num(V, 1) + ' ≤ ' + F.num(t.vMax, 0) + ' ' + un, valor: V, unidade: un, casas: 1, fonte: fonte })
      if (veff !== null) r.passo({ grupo: 'produto', titulo: 'Velocidade efetiva Veff (informativa)', formula: 'Veff = Q_p / (3600 · Aeff)', subst: 'Veff = ' + F.num(q, 0) + ' / (3600 · ' + F.num(t.aeff, 4) + ')', valor: veff, unidade: 'm/s', casas: 2, fonte: 'Aeff do catálogo ' + fam.fonte });
      r.passo({ grupo: 'produto', titulo: 'Perda de carga total Δpt', formula: 'Δpt = a · (V / V₀)^n  [reta do diagrama em eixos log]', subst: 'Δpt = ' + F.num(e.dp[0], 2) + ' · (' + F.num(V, 1) + ' / ' + F.num(e.dp[1], 1) + ')^' + F.num(e.dp[2], 2) + ' = ' + F.num(dpPa, 1) + ' Pa', valor: dpPa / PA_MMCA, unidade: 'mmCA', casas: 2, fonte: fonte + ', ' + fam.pagAcustica + ' (diagrama digitalizado)' });
      r.passo({ grupo: 'produto', titulo: 'Nível de potência sonora LWA', formula: 'LWA = ' + fam.lRef + ' + ' + F.num(dB, 1) + ' · log₁₀(V / V_' + fam.lRef + ')', subst: 'LWA = ' + fam.lRef + ' + ' + F.num(dB, 1) + ' · log₁₀(' + F.num(V, 1) + ' / ' + F.num(lRefV, 1) + ')', valor: ln, unidade: 'dB(A)', casas: 1, fonte: fonte + ', ' + fam.pagAcustica + ' (marcas de LWA sobre a reta)' });
      r.passo({ grupo: 'alcance', titulo: 'Lei de velocidade do jato junto à parede (diagrama v_L × L)', formula: 'v_L = K · V · f_mont · f_A / L   (L = distância horizontal + H1)', subst: 'v_L · L = ' + F.num(t.K, 5) + ' · ' + F.num(V, 1) + ' · ' + F.num(fm, 2) + ' = ' + F.num(kv, 3) + ' m²/s (espaçamento de referência)', valor: kv, unidade: 'm²/s', casas: 3, fonte: fonte + ', ' + fam.pagJato + '; ' + fam.notaMontagem });
      r.passo({ grupo: 'alcance', titulo: 'Alcance a 0,5 m/s (trajeto horizontal + vertical)', formula: 'X = (v_L · L) / 0,5', subst: 'X = ' + F.num(kv, 3) + ' / 0,5', valor: kv / 0.5, unidade: 'm', casas: 2, fonte: 'Derivado da lei v_L × L do catálogo' });
      r.passo({ grupo: 'alcance', titulo: 'Alcance a 0,3 m/s (trajeto horizontal + vertical)', formula: 'X = (v_L · L) / 0,3', subst: 'X = ' + F.num(kv, 3) + ' / 0,3', valor: kv / 0.3, unidade: 'm', casas: 2, fonte: 'Derivado da lei v_L × L do catálogo' });
    }
    return { veff: veff, dp: dpPa / PA_MMCA, dpPa: dpPa, ln: ln, kv: kv, fm: fm, V: V, un: un, xMin: kv / 0.5, xMax: kv / 0.3, vtMin: 0.5, vtMax: 0.3,
      fonte: fonte + ' (diagramas digitalizados)', fam: fam, t: t, famId: famId, tam: tam, entrada: ent };
  }

  // fator do espaçamento A entre difusores da fileira paralela à parede (sem vizinho: último valor da tabela)
  function fA(fam, A) { return (A === null || A === undefined || !isFinite(A)) ? fam.fA[fam.fA.length - 1][1] : interp(fam.fA, A); }

  /* Menor espaçamento transversal à direção d ('+x', '-x', '+y', '-y') entre as peças; Infinity se não há vizinho. */
  function transversal(pos, d) {
    var ex = d.charAt(1) === 'x', m = Infinity;
    for (var i = 0; i < pos.length; i++) for (var j = i + 1; j < pos.length; j++) {
      var a = Math.abs(ex ? pos[i].y - pos[j].y : pos[i].x - pos[j].x), b = Math.abs(ex ? pos[i].x - pos[j].x : pos[i].y - pos[j].y);
      if (a > 0.01 && b <= 0.5 * a && a < m) m = a;

  }

  /* Velocidade na parede (ou no plano médio entre fileiras afastadas): L = dist + H1. */

    var f = fA(b.fam, At), L = dist + H1, v = b.kv * f / L, notas = [];
    if (isFinite(At) && At < b.fam.fA[0][0] - 1e-9) notas.push('Espaçamento ' + F.num(At, 2) + ' m entre difusores menor que o mínimo da correção f_A do diagrama (' + F.num(b.fam.fA[0][0], 1) + ' m): usado o extremo');
    if (r) notas.forEach(function (n) { r.estimado('Velocidade na parede: ' + n); });
    if (r) r.passo({ grupo: 'zona', titulo: (entreFileiras ? 'Velocidade no plano médio entre fileiras' : 'Velocidade do jato junto à parede, ao entrar na zona ocupada') + ' — ' + rotulo,
      formula: 'v_L = (v_L·L) · f_A / L ;  L = ' + (entreFileiras ? 'B/2' : 'X') + ' + H1', subst: 'v_L = ' + F.num(b.kv, 3) + ' · ' + F.num(f, 2) + ' / (' + F.num(dist, 2) + ' + ' + F.num(H1, 2) + ')' + (isFinite(At) ? ' ; A = ' + F.num(At, 2) + ' m' : ' ; sem vizinho na fileira'), valor: v, unidade: 'm/s', casas: 3,
      fonte: b.fam.fonte + ', ' + b.fam.pagJato + ' (v_L × L, correção por A)' });
    return { v: v, notas: notas };
  }

  function fH1(ref, max, exp, H1, notas) {
    var h = H1;
    if (H1 > max) { h = max; notas.push('H1 = ' + F.num(H1, 2) + ' m acima do diagrama (máx. ' + F.num(max, 1) + ' m): usado o valor em ' + F.num(max, 1) + ' m (limite superior)'); }
    if (H1 < ref) notas.push('H1 = ' + F.num(H1, 2) + ' m abaixo do diagrama (mín. ' + F.num(ref, 1) + ' m): extrapolação pela lei do diagrama');
