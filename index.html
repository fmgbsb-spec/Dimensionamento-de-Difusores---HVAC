  // Texto do erro de um valor digitado, ou '' quando serve
  function validar(caminho, v, E) {
    var m = /^amb\.(\d+)\.geo\.(Hinst|zo)$/.exec(caminho), i, L, c;
    if (m) {
      var g = E.ambientes[+m[1]].geo;

    }
    if (/^projeto\.config\./.test(caminho)) {
      c = porCam[caminho.slice('projeto.config.'.length)];
      if (!c) return '';
      if (c.inteiro && v !== Math.round(v)) return 'Digite um número inteiro.';
      return v > c.max || v < c.min || (c.aberto && v <= c.min) ? faixaTxt(c) : '';
    }

  function nPend(r) { return Object.keys(r.erros).length; }
  function area(g) { return ok(g.C) && ok(g.W) ? g.C * g.W : NaN; }

  // Campo numérico do ambiente ou do projeto: caminho completo, id derivado dele
  function num(caminho, rotulo, valor, o) {
    var p = { id: idDe(caminho), caminho: caminho, rotulo: rotulo, valor: valor };
    Object.keys(o || {}).forEach(function (k) { p[k] = o[k]; });
    return C.campo(p);
  }
  function sel(caminho, rotulo, valor, opcoes, fonte, extra) {
    var p = { id: idDe(caminho), caminho: caminho, rotulo: rotulo, valor: valor, opcoes: opcoes, fonte: fonte };
    Object.keys(extra || {}).forEach(function (k) { p[k] = extra[k]; });
    return C.seletor(p);
  }
  // Liga-desliga (família, parede, opção): botão com aria-pressed; a fonte, quando houver, abre a gaveta
  function liga(caminho, rotulo, valor, dica) {
    return '<button type="button" class="liga" data-acao="alternar" data-caminho="' + caminho + '" aria-pressed="' + !!valor + '"' + (dica ? ' title="' + esc(dica) + '"' : '') + '>' + esc(rotulo) + '</button>';
  }
  function ligaFonte(caminho, rotulo, valor, fonte) {
    return '<div class="liga-l">' + liga(caminho, rotulo, valor, '') + C.selo('norma', 'fonte', fonte) + '</div>';
  }
  function marcarPar(caminho) {
    return '<span class="marcar-par"><button type="button" class="botao leve" data-acao="marcar" data-caminho="' + caminho + '" data-valor="sim">Marcar todas</button>' +
      '<button type="button" class="botao leve" data-acao="marcar" data-caminho="' + caminho + '" data-valor="nao">Limpar</button></span>';
  }
  function contar(obj, lista) { return lista.filter(function (x) { return obj && obj[x[0]]; }).length; }
  function ligas(base, obj, lista) { return lista.map(function (x) { return liga(base + x[0], x[1], obj && obj[x[0]], x[2]); }).join(''); }

  // "Mais opções": botão que abre e fecha a parte extra do bloco (estado em U.aberto[id])
  function mais(id, corpo, rotulo) {
    var ab = !!(UU().aberto || {})[id];
    return '<div class="mais-d' + (ab ? ' aberto' : '') + '"><button type="button" class="mais-bt" data-acao="bloco" data-bloco="' + id + '" aria-expanded="' + ab + '">' +
      '<span class="seta" aria-hidden="true">›</span> ' + esc(rotulo || 'Mais opções') + '</button>' + (ab ? '<div class="mais-corpo">' + corpo() + '</div>' : '') + '</div>';
  }
  // Altitude: projeto novo começa em Brasília (D.util.formato4.ALTITUDE_PADRAO); a tela diz sempre qual está em uso
  function localTxt(alt) { return alt === F4.ALTITUDE_PADRAO ? ' (Brasília)' : (alt === 0 ? ' (nível do mar)' : ''); }

  // ---------------------------------------------------------------- Início
  function inicio(E, R) {
    var n = E.ambientes.length, passos = H.app.trilha.map(function (t, k) {
      return '<a class="peso passo-ini' + (t.pend && t.pend(E, R) ? ' pend' : '') + '" href="#/' + t.r + '"><span class="selo calc">passo ' + (k + 1) + '</span>' +
        '<h3>' + esc(t.t) + '</h3><p class="suave">' + esc(t.s(E, R)) + '</p></a>';
    }).join('');
    return C.cabeca('Início', E.projeto.nome || 'Projeto sem nome', esc(plural(n, 'ambiente', 'ambientes')) + ' · revisão ' + esc(E.projeto.revisao)) +
      '<div class="cartao"><h2>Projeto aberto</h2><div class="acoes">' +
        '<a class="botao prim" href="#/projeto">Continuar</a>' +
        '<button type="button" class="botao" data-acao="abrir-arquivo">Abrir arquivo…</button>' +
        '<button type="button" class="botao" data-acao="salvar">Salvar arquivo</button>' +
        '<button type="button" class="botao" data-acao="exemplo">Carregar o exemplo</button>' +
        '<button type="button" class="botao" data-acao="novo-projeto">Projeto novo</button></div>' +
        (UU().importacao ? '<p class="inicio-imp"><button type="button" class="botao leve" data-acao="ver-importacao">Ver o relatório da última importação</button></p>' : '') +
      '</div>' +
      '<div class="cartao"><h2>Como o trabalho anda</h2><div class="pesos">' + passos + '</div></div>' +
      '<p class="inicio-ref"><a href="#/referencias">Referências: normas, tabelas e base TROX</a></p>';
  }

  // ---------------------------------------------------------------- Projeto
  function campoCfg(E, c) {
    var cam = 'projeto.config.' + c.cam, v = CAT.ler(E.projeto.config, c.cam), pd = CAT.padraoConfig(c.cam);
    return num(cam, c.rot, v, { unidade: c.un, casas: c.casas, inteiro: c.inteiro, padrao: pd, alterado: v !== pd, seloPadrao: 'padrão do app' });
  }
  function somaPesos(o) { var s = 0, k; for (k in o) s += o[k]; return s; }

  function blocoCfg(E, nivel, n) {
    var cfg = E.projeto.config, alt = CAT.alteradas(cfg, nivel.n), campos = CAT.config.filter(function (c) { return c.nivel === nivel.n; }), grupos = [], porGrupo = {};
    campos.forEach(function (c) { if (!porGrupo[c.grupo]) { porGrupo[c.grupo] = []; grupos.push(c.grupo); } porGrupo[c.grupo].push(c); });
    return C.bloco('cfg' + nivel.n, n, esc(nivel.titulo), alt ? plural(alt, 'alterada', 'alteradas') : 'tudo no padrão', '', '', function () {
      var s = '';
      if (nivel.n === 2) s += '<p class="suave cfg-intro">Prática de projeto, declarada: estes números não vêm de norma.</p>';
      if (nivel.n === 3) {
        var si = somaPesos(cfg.indice.pesosInsuflamento), sr = somaPesos(cfg.indice.pesosRetorno);
        s += '<div class="aviso">Os pesos e fatores mudam a nota e a ordem das alternativas. O padrão é o calibrado na v2.1.3.</div>' +
          '<div class="kpis cfg-soma">' + C.kpi('Soma dos pesos do insuflamento', f.num(si, 0)) + C.kpi('Soma dos pesos do retorno', f.num(sr, 0)) + '</div>';
        if (Math.abs(si - 100) > 1e-9) s += '<div class="aviso">Insuflamento: a soma dos pesos é ' + f.num(si, 0) + ': a nota máxima deixa de ser 100.</div>';
        if (Math.abs(sr - 100) > 1e-9) s += '<div class="aviso">Retorno: a soma dos pesos é ' + f.num(sr, 0) + ': a nota máxima deixa de ser 100.</div>';
      }
      grupos.forEach(function (g) {
        s += '<div class="grupo-cfg">' + (grupos.length > 1 ? '<h3>' + esc(g) + '</h3>' : '') + '<div class="grade">' + porGrupo[g].map(function (c) { return campoCfg(E, c); }).join('') + '</div></div>';
      });
      return s + '<div class="acoes cfg-reset"><button type="button" class="botao" data-acao="config-padrao" data-nivel="' + nivel.n + '">Voltar este nível ao padrão</button></div>';
    });
  }

  function projeto(E, R) {
    var p = E.projeto, rho = NaN, k;
    for (k = 0; k < R.amb.length; k++) { if (R.amb[k].res) { rho = R.amb[k].res.amb.rho; break; } }
    var nIns = contar(p.padroes.familias, FAM_INS.concat(FAM_AI)), nRet = contar(p.padroes.retornoFamilias, FAM_RET);
    var s = C.cabeca('Passo 1 de 4', 'Projeto', 'Dados que valem para todos os ambientes.');
    s += C.bloco('ident', 1, 'Identificação', (p.nome || 'sem nome') + ' · ' + (p.responsavel || 'falta o responsável'), esc('rev. ' + p.revisao), '', function () {
      return '<div class="grade g2">' +
        C.texto({ id: 'c-projeto-nome', caminho: 'projeto.nome', rotulo: 'Nome do projeto', valor: p.nome }) +
        C.texto({ id: 'c-projeto-responsavel', caminho: 'projeto.responsavel', rotulo: 'Responsável', valor: p.responsavel }) +
        C.texto({ id: 'c-projeto-revisao', caminho: 'projeto.revisao', rotulo: 'Revisão', valor: p.revisao }) + '</div>';
    });
    var BSB = F4.ALTITUDE_PADRAO;
    s += C.bloco('local', 2, 'Local', 'altitude ' + f.num(p.altitude, 0) + ' m' + localTxt(p.altitude), ok(rho) ? f.num(rho, 3) : '—', 'kg/m³', function () {
      return '<div class="grade">' +
        num('projeto.altitude', 'Altitude do local', p.altitude, { unidade: 'm', casas: 0, fonte: T.ALT }) +
        (ok(rho) ? C.calculado({ rotulo: 'Massa específica do ar', valor: f.num(rho, 3), unidade: 'kg/m³', fonte: 'Calculada pela atmosfera padrão, na altitude do projeto (do primeiro ambiente calculado).' }) : '') + '</div>' +
        '<p class="fraco nota-local">Em uso neste projeto: <b>' + f.num(p.altitude, 0) + ' m</b>' + localTxt(p.altitude) + '. ' +
        (p.altitude === BSB
          ? 'É a altitude com que todo projeto novo começa: não é preciso preencher de novo. Mude só se a obra for em outro local (nível do mar = 0 m).'
          : 'Não é a de Brasília (' + f.num(BSB, 0) + ' m), com que todo projeto novo começa. <button type="button" class="voltar" data-acao="definir" data-caminho="projeto.altitude" data-valor="' + BSB +
            '" data-numerico="1">usar a altitude de Brasília (' + f.num(BSB, 0) + ' m)</button>') + '</p>';
    });
    s += C.bloco('fam', 3, 'Famílias dos ambientes novos', nIns + ' de insuflamento · ' + nRet + ' de retorno', nIns + ' + ' + nRet, 'famílias', function () {
      return '<p class="fraco">Vale para os ambientes criados daqui em diante; cada ambiente guarda as suas.</p>' + familias('projeto.padroes.familias.', p.padroes.familias, 'projeto.padroes.retornoFamilias.', p.padroes.retornoFamilias, false);
    });
    s += '<div class="acoes sec-fim"><a class="botao prim" href="#/ambientes">Seguir para os ambientes</a></div>';
    // Critérios, regras e pesos: padrões do app, que raramente mudam. Ficam no fim da página, recolhidos, fora da sequência dos blocos
    var nAlt = 0; CAT.niveis.forEach(function (nv) { nAlt += CAT.alteradas(p.config, nv.n); });
    return s + '<div class="padroes-app">' + mais('mais-projeto', function () {
      return '<p class="suave cfg-intro">Critérios de projeto, regras de arranjo e pesos da nota. Já vêm preenchidos com o padrão do app e valem para todos os ambientes: abra só se este projeto pedir um critério diferente.</p>' +
        '<p class="suave cfg-intro">As tabelas de norma e de prática são só de leitura: ver <a href="#/referencias">Referências</a>.</p>' +
        CAT.niveis.map(function (nv, i) { return blocoCfg(E, nv, 'ABC'.charAt(i)); }).join('');
    }, 'Mais opções: critérios, regras e pesos da nota (' + (nAlt ? plural(nAlt, 'alterada', 'alteradas') : 'tudo no padrão do app') + ')') + '</div>';
  }

  // Famílias de insuflamento (com a alta indução à parte) e de retorno
  function familias(baseIns, ins, baseRet, ret, comAls) {
    return '<div class="sub-fam"><div class="fam-cab"><h3>Famílias de insuflamento</h3>' + marcarPar(baseIns + 'ADLQ') + '</div><div class="ligas">' + ligas(baseIns, ins, FAM_INS) +
        (comAls ? '<button type="button" class="liga" disabled aria-pressed="false" title="' + esc(T.ALS) + '">ALS — linear (sem dados)</button>' : '') + '</div>' +
      '<div class="fam-cab"><h3>Alta indução (jato rotacional)</h3>' + C.selo('norma', 'fonte', T.AI) + '</div><div class="ligas">' + ligas(baseIns, ins, FAM_AI) + '</div></div>' +
      '<div class="sub-fam"><div class="fam-cab"><h3>Grelhas de retorno</h3>' + marcarPar(baseRet + 'AT_VAT') + '</div><div class="ligas">' + ligas(baseRet, ret, FAM_RET) + '</div></div>';
  }

  // ---------------------------------------------------------------- Ambientes
  // `s`: a solução adotada do ambiente (a 1ª opção do app, enquanto nada for adotado)
  function opcaoTxt(r, s) {
    if (nPend(r)) return 'a completar: ' + Object.keys(r.erros).map(function (k) { return AD.ROTULO[k] || k; }).join(', ');
    return s ? AD.rotuloSolucao(s) : 'nenhuma combinação das famílias marcadas';
  }
  function ambientes(E, R) {
    var linhas = E.ambientes.map(function (amb, i) {
      var r = R.amb[i], g = amb.geo, a = area(g), v = ESC.resolver(amb, E.projeto), sp = v.sup;
      return '<div class="amb-item"><div><a class="nome" href="#/ambiente/' + i + '">' + esc(amb.nome || 'Ambiente sem nome') + '</a>' +
        '<div class="fraco">' + m2(g.C) + ' × ' + m2(g.W) + ' × ' + m2(g.H) + ' m · ' + f.num(a, 1) + ' m²</div></div>' +
        '<div class="kpi"><b class="num">' + (r.res ? f.num(r.res.amb.Q, 0) : '—') + '</b><div class="fraco">m³/h</div></div>' +
        '<div class="amb-opc"><div class="' + (nPend(r) || !sp ? 'fraco' : '') + '">' + esc(opcaoTxt(r, sp)) + '</div>' + (sp ? seloSit(sp) + (v.adotada ? ' ' + C.selo('alterado', 'adotada por você') : '') : '') + '</div>' +
        '<div class="acoes"><button type="button" class="botao" data-acao="duplicar" data-amb="' + i + '">Duplicar</button>' +
        (E.ambientes.length > 1 ? '<button type="button" class="botao perigo" data-acao="excluir" data-amb="' + i + '">Excluir</button>' : '') + '</div></div>';
    }).join('');
    return C.cabeca('Passo 2 de 4', 'Ambientes', 'Cada ambiente é selecionado com os seus próprios dados.') + linhas +
      '<div class="acoes sec-fim"><button type="button" class="botao prim" data-acao="novo-amb">Novo ambiente</button>' +
      '<span class="fraco">Atalho no editor: <kbd>Ctrl</kbd> <kbd>D</kbd> duplica o ambiente aberto.</span></div>' +
      '<div class="acoes sec-fim"><button type="button" class="botao" data-acao="importar-ct">Importar ambientes da carga térmica</button>' +
      '<span class="fraco">Traz nome, pé-direito, temperatura e umidade; de arquivo da carga térmica v0.5.1 em diante, também o calor sensível do ambiente. Comprimento e largura ficam para digitar.</span></div>';
  }

  // ---------------------------------------------------------------- Ambiente
  function croquiParedes(amb, cam) {
    var pe = amb.geo.paredesExternas || {}, g = amb.geo;
    function lado(k, cls, rot) {
      return '<button type="button" class="lado ' + cls + '" data-acao="alternar" data-caminho="' + cam + 'geo.paredesExternas.' + k + '" aria-pressed="' + !!pe[k] + '">' + rot + '</button>';
    }
    return '<div class="croqui-p" role="group" aria-label="Paredes externas">' +
      // espaço não separável dentro do parêntese: no celular (F1, M4) o rótulo quebra antes dele, não no meio
      lado('yW', 'l-n', 'superior (y = L)') + lado('x0', 'l-o', 'esquerda (x = 0)') +
      '<div class="l-c"><b>Planta</b><span>' + m2(g.C) + ' × ' + m2(g.W) + ' m</span></div>' +
      lado('xC', 'l-l', 'direita (x = C)') + lado('y0', 'l-s', 'inferior (y = 0)') + '</div>';
  }

  // Sugestão de largura (só em ambiente importado, com amb.areaCT); a conta é de D.util.importaCT, a tela só escreve
  function sugestaoLargura(amb, i, g) {
    var IC = D.util.importaCT, A = amb.areaCT, w, t = '', btn = '';
    if (typeof A !== 'number' || !isFinite(A) || !(A > 0)) return '';
    if (!ok(g.C) && !ok(g.W)) t = 'Área na carga térmica: ' + f.num(A, 1) + ' m². Digite o comprimento e o app sugere a largura.';
    else if (ok(g.C) && !ok(g.W)) {
      w = IC.larguraSugerida(A, g.C);
      if (w === null) return '';
      t = 'Largura sugerida: <b>' + f.num(w, 2) + ' m</b> (área da carga térmica, ' + f.num(A, 1) + ' m² ÷ comprimento, ' + f.num(g.C, 2) + ' m). ';
      btn = '<button type="button" class="botao" data-acao="usar-largura" data-amb="' + i + '">Usar</button>';
    } else if (ok(g.C) && ok(g.W) && IC.areaDifere(A, g.C, g.W)) t = 'C × L = ' + f.num(g.C * g.W, 1) + ' m²; a carga térmica calculou com ' + f.num(A, 1) + ' m².';
    else return '';
    return '<p class="fraco sug-larg">' + t + btn + '</p>';
  }

  function ambiente(E, i, R) {
    var amb = E.ambientes[i];
    if (!amb) return C.cabeca('Passo 2 de 4', 'Ambiente não encontrado', '<a href="#/ambientes">Voltar à lista de ambientes</a>');
    var r = R.amb[i], g = amb.geo, a = amb.ar, c = amb.crit, rt = amb.retorno, cam = 'amb.' + i + '.', N = E.ambientes.length;
    var apl = AD.aplicacao(c.aplicacao), toAd = ok(a.to) ? a.to : AD.toPadrao(a.dT), dbaAd = ok(c.dbaMax) ? c.dbaMax : AD.limiteRuido(c.aplicacao);
    var pad = AD.alturaPostura(g.postura), ar = r.res ? r.res.amb : null;

    var s = '<div class="cabeca"><div class="sobre">Passo 2 de 4 · ambiente ' + (i + 1) + ' de ' + N + '</div>' +
      '<div class="nome-amb">' + C.texto({ id: idDe(cam + 'nome'), caminho: cam + 'nome', rotulo: 'Nome do ambiente', valor: amb.nome }) + '</div>' +
      '<nav class="amb-nav"><a href="#/ambientes">← Ambientes</a>' + (i > 0 ? '<a href="#/ambiente/' + (i - 1) + '">‹ anterior</a>' : '') +
      (i < N - 1 ? '<a href="#/ambiente/' + (i + 1) + '">próximo ›</a>' : '') + '</nav></div>';

    var falta = Object.keys(r.erros);
    if (falta.length) {
      s += '<div class="quadro-falta" role="alert"><b>Para selecionar, falta</b><ul class="pend">' + falta.map(function (k) {
        return '<li><span aria-hidden="true">•</span><span><b>' + esc(AD.ROTULO[k] || k) + '</b>: ' + esc(r.erros[k]) + '</span></li>';
      }).join('') + '</ul></div>';
    }
    var avs = r.avisos.filter(function (x) { return x.nivel !== 'erro'; });
    if (avs.length) s += '<div class="aviso"><b>Avisos</b><ul class="lista-avisos">' + avs.map(function (x) { return '<li>' + esc(x.texto) + '</li>'; }).join('') + '</ul></div>';

    // 1 Geometria e montagem
    s += C.bloco('geo', 1, 'Geometria e montagem', m2(g.C) + ' × ' + m2(g.W) + ' m · pé-direito ' + m2(g.H) + ' m · difusor a ' + m2(g.Hinst) + ' m',
      ok(area(g)) ? f.num(area(g), 1) : '—', 'm²', function () {
        return C.aprender('Rente ao forro, o jato adere ao teto (efeito Coandă) e alcança o valor do catálogo. A altura de instalação é igual ao pé-direito quando o difusor é montado no forro.') +
          '<div class="grade">' +
          num(cam + 'geo.C', 'Comprimento', g.C, { unidade: 'm', casas: 2, fonte: T.C }) +
          num(cam + 'geo.W', 'Largura', g.W, { unidade: 'm', casas: 2, fonte: T.W }) +
          num(cam + 'geo.H', 'Pé-direito', g.H, { unidade: 'm', casas: 2, fonte: T.H }) +
          num(cam + 'geo.Hinst', 'Altura de instalação', g.Hinst, { unidade: 'm', casas: 2, fonte: T.HINST }) + '</div>' + sugestaoLargura(amb, i, g) +
          mais('mais-geo', function () {
            return '<div class="grade g2">' +
              sel(cam + 'geo.postura', 'Postura predominante', g.postura, [{ v: 'emPe', t: 'Em pé (zona ocupada até 1,8 m)' }, { v: 'sentado', t: 'Sentado (altura da cabeça, 1,1 m)' }], T.POSTURA, { seloTexto: 'NBR 16401-2, 3.55' }) +
              '</div><div class="grade" style="margin-top:14px">' +
              num(cam + 'geo.zo', 'Zona ocupada', ok(g.zo) ? g.zo : pad, { unidade: 'm', casas: 2, padrao: pad, alterado: ok(g.zo), fonte: T.ZO }) +
              C.calculado({ rotulo: 'Área', valor: f.num(area(g), 2), unidade: 'm²', fonte: T.AREA }) + '</div>' +
              '<div class="sub-fam"><div class="fam-cab"><h3>Paredes externas (com janela)</h3>' + C.selo('norma', 'fonte', T.PAREDES) + '</div>' + croquiParedes(amb, cam) + '</div>' +
              '<div style="margin-top:14px">' + C.segmentado({ rotulo: 'Montagem', caminho: cam + 'geo.montagem', valor: g.montagem,
                opcoes: [{ v: 'forro', t: 'Rente ao forro (efeito Coandă)' }, { v: 'suspenso', t: 'Duto aparente / livre suspenso' }], fonte: T.MONT }) + '</div>';
          });
      });

    // 2 Ar
    var Qv = ar ? ar.Q : (a.modo === 'vazao' && ok(a.Q) ? a.Q : NaN);
    s += C.bloco('ar', 2, 'Ar', f.num(Qv, 0) + ' m³/h · ΔT ' + f.num(a.dT, 1) + ' °C · ' + f.num(toAd, 1) + ' °C', ar ? f.num(ar.qEsp, 1) : '—', 'm³/h·m²', function () {
      return C.aprender('A vazão total do ambiente soma todos os difusores. Pelo calor sensível, a vazão sai de Q = Qs·3600/(ρ·cp·ΔT).') +
        '<div style="margin-bottom:14px">' + C.segmentado({ rotulo: 'Entrada da vazão', caminho: cam + 'ar.modo', valor: a.modo,
          opcoes: [{ v: 'vazao', t: 'Vazão total conhecida' }, { v: 'carga', t: 'Calor sensível do ambiente' }] }) + '</div><div class="grade">' +
        (a.modo === 'carga'
          ? num(cam + 'ar.qs', 'Calor sensível do ambiente (sem ar exterior, sem latente, sem calor ao retorno)', a.qs, { unidade: 'W', casas: 0, fonte: T.QS }) +
            C.calculado({ rotulo: 'Vazão total de insuflamento', valor: ar ? f.num(ar.Q, 0) : '—', unidade: 'm³/h', fonte: T.QCALC })
          : num(cam + 'ar.Q', 'Vazão total de insuflamento', a.Q, { unidade: 'm³/h', casas: 0, fonte: T.Q })) +
        num(cam + 'ar.dT', 'ΔT de insuflamento', a.dT, { unidade: '°C', casas: 1, fonte: T.DT }) + '</div>' +
        mais('mais-ar', function () {
          return '<div class="grade">' +
            num(cam + 'ar.to', 'Temperatura operativa de projeto', toAd, { unidade: '°C', casas: 1, padrao: AD.toPadrao(a.dT), alterado: ok(a.to), fonte: T.TO }) +
            num(cam + 'ar.ur', 'Umidade relativa do ambiente', ok(a.ur) ? a.ur : AD.UR_PADRAO, { unidade: '%', casas: 0, padrao: AD.UR_PADRAO, alterado: ok(a.ur), seloPadrao: 'padrão do app', fonte: T.UR }) +
            num(cam + 'ar.retornoPct', 'Vazão de retorno', a.retornoPct, { unidade: '%', casas: 0, fonte: T.RET }) +
            C.calculado({ rotulo: 'Vazão específica', valor: ar ? f.num(ar.qEsp, 1) : '—', unidade: 'm³/h·m²', fonte: T.QESP }) + '</div>';
        });
    });

    // 3 Ruído e conforto
    var limite = null;
    if (ok(toAd) && D.motor.normas) limite = D.motor.normas.limiteVzo(toAd, !!c.controleLocal, null);
    var notaApl = apl ? (apl.semNorma ? 'valor de projeto (finalidade não consta na NBR 10152:2017, Tabela 3): ' : 'NBR 10152: ') + apl.dba + ' dB(A) · velocidade na boca (prática): ' +
      (function () { var cl = D.dados.normas.bocas.insuflamento.classes[apl.classeVel]; return cl ? f.num(cl.min, 1) + '–' + f.num(cl.max, 1) : '—'; })() + ' m/s' : '';
    s += C.bloco('ruido', 3, 'Ruído e conforto', (apl ? apl.nome : '—') + ' · até ' + f.num(dbaAd, 0) + ' dB(A) · Δp até ' + f.num(c.dpMaxPa, 1) + ' Pa', f.num(dbaAd, 0), 'dB(A)', function () {
      return C.aprender('O nível sonoro do ambiente é comparado com LN − atenuação + 10·log n. As tabelas TROX já são calculadas com registro aberto.') +
        '<div class="grade g2">' +
        sel(cam + 'crit.aplicacao', 'Aplicação (NBR 10152)', c.aplicacao, D.dados.normas.nbr10152.aplicacoes.map(function (x) { return { v: x.id, t: x.nome + ' (' + x.dba + ' dB(A))' }; }), T.APL, { nota: notaApl }) + '</div>' +
        mais('mais-ruido', function () {
          return '<div class="grade g2">' +
            '<div class="com-nota">' + num(cam + 'crit.dbaMax', 'Limite de ruído no ambiente', dbaAd, { unidade: 'dB(A)', casas: 0, padrao: AD.limiteRuido(c.aplicacao), alterado: ok(c.dbaMax),
              seloPadrao: apl && apl.semNorma ? 'valor de projeto' : undefined, fonte: T.DBA }) +
              (apl && apl.semNorma ? '<div class="fraco">Nível sonoro máximo de ' + f.num(apl.dba, 0) + ' dB(A) em "' + esc(apl.nome) + '": valor de projeto, sem norma (a Tabela 3 da NBR 10152:2017 não traz essa finalidade).</div>' : '') + '</div>' +
            '<div class="com-nota">' + num(cam + 'crit.dpMaxPa', 'Perda de carga máxima no difusor', c.dpMaxPa, { unidade: 'Pa', casas: 1, fonte: T.DP }) +
              '<div class="fraco">= ' + f.num(AD.paParaMmca(c.dpMaxPa), 2) + ' mmCA</div></div></div>' +
            '<div class="sub-fam">' + C.segmentado({ rotulo: 'Limite de velocidade na zona ocupada', caminho: cam + 'crit.vzoModo', valor: c.vzoModo,
              opcoes: [{ v: 'nbr', t: 'Pela NBR 16401-2' }, { v: 'projeto', t: 'Limite de projeto' }], fonte: T.VZO }) +
              (limite ? '<div class="fraco" style="margin-top:6px">NBR 16401-2, ' + esc(limite.clausula) + ': ' + (limite.semLimite ? 'sem limite superior (controle local); alerta acima de 1,6 m/s, critério do app' : 'v_máx = ' + f.num(limite.valor, 2) + ' m/s a ' + f.num(toAd, 1) + ' °C' + (limite.alerta ? '; alerta acima de ' + f.num(limite.alerta.valor, 2) + ' m/s (' + esc(limite.alerta.clausula) + ', informativo)' : '')) + '</div>' : '') + '</div>' +
            (c.vzoModo === 'projeto' ? '<div class="grade" style="margin-top:14px">' + num(cam + 'crit.vzoMax', 'Limite de velocidade do ar na zona ocupada', c.vzoMax, { unidade: 'm/s', casas: 2 }) + '</div>' : '') +
            '<div class="ligas" style="margin-top:14px">' +
              ligaFonte(cam + 'crit.controleLocal', 'Ocupantes com controle local da velocidade', c.controleLocal, T.CL) +
              ligaFonte(cam + 'crit.regulagemRamal', 'Registro de regulagem no ramal', c.regulagemRamal, T.RAMAL) + '</div>' +
            '<div class="grade g2" style="margin-top:14px">' +
              sel(cam + 'crit.registro', 'Registro na peça (lâminas opostas)', c.registro, [{ v: 'sem', t: 'Sem registro na peça' }, { v: 'aberto', t: 'Com registro, 100% aberto' }, { v: '50', t: 'Com registro, 50% aberto' }, { v: '25', t: 'Com registro, 25% aberto' }], T.REG) +
              sel(cam + 'crit.acessorio', 'Acessório', c.acessorio, [{ v: 'nenhum', t: 'Nenhum' }, { v: 'captor', t: 'Captor QZ/RZ' }, { v: 'plenum', t: 'Caixa plenum AK' }], T.ACESS) +
              sel(cam + 'crit.tratamento', 'Acústica do ambiente', c.tratamento, [{ v: 'normal', t: 'Ambiente normal (V’ = V)' }, { v: 'ressonante', t: 'Com ressonância (V’ = 0,5·V)' }, { v: 'absorvente', t: 'Com muita absorção (V’ = 2·V)' }], T.TRAT) + '</div>';
        });
    });

    // 4 Produtos
    var ret = D.dados.normas.bocas.retornoFace, posOps = ['forro', 'paredeAlta', 'zonaLonge', 'zonaAssentos', 'veneziana'].map(function (k) { return { v: k, t: ret[k].nome }; });
    var nIns = contar(amb.familias, FAM_INS.concat(FAM_AI)), nRet = contar(rt.familias, FAM_RET), posNome = ret[rt.posicao] ? ret[rt.posicao].nome : '—';
    s += C.bloco('prod', 4, 'Produtos', plural(nIns, 'família de insuflamento', 'famílias de insuflamento') + ' · retorno: ' + posNome + ', ' + (rt.tipo === 'plenum' ? 'plenum' : 'dutado'), nIns + ' + ' + nRet, 'famílias', function () {
      return C.aprender('Difusores de alta indução misturam o ar muito rápido: são usados com muitas trocas de ar por hora, cargas térmicas altas ou ΔT grande.') +
        familias(cam + 'familias.', amb.familias, cam + 'retorno.familias.', rt.familias, true) +
        '<div class="grade g2" style="margin-top:14px">' +
          sel(cam + 'retorno.posicao', 'Posição das grelhas', rt.posicao, posOps, T.POS) + '</div>' +
        '<div style="margin-top:14px">' + C.segmentado({ rotulo: 'Tipo de retorno', caminho: cam + 'retorno.tipo', valor: rt.tipo,
          opcoes: [{ v: 'dutado', t: 'Dutado — um ramal por grelha' }, { v: 'plenum', t: 'Plenum no entreforro (sem dutos)' }], fonte: T.TIPO }) + '</div>' +
        mais('mais-prod', function () {
          return '<div class="grade">' +
            num(cam + 'retorno.hMax', 'Altura H máxima da grelha', rt.hMax, { unidade: 'mm', casas: 0, anulavel: true, fonte: T.HMAX }) +
            num(cam + 'retorno.lMax', 'Largura L máxima da grelha', rt.lMax, { unidade: 'mm', casas: 0, anulavel: true, fonte: T.LMAX }) + '</div>' +
            '<div class="ligas" style="margin-top:14px">' + ligaFonte(cam + 'retorno.modular', 'Forro modular 625 mm (preferir 525×525 / 525×1225)', rt.modular, T.MOD) + '</div>' +
            '<div class="grade g2" style="margin-top:14px">' +
            sel(cam + 'crit.entradaAI', 'Entrada de ar da alta indução', c.entradaAI, [{ v: 'H', t: 'Lateral — caixa plenum com colarinho horizontal (H)' }, { v: 'V', t: 'Superior — colarinho vertical (V)' }], T.ENTRADA_AI) + '</div>';
        });
    });
    return s;
  }

  H.ui.telas = { inicio: inicio, projeto: projeto, ambientes: ambientes, ambiente: ambiente };
})(window.HVAC, window.Difusores);

</script>
<script>
/* ==== js/interface/planta3.js ==== */
/* Planta em SVG da tela Seleção (v3.0.0, sessão T2): cópia adaptada de planta.js (tela da v2.1.3, retirada na v3.0.0).
 * Mesma geometria, escala, regras e textos: sala cotada, fronteira da zona ocupada (NBR 16401-2:2024, 3.55), difusores e
 * grelhas de retorno arrastáveis, alcances do catálogo e zona dos jatos no nível do teto (ASHRAE Fundamentals 2021 cap. 20,
 * Eq. 4 — fim do jato a 0,25 m/s). O que muda: nenhuma cor escrita no SVG (cada traço e preenchimento é uma classe pl-*,
 * com as cores em difusores.css, nos temas claro e escuro), o SVG ocupa a largura do cartão e a legenda e as tabelas usam
 * as classes de tabela da plataforma. Formatação por D.util.fmt (o H.util.fmt escreve o sinal negativo de outro modo). */
(function (H, D) {
  'use strict';
  var F = D.util.fmt;
  var ESC = 60; // px por metro
  var MG = 1.0; // margem em torno da sala (m)
  var PAREDE_NOME = { x0: 'parede x = 0', xC: 'parede x = C', y0: 'parede y = 0', yW: 'parede y = L' };

  function cfgRet() { return D.motor.config.retorno; }
  function classeJato(v) { var c = cfgRet(); return v > c.vJatoReprova ? 'pl-grelha-reprova' : (v > c.vJatoAlerta ? 'pl-grelha-alerta' : 'pl-grelha'); }

  /* Faixas de velocidade do jato no teto (≥ 0,25 e ≥ 0,5 m/s): retângulos fundidos por linha. */
  function sombraJatos(campo, C, W, X, Y) {
    var c = cfgRet(), passo = Math.max(0.1, Math.min(0.35, Math.min(C, W) / 30));
    var nx = Math.ceil(C / passo - 1e-9), ny = Math.ceil(W / passo - 1e-9), s = '';
    var classes = [null, 'pl-sombra1', 'pl-sombra2'];
    for (var j = 0; j < ny; j++) {
      var ya = j * passo, yb = Math.min((j + 1) * passo, W), yc = (ya + yb) / 2, atual = 0, ini = 0;
      for (var i = 0; i <= nx; i++) {
        var cls = 0;
        if (i < nx) { var v = campo({ x: (i * passo + Math.min((i + 1) * passo, C)) / 2, y: yc }); cls = v > c.vJatoReprova ? 2 : (v > c.vJatoAlerta ? 1 : 0); }
        if (cls !== atual) {
          if (atual) { var xa = ini * passo, xb = Math.min(i * passo, C); s += '<rect class="' + classes[atual] + '" x="' + X(xa) + '" y="' + Y(yb) + '" width="' + ((xb - xa) * ESC) + '" height="' + ((yb - ya) * ESC) + '"/>'; }
          atual = cls; ini = i;
        }
      }
    }
    return s;
  }

  function svgPlanta(sup, ret, amb, ctx, interativo) {
    var C = amb.C, W = amb.W, w = (C + 2 * MG) * ESC, h = (W + 2 * MG) * ESC;
    function X(x) { return (MG + x) * ESC; }
    function Y(y) { return (MG + W - y) * ESC; }
    var temCampo = !!(sup && ctx && ctx.campo);
    // largura do cartão, sem passar de 1,5 vez o tamanho de origem (sala pequena não vira desenho gigante)
    var s = '<svg class="pl-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" font-size="12" style="max-width:' + Math.round(w * 1.5) + 'px">';
    s += '<defs><clipPath id="sala-clip"><rect x="' + X(0) + '" y="' + Y(W) + '" width="' + C * ESC + '" height="' + W * ESC + '"/></clipPath>' +
      '<pattern id="hach" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="pl-hach" x1="0" y1="0" x2="0" y2="6" stroke-width="1.5"/></pattern></defs>';
    // sala
    s += '<rect class="pl-fundo pl-parede" x="' + X(0) + '" y="' + Y(W) + '" width="' + C * ESC + '" height="' + W * ESC + '" stroke-width="2"/>';
    // zona dos jatos no nível do teto (onde o retorno não deve ficar)
    if (temCampo) s += '<g clip-path="url(#sala-clip)">' + sombraJatos(ctx.campo, C, W, X, Y) + '</g>';
    // paredes externas (recuo de 1,0 m da zona ocupada)
    var rec = (amb.zona && amb.zona.recuo) || {}, zN = D.dados.normas.nbr16401_2.zonaOcupada;
    function ext(k) { return (rec[k] || 0) >= zN.recuoParedeExterna - 1e-9; }
    var EXT = 'class="pl-ext" stroke-width="5" stroke-linecap="square"';
    if (ext('-x')) s += '<line x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(0) + '" y2="' + Y(W) + '" ' + EXT + '/>';
    if (ext('+x')) s += '<line x1="' + X(C) + '" y1="' + Y(0) + '" x2="' + X(C) + '" y2="' + Y(W) + '" ' + EXT + '/>';
    if (ext('-y')) s += '<line x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(C) + '" y2="' + Y(0) + '" ' + EXT + '/>';
    if (ext('+y')) s += '<line x1="' + X(0) + '" y1="' + Y(W) + '" x2="' + X(C) + '" y2="' + Y(W) + '" ' + EXT + '/>';
    // fronteira da zona ocupada
    var zx0 = rec['-x'] || 0, zx1 = C - (rec['+x'] || 0), zy0 = rec['-y'] || 0, zy1 = W - (rec['+y'] || 0);
    if (zx1 > zx0 && zy1 > zy0) s += '<rect class="pl-zona" x="' + X(zx0) + '" y="' + Y(zy1) + '" width="' + ((zx1 - zx0) * ESC) + '" height="' + ((zy1 - zy0) * ESC) + '" stroke-width="1.2" stroke-dasharray="6 4"/>' +
      '<text class="pl-zona-t" x="' + (X(zx1) - 5) + '" y="' + (Y(zy0) - 5) + '" text-anchor="end" font-size="10">zona ocupada até ' + F.num(amb.zo, 1) + ' m (NBR 16401-2, 3.55)</text>';
    // cotas
    var yc = Y(W) - 22, xc = X(0) - 22;
    s += '<line class="pl-cota" x1="' + X(0) + '" y1="' + yc + '" x2="' + X(C) + '" y2="' + yc + '"/><line class="pl-cota" x1="' + X(0) + '" y1="' + (yc - 5) + '" x2="' + X(0) + '" y2="' + (yc + 5) + '"/><line class="pl-cota" x1="' + X(C) + '" y1="' + (yc - 5) + '" x2="' + X(C) + '" y2="' + (yc + 5) + '"/>' +
      '<text class="pl-texto" x="' + (X(0) + C * ESC / 2) + '" y="' + (yc - 6) + '" text-anchor="middle">' + F.num(C, 2) + ' m</text>';
    s += '<line class="pl-cota" x1="' + xc + '" y1="' + Y(0) + '" x2="' + xc + '" y2="' + Y(W) + '"/><line class="pl-cota" x1="' + (xc - 5) + '" y1="' + Y(0) + '" x2="' + (xc + 5) + '" y2="' + Y(0) + '"/><line class="pl-cota" x1="' + (xc - 5) + '" y1="' + Y(W) + '" x2="' + (xc + 5) + '" y2="' + Y(W) + '"/>' +
      '<text class="pl-texto" transform="translate(' + (xc - 8) + ',' + (Y(0) - W * ESC / 2) + ') rotate(-90)" text-anchor="middle">' + F.num(W, 2) + ' m</text>';
    // origem
    s += '<circle class="pl-origem" cx="' + X(0) + '" cy="' + Y(0) + '" r="3"/><text class="pl-cota-t" x="' + (X(0) + 6) + '" y="' + (Y(0) + 24) + '" font-size="10">origem (0,0)</text>';
    // alcances e difusores
    if (sup) {
      var pos = sup.cand.arranjo.pos, linear = sup.cand.familia === 'ADE';
      s += '<g clip-path="url(#sala-clip)">';
      pos.forEach(function (p) {
        if (!linear) {
          s += '<circle class="pl-jato" cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + sup.xMax * ESC + '" stroke-width="1.3" stroke-dasharray="7 5"/>';
          s += '<circle class="pl-jato" cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + sup.xMin * ESC + '" stroke-width="1.3" stroke-dasharray="2 4"/>';
        } else {
          var comp = sup.cand.comp / 1000, ox = sup.cand.arranjo.orient === 'x';
          sup.cand.arranjo.dirs.forEach(function (d) {
            var sg = d.charAt(0) === '+' ? 1 : -1;
            [[sup.xMax, '7 5'], [sup.xMin, '2 4']].forEach(function (q) {
              var r = q[0];
              if (ox) { // linha ao longo de x, jato em ±y
                var y0 = sg > 0 ? p.y : p.y - r;
                s += '<rect class="pl-jato" x="' + X(p.x - comp / 2) + '" y="' + Y(y0 + r) + '" width="' + comp * ESC + '" height="' + r * ESC + '" stroke-width="1.3" stroke-dasharray="' + q[1] + '"/>';
              } else {
                var x0 = sg > 0 ? p.x : p.x - r;
                s += '<rect class="pl-jato" x="' + X(x0) + '" y="' + Y(p.y + comp / 2) + '" width="' + r * ESC + '" height="' + comp * ESC + '" stroke-width="1.3" stroke-dasharray="' + q[1] + '"/>';
              }
            });
          });
        }
      });
      s += '</g>';
      pos.forEach(function (p, i) {
        var cls = interativo ? ' class="difusor"' : '';
        s += '<g' + cls + ' data-idx="' + i + '" transform="translate(' + X(p.x) + ',' + Y(p.y) + ')">';
        if (sup.cand.familia === 'ADLQ') s += '<rect class="pl-dif" x="-15" y="-15" width="30" height="30" rx="3" stroke-width="1.5"/>';
        else if (sup.cand.familia !== 'ADE') s += '<circle class="pl-dif" r="15" stroke-width="1.5"/>';
        else { var cw = sup.cand.comp / 1000 * ESC, ch = 9; if (sup.cand.arranjo.orient === 'x') s += '<rect class="pl-dif" x="' + (-cw / 2) + '" y="' + (-ch / 2) + '" width="' + cw + '" height="' + ch + '" stroke-width="1.2"/>'; else s += '<rect class="pl-dif" x="' + (-ch / 2) + '" y="' + (-cw / 2) + '" width="' + ch + '" height="' + cw + '" stroke-width="1.2"/>'; }
        s += '<text class="pl-dif-n" x="0" y="4" text-anchor="middle" font-size="11" font-weight="700">' + (i + 1) + '</text></g>';
      });
    }
    // grelhas de retorno (posições calculadas ou ajustadas à mão)
    if (ret && ret.pos) {
      var gl = ret.L / 1000, gh = ret.H / 1000;
      ret.pos.forEach(function (p, i) {
        var v = (temCampo && ctx.altoNivel) ? ctx.campo(p) : 0, cor = classeJato(v), cls = interativo ? ' class="grelha"' : '';
        s += '<g' + cls + ' data-ret-idx="' + i + '" transform="translate(' + X(p.x) + ',' + Y(p.y) + ')">';
        if (!p.parede) {
          var wpx = Math.max(gl * ESC, 14), hpx = Math.max(gh * ESC, 8);
          s += '<rect class="' + cor + '" x="' + (-wpx / 2) + '" y="' + (-hpx / 2) + '" width="' + wpx + '" height="' + hpx + '" fill="url(#hach)" stroke-width="1.4"/><text class="pl-texto" x="0" y="' + (-hpx / 2 - 4) + '" text-anchor="middle" font-size="10">R' + (i + 1) + '</text>';
        } else if (p.parede === 'x0' || p.parede === 'xC') {
          var lpx = Math.max(gl * ESC, 14);
          s += '<rect class="' + cor + '" x="-4.5" y="' + (-lpx / 2) + '" width="9" height="' + lpx + '" fill="url(#hach)" stroke-width="1.4"/><text class="pl-texto" x="' + (p.parede === 'x0' ? -8 : 8) + '" y="4" text-anchor="' + (p.parede === 'x0' ? 'end' : 'start') + '" font-size="10">R' + (i + 1) + '</text>';
        } else {
          var lpy = Math.max(gl * ESC, 14);
          s += '<rect class="' + cor + '" x="' + (-lpy / 2) + '" y="-4.5" width="' + lpy + '" height="9" fill="url(#hach)" stroke-width="1.4"/><text class="pl-texto" x="0" y="' + (p.parede === 'y0' ? 17 : -9) + '" text-anchor="middle" font-size="10">R' + (i + 1) + '</text>';
        }
        s += '</g>';
      });
    }
    s += '</svg>';
    return s;
  }

  function legenda(sup, ret, amb, ctx) {
    var h = '<div class="pl-legenda">';
    if (sup) h += '<span class="pl-chip c-dif">Difusor (' + F.esc(sup.modelo.split(' — ')[0]) + ')</span><span class="pl-chip c-min">Alcance mín. ' + F.num(sup.xMin, 2) + ' m (' + F.num(sup.vtMin, 1) + ' m/s)</span><span class="pl-chip c-max">Alcance máx. ' + F.num(sup.xMax, 2) + ' m (' + F.num(sup.vtMax, 1) + ' m/s)</span>';
    if (sup && ctx && ctx.campo) h += '<span class="pl-chip c-jato">Jato no teto ≥ 0,25 m/s (escuro ≥ 0,5 m/s) — ASHRAE cap. 20, Eq. 4</span>';
    h += '<span class="pl-chip c-zona">Fronteira da zona ocupada — NBR 16401-2, 3.55</span>';
    if (amb && amb.zona && ['-x', '+x', '-y', '+y'].some(function (k) { return amb.zona.recuo[k] >= 1; })) h += '<span class="pl-chip c-ext">Parede externa (recuo 1,0 m)</span>';
    if (ret) h += '<span class="pl-chip c-ret">Grelha de retorno ' + F.esc(ret.modelo) + ' ' + ret.H + '×' + ret.L + (ret.pos ? ' (' + ret.pos.length + ')' : '') + '</span>';
    return h + '</div>';
  }

  function tabelaCoordenadas(sup, ret, amb, ctx) {
    var h = '';
    if (sup) {
      var pos = sup.cand.arranjo.pos;
      h += '<h3 class="pl-tit">Coordenadas dos difusores (m, a partir da origem no canto inferior esquerdo da planta)</h3><div class="tabela-rolo"><table class="pl-tab"><thead><tr><th>Nº</th><th class="num">x</th><th class="num">y</th><th class="num">à parede −x</th><th class="num">à parede +x</th><th class="num">à parede −y</th><th class="num">à parede +y</th><th class="num">vizinho mais próximo</th></tr></thead><tbody>';
      pos.forEach(function (p, i) {
        var dv = Infinity; pos.forEach(function (q, j) { if (i !== j) dv = Math.min(dv, Math.hypot(p.x - q.x, p.y - q.y)); });
        h += '<tr><td>' + (i + 1) + '</td><td class="num">' + F.num(p.x, 2) + '</td><td class="num">' + F.num(p.y, 2) + '</td><td class="num">' + F.num(p.x, 2) + '</td><td class="num">' + F.num(amb.C - p.x, 2) + '</td><td class="num">' + F.num(p.y, 2) + '</td><td class="num">' + F.num(amb.W - p.y, 2) + '</td><td class="num">' + (isFinite(dv) ? F.num(dv, 2) : '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
      var a = sup.cand.arranjo;
      if (a.tipo === 'grade') h += '<p class="fraco">Arranjo ' + a.nx + ' × ' + a.ny + ' · espaçamento ' + F.num(a.sx, 2) + ' × ' + F.num(a.sy, 2) + ' m · L característico: ' + F.esc(sup.LTxt) + '</p>';
      else h += '<p class="fraco">' + F.esc(a.descricao) + ' · L característico: ' + F.esc(sup.LTxt) + '</p>';
    }
    if (ret && ret.pos && ret.pos.length) {
      var alto = !!(ctx && ctx.altoNivel && ctx.campo && sup);
      h += '<h3 class="pl-tit">Coordenadas das grelhas de retorno (m)</h3><div class="tabela-rolo"><table class="pl-tab"><thead><tr><th>Nº</th><th class="num">x</th><th class="num">y</th><th>Posição</th><th>Dimensão H × L</th><th class="num">Difusores atendidos</th><th class="num">Jato no teto (m/s)</th></tr></thead><tbody>';
      ret.pos.forEach(function (p, i) {
        h += '<tr><td>R' + (i + 1) + '</td><td class="num">' + F.num(p.x, 2) + '</td><td class="num">' + F.num(p.y, 2) + '</td><td>' + (p.parede ? PAREDE_NOME[p.parede] : 'forro') + '</td><td>' + ret.H + ' × ' + ret.L + ' mm</td><td class="num">' + (ret.grupos ? ret.grupos[i] : '—') + '</td><td class="num">' + (alto ? F.num(ctx.campo(p), 2) : '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
      if (ret.maxDist != null) h += '<p class="fraco">Difusor mais afastado da grelha mais próxima: ' + F.num(ret.maxDist, 2) + ' m (limite ' + F.num(ret.dMax, 0) + ' m)' + (ret.espMin != null ? ' · espaçamento mínimo entre grelhas: ' + F.num(ret.espMin, 2) + ' m' : '') + ' · ' + F.num(ret.areaPorGrelha, 0) + ' m² por grelha</p>';
    }
    return h;
  }

  /* Arraste de difusores ([data-idx]) e grelhas ([data-ret-idx]); chama o callback ao soltar.
     Celular (v3.2.0, M4, F4): em tela estreita o arraste só começa com o modo "Mover difusores" ligado (H.ui.planta3.movendo, que põe
     .movendo na planta e touch-action: none no desenho); desligado, o toque rola a página. No computador, como antes. */
  function ligarArraste(container, sup, amb, aoMoverDif, aoMoverRet) {
    var svg = container.querySelector('svg'); if (!svg) return;
    var arr = null;
    function ponto(ev) { var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; var p = pt.matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / ESC - MG, y: amb.W - (p.y / ESC - MG) }; }
    svg.addEventListener('pointerdown', function (ev) {
      if (H.ui.api && H.ui.api.celular && H.ui.api.celular() && !container.classList.contains('movendo')) return;
      var g = ev.target.closest ? ev.target.closest('[data-idx],[data-ret-idx]') : null; if (!g) return;
      var ret = g.hasAttribute('data-ret-idx');
      if (ret ? !aoMoverRet : !(aoMoverDif && sup)) return;
      arr = { idx: +(ret ? g.getAttribute('data-ret-idx') : g.getAttribute('data-idx')), g: g, ret: ret }; svg.setPointerCapture(ev.pointerId); ev.preventDefault();
    });
    svg.addEventListener('pointermove', function (ev) {
      if (!arr) return; var p = ponto(ev), lim = arr.ret ? 0 : 0.1;
      p.x = Math.min(Math.max(p.x, lim), amb.C - lim); p.y = Math.min(Math.max(p.y, lim), amb.W - lim);
      arr.g.setAttribute('transform', 'translate(' + ((MG + p.x) * ESC) + ',' + ((MG + amb.W - p.y) * ESC) + ')'); arr.ultimo = p;
    });
    function fim() { if (!arr) return; var a = arr; arr = null; if (a.ultimo) (a.ret ? aoMoverRet : aoMoverDif)(a.idx, Math.round(a.ultimo.x * 100) / 100, Math.round(a.ultimo.y * 100) / 100); }
    svg.addEventListener('pointerup', fim); svg.addEventListener('pointercancel', fim);
  }

  H.ui.planta3 = { svg: svgPlanta, legenda: legenda, tabelaCoordenadas: tabelaCoordenadas, ligarArraste: ligarArraste, PAREDE_NOME: PAREDE_NOME, movendo: false };
})(window.HVAC, window.Difusores);

</script>
<script>
/* ==== js/interface/selecao.js ==== */
/* Tela Seleção dos difusores (v3.0.0, sessão T2): Passo 3. Conjunto de ambientes, Seleção de um ambiente e as contas da gaveta.
   A tela não calcula nada: todo número vem de campo do resultado do motor ou do rastro dele (a única conta é s.lp − s.ln + s.atenuacao,
   a parcela 10·log₁₀ N do ruído, e a conversão de mmCA para Pa). As frases técnicas são as de resultados.js e planta.js (tela da v2.1.3, retirada na v3.0.0),
   com as siglas trocadas pelos rótulos aprovados; citação de norma só vem de campo `fonte` do motor. A casca ouve os eventos (data-acao).
   Alternativa adotada, posições e listas: D.util.escolha. Especificação: sessão T2, seção 4. */
(function (H, D) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, AD = D.util.adaptador, ESC = D.util.escolha, PA = AD.PA_POR_MMCA;
  var SELO = { aprovado: 'Aprovado', ressalva: 'Aprovado com ressalva', reprovado: 'Reprovado' };
  var SIT = { atende: 'Atende', alerta: 'Alerta', reprova: 'Não atende', na: 'Não aplicável' };

  // ---------------------------------------------------------------- auxiliares
  function ok(v) { return v !== null && v !== undefined && v !== '' && !isNaN(v); }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
  function nPend(r) { return Object.keys(r.erros).length; }
  function seloSit(s) { return s ? '<span class="selo sit sit-' + esc(s.selo) + '">' + esc(SELO[s.selo] || s.selo) + '</span>' : ''; }
  function sit(x) { return '<span class="selo sit sit-' + esc(x) + '">' + esc(SIT[x] || x) + '</span>'; }
  function vaz(Q) { return f.num(Q, 0) + ' m³/h <small class="fraco">(' + f.num(Q / 3.6, 0) + ' L/s)</small>'; }
  function dpTxt(dp) { return f.num(dp * PA, 1) + ' Pa <small class="fraco">(' + f.num(dp, 2) + ' mmCA)</small>'; }
  function dB(x) { return f.num(x, 1) + ' dB(A)'; }
  function achar(lista, id) { var r = null; (lista || []).forEach(function (x) { if (!r && x.id === id) r = x; }); return r; }
  function dim(g) { return f.num(g.C, 2) + ' × ' + f.num(g.W, 2) + ' × ' + f.num(g.H, 2) + ' m'; }
  function area(g) { return ok(g.C) && ok(g.W) ? f.num(g.C * g.W, 2) + ' m²' : '—'; }
  function sobreNome(amb) { return amb.nome || 'Ambiente sem nome'; }

  // Ruído no ambiente: insuflamento + retorno quando há retorno; senão só o insuflamento
  function ruido(v) {
    if (v.ret && typeof v.ret.lpTotal === 'number') return v.ret.lpTotal;
    return v.sup ? v.sup.lp : NaN;
  }

  // Frases da tela da v2.1.3 (retirada na v3.0.0; resultados.js)
  function motivos(s) {
    var rep = s.verifs.filter(function (v) { return v.situacao === 'reprova'; }).map(function (v) { return v.criterio; });
    if (rep.length) return 'Reprova: ' + rep.join('; ');
    var n = s.rastro.estimados.length + s.rastro.estendidos.length;
    return n ? n + ' ressalva(s)' : 'Todos os critérios com dado publicado';
  }
  function limiteVzoTxt(a) {
    var l = a.vzoLim;
    if (l.clausula === 'projeto') return 'limite de projeto ' + f.num(l.valor, 2) + ' m/s (NBR 16401-2 daria ' + f.num(l.normativo.valor, 2) + ')';
    return l.semLimite ? 'sem limite superior (controle local, NBR 16401-2, 6.3.2.3); alerta acima de 1,6 m/s' : 'limite ' + f.num(l.valor, 2) + ' m/s (NBR 16401-2, ' + l.clausula + ')' + (l.alerta ? '; alerta acima de ' + f.num(l.alerta.valor, 2) + ' m/s (' + l.alerta.clausula + ', informativo)' : '');
  }
  var FRASE_SEM_SOLUCAO = 'Nenhuma combinação das famílias marcadas atende ao domínio publicado nos catálogos para esta vazão e geometria. Experimente outras famílias, mais peças ou outra vazão.';
  function listaTxt(titulo, itens, pref) {
    return '<p class="fraco"><b>' + esc((pref ? pref + ' — ' : '') + titulo) + '</b></p><ul class="lista-avisos">' + itens.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  }
  // Ressalvas e alertas do rastro (títulos de listaAvisos); `pref` marca o retorno
  function ressalvas(r, pref) {
    var h = '';
    if (r.estimados.length) h += listaTxt('Ressalvas (dados estimados ou regras estendidas):', r.estimados.concat(r.estendidos), pref);
    else if (r.estendidos.length) h += listaTxt('Ressalvas (regras estendidas):', r.estendidos, pref);
    if (r.alertas.length) h += listaTxt('Alertas:', r.alertas, pref);
    return h;
  }
  function metodos(r, pref) {
    return r.metodos && r.metodos.length ? listaTxt('Notas de método (valem para todas as alternativas; não mudam o selo nem a nota):', r.metodos, pref) : '';
  }
  // "Para selecionar, falta": o mesmo quadro da tela Ambiente
  function quadroFalta(r, i) {
    return '<div class="quadro-falta" role="alert"><b>Para selecionar, falta</b><ul class="pend">' + Object.keys(r.erros).map(function (k) {
      return '<li><span aria-hidden="true">•</span><span><b>' + esc(AD.ROTULO[k] || k) + '</b>: ' + esc(r.erros[k]) + '</span></li>';
    }).join('') + '</ul><p><a href="#/ambiente/' + i + '">Editar o ambiente</a></p></div>';
  }
  function opcaoTxt(r) {
    if (nPend(r)) return 'a completar: ' + Object.keys(r.erros).map(function (k) { return AD.ROTULO[k] || k; }).join(', ');
    return 'nenhuma combinação das famílias marcadas';
  }
  function retTxt(rt) { return rt.n + ' × ' + rt.modelo + ' ' + rt.H + '×' + rt.L; }
  function minuscula(t) { t = String(t); return t.charAt(0).toLowerCase() + t.slice(1); }   // nome de tabela no meio de uma frase
  function mesmaIns(x, s) { return ESC.sIns(ESC.chaveIns(x.cand)) === ESC.sIns(ESC.chaveIns(s.cand)); }
  function botao(texto, acao, i, extra) { return '<button type="button" class="botao" data-acao="' + acao + '" data-amb="' + i + '"' + (extra || '') + '>' + esc(texto) + '</button>'; }

  // Celular (v3.2.0, sessão M4, F3): cada tabela de soluções fica só no computador (.so-computador) e ganha logo depois a lista de
  // cartões da plataforma (C.cartoes, oculta no computador), com os mesmos números e o mesmo "adotar". Os números vêm dos mesmos campos.
  function cartoes(itens) { return '<div class="sel-cartoes">' + C.cartoes(itens) + '</div>'; }
  function val(r, v, u) { return { r: r, v: v, u: u }; }
  // selo, "adotada" ou o botão adotar, e os motivos (só onde a tabela também os mostra)
  function sitCartao(s, adot, atributos, comMotivos) {
    return seloSit(s) + (adot ? ' <span class="fraco">adotada</span>' : ' <button type="button" class="botao" ' + atributos + '>adotar</button>') +
      (comMotivos ? '<div class="fraco">' + esc(motivos(s)) + '</div>' : '');
  }

  // ---------------------------------------------------------------- Seleção de um ambiente
  function secResposta(E, i, v) {
    var r = v.r, s = v.sup, rt = v.ret, a = r.res.amb, h = '<section class="cartao resposta" id="sel-resposta">';
    h += '<p class="resp-linha">Use <b id="sel-use" data-n="' + s.n + '">' + esc(AD.rotuloSolucao(s)) + '</b>, arranjo <span data-g="ins_arranjo">' + esc(s.cand.arranjo.descricao) + '</span>, ' +
      '<span data-g="ins_m3h_por_peca">' + f.num(s.Qp, 0) + '</span> m³/h por peça <small class="fraco">(' + f.num(s.Qp / 3.6, 0) + ' L/s)</small> <span class="selo sit sit-' + esc(s.selo) + '" data-g="ins_selo">' + esc(SELO[s.selo] || s.selo) + '</span></p>';
    var origem = '';
    if (v.adotada) origem += C.selo('alterado', 'adotada por você') + ' ' + botao('voltar à 1ª opção do app (' + AD.rotuloSolucao(v.primeira) + ')', 'voltar-primeira', i, '');
    else origem += '<span class="fraco">1ª opção do app</span>';
    if (v.ajustada) origem += ' <span class="fraco">posições ajustadas na planta</span> ' + botao('restaurar as posições', 'restaurar-pos', i, '');
    h += '<p class="resp-origem">' + origem + '</p>';
    if (a.Qret <= 0) h += '<p class="resp-ret">Retorno: sem vazão de retorno</p>';
    else if (!rt) h += '<p class="resp-ret">Retorno: nenhuma grelha das famílias marcadas atende ao domínio publicado para ' + f.num(a.Qret, 0) + ' m³/h com até ' + D.motor.config.retorno.maxPecas + ' grelhas.</p>';
    else h += '<p class="resp-ret"><span>Retorno: <span id="sel-ret" data-n="' + rt.n + '">' + esc(retTxt(rt)) + '</span>, ' + esc(minuscula(rt.faixaFace.nome)) + '</span> <span class="selo sit sit-' + esc(rt.selo) + '" data-g="ret_selo">' + esc(SELO[rt.selo] || rt.selo) + '</span></p>';
    if (r.res.semAprovada) h += '<div class="aviso erro" id="aviso-fora-alcance">' + esc(r.res.semAprovada.texto) + '</div>';
    v.avisos.forEach(function (t) { h += '<div class="aviso">' + esc(t) + '</div>'; });
    var av = r.avisos.filter(function (x) { return x.nivel !== 'erro'; });
    if (av.length) h += '<div class="aviso alerta" id="avisos-entrada"><b>Avisos de entrada</b><ul class="lista-avisos">' + av.map(function (x) { return '<li>' + esc(x.texto) + '</li>'; }).join('') + '</ul></div>';
    h += ressalvas(s.rastro, '') + (rt ? ressalvas(rt.rastro, 'Retorno') : '');
    h += '<span hidden data-g="ins_familia">' + esc(ESC.familiaDe(s.cand)) + '</span><span hidden data-g="ins_tam">' + esc(s.cand.familia === 'ADE' ? s.cand.ab + 'x' + s.cand.comp : String(s.cand.tam)) + '</span>' +
      '<span hidden data-g="ins_n">' + s.n + '</span><span hidden data-g="ins_indice">' + f.num(s.indice.total, 0) + '</span>';
    return h + '</section>';
  }

  // Um indicador-botão: abre a conta na gaveta. valor e apoio já vêm em HTML; `sitV` é a verificação cuja situação fecha o indicador
  function kpiBt(chave, rotulo, valor, apoio, sitV) {
    return '<button type="button" class="kpi-c kpi-bt" data-acao="conta" data-chave="' + chave + '"><span>' + esc(rotulo) + '</span><b class="num">' + valor + '</b>' +
      (apoio ? '<span class="fraco">' + apoio + '</span>' : '') + (sitV ? '<span class="kpi-sit sit-' + esc(sitV.situacao) + '">' + esc(SIT[sitV.situacao] || sitV.situacao) + '</span>' : '') + '</button>';
  }

  function secNumeros(E, i, v) {
    var amb = E.ambientes[i], s = v.sup, rt = v.ret, a = v.r.res.amb, e = v.r.e, comRet = !!(rt && typeof rt.lpTotal === 'number');
    var dpMaxPa = ok(amb.crit.dpMaxPa) ? amb.crit.dpMaxPa : e.crit.dpMax * PA;
    var lim = f.num(e.crit.dbaMax, 0) + ' dB(A)';
    var ruidoV = (comRet && achar(rt.verifs, 'acusticaTotal')) || achar(s.verifs, 'acustica');
    var nRuido = '<span data-g="' + (comRet ? 'lp_total' : 'ins_lp') + '">' + f.num(ruido(v), 1) + '</span> dB(A)';
    var apRuido = 'limite ' + lim + ' · ' + (comRet ? 'insuflamento <span data-g="ins_lp">' + f.num(s.lp, 1) + '</span> + retorno <span data-g="ret_lp">' + f.num(rt.lp, 1) + '</span>' : 'só insuflamento');
    var t50 = s.t50LMax - s.t50L > 1e-9
      ? '<span data-g="ins_t50L">' + f.num(s.t50L, 2) + '</span> a <span data-g="ins_t50LMax">' + f.num(s.t50LMax, 2) + '</span>'
      : '<span data-g="ins_t50L" data-g2="ins_t50LMax">' + f.num(s.t50L, 2) + '</span>';
    var apT50 = s.altaInducao ? 'informativo na alta indução' : 'faixa ' + f.num(s.faixaT50L.min, 1) + ' a ' + f.num(s.faixaT50L.max, 1);
    return '<section class="cartao" id="sel-numeros"><p class="fraco sel-dica"><span class="so-computador">Clique</span><span class="so-celular">Toque</span> em um número para ver a conta.</p><div class="kpis">' +
      kpiBt('ruido', 'Ruído no ambiente', nRuido, apRuido, ruidoV) +
      kpiBt('dp', 'Perda de carga', '<span data-g="ins_dp_pa">' + f.num(s.dp * PA, 1) + '</span> Pa', '(<span data-g="ins_dp">' + f.num(s.dp, 2) + '</span> mmCA) · limite ' + f.num(dpMaxPa, 1) + ' Pa', achar(s.verifs, 'dp')) +
      kpiBt('vzo', 'Velocidade do ar na zona ocupada', '<span data-g="ins_vzo">' + f.num(s.vzo, 2) + '</span> m/s', 'direção ' + esc(s.vzoDir) + ' · ' + esc(limiteVzoTxt(a)), achar(s.verifs, 'vzo')) +
      kpiBt('alcance', 'Alcance a 0,25 m/s ÷ comprimento característico (T50/L)', t50, apT50, achar(s.verifs, 't50L')) +
      '</div></section>';
  }

  function secPecas(E, i, v) {
    var amb = E.ambientes[i], s = v.sup, lista = ESC.porQuantidade(amb, E.projeto), curto = String(s.modelo).split(' — ')[0] + ' ' + s.dimensao;
    var linhas = lista.map(function (x, k) {
      var q = x.s;
      return '<tr' + (x.adotada ? ' class="adotada"' : '') + '><td class="num">' + q.n + '</td><td>' + esc(q.cand.arranjo.descricao) + '</td><td class="num">' + vaz(q.Qp) + '</td><td class="num">' + dB(q.lp) + '</td><td class="num">' + dpTxt(q.dp) +
        '</td><td class="num">' + f.num(q.vzo, 2) + ' m/s</td><td>' + seloSit(q) + '<div class="fraco">' + esc(motivos(q)) + '</div></td><td>' +
        (x.adotada ? 'adotada' : '<button type="button" class="botao" data-acao="adotar" data-amb="' + i + '" data-lista="qtd" data-i="' + k + '">adotar</button>') + '</td></tr>';
    }).join('');
    var itens = lista.map(function (x, k) {
      var q = x.s;
      return { titulo: plural(q.n, 'peça', 'peças'), sub: q.cand.arranjo.descricao, destaque: x.adotada,
        valores: [val('Vazão por peça', f.num(q.Qp, 0), 'm³/h'), val('Ruído', f.num(q.lp, 1), 'dB(A)'), val('Perda de carga', f.num(q.dp * PA, 1), 'Pa'), val('Na zona ocupada', f.num(q.vzo, 2), 'm/s')],
        situacao: sitCartao(q, x.adotada, 'data-acao="adotar" data-amb="' + i + '" data-lista="qtd" data-i="' + k + '"', true) };
    });
    return '<section class="cartao" id="sel-pecas"><h2>Por que ' + plural(s.n, 'peça', 'peças') + '?</h2><p class="suave">' + esc(curto) + ': uma linha por quantidade que o catálogo cobre neste ambiente; em cada quantidade, o arranjo mais bem colocado.</p>' +
      '<div class="tabela-rolo so-computador"><table class="sel-tab"><thead><tr><th class="num">Peças</th><th>Arranjo</th><th class="num">Vazão por peça</th><th class="num">Ruído do insuflamento</th><th class="num">Perda de carga</th><th class="num">Velocidade do ar na zona ocupada</th><th>Situação</th><th></th></tr></thead><tbody>' +
      linhas + '</tbody></table></div>' + cartoes(itens) + '</section>';
  }

  function linhaAlt(i, v, s, lista, k, familia) {
    var adot = mesmaIns(s, v.sup), prim = v.primeira && mesmaIns(s, v.primeira);
    return '<tr' + (adot ? ' class="adotada"' : '') + '>' +
      '<td class="sol">' + esc(AD.rotuloSolucao(s)) + '<div class="fraco">' + (familia !== undefined ? esc(familia) + ' · ' : '') + esc(s.cand.arranjo.descricao) + (prim ? ' · 1ª opção do app' : '') + '</div></td>' +
      '<td class="num">' + vaz(s.Qp) + '</td><td class="num">' + dB(s.lp) + '</td><td class="num">' + dpTxt(s.dp) + '</td><td class="num">' + f.num(s.vzo, 2) + ' m/s</td><td class="num">' + f.num(s.t50L, 2) + '</td>' +
      '<td>' + seloSit(s) + '</td><td class="num"><span class="fraco">' + f.num(s.indice.total, 0) + '</span></td><td>' +
      (adot ? 'adotada' : '<button type="button" class="botao" data-acao="adotar" data-amb="' + i + '" data-lista="' + lista + '" data-i="' + k + '">adotar</button>') + '</td></tr>';
  }
  function cartaoAlt(i, v, s, lista, k, familia) {

  // "Antes de emitir" no fim da tela (T3): no conjunto, todos os itens; no ambiente, só quando o projeto tem um ambiente só
  function cartaoEmitir(E, i) { return H.ui.telaMemorial ? H.ui.telaMemorial.antesDeEmitir(E, i) : ''; }

  function ambiente(E, i, R) { return ambienteCorpo(E, i, R) + (E.ambientes.length === 1 ? cartaoEmitir(E, 0) : ''); }
  function ambienteCorpo(E, i, R) {

      return h + '<div class="aviso alerta">' + esc(FRASE_SEM_SOLUCAO) + '</div>';

  // ---------------------------------------------------------------- contas da gaveta
  function passoHtml(p) {
    return '<div class="passo"><div class="q"><span>' + esc(p.titulo) + '</span><span class="num">' + (ok(p.valor) ? esc(f.num(p.valor, p.casas === undefined ? 2 : p.casas) + (p.unidade ? ' ' + p.unidade : '')) : '') + '</span></div>' +

  }
  function grupoHtml(titulo, passos) { return passos.length ? (titulo ? '<h3>' + esc(titulo) + '</h3>' : '') + passos.map(passoHtml).join('') : ''; }
  // Passos do rastro: os de `produto` cujo título casa com `re` (todos os de `produto` se nenhum casar) e todos os dos grupos de `grupos`
  function filtrar(passos, re, grupos) {
    var prod = passos.filter(function (p) { return p.grupo === 'produto'; }), cas = re ? prod.filter(function (p) { return re.test(p.titulo); }) : prod;
    if (!cas.length) cas = prod;
    return passos.filter(function (p) { return (p.grupo === 'produto' && cas.indexOf(p) >= 0) || (p.grupo !== 'produto' && grupos.indexOf(p.grupo) >= 0); });
  }

  function conta(chave, E, U) {
    var i = Math.min(U.amb, E.ambientes.length - 1), amb = E.ambientes[i];
    if (!amb) return null;
    var v = ESC.resolver(amb, E.projeto), s = v.sup;
    if (!s) return null;
    var sobre = sobreNome(amb) + ' · ' + AD.rotuloSolucao(s), ps = s.rastro.passos, rt = v.ret, titulo, valor, html;
    if (chave === 'ruido') {
      titulo = 'Ruído no ambiente'; valor = dB(ruido(v));
      html = grupoHtml('Insuflamento', filtrar(ps, /^Vazão por peça|sonor|ruído/i, ['acustica'])) + (rt ? grupoHtml('Retorno', filtrar(rt.rastro.passos, /^Vazão por grelha|sonor|ruído/i, ['acustica'])) : '');
    } else if (chave === 'dp') {
