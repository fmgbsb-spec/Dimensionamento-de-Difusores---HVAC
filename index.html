<script>(function () {
  // _publicacao-web: registra o service worker (app instalável e offline) só quando a página vem por
  // https ou do servidor local de teste; aberta por arquivo, nada muda. data-sw no <html> serve ao teste.
  var h = document.documentElement, l = location;
  var seguro = l.protocol === 'https:' || l.hostname === 'localhost' || l.hostname === '127.0.0.1';
  if (!seguro || !('serviceWorker' in navigator)) { h.setAttribute('data-sw', 'indisponivel'); return; }
  h.setAttribute('data-sw', navigator.serviceWorker.controller ? 'ativo' : 'registrando');
  navigator.serviceWorker.register('sw.js', { scope: './' }).then(function () {
    if (!navigator.serviceWorker.controller) h.setAttribute('data-sw', 'instalado');
  }, function () { h.setAttribute('data-sw', 'erro'); });
  // Pede ao navegador para não apagar os dados do app por falta de espaço ou de uso.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
})();</script>

<!-- Plataforma comum (_plataforma-hvac): tokens, base, componentes e folha do memorial. O build embute tudo no HTML único. -->
<style>
/* ==== plataforma v0.4.1: css/base.css ==== */
/* Plataforma HVAC: tokens de tema, base e componentes comuns aos apps.
   Regra do guia: nenhum valor de cor fora dos blocos de tokens. Cor própria de um app entra no CSS do app. */
:root {
  --fundo: #f3f0e8; --sup: #fffdf8; --sup2: #f8f5ee; --linha: #ddd6c7; --linha-forte: #bfb6a3;
  --tinta: #1b2829; --tinta2: #4a5b5c; --tinta3: #768485;
  --prim: #0e5f59; --prim-tinta: #ffffff; --prim-suave: #d9e9e5;
  --norma-f: #e6ecd6; --norma-t: #42511c;
  --alt-f: #fbe7c2; --alt-t: #744600;
  --calc-f: #e8e4db; --calc-t: #4a5b5c;
  --demo-f: #e7e0f3; --demo-t: #4a3879;
  --erro: #b3261e; --alerta: #8a5200; --ok: #2c6b2f;
  --sombra: 0 1px 2px rgba(27, 40, 41, .06), 0 8px 24px rgba(27, 40, 41, .07);
  --raio: 12px; --fonte: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fonte-titulo: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  /* Cores que valem igual nos dois temas: véu das janelas, variação da faixa e a folha do memorial (papel branco). */
  --veu: rgba(10, 16, 16, .45); --faixa-delta: rgba(127, 127, 127, .3);
  --folha-fundo: #fff; --folha-tinta: #1b1b1b; --folha-tinta2: #555; --folha-linha: #d5d5d5;
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --fundo: #121819; --sup: #1a2223; --sup2: #212b2c; --linha: #2f3b3c; --linha-forte: #465758;
  --tinta: #e8eeec; --tinta2: #b4c1c0; --tinta3: #8b9a99;
  --prim: #5fc4b8; --prim-tinta: #0b1f1d; --prim-suave: #1e3936;
  --norma-f: #2c3520; --norma-t: #c9d8a2;
  --alt-f: #45330f; --alt-t: #f3cf8a;
  --calc-f: #2a3334; --calc-t: #b4c1c0;
  --demo-f: #2f2945; --demo-t: #cbbdf0;
  --erro: #ff8a80; --alerta: #f0b862; --ok: #8fd694;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.5 var(--fonte); padding-bottom: 76px; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
a { color: var(--prim); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--prim); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.suave { color: var(--tinta2); }
.fraco { color: var(--tinta3); font-size: 13px; }
.oculto { display: none !important; }

/* ---------- Topo e trilha ---------- */
.topo { position: sticky; top: 0; z-index: 20; background: var(--sup); border-bottom: 1px solid var(--linha); }
.topo-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 8px; font-family: var(--fonte-titulo); font-weight: 700; text-decoration: none; color: var(--tinta); white-space: nowrap; }
.marca svg { width: 26px; height: 26px; }
.marca small { font-weight: 500; color: var(--tinta3); font-size: 12px; }
.topo-acoes { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icone { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; color: var(--tinta2); font-size: 13px; white-space: nowrap; }
.icone:hover { background: var(--sup2); border-color: var(--linha); }
.icone[aria-pressed="true"] { background: var(--prim-suave); color: var(--prim); border-color: transparent; font-weight: 600; }
kbd { font: 11px var(--fonte); border: 1px solid var(--linha-forte); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--tinta2); background: var(--sup); }

.trilha { max-width: 1040px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 4px; list-style: none; overflow-x: auto; }
.trilha li { flex: 1 1 0; min-width: 118px; }
.trilha a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--tinta2); border: 1px solid transparent; }
.trilha a:hover { background: var(--sup2); }
.trilha .n { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--linha-forte); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.trilha .t { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; }
.trilha .s { display: block; font-size: 12px; color: var(--tinta3); white-space: nowrap; }
.trilha a[aria-current="page"] { background: var(--prim-suave); color: var(--tinta); }
.trilha a[aria-current="page"] .n { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.trilha .pend .s { color: var(--alerta); }

/* ---------- Estrutura da tela ---------- */
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; }
main.larga { max-width: 1040px; }
.cabeca { margin-bottom: 20px; }
.cabeca .sobre { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--prim); margin-bottom: 6px; }
.cabeca p { color: var(--tinta2); margin-top: 6px; max-width: 62ch; }
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; margin-bottom: 14px; }
.cartao > h2 { margin-bottom: 12px; }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade:not(.g2) > .campo { max-width: 300px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.botao { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha-forte); background: var(--sup); border-radius: 10px; padding: 8px 14px; font-weight: 600; text-decoration: none; color: var(--tinta); }
.botao:hover { border-color: var(--prim); }
.botao.prim { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.botao.leve { border-color: transparent; background: none; color: var(--prim); padding: 6px 8px; }
.botao.perigo:hover { border-color: var(--erro); color: var(--erro); }
.aviso { border-left: 3px solid var(--demo-t); background: var(--demo-f); color: var(--demo-t); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.aprender { border-left: 3px solid var(--prim); background: var(--prim-suave); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin: 0 0 14px; }
.aprender b { color: var(--prim); }

/* ---------- Campo com estado ---------- */
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo label, .rotulo { font-size: 13px; font-weight: 600; color: var(--tinta2); }
.entrada { display: flex; align-items: stretch; border: 1px solid var(--linha-forte); border-radius: 10px; background: var(--sup); overflow: hidden; }
.entrada:focus-within { border-color: var(--prim); box-shadow: 0 0 0 3px var(--prim-suave); }
.entrada input, .entrada select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 11px; outline: none; font-size: 15px; }
.entrada input.num { text-align: right; font-weight: 600; }
.entrada .un { display: grid; place-items: center; padding: 0 10px; font-size: 13px; color: var(--tinta3); background: var(--sup2); border-left: 1px solid var(--linha); white-space: nowrap; }
.entrada.fixo { background: var(--sup2); border-style: dashed; }
.entrada.fixo input { color: var(--tinta2); }
.campo.invalido .entrada { border-color: var(--erro); }
.estado { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 22px; }
.selo { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo.norma { background: var(--norma-f); color: var(--norma-t); }
.selo.alterado { background: var(--alt-f); color: var(--alt-t); }
.selo.calc { background: var(--calc-f); color: var(--calc-t); }
.selo.demo { background: var(--demo-f); color: var(--demo-t); }
.selo.mantido { background: var(--prim-suave); color: var(--prim); }
button.selo:hover { filter: brightness(.95); text-decoration: underline; }
.voltar { border: 0; background: none; color: var(--tinta2); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.msg { font-size: 12.5px; color: var(--alerta); }
.campo.invalido .msg { color: var(--erro); }
.seg { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: 10px; overflow: hidden; background: var(--sup); }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 14px; border-right: 1px solid var(--linha); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--prim); color: var(--prim-tinta); font-weight: 600; }
.valor-calc { display: inline-flex; align-items: baseline; gap: 6px; border: 1px dashed var(--linha-forte); background: var(--sup2); border-radius: 10px; padding: 8px 11px; font-weight: 650; color: var(--tinta); text-align: left; }
.valor-calc:hover { border-color: var(--prim); }
.valor-calc small { font-weight: 500; color: var(--tinta3); }

/* ---------- Bloco recolhível (frase-resumo) ---------- */
.bloco { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.bloco-cab { width: 100%; display: grid; grid-template-columns: 30px 1fr auto 18px; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; border-radius: var(--raio); }
.bloco-cab:hover { background: var(--sup2); }
.bloco-cab .n { width: 28px; height: 28px; border-radius: 50%; background: var(--prim-suave); color: var(--prim); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.bloco-cab .tit { font-weight: 650; font-size: 16px; display: block; }
.bloco-cab .frase { color: var(--tinta2); font-size: 14px; display: block; }
.bloco-cab .carga { text-align: right; font-weight: 650; white-space: nowrap; }
.bloco-cab .carga small { display: block; font-weight: 500; color: var(--tinta3); font-size: 12px; }
.bloco-cab .seta { color: var(--tinta3); transition: transform .15s; }
.bloco.aberto .bloco-cab .seta { transform: rotate(90deg); }
.bloco.aberto { border-color: var(--linha-forte); box-shadow: var(--sombra); }
.bloco-corpo { padding: 4px 16px 18px 58px; }
.sub { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linha); }
.sub > h3 { margin-bottom: 10px; }
details.mais { margin-top: 16px; border-top: 1px solid var(--linha); padding-top: 12px; }
details.mais > summary { cursor: pointer; font-weight: 600; color: var(--prim); font-size: 14px; }
details.mais > .grade { margin-top: 12px; }

/* ---------- Lista de ambientes (linha: nome, indicadores e ações; o app pode trocar as colunas) ---------- */
.amb-item { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.amb-item:hover { border-color: var(--prim); }
.amb-item a.nome { font-weight: 650; font-size: 16px; color: var(--tinta); text-decoration: none; }
.amb-item a.nome:hover { color: var(--prim); text-decoration: underline; }
.amb-item .kpi { text-align: right; }
.amb-item .kpi b { font-size: 18px; }

/* ---------- Tabelas ---------- */
.tabela-rolo { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta3); font-weight: 700; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.total td { font-weight: 700; border-top: 2px solid var(--linha-forte); }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: var(--sup2); }
.x { border: 0; background: none; color: var(--tinta3); font-size: 18px; padding: 6px; border-radius: 6px; }
.x:hover { color: var(--erro); background: var(--sup2); }

/* ---------- Número em destaque, indicadores, barras, cartões e lista de pendências ---------- */
.heroi-res { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.numero { font-family: var(--fonte-titulo); font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.numero small { font-size: 24px; font-weight: 600; color: var(--tinta2); letter-spacing: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi-c { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; background: var(--sup2); text-align: left; }
button.kpi-c:hover { border-color: var(--prim); }
.kpi-c span { display: block; font-size: 12px; color: var(--tinta3); font-weight: 600; }
.kpi-c b { font-size: 18px; }
.barras { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 84px 52px; gap: 6px 12px; align-items: center; font-size: 14px; }
.barras .linha-b { display: contents; cursor: pointer; }
.barras .linha-b:hover .nome { color: var(--prim); text-decoration: underline; }
.barras .trilho { height: 14px; position: relative; }
.barras .barra { position: absolute; top: 0; bottom: 0; background: var(--prim); border-radius: 0 4px 4px 0; min-width: 2px; }
.barras .barra.neg { background: var(--tinta3); border-radius: 4px 0 0 4px; }
.barras .eixo { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--linha-forte); }
.barras .v, .barras .p { text-align: right; font-variant-numeric: tabular-nums; }
.barras .p { color: var(--tinta3); }
.pesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.peso { border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }
.peso b { display: block; font-size: 22px; font-family: var(--fonte-titulo); }
.pend { list-style: none; padding: 0; margin: 0; }
.pend li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.pend li:last-child { border-bottom: 0; }

/* ---------- Faixa de resultado ---------- */
.faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--tinta); color: var(--fundo); }
.faixa-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.faixa .item span { display: block; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .05em; }
.faixa .item b { font-size: 18px; font-variant-numeric: tabular-nums; }
.faixa .delta { font-size: 13px; border-radius: 999px; padding: 3px 10px; background: var(--faixa-delta); }
.faixa a { margin-left: auto; color: inherit; font-weight: 600; text-decoration: none; border: 1px solid currentColor; border-radius: 10px; padding: 7px 12px; }

/* ---------- Gaveta, paleta e janela ---------- */
.veu { position: fixed; inset: 0; background: var(--veu); z-index: 40; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--sup); z-index: 41; box-shadow: var(--sombra); display: flex; flex-direction: column; }
.gaveta header { padding: 18px 20px 12px; border-bottom: 1px solid var(--linha); display: flex; gap: 12px; align-items: flex-start; }
.gaveta header div { flex: 1; }
.gaveta .corpo { padding: 16px 20px 28px; overflow: auto; }
.gaveta .valor-g { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 700; }
.passo { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.passo .q { font-weight: 650; display: flex; justify-content: space-between; gap: 12px; }
.passo .f { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; color: var(--tinta2); margin-top: 2px; overflow-wrap: anywhere; }
.passo .fo { font-size: 12.5px; color: var(--tinta3); margin-top: 4px; }
.janela { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); max-height: 76vh; overflow: auto; background: var(--sup); z-index: 41; border-radius: 14px; box-shadow: var(--sombra); padding: 16px; }
.janela h2 { margin-bottom: 10px; }
.paleta input { width: 100%; border: 1px solid var(--linha-forte); border-radius: 10px; padding: 10px 12px; background: var(--sup); font-size: 16px; }
.paleta ul { list-style: none; margin: 10px 0 0; padding: 0; }
.paleta li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 10px; }
.paleta li button.ativo, .paleta li button:hover { background: var(--prim-suave); }

@media (max-width: 760px) {
  h1 { font-size: 23px; }
  .trilha .s { display: none; }
  .trilha li { min-width: 0; }
  .trilha .t { font-size: 13px; }
  .topo-acoes .txt { display: none; }
  .bloco-corpo { padding-left: 16px; }
  .bloco-cab { grid-template-columns: 30px 1fr 18px; }
  .bloco-cab .carga { grid-column: 2; text-align: left; }
  .bloco-cab .carga small { display: inline; margin-left: 6px; }
  .heroi-res { grid-template-columns: 1fr; gap: 14px; }
  .numero { font-size: 48px; }
  .barras { display: block; }
  .barras .linha-b { display: grid; grid-template-columns: 1fr auto 44px; gap: 3px 10px; margin-bottom: 10px; }
  .barras .trilho { grid-column: 1 / -1; grid-row: 2; }
  .faixa-linha { gap: 14px; }
  .faixa .item.sec { display: none; }
  .amb-item { grid-template-columns: 1fr; }
  .amb-item .kpi { text-align: left; }
}

/* ---------- Celular (v0.4.0; especificação aprovada na sessão M0, itens C1 a C17) ----------
   Regra que muda elemento que já existe: só sob @media screen and (max-width: 760px). O "screen" é obrigatório: sem ele o
   navegador aplica a regra também na impressão e o PDF muda (achado da M0). A regra estreita acima (sem "screen") fica como está.
   Elemento novo (cel-*) nasce oculto aqui e só aparece em tela estreita: no computador não ocupa nenhum pixel. */
.cel-menu, .cel-passos, .cel-dica, .cel-cartoes, .cel-rolar { display: none; }
/* .so-celular: só em tela estreita (some no computador e no papel); .so-computador: some em tela estreita */
@media not screen and (max-width: 760px) { .so-celular { display: none !important; } }
/* Seletor de arquivo de projeto sobre um botão, invisível (input[type=file][data-arquivo-projeto] dentro de .arquivo-projeto):
   o seletor escondido com display:none e acionado por código falha em alguns celulares */
.arquivo-projeto { position: relative; overflow: hidden; cursor: pointer; }
.arquivo-projeto input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }

@media screen and (max-width: 760px) {
  .so-computador { display: none !important; }

/* Formatação numérica (padrão brasileiro: vírgula decimal) e utilidades de texto. */
(function (H) {
  'use strict';

  function num(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (casas === undefined) casas = 2;
    var s = Math.abs(Number(v)).toFixed(casas);
    var partes = s.split('.');
    partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var negativo = Number(v) < 0 && Number(s) !== 0;
    return (negativo ? '−' : '') + partes.join(',');
  }

  function numU(v, casas, unidade) {
    return num(v, casas) + (unidade ? ' ' + unidade : '');
  }

  // Valor para dentro de um <input>: sem separador de milhar, sem zeros à direita
  function campo(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '';
    var s = Number(v).toFixed(casas === undefined ? 2 : casas);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }

  // Lê número digitado com vírgula ou ponto decimal
  function ler(texto) {
    if (typeof texto === 'number') return texto;
    if (texto === null || texto === undefined) return NaN;
    var s = String(texto).trim().replace(/\s/g, '').replace('−', '-');
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    return s === '' ? NaN : Number(s);
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function pct(v, casas) { return num(v * 100, casas === undefined ? 0 : casas) + ' %'; }

  H.util.fmt = { num: num, numU: numU, campo: campo, ler: ler, esc: esc, pct: pct };

<script>
/* ==== js/util/interpolacao.js ==== */
/* Interpolação em tabelas de catálogo — sem extrapolação.
 * Retorna também os pontos usados, para o memorial de cálculo.
 */
(function (D) {
  'use strict';

  function lin(x, x0, x1, y0, y1) {
    if (x1 === x0) return y0;
    return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }

  // modo: 'lin' (y linear em x), 'loglog' (log y linear em log x),
  //       'semilog' (y linear em log x — adequado para dB)
  function interp(x, x0, x1, y0, y1, modo) {
    if (modo === 'loglog' && x0 > 0 && x1 > 0 && y0 > 0 && y1 > 0 && x > 0) {
      return Math.exp(lin(Math.log(x), Math.log(x0), Math.log(x1), Math.log(y0), Math.log(y1)));
    }
    if (modo === 'semilog' && x0 > 0 && x1 > 0 && x > 0) {
      return lin(Math.log(x), Math.log(x0), Math.log(x1), y0, y1);
    }
    return lin(x, x0, x1, y0, y1);
  }

  /* Localiza o intervalo de x numa lista de pontos ordenada por x.
   * pts: array de arrays; ix: índice da coluna x.
   * Retorna { i0, i1, exato } ou null se x estiver fora do domínio publicado. */
  function intervalo(pts, x, ix) {
    var n = pts.length;
    if (!n) return null;
    var eps = 1e-9;
    if (x < pts[0][ix] - eps || x > pts[n - 1][ix] + eps) return null;
    for (var i = 0; i < n; i++) {
      if (Math.abs(pts[i][ix] - x) <= eps) return { i0: i, i1: i, exato: true };
    }
    for (var j = 0; j < n - 1; j++) {
      if (x > pts[j][ix] && x < pts[j + 1][ix]) return { i0: j, i1: j + 1, exato: false };
    }
    return null;
  }

  /* Interpola a coluna iy em x (coluna ix). */
  function naTabela(pts, x, ix, iy, modo) {
    var it = intervalo(pts, x, ix);
    if (!it) return null;
    var p0 = pts[it.i0], p1 = pts[it.i1];
    if (p0[iy] == null || p1[iy] == null) return null;
    var y = it.exato ? p0[iy] : interp(x, p0[ix], p1[ix], p0[iy], p1[iy], modo);
    return { valor: y, p0: p0, p1: p1, exato: it.exato, modo: modo };
  }

  D.util.interp = { lin: lin, interp: interp, intervalo: intervalo, naTabela: naTabela };
})(window.Difusores);

<script>
/* ==== js/util/rastro.js ==== */
/* Rastro de cálculo — base do memorial auditável.
 * Cada passo registra: fórmula, valores substituídos, resultado, unidade e fonte.
 * O motor recebe um Rastro opcional; sem rastro (null) os cálculos rodam sem
 * registrar passos (mais rápido para varrer centenas de alternativas).
 */
(function (D) {
  'use strict';

  function Rastro() {
    this.passos = [];
    this.estimados = [];   // itens decididos com dado estimado (geram "com ressalva")
    this.estendidos = [];  // regras estendidas de outra família/condição
    this.alertas = [];     // avisos que não mudam o selo
    this.metodos = [];     // notas de método, comuns a todos os candidatos (não mudam o selo nem a nota)
  }

  /* p = { grupo, titulo, formula, subst, valor, unidade, casas, fonte, tipo } */
  Rastro.prototype.passo = function (p) {
    this.passos.push(p);
    return p.valor;
  };

  Rastro.prototype.estimado = function (txt) {
    if (this.estimados.indexOf(txt) < 0) this.estimados.push(txt);
  };
  Rastro.prototype.estendido = function (txt) {
    if (this.estendidos.indexOf(txt) < 0) this.estendidos.push(txt);
  };
  Rastro.prototype.alerta = function (txt) {
    if (this.alertas.indexOf(txt) < 0) this.alertas.push(txt);
  };
  Rastro.prototype.metodo = function (txt) {
    if (this.metodos.indexOf(txt) < 0) this.metodos.push(txt);
  };

  // que são necessárias para o selo e o índice de todas as alternativas).
  function RastroLeve() { Rastro.call(this); }
  RastroLeve.prototype = Object.create(Rastro.prototype);
  RastroLeve.prototype.passo = function (p) { return p.valor; };

  D.util.Rastro = Rastro;
  D.util.RastroLeve = RastroLeve;
})(window.Difusores);

</script>
<script>
/* ==== js/util/sanear.js ==== */
/* Células não monótonas das tabelas de catálogo.
 * Desde a v2.1.2 as tabelas TROX entram no cálculo como impressas (item B5 do quadro de decisão de
 * 2026-10-07): nenhum valor é corrigido. Este módulo só LISTA as células em que a grandeza diminui
 * quando Q aumenta, com o valor que a tendência dos vizinhos daria, para a conferência contra o
 * catálogo (célula a célula, com os vizinhos como referência). A lista sai do mesmo algoritmo que, até a v2.1.1, substituía
 * esses valores. */
(function (D) {
  'use strict';
  var I = D.util.interp;

  function arred(v, casas) { var f = Math.pow(10, casas); return Math.round(v * f) / f; }

  function estimar(pts, k, ix, iy, modo) {
    var a = k - 1, b = k + 1;
    while (a >= 0 && pts[a][iy] == null) a--;
    while (b < pts.length && pts[b][iy] == null) b++;
    if (a >= 0 && b < pts.length) return I.interp(pts[k][ix], pts[a][ix], pts[b][ix], pts[a][iy], pts[b][iy], modo);
    if (a >= 0) return pts[a][iy];
    if (b < pts.length) return pts[b][iy];
    return null;
  }

  function tx(v, modo) { return modo === 'lin' ? v : Math.log(v); }
  function ty(v, modo) { return modo === 'loglog' ? Math.log(v) : v; }
  function tyInv(v, modo) { return modo === 'loglog' ? Math.exp(v) : v; }

  /* Tendência local: ajuste linear (no espaço transformado) com até 2 vizinhos
   * válidos de cada lado, excluindo o índice `excluir` (o outro candidato). */
  function tendencia(pts, k, ix, iy, modo, excluir) {
    var xs = [], ys = [], i, n = 0;
    for (i = k - 1; i >= 0 && n < 2; i--) { if (i === excluir || pts[i][iy] == null || pts[i][iy] <= 0) continue; xs.push(tx(pts[i][ix], modo)); ys.push(ty(pts[i][iy], modo)); n++; }
    n = 0;
    for (i = k + 1; i < pts.length && n < 2; i++) { if (i === excluir || pts[i][iy] == null || pts[i][iy] <= 0) continue; xs.push(tx(pts[i][ix], modo)); ys.push(ty(pts[i][iy], modo)); n++; }
    if (xs.length < 2) return null;
    var mx = 0, my = 0; xs.forEach(function (x, j) { mx += x; my += ys[j]; }); mx /= xs.length; my /= xs.length;
    var sxy = 0, sxx = 0; xs.forEach(function (x, j) { sxy += (x - mx) * (ys[j] - my); sxx += (x - mx) * (x - mx); });
    var b = sxx > 0 ? sxy / sxx : 0;
    return tyInv(my + b * (tx(pts[k][ix], modo) - mx), modo);
  }

  function desvio(pts, k, ix, iy, modo, excluir) {
    var est = tendencia(pts, k, ix, iy, modo, excluir);
    if (est == null) est = estimar(pts, k, ix, iy, modo);
    if (est == null || est === 0) return 0;
    return Math.abs(pts[k][iy] - est) / Math.abs(est);
  }

  /* pts: pontos ordenados por x (coluna ix); iy: coluna examinada; modo: 'loglog' | 'semilog' | 'lin'.
   * Não altera `pts`: trabalha numa cópia e devolve uma linha por célula discrepante,
   * { tabela, x, campo, impresso, tendencia }. */
  function naoMonotonas(pts, ix, iy, modo, rotulo, casas, nomeCampo) {
    var c = pts.map(function (p) { return p.slice(); }), porIndice = {}, ordem = [], guard = 0;
    while (guard++ < 60) {
      var idx = -1;
      for (var i = 1; i < c.length; i++) {
        if (c[i][iy] != null && c[i - 1][iy] != null && c[i][iy] < c[i - 1][iy] - 1e-9) { idx = i; break; }
      }
      if (idx < 0) break;
      var a = idx - 1, b = idx;
      var k = desvio(c, a, ix, iy, modo, b) > desvio(c, b, ix, iy, modo, a) ? a : b;
      var novo = estimar(c, k, ix, iy, modo);
      if (novo == null) break;
      novo = arred(novo, casas);
      // a tendência fica entre os vizinhos mesmo após o arredondamento
      if (k > 0 && c[k - 1][iy] != null && novo < c[k - 1][iy]) novo = c[k - 1][iy];
      if (k < c.length - 1 && c[k + 1][iy] != null && novo > c[k + 1][iy]) novo = c[k + 1][iy];
      if (!porIndice[k]) { porIndice[k] = { tabela: rotulo, x: pts[k][ix], campo: nomeCampo, impresso: pts[k][iy], tendencia: novo }; ordem.push(k); }
      else porIndice[k].tendencia = novo;
      c[k][iy] = novo;
    }
    return ordem.map(function (k) { return porIndice[k]; });
  }

  D.util.sanear = { naoMonotonas: naoMonotonas };
})(window.Difusores);

</script>

/* ==== js/motor/metodologia.js ==== */
/* Regras genéricas da metodologia de referência (seções 2 a 6).
 * Regra do ClimaApp (fator 0,75 de montagem suspensa) usada só nos testes de validação; o app usa 0,707 e não chama este módulo.
 * Validadas contra as saídas do ClimaApp nos testes (fixtures com coeficientes Tropical, só em teste).
 */
(function (D) {
  'use strict';

  var M = {
    // Seção 4 — número de direções: (1/n)^0,45
    fatorDirecoes: function (n) { return Math.pow(1 / n, 0.45); },
    // Seção 4 — repartição do alcance em difusores retangulares (r = lado maior / lado menor)
    fatorRetangularMaior: function (r) { return 0.9734 * Math.pow(r, 0.2341); },
    fatorRetangularMenor: function (r) { return 0.9115 * Math.pow(r, -0.4675); },
    // Seção 4 — sem efeito Coandă (duto aparente / livre suspenso)
    fatorSuspenso: 0.75,
    // Seção 2 — registro de lâminas opostas
    fatorRegistroAberto: 1.10,
    fatorRegistroRegulado: 1.25,
    // Seção 3 — soma de n fontes iguais
    somaFontes: function (nivel, n) { return nivel + 10 * Math.log10(n); },
    // Seção 6 — regra do catálogo DI (Tropical) para v na zona ocupada, por eixo:
    //   L ≥ Xmáx → 0,10 ; Xmín ≤ L < Xmáx → interpolação 0,25…0,10 ; L < Xmín → 0,25·(Xmín/L)
    vzoRegraReferencia: function (L, xmin, xmax) {
      if (L >= xmax) return 0.10;
      if (L >= xmin) return 0.25 - (L - xmin) / (xmax - xmin) * 0.15;
      return 0.25 * (xmin / L);
    },
    // Seção 9 — economia de peças
    pontosPecas: function (n) { return 10 / (1 + (n - 1) / 6); }
  };

  D.motor.metodologia = M;
})(window.Difusores);

</script>

    var n = D.dados.normas.nbr16401_2.velocidade, s = n.semControle, res;
    if (controleLocal) {
      res = { valor: n.controleLocal.maxFig4, clausula: '6.3.2.3', formula: 'sem limite superior na norma (6.3.2.3); alerta acima de 1,6 m/s (critério do app: fim do eixo da Figura 4)', subst: 'controle local da velocidade disponível (1 controle por 6 ocupantes ou por 84 m²)', semLimite: true };
    } else if (to < s.t1) {
      res = { valor: s.abaixo23, clausula: '6.3.2.4 c)', formula: 'v_máx = 0,20 m/s (t_o < 23 °C)', subst: 't_o = ' + F.num(to, 1) + ' °C' };
      if (to < n.corpoFrio.toLimite) {
        res.alerta = { valor: n.corpoFrio.vMax, clausula: n.corpoFrio.clausula };
        res.formula = 'v_máx = 0,20 m/s (t_o < 23 °C); abaixo de 22,5 °C, alerta acima de 0,15 m/s (F.4, Anexo F, informativo)';
        res.subst = 't_o = ' + F.num(to, 1) + ' °C < 22,5 °C';
      }
    } else if (to <= s.t2) {
      var v = s.eq2[0] + s.eq2[1] * to + s.eq2[2] * to * to;
      var vFinal = Math.min(s.acima255, Math.max(s.abaixo23, v));
      res = { valor: vFinal, clausula: '6.3.2.4 b), Equação (2)', formula: 'v = 50,49 − 4,4047·t_o + 0,096425·t_o² (23 ≤ t_o ≤ 25,5 °C), limitado a 0,20–0,8 m/s', subst: 'v = 50,49 − 4,4047·' + F.num(to, 1) + ' + 0,096425·' + F.num(to, 1) + '² = ' + F.num(v, 3) };
    } else {
      res = { valor: s.acima255, clausula: '6.3.2.4 a)', formula: 'v_máx = 0,8 m/s (t_o > 25,5 °C)', subst: 't_o = ' + F.num(to, 1) + ' °C' };
    }
    res.fonte = 'ABNT NBR 16401-2:2024, ' + res.clausula;
    if (r) r.passo({ grupo: 'zona', titulo: 'Limite de velocidade do ar na zona ocupada', formula: res.formula, subst: res.subst, valor: res.valor, unidade: 'm/s', casas: 2, fonte: res.fonte });
    return res;
  }

  /* Eficácia da distribuição de ar Ez — NBR 16401-3:2024, Tabela 3.
   * o = { aquecimento, dT (K, módulo), retornoAlto, v14 (m/s a 1,4 m do piso) } */
  function ez(o, r) {
    var t = D.dados.normas.nbr16401_3.ez, linha;
    if (!o.aquecimento) linha = 'frioForro';
    else if (!o.retornoAlto) linha = 'quenteForroRetPiso';
    else if (o.dT >= t.dtLimite) linha = 'quente8ForroRetForro';
    else linha = (o.v14 != null && o.v14 >= t.vRef) ? 'quenteMenos8Rapido' : 'quenteMenos8Lento';
    var l = t.linhas.filter(function (x) { return x.id === linha; })[0];
    var res = { valor: l.valor, texto: l.texto, clausula: t.clausula, fonte: 'ABNT NBR 16401-3:2024, Tabela 3' };
    if (r) r.passo({ grupo: 'zona', titulo: 'Eficácia da distribuição de ar (Ez)', formula: 'Tabela 3 — configuração insuflamento/retorno', subst: l.texto + (o.aquecimento && o.retornoAlto && o.dT < t.dtLimite ? ' (v a 1,4 m = ' + F.num(o.v14, 2) + ' m/s)' : ''), valor: l.valor, unidade: '', casas: 2, fonte: res.fonte });
    return res;
  }

  /* Corrente de ar (draft) — ASHRAE Fundamentals 2021 cap. 9 (Fanger et al. 1989). */
  function draft(v, ta, Tu, r) {
    var d = D.dados.normas.ashrae.draft;
    var vv = Math.max(v, d.vMin);
    var pd = (34 - ta) * Math.pow(Math.max(vv - 0.05, 0), 0.62) * (0.37 * vv * Tu + 3.14);
    pd = Math.max(0, Math.min(100, pd));
    var fora = ta < d.faixa.ta[0] || ta > d.faixa.ta[1] || vv > d.faixa.v[1];
    if (r) r.passo({ grupo: 'zona', titulo: 'Percentual de insatisfeitos por corrente de ar (draft)', formula: d.formula, subst: 'PD = (34 − ' + F.num(ta, 1) + ') · (' + F.num(vv, 2) + ' − 0,05)^0,62 · (0,37·' + F.num(vv, 2) + '·' + Tu + ' + 3,14)', valor: pd, unidade: '%', casas: 1, fonte: d.fonte + (fora ? ' — fora da faixa de ajuste do modelo' : '') });
    return { pd: pd, fora: fora, fonte: d.fonte };
  }

  /* Zona ocupada — NBR 16401-2:2024, 3.55 (geralmente até 1,8 m; os 1,1 m de pessoa sentada vêm de 6.3.3.1).
   * paredesExternas = { x0, xC, y0, yW } (booleanos). */
  function zonaOcupada(postura, paredesExternas) {
    var z = D.dados.normas.nbr16401_2.zonaOcupada, p = paredesExternas || {};
    function rec(k) { return p[k] ? z.recuoParedeExterna : z.recuoParedeInterna; }
    return {
      altura: postura === 'sentado' ? z.alturaSentado : z.alturaEmPe,
      recuo: { '-x': rec('x0'), '+x': rec('xC'), '-y': rec('y0'), '+y': rec('yW') },
      clausula: z.clausula, fonte: 'ABNT NBR 16401-2:2024, 3.55'
    };
  }

  D.motor.normas = { limiteVzo: limiteVzo, ez: ez, draft: draft, zonaOcupada: zonaOcupada };
})(window.Difusores);

</script>
<script>
/* ==== js/motor/avisos.js ==== */
/* Avisos de entrada (sem DOM): D.motor.avisos(e) → lista de { nivel, codigo, campo, texto }.
 * nivel 'erro': sem o dado não há cálculo. selecao.selecionar devolve o resultado bloqueado e nenhum valor
 * é adotado no lugar (até a v2.1.1 o ΔT vazio virava 1 K na vazão pela carga, sem aviso).
 * nivel 'aviso': o cálculo segue. Nesta versão só existem os avisos de entrada que mudam número (item C8 do
 * quadro de decisão de 2026-10-07): dtVazio, dtZero, vazaoZero, cargaZero e instalacaoAbaixoZona.
 * `campo` é o id do campo na tela ('ar.dT', 'ar.Q', 'ar.qs', 'geo.zo'). */
(function (D) {
  'use strict';
  var F = D.util.fmt;

  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }

  // Altura da zona ocupada usada no cálculo: a informada ou a da postura (NBR 16401-2:2024, 3.55 e 6.3.3.1)
  function zonaOcupada(e) {
    var z = D.dados.normas.nbr16401_2.zonaOcupada, geo = e.geo || {};
    return geo.zo > 0 ? geo.zo : (geo.postura === 'sentado' ? z.alturaSentado : z.alturaEmPe);
  }

  function avisos(e) {
    var lista = [], ar = (e && e.ar) || {}, geo = (e && e.geo) || {}, carga = ar.modo === 'carga';
    function add(nivel, codigo, campo, texto) { lista.push({ nivel: nivel, codigo: codigo, campo: campo, texto: texto }); }

    if (vazio(ar.dT) || typeof ar.dT !== 'number') {
      add('erro', 'dtVazio', 'ar.dT', 'ΔT de insuflamento vazio: ' + (carga ? 'sem ele a vazão não sai do calor sensível do ambiente' : 'sem ele não se calculam a capacidade sensível, o Ez e a validade do catálogo') +
        '. O app não adota valor no lugar.');
    } else if (ar.dT === 0) {
      add('erro', 'dtZero', 'ar.dT', 'ΔT de insuflamento igual a zero: ' + (carga ? 'a vazão pelo calor sensível do ambiente seria infinita' : 'o ar insuflado não retira calor do ambiente') + '. Informe o ΔT de projeto.');
    }
    if (carga) {
      if (!(ar.qs > 0)) add('erro', 'cargaZero', 'ar.qs', 'Calor sensível do ambiente vazio ou igual a zero: não há vazão a calcular.');
    } else if (!(ar.Q > 0)) {
      add('erro', 'vazaoZero', 'ar.Q', 'Vazão total de insuflamento vazia ou igual a zero: não há vazão a distribuir.');
    }
    if (geo.Hinst > 0) {
      var zo = zonaOcupada(e);
      if (!(geo.Hinst > zo)) {
        add('erro', 'instalacaoAbaixoZona', 'geo.zo', 'Altura de instalação (' + F.num(geo.Hinst, 2) + ' m) não fica acima da zona ocupada (' + F.num(zo, 2) +
          ' m): o terminal ficaria dentro da zona ocupada e a distância H1 = h_inst − h_zo seria nula ou negativa.');
      }
    }
    return lista;
  }

  avisos.bloqueia = function (lista) { return lista.some(function (a) { return a.nivel === 'erro'; }); };

  /* Aviso de saída (D1 do quadro de 2026-10-07): nenhuma das alternativas geradas é aprovada. Só texto, sem mudar cálculo nem ordem.
   * `melhor` é a alternativa de maior nota (com o rastro completo). O exemplo é o do catálogo VDW 2/7/EN/6 (PDF 16 e 17). */
  avisos.semAprovada = function (amb, nCandidatos, melhor) {
    var a = D.motor.config.arranjo, rep = melhor && melhor.verifs ? melhor.verifs.filter(function (v) { return v.situacao === 'reprova'; }).map(function (v) { return v.criterio; }) : [];
    return { codigo: 'semAprovada', nivel: 'fora-do-alcance',
      texto: 'Caso fora do alcance do app: nenhuma das ' + nCandidatos + ' alternativas geradas é aprovada' + (rep.length ? ' (a de maior nota reprova em: ' + rep.join('; ') + ')' : '') + '. ' +
        'O app só gera malhas de até ' + a.maxPecas + ' peças, com proporção da malha de ' + F.num(a.proporcaoMin, 1) + ' a ' + F.num(a.proporcaoMax, 1) + ' e espaçamento mínimo de ' + F.num(a.espacamentoMin, 1) + ' m; ' +
        'esta vazão por área é de ' + F.num(amb.qEsp, 0) + ' m³/h por m². Para arranjos maiores o catálogo resolve o caso por fileiras: no exemplo do VDW, um salão de 24 × 24 m com 16.000 l/s (57.600 m³/h ÷ 576 m² = 100 m³/h por m², conta do app) leva 133 peças em 7 fileiras de 19, a 3 m da fachada (TROX VDW 2/7/EN/6, PDF 16 e 17), arranjo que o app não gera. ' +
        'As alternativas listadas são só as de maior nota e não devem ser adotadas sem esse dimensionamento.' };
  };
  D.motor.avisos = avisos;
})(window.Difusores);

</script>
<script>

(function (D) {
  'use strict';
  var F = D.util.fmt;

  function premissas() {
    var n = D.dados.normas, t = n.ashrae.t50L, cfg = D.motor.config, tec = n.nbr10152.porId('tecnico'), g = D.dados.trox.graficos.atenuacao;
    var fr = cfg.indice.retornoFaixaCheia, w = cfg.indice.pesosInsuflamento, de = cfg.indice.desempate, k4 = cfg.indice.t50LReducaoZona4;
    function limSup(k) { return F.num(D.motor.indice.limSupT50L(t[k]), 2); }
    // velocidade em que PD chega ao limite do alerta, a 24 °C (bisseção na Eq. 59 do cap. 9)
    var vPd = (function () { var a = 0.05, b = 0.5; for (var i = 0; i < 40; i++) { var m = (a + b) / 2; if (D.motor.normas.draft(m, 24, cfg.draft.Tu).pd < cfg.draft.pdMax) a = m; else b = m; } return (a + b) / 2; })();
    var vNbr = D.motor.normas.limiteVzo(24, false).valor;
    function faixa(k) { return t[k].nome + ': ' + F.num(t[k].min, 1) + ' a ' + F.num(t[k].max, 1) + ' (ótimo ' + F.num(t[k].otimo, 1) + ')'; }

          '2 × o alcance a 0,5 m/s no ADE. As retas de v_L dos gráficos de seleção da C2-005 (págs. 2 e 3), medidas pelos vetores do PDF, dão decaimento L ∝ v^−1,00 no ADLQ (T50 = 1,20 × o alcance a 0,3 m/s, o valor do app) ' +
          'e L ∝ v^−0,85 no ADLR (1,17, 2,7 % abaixo do app); nos dois casos é extrapolação além da última reta (0,3 m/s). É um limite superior, e a escolha é sensível a ele: ' +

        situacao: 'premissa declarada, sem confirmação do fabricante: valor único de 1,20 para o ADLQ e o ADLR; o gráfico dá 1,20 e 1,17' },
      { id: 't50L', titulo: 'Faixas de T50/L por tipo de difusor',
        texto: 'Faixas adotadas (em Referências, só para leitura): ' + faixa('teto') + '; ' + faixa('tetoRadial') + '; ' + faixa('linear') + '. Os números mínimo e máximo são os da Tabela 4 da Titus (2018), fonte secundária; o "ótimo" é critério do app (a Titus manda escolher perto do meio da faixa). ' +
          '(Na Titus, a nota † da Tabela 4 dá 0,9 a 1,8 a um dos modelos de difusor redondo, o PAS; o app usa 0,6 a 1,2.) A Price traz outra tabela, por carga térmica, sem nomear a origem: adotá-la mudaria a 1ª opção em 3 a 5 dos 15 casos de referência. A seleção da TROX não usa T50/L (C2-005). Nos difusores de alta indução (FD, VDW, VD) a razão T50/L é só informativa. ' +

          'porque o T50 do app é limite superior (o Fundamentals 2021, cap. 20, p. 20.5, traz como prática aceita reduzir em 30 % o alcance calculado quando ele cai na zona 4; tratar o T50 como limite superior e pôr a borda em máx ÷ 0,7 é critério do app). No exemplo de seleção da C2-005, pág. 4 (ADLR 4, 900 m³/h, L = 2,2 m, que o catálogo chama de alcance até v_L = 0,4 m/s), o app, lendo esse L como o comprimento característico, calcula T50/L de 1,58: acima de 1,2 e dentro de 1,2 ÷ 0,7 = 1,71. ' +

      { id: 'fator0707', titulo: 'Montagem suspensa: alcance × ' + F.num(n.ashrae.jato.fatorLivre.valor, 3),
        texto: 'Sem forro, o alcance do catálogo (jato aderido ao teto) é multiplicado por ' + F.num(n.ashrae.jato.fatorLivre.valor, 3) + '. A equação vale para jato livre não circular; o app aplica o mesmo fator ao ADLR, de jato radial. ' +

        situacao: 'premissa declarada, sem confirmação do fabricante, com o apoio das duas relações publicadas para a alta indução' },

        texto: 'O dB(A) das tabelas TROX é nível de potência sonora (LN); o nível no ambiente é LN − atenuação do ambiente + 10·log n. A atenuação é um modelo ajustado ao gráfico do catálogo, com a forma da equação de campo sonoro em recinto (Q = 2; R = 0,732·V\'^(2/3)), calibrado no exemplo impresso (cerca de 7 dB(A) a 2,0 m em 200 m³; V\' é o volume do local, como diz o texto da C2-005 pág. 5, embora o eixo do gráfico traga o rótulo "V [m³/h]"). ' +

          'O gráfico é conservador: a equação de Schultz (Fundamentals 2021, cap. 8, Eq. 26, ±2 dB) dá 10,6 dB a 500 Hz para 2 m e 200 m³, contra cerca de 7 dB(A) do catálogo.',

      { id: 'velocidades', titulo: 'Velocidades de prática nas bocas e nas grelhas',
        texto: 'As faixas de velocidade efetiva nas bocas de insuflamento, por aplicação, são prática de projeto sem documento (procuradas em toda a biblioteca e não achadas). As de velocidade de face no retorno, por posição (área bruta), vêm do guia da Krueger (2012, p. a1-14), que as atribui ao Fundamentals 2001 (fonte secundária). Ficam em Referências, só para leitura. ' +
          'No índice do insuflamento a velocidade na boca ' + (cfg.indice.velocidadeBocaNeutra ? 'é neutra entre a mínima e o máximo da aplicação' : 'pontua pela posição na faixa') +
          (fr ? '; no retorno acima da zona ocupada a nota é cheia de ' + F.num(fr.min, 1) + ' a ' + F.num(fr.max, 1) + ' m/s (velocidade no núcleo, Design Manual for Hospitals and Clinics, 2013, p. 192)' : '') + '. ' +

      { id: 'draft', titulo: 'Corrente de ar (PD)',
        texto: 'Alerta quando PD passa de ' + cfg.draft.pdMax + ' %, com intensidade de turbulência de ' + cfg.draft.Tu + ' %. A equação é da ASHRAE; o capítulo não dá limite de PD nem turbulência típica (a Fig. 11 traz a curva de 15 %): os dois números são critério do app. ' +

<script>
/* ==== js/motor/ar.js ==== */
/* Grandezas do ar e do ambiente. */
(function (D) {
  'use strict';
  var F = D.util.fmt;
  var CP_AR = 1006, CP_VAPOR = 1860; // J/(kg·K): ar seco e vapor d'água (ASHRAE Fundamentals 2021 cap. 1, Eq. 30)
  var UR_PADRAO = 50;                // %, quando a entrada não traz a umidade relativa do ambiente

  // Pressão de saturação do vapor sobre água líquida (Pa): ASHRAE Fundamentals 2021 cap. 1, Eq. (6)
  function pws(tC) {
    var T = tC + 273.15;
    return Math.exp(-5.8002206e3 / T + 1.3914993 - 4.8640239e-2 * T + 4.1764768e-5 * T * T - 1.4452093e-8 * T * T * T + 6.5459673 * Math.log(T));
  }

  // Temperatura operativa de projeto: a informada ou o padrão da NBR 16401-1 (resfriamento ou aquecimento)
  function tempOperativa(e) {
    var to = e.ar.to, ci = D.dados.normas.nbr16401_1.condicoesInternas;
    if (to === undefined || to === null || isNaN(to)) to = e.ar.dT < 0 ? ci.toPadraoAquecimento : ci.toPadraoResfriamento;
    return to;
  }

  /* Umidade absoluta e calor específico do ar úmido do ambiente, pela temperatura, pela umidade
   * relativa (e.ar.ur, em %; padrão 50) e pela pressão da altitude. */
  function umidade(e, r) {
    var z = e.ar.z || 0, to = tempOperativa(e), ur = e.ar.ur > 0 && e.ar.ur <= 100 ? e.ar.ur : UR_PADRAO;
    var p = 101325 * Math.pow(1 - 2.25577e-5 * z, 5.2559), ps = pws(to), pv = ur / 100 * ps;
    var w = 0.621945 * pv / (p - pv), cp = CP_AR + CP_VAPOR * w;
    if (r) r.passo({
      grupo: 'ar', titulo: 'Umidade absoluta do ar do ambiente',
      formula: 'w = 0,621945 · pv / (p − pv);  pv = UR · pws(t)',
      subst: 'pws(' + F.num(to, 1) + ' °C) = ' + F.num(ps, 0) + ' Pa; pv = ' + F.num(ur, 0) + ' % · ' + F.num(ps, 0) + ' = ' + F.num(pv, 0) + ' Pa; p = ' + F.num(p, 0) + ' Pa (' + F.num(z, 0) + ' m)',
      valor: w, unidade: 'kg/kg', casas: 5, fonte: 'ASHRAE Handbook — Fundamentals 2021 cap. 1, Equações (3) (pressão × altitude), (6) (pressão de saturação) e (20) (umidade absoluta)'
    });
    if (r) r.passo({
      grupo: 'ar', titulo: 'Calor específico do ar úmido',
      formula: 'cp = 1006 + 1860 · w',
      subst: 'cp = 1006 + 1860 · ' + F.num(w, 5),
      valor: cp, unidade: 'J/(kg·°C)', casas: 1, fonte: 'ASHRAE Handbook — Fundamentals 2021 cap. 1, Equação (30) (entalpia do ar úmido: h = 1,006·t + w·(2501 + 1,86·t))'
    });
    return { w: w, cp: cp, pws: ps, p: p, ur: ur, to: to };
  }

  // Massa específica do ar do ambiente: 1,2 kg/m³ ao nível do mar, corrigida pela pressão barométrica
  // da altitude (o ar do recinto está na temperatura de projeto, não na da atmosfera padrão)
  function rho(z, r) {
    var v = 1.2 * Math.pow(1 - 2.25577e-5 * z, 5.2559);
    if (r) r.passo({
      grupo: 'ar', titulo: 'Massa específica do ar do ambiente (altitude)',
      formula: 'ρ = 1,2 · p/p₀ = 1,2 · (1 − 2,25577·10⁻⁵ · z)^5,2559',
      subst: 'ρ = 1,2 · (1 − 2,25577·10⁻⁵ · ' + F.num(z, 0) + ')^5,2559',
      valor: v, unidade: 'kg/m³', casas: 3, fonte: 'ASHRAE Handbook — Fundamentals 2021 cap. 1, Equação (3) (pressão barométrica × altitude); massa específica de referência sem correção de temperatura (convenção do ar padrão, a mesma da carga térmica e do app de redes; ao nível do mar ρ·cp = 1228 J/(m³·°C), a 0,2 % do 1,23 kJ/(m³·°C) do ar padrão do cap. 18, p. 18.15). Pela lei dos gases, na base de ar seco (a coerente com o cp usado), a 1.060 m a vazão sairia 2,7 % maior na condição do ambiente (24 °C, 50 %) e 0,7 % menor na do insuflamento (14 °C, mesma umidade absoluta); ao nível do mar, 2,5 % maior e 0,9 % menor'
    });
    return v;
  }

  /* Calcula as grandezas do ambiente a partir da entrada. */
  function ambiente(e, r) {
    var g = {}, N = D.motor.normas;
    g.C = e.geo.C; g.W = e.geo.W; g.H = e.geo.H; g.Hinst = e.geo.Hinst;
    g.zona = N ? N.zonaOcupada(e.geo.postura || 'emPe', e.geo.paredesExternas) : { altura: 1.8, recuo: {} };
    g.zo = e.geo.zo > 0 ? e.geo.zo : g.zona.altura;
    g.area = g.C * g.W;
    g.volume = g.area * g.H;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Área do ambiente', formula: 'A = C · L', subst: 'A = ' + F.num(g.C, 2) + ' · ' + F.num(g.W, 2), valor: g.area, unidade: 'm²', casas: 2, fonte: 'Geometria' });
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Volume do ambiente', formula: 'V = A · H', subst: 'V = ' + F.num(g.area, 2) + ' · ' + F.num(g.H, 2), valor: g.volume, unidade: 'm³', casas: 1, fonte: 'Geometria' });
    g.rho = rho(e.ar.z || 0, r);
    g.dT = e.ar.dT;
    var um = umidade(e, r);
    g.w = um.w; g.cp = um.cp; g.ur = um.ur;
    if (e.ar.modo === 'carga') {
      // ΔT vazio ou zero: sem vazão (NaN). Nenhum valor é adotado no lugar; o aviso sai de motor\avisos.js
      var dtAbs = Math.abs(g.dT);
      g.Q = dtAbs > 0 ? e.ar.qs * 3600 / (g.rho * g.cp * dtAbs) : NaN;
      if (r) r.passo({
        grupo: 'ambiente', titulo: 'Vazão de insuflamento pelo calor sensível do ambiente',
        formula: 'Q = Qs · 3600 / (ρ · cp · |ΔT|)',
        subst: 'Q = ' + F.num(e.ar.qs, 0) + ' · 3600 / (' + F.num(g.rho, 3) + ' · ' + F.num(g.cp, 1) + ' · ' + F.num(dtAbs, 1) + ')',
        valor: g.Q, unidade: 'm³/h', casas: 0, fonte: 'Balanço de energia sensível (ASHRAE Fundamentals); NBR 16401-1:2024, 6.3.4 exige apenas o estudo psicrométrico e as vazões por zona (a equação da vazão é da ASHRAE)'
      });
    } else {
      g.Q = e.ar.Q;
      if (r) r.passo({ grupo: 'ambiente', titulo: 'Vazão total de insuflamento (informada)', formula: 'Q', subst: 'Q = ' + F.num(g.Q, 0), valor: g.Q, unidade: 'm³/h', casas: 0, fonte: 'Dado de entrada' });
    }
    g.qs = g.rho * g.cp * g.Q / 3600 * g.dT;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Capacidade sensível do ar insuflado', formula: 'Qs = ρ · cp · Q/3600 · ΔT', subst: 'Qs = ' + F.num(g.rho, 3) + ' · ' + F.num(g.cp, 1) + ' · ' + F.num(g.Q, 0) + '/3600 · ' + F.num(g.dT, 1), valor: g.qs, unidade: 'W', casas: 0, fonte: 'Balanço de energia sensível' });
    g.qEsp = g.Q / g.area;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Vazão específica', formula: 'q = Q / A', subst: 'q = ' + F.num(g.Q, 0) + ' / ' + F.num(g.area, 2), valor: g.qEsp, unidade: 'm³/h·m²', casas: 1, fonte: 'Geometria' });
    g.ren = g.Q / g.volume;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Taxa de renovação', formula: 'N = Q / V', subst: 'N = ' + F.num(g.Q, 0) + ' / ' + F.num(g.volume, 1), valor: g.ren, unidade: 'ren/h', casas: 1, fonte: 'Geometria' });
    g.Qret = g.Q * (e.ar.retornoPct || 0) / 100;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Vazão de retorno', formula: 'Qr = Q · %ret', subst: 'Qr = ' + F.num(g.Q, 0) + ' · ' + F.num(e.ar.retornoPct, 0) + '%', valor: g.Qret, unidade: 'm³/h', casas: 0, fonte: 'Dado de entrada' });
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Zona ocupada', formula: 'altura e recuos das paredes', subst: 'altura ' + F.num(g.zo, 2) + ' m (' + (e.geo.postura === 'sentado' ? 'sentado' : 'em pé') + '); recuos: x=0 ' + F.num(g.zona.recuo['-x'] || 0.3, 1) + ' m, x=C ' + F.num(g.zona.recuo['+x'] || 0.3, 1) + ' m, y=0 ' + F.num(g.zona.recuo['-y'] || 0.3, 1) + ' m, y=L ' + F.num(g.zona.recuo['+y'] || 0.3, 1) + ' m', valor: g.zo, unidade: 'm', casas: 2, fonte: 'ABNT NBR 16401-2:2024, 3.55 (zona ocupada: geralmente até 1,8 m; recuos de 1,0 m e 0,3 m) e 6.3.3.1 (1,1 m: altura da cabeça de pessoa sentada)' });
    g.H1 = g.Hinst - g.zo;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Distância do terminal ao topo da zona ocupada', formula: 'H1 = h_inst − h_zo', subst: 'H1 = ' + F.num(g.Hinst, 2) + ' − ' + F.num(g.zo, 2), valor: g.H1, unidade: 'm', casas: 2, fonte: 'Geometria; zona ocupada NBR 16401-2:2024, 3.55' });
    g.xMaxAltura = 1.5 * g.Hinst;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Alcance máximo admissível pela altura de instalação', formula: 'X_adm = 1,5 · h_inst', subst: 'X_adm = 1,5 · ' + F.num(g.Hinst, 2), valor: g.xMaxAltura, unidade: 'm', casas: 2, fonte: 'Prática de projeto (metodologia de referência, seção 6) — limite de queda do jato' });
    // temperatura operativa e limite de velocidade (NBR 16401-2)
    g.to = um.to;
    if (r) r.passo({ grupo: 'ambiente', titulo: 'Temperatura operativa de projeto', formula: 't_o', subst: 't_o = ' + F.num(g.to, 1) + ' °C', valor: g.to, unidade: '°C', casas: 1, fonte: 'ABNT NBR 16401-1:2024, 5.2.1 (dentro da faixa de conforto da NBR 16401-2); o valor padrão de 24 °C é do app' });
    var crit = e.crit || {};
    var lim = N.limiteVzo(g.to, !!crit.controleLocal, r);
    if (crit.vzoModo === 'projeto' && crit.vzoMax > 0) {
      g.vzoLim = { valor: crit.vzoMax, fonte: 'Limite de projeto adotado (NBR 16401-2:2024, 6.3.2.4 daria ' + F.num(lim.valor, 2) + ' m/s)', clausula: 'projeto', normativo: lim };
      if (r) r.passo({ grupo: 'zona', titulo: 'Limite de velocidade adotado no projeto', formula: 'v_máx (projeto)', subst: 'v_máx = ' + F.num(crit.vzoMax, 2) + ' m/s (normativo: ' + F.num(lim.valor, 2) + ' m/s)', valor: crit.vzoMax, unidade: 'm/s', casas: 2, fonte: 'Critério de projeto' });
    } else {
      g.vzoLim = { valor: lim.valor, fonte: lim.fonte, clausula: lim.clausula, normativo: lim, semLimite: lim.semLimite, alerta: lim.alerta };
    }
    return g;
  }

  D.motor.ar = { rho: rho, ambiente: ambiente, umidade: umidade, pws: pws };
})(window.Difusores);

<script>
/* ==== js/motor/acustica.js ==== */
/* Acústica: potência sonora TROX (LN) → nível de pressão no ambiente. */
(function (D) {
  'use strict';
  var F = D.util.fmt;

  /* Atenuação natural do ambiente — modelo do gráfico C2-005 pág. 5. */
  function atenuacao(dist, volume, tratamento, r) {
    var g = D.dados.trox.graficos.atenuacao;
    var fv = D.dados.trox.graficos.fatorVolume[tratamento] || 1;
    var Vl = volume * fv;
    var R = g.c * Math.pow(Vl, 2 / 3);
    var termo = g.Q / (4 * Math.PI * dist * dist) + 4 / R;
    var A = -10 * Math.log10(termo);
    if (r) {
      r.passo({ grupo: 'acustica', titulo: 'Volume acústico equivalente', formula: "V' = V · f_trat", subst: "V' = " + F.num(volume, 1) + ' · ' + F.num(fv, 1) + ' (' + tratamento + ')', valor: Vl, unidade: 'm³', casas: 1, fonte: 'TROX C2-005 pág. 5 (normal ×1; ressonante ×0,5; muita absorção ×2)' });
      r.passo({
        grupo: 'acustica', titulo: 'Atenuação natural do ambiente',
        formula: "A = −10 · log₁₀[ 2/(4π·r²) + 4/(0,732 · V'^(2/3)) ]",
        subst: 'A = −10 · log₁₀[ 2/(4π·' + F.num(dist, 2) + '²) + 4/(0,732 · ' + F.num(Vl, 1) + '^(2/3)) ]',
        valor: A, unidade: 'dB(A)', casas: 1,
        fonte: g.fonte + ' — modelo ajustado ao gráfico, erro ' + g.erro
      });
      if (dist < g.faixaR[0] || dist > g.faixaR[1] || Vl < g.faixaV[0] || Vl > g.faixaV[1]) {
        r.estimado("Atenuação do ambiente fora da faixa do gráfico TROX (r = 0,7–5 m; V' = 20–2000 m³)");
      }
    }
    return A;
  }

  /* Soma de n fontes iguais e desconto da atenuação. */
  function pressaoAmbiente(LN, n, A, r, rotulo) {
    var soma = 10 * Math.log10(n);
    var Lp = LN + soma - A;
    if (r) r.passo({
      grupo: 'acustica', titulo: 'Nível de pressão sonora no ambiente' + (rotulo ? ' — ' + rotulo : ''),
      formula: 'Lp = LN + 10·log₁₀(n) − A',
      subst: 'Lp = ' + F.num(LN, 1) + ' + 10·log₁₀(' + n + ') − ' + F.num(A, 1),
      valor: Lp, unidade: 'dB(A)', casas: 1,
      fonte: 'TROX C2-005 pág. 5 (LN é potência sonora; subtrair a atenuação do ambiente); soma de fontes iguais'
    });
    return Lp;
  }

  /* Soma logarítmica de dois níveis de pressão sonora (insuflamento + retorno no mesmo ambiente). */
  function somaNiveis(L1, L2, r) {
    var Lt = 10 * Math.log10(Math.pow(10, L1 / 10) + Math.pow(10, L2 / 10));
    if (r) r.passo({
      grupo: 'acustica', titulo: 'Nível de pressão sonora somado — insuflamento + retorno',
      formula: 'Lp,total = 10·log₁₀(10^(Lp,ins/10) + 10^(Lp,ret/10))',
      subst: 'Lp,total = 10·log₁₀(10^(' + F.num(L1, 1) + '/10) + 10^(' + F.num(L2, 1) + '/10))',
      valor: Lt, unidade: 'dB(A)', casas: 1,
      fonte: 'Soma de fontes sonoras incoerentes (energia); limite do ambiente: ABNT NBR 10152:2017, Tabela 3'
    });
    return Lt;
  }

  D.motor.acustica = { atenuacao: atenuacao, pressaoAmbiente: pressaoAmbiente, somaNiveis: somaNiveis };
})(window.Difusores);

</script>
<script>

/* Alcance, comprimento característico L e velocidade na zona ocupada. */
(function (D) {
  'use strict';
  var F = D.util.fmt;
  var NOMES = { '+x': 'direção +x (comprimento)', '-x': 'direção −x (comprimento)', '+y': 'direção +y (largura)', '-y': 'direção −y (largura)' };
  var PAREDE = { '+x': 'parede x = C', '-x': 'parede x = 0', '+y': 'parede y = L', '-y': 'parede y = 0' };

  /* L por direção de cada terminal: distância à parede ou fração da distância
   * ao terminal à frente (plano de encontro dos jatos) — ASHRAE Fundamentals cap. 20. */
  function direcoes(pos, C, W, dirs, fracao) {
    if (fracao === undefined) fracao = 0.5;
    return pos.map(function (p, i) {

    var f = fA(b.fam, At), L = dist + H1, v = b.kv * f / L, notas = [];

    if (r) notas.forEach(function (n) { r.estimado('Velocidade na parede: ' + n); });
    if (r) r.passo({ grupo: 'zona', titulo: (entreFileiras ? 'Velocidade no plano médio entre fileiras' : 'Velocidade do jato junto à parede, ao entrar na zona ocupada') + ' — ' + rotulo,
      formula: 'v_L = (v_L·L) · f_A / L ;  L = ' + (entreFileiras ? 'B/2' : 'X') + ' + H1', subst: 'v_L = ' + F.num(b.kv, 3) + ' · ' + F.num(f, 2) + ' / (' + F.num(dist, 2) + ' + ' + F.num(H1, 2) + ')' + (isFinite(At) ? ' ; A = ' + F.num(At, 2) + ' m' : ' ; sem vizinho na fileira'), valor: v, unidade: 'm/s', casas: 3,

  function fH1(ref, max, exp, H1, notas) {
    var h = H1;
    if (H1 > max) { h = max; notas.push('H1 = ' + F.num(H1, 2) + ' m acima do diagrama (máx. ' + F.num(max, 1) + ' m): usado o valor em ' + F.num(max, 1) + ' m (limite superior)'); }

  /* Velocidade entre dois difusores vizinhos à distância A, na profundidade H1 (diagramas v_H1).

  function vEntre(b, A, B, H1, r, rotulo) {

    if (fam.vh1Lei) { // VD: faixa 0,15–0,30 m/s dos diagramas 9/11/13/15, interpolada/extrapolada em log
      var l = fam.vh1Lei, Ac = A;

      det = 'v = ' + F.num(t.c * 1e4, 2) + '·10⁻⁴ · ' + F.num(b.V, 0) + '^1,2 · (' + F.num(Ac, 2) + '/2)^−1,2 · ' + F.num(fh, 3) + ' · ' + F.num(b.fm, 2);

      if (multi && (B < fam.bMulti[0] - 1e-9 || B > fam.bMulti[1] + 1e-9)) notas.push('Distância entre fileiras B = ' + F.num(B, 2) + ' m fora da faixa do diagrama de várias fileiras (' + F.num(fam.bMulti[0], 1) + '–' + F.num(fam.bMulti[1], 1) + ' m)');
      if (A < grade[0] - 1e-9) notas.push('Espaçamento ' + F.num(A, 2) + ' m menor que o mínimo do diagrama (' + F.num(grade[0], 1) + ' m): usado o valor do extremo');

    }
    if (r) {
      r.passo({ grupo: 'zona', titulo: 'Velocidade entre dois difusores (v_H1) — ' + rotulo, formula: 'v_H1 = f(V, A, H1) — ' + nomeDiag, subst: det + ' ; A = ' + F.num(A, 2) + ' m' + (isFinite(B) ? ', B = ' + F.num(B, 2) + ' m' : '') + ', H1 = ' + F.num(H1, 2) + ' m', valor: v, unidade: 'm/s', casas: 3,
        fonte: 'TROX ' + fam.fonte + ', ' + fam.pagJato + ' — ' + b.famId + ' ' + t.rotulo + (t.pag ? ' (pág. ' + t.pag + ')' : '') + '; ' + fam.notaMontagem });
      notas.forEach(function (n) { r.estimado('Velocidade entre difusores: ' + n); });
    }
    return { v: v, notas: notas };
  }

  D.motor.altaInducao = { familia: familia, terminal: terminal, fA: fA, transversal: transversal, vParede: vParede, vEntre: vEntre, interp: interp, ENT: ENT };
})(window.Difusores);

<script>
/* ==== js/motor/verificacoes.js ==== */
/* Verificações normativas: cada item traz critério, valor, limite, folga,
 * situação (atende / alerta / reprova / na) e norma de origem. */
(function (D) {
  'use strict';
  var F = D.util.fmt;

  /* Monta um item de verificação.
   * o = { id, criterio, valor, limite, tipo: 'max'|'min'|'faixa', min, max,
   *       casas, unidade, falha: 'reprova'|'alerta', fonte, obs } */
  function item(o) {
    var sit = 'atende', folga = null, lim = '';
    var casas = o.casas === undefined ? 2 : o.casas, u = o.unidade || '';
    if (o.valor === null || o.valor === undefined || isNaN(o.valor)) {
      sit = 'na';
    } else if (o.tipo === 'max') {
      lim = '≤ ' + F.numU(o.limite, casas, u);
      folga = (o.limite - o.valor) / Math.abs(o.limite || 1);
      if (o.valor > o.limite + 1e-12) sit = o.falha || 'reprova';
    } else if (o.tipo === 'min') {
      lim = '≥ ' + F.numU(o.limite, casas, u);
      folga = (o.valor - o.limite) / Math.abs(o.limite || 1);
      if (o.valor < o.limite - 1e-12) sit = o.falha || 'reprova';
    } else if (o.tipo === 'faixa') {
      lim = F.num(o.min, casas) + ' a ' + F.numU(o.max, casas, u);
      if (o.valor > o.max + 1e-12) sit = o.falhaAcima || o.falha || 'reprova';
      else if (o.valor < o.min - 1e-12) sit = o.falhaAbaixo || o.falha || 'alerta';
    } else if (o.tipo === 'info') {
      sit = o.situacao || 'alerta';
      lim = o.limiteTxt || '';
    }
    return {
      id: o.id, criterio: o.criterio, valor: o.valor, valorTxt: o.valorTxt || (o.valor == null ? '—' : F.numU(o.valor, casas, u)),
      limiteTxt: o.limiteTxt || lim, folga: folga, situacao: sit, fonte: o.fonte || '', obs: o.obs || ''
    };
  }

  function resumo(lista) {
    var r = { reprova: [], alerta: [], atende: [], na: [] };
    lista.forEach(function (v) { (r[v.situacao] || r.na).push(v); });
    return r;
  }

  D.motor.verificacoes = { item: item, resumo: resumo };
})(window.Difusores);

</script>
<script>
/* ==== js/motor/indice.js ==== */
/* Índice global (0–100), fatores e selo — metodologia de referência, seção 9,
 * com as parcelas revistas para privilegiar soluções de engenharia:
 * - zona ocupada: pontuação cheia com folga de 25 % em relação ao limite (não premia v → 0);
 * - velocidade na boca: neutra entre a mínima e o máximo da aplicação (v2.1.2, item B3);
 * - economia de peças relativa à área do ambiente;
 * - retorno: distribuição (mínimo, fragmentação, cobertura, grelhas vazias) e curto-circuito;
 *   velocidade de face com nota cheia numa faixa (v2.1.2, item A4).
 * Ordem do insuflamento (v2.1.2, item A1): entre candidatos a poucos pontos do líder vence o de menos
 * peças, desde que não tenha mais alertas que o líder. As folgas que dão a parcela cheia, a faixa do
 * desempate e os fatores são números de config.js.
 * v2.1.3 (quadro de 2026-10-07, critério do app, sem norma): peso do T50/L 20 e das peças 20 (as faixas de
 * T50/L só têm fonte secundária e a seleção da TROX não usa T50/L); faixa do desempate de 5 pontos; o alerta
 * de corrente de ar (id draft) não conta na guarda do desempate, porque o limite que vale é o de velocidade da
 * NBR 16401-2:2024, 6.3.2.4 (segue no fator de 3 % por alerta); acima do máximo da faixa de T50/L a nota cai

  'use strict';
  var F = D.util.fmt;

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  // Limite de cima do T50/L para a nota e para o alerta: máximo da faixa ÷ t50LReducaoZona4 (sem o número: o próprio máximo)
  function limSupT50L(faixa) {
    var k = D.motor.config.indice.t50LReducaoZona4;

  }

  // Aderência à faixa recomendada de T50/L (Titus 2018, Tabela 4, fonte secundária): 1 no ótimo, 0,5 nas bordas, 0 abaixo do mínimo;

    return 'aprovado';

  /* fEst: fator de "dado estimado" (1 = a marca fica só no selo, sem mexer na nota) */
  function aplicarFatores(base, verifs, marcas, cfg, parcelas, fEst) {

    if (verifs.some(function (v) { return v.situacao === 'reprova'; })) { total *= cfg.fatorReprova; fatores.push({ nome: 'Reprovação em verificação', fator: cfg.fatorReprova }); }

  /* m: métricas do candidato de insuflamento; ctx: contexto do ambiente (dbaMax, dpMax, vzoMax, area) */

    var cfg = D.motor.config.indice, c = D.motor.config, p = [];
    var w = cfg.pesosInsuflamento;
    // T50/L nos dois eixos: vale a pior aderência entre a razão mínima e a máxima

    var f1 = m.altaInducao ? cfg.t50LAltaInducao : (fMin === null || fMax === null ? null : Math.min(fMin, fMax));
    p.push({ nome: 'Aderência T50/L à faixa recomendada', max: w.t50L, f: f1 === null ? 0.5 : f1, det: m.altaInducao ? 'alta indução: ADPI × T50/L não tabelado para jato rotacional — nota fixa ' + F.num(cfg.t50LAltaInducao, 2) + ' (a distribuição é verificada por v_L e v_H1 do catálogo)' : m.t50L == null ? 'sem valor — neutro' : 'T50/L = ' + F.num(m.t50L, 2) + (Math.abs(tMax - m.t50L) > 1e-9 ? ' a ' + F.num(tMax, 2) + ' (menor e maior entre as direções; vale a pior aderência)' : '') + ' (faixa ' + F.num(m.faixaT50L.min, 1) + '–' + F.num(m.faixaT50L.max, 1) + ', ótimo ' + F.num(m.faixaT50L.otimo, 1) + (limSupT50L(m.faixaT50L) > m.faixaT50L.max ? '; acima do máximo a nota cai de 0,5 a 0 até ' + F.num(limSupT50L(m.faixaT50L), 2) : '') + ')' });
    var fa = clamp((ctx.dbaMax - m.lp) / cfg.folgaAcustica, 0, 1);
    p.push({ nome: 'Folga acústica', max: w.acustica, f: fa, det: 'Lp = ' + F.num(m.lp, 1) + ' dB(A) × limite ' + F.num(ctx.dbaMax, 0) + ' dB(A) (1,0 com ' + F.num(cfg.folgaAcustica, 0) + ' dB de folga)' });
    var fd = clamp((1 - m.dp / ctx.dpMax) / cfg.folgaDp, 0, 1);
    p.push({ nome: 'Folga de perda de carga', max: w.dp, f: fd, det: 'Δp = ' + F.num(m.dp, 2) + ' × limite ' + F.num(ctx.dpMax, 2) + ' mmCA' + (cfg.folgaDp < 1 ? ' (1,0 até ' + F.num((1 - cfg.folgaDp) * 100, 0) + ' % do limite)' : '') });
    var mz = cfg.margemZona, fz = m.alturaOk ? clamp((ctx.vzoMax - m.vzo) / (mz * ctx.vzoMax), 0, 1) : 0;
    p.push({ nome: 'Zona ocupada e altura', max: w.zona, f: fz, det: 'v_zo = ' + F.num(m.vzo, 2) + ' × limite ' + F.num(ctx.vzoMax, 2) + ' m/s (1,0 até ' + F.num((1 - mz) * 100, 0) + ' % do limite, 0 no limite); alcance ' + (m.alturaOk ? 'dentro' : 'fora') + ' do limite de altura' });
    var cl = m.faixaFace.classe, fc;
    if (m.faixaFace.info) fc = 1; else if (m.vFace == null) fc = 0.5; else if (m.vFace >= cl.min && m.vFace <= cl.max) fc = 1; else if (m.vFace >= m.faixaFace.min && m.vFace < cl.min) fc = 0.5; else fc = 0;

    if (neutra && m.vFace != null && m.vFace >= m.faixaFace.min && m.vFace <= cl.max) fc = 1;
    p.push({ nome: 'Velocidade efetiva na boca (prática de projeto)', max: w.velocidade, f: fc, det: m.faixaFace.info ? 'alta indução: vazão dentro da faixa do catálogo (seleção pelo fabricante — NBR 16401-1, 9.2.1)' : m.vFace == null ? 'não avaliada' : F.num(m.vFace, 2) + ' m/s; faixa da aplicação ' + F.num(cl.min, 1) + '–' + F.num(cl.max, 1) + ' m/s (' + (neutra ? '1,0 entre ' + F.num(m.faixaFace.min, 1) + ' m/s e o máximo da aplicação; 0 fora' : '1,0 dentro; 0,5 abaixo, até ' + F.num(m.faixaFace.min, 1) + ' m/s; 0 fora') + ')' });
    var nRef = Math.max(1, Math.ceil((ctx.area || 0) / c.arranjo.areaRefPorDifusor)), fp = m.n <= nRef ? 1 : nRef / m.n;
    p.push({ nome: 'Economia de peças', max: w.pecas, f: fp, det: m.n + ' peça(s); referência ' + nRef + ' (1 difusor por ' + c.arranjo.areaRefPorDifusor + ' m²): 1,0 até a referência, depois n_ref/n' });
    return fechar(p, verifs, marcas, cfg, cfg.fatorEstimadoInsuflamento);
  }

  /* Retorno: sem "economia de peças"; entram distribuição e afastamento dos jatos. */
  function retorno(m, ctx, verifs, marcas) {
    var cfg = D.motor.config.indice, cr = D.motor.config.retorno, p = [], w = cfg.pesosRetorno;
    p.push({ nome: 'Folga acústica', max: w.acustica, f: clamp((ctx.dbaMax - m.lp) / 10, 0, 1), det: 'Lp = ' + F.num(m.lp, 1) + ' dB(A) × limite ' + F.num(ctx.dbaMax, 0) + ' dB(A) (1,0 com 10 dB de folga)' });
    p.push({ nome: 'Folga de perda de carga', max: w.dp, f: clamp(1 - m.dp / ctx.dpMax, 0, 1), det: 'Δp = ' + F.num(m.dp, 2) + ' × limite ' + F.num(ctx.dpMax, 2) + ' mmCA' });
    var vmax = m.faixaFace.max, fv = m.vFace <= 0.75 * vmax ? 1 : (m.vFace <= vmax ? 1 - 0.5 * (m.vFace - 0.75 * vmax) / (0.25 * vmax) : 0);
    if (m.faixaFace.min !== undefined && m.vFace < m.faixaFace.min) fv = 0.5;
    // retorno acima da zona ocupada: nota cheia dentro da faixa; abaixo cai em proporção (grelha grande demais)
    var fx = cfg.retornoFaixaCheia, naFaixa = !!fx && m.faixaFace.min === undefined;
    if (naFaixa) fv = m.vFace < fx.min ? m.vFace / fx.min : (m.vFace <= fx.max ? 1 : (m.vFace <= vmax ? 1 - 0.5 * (m.vFace - fx.max) / (vmax - fx.max) : 0));
    p.push({ nome: 'Velocidade de face moderada (ruído e pressão)', max: w.velocidade, f: fv, det: F.num(m.vFace, 2) + ' m/s × recomendado ≤ ' + F.num(vmax, 1) + ' m/s (' + (naFaixa ? '1,0 entre ' + F.num(fx.min, 1) + ' e ' + F.num(fx.max, 1) + ' m/s; abaixo, em proporção' : '1,0 até 75 % do máximo') + ')' });
    var fd = Math.min(1, m.n / m.nMin), extra = Math.max(0, m.n - m.nMin), det = m.n + ' grelha(s), mínimo ' + m.nMin;
    if (extra) { fd *= 1 / (1 + cr.penalGrelhaExtra * extra); det += ' (+' + extra + ' além do mínimo: fragmentação)'; }
    if (m.maxDist != null) { fd *= Math.min(1, m.dMax / m.maxDist); det += '; difusor mais afastado a ' + F.num(m.maxDist, 1) + ' m (limite ' + F.num(m.dMax, 1) + ')'; }

    if (vazias) { fd *= Math.pow(0.8, vazias); det += '; ' + vazias + ' grelha(s) sem difusor atendido'; }
    if (m.modularPenal) { fd *= cr.penalNaoModular; det += '; tamanho não modular'; }
    p.push({ nome: 'Distribuição das grelhas', max: w.distribuicao, f: fd, det: det });
    var fc = m.vJato <= 0.125 ? 1 : clamp(1 - (m.vJato - 0.125) / (m.vReprova - 0.125), 0, 1);
    p.push({ nome: 'Afastamento dos jatos de insuflamento (curto-circuito)', max: w.curto, f: fc, det: 'jato na grelha ' + F.num(m.vJato, 2) + ' m/s (1,0 até 0,125; fim do jato 0,25 m/s; 0 em ' + F.num(m.vReprova, 2) + ')' });

  }

  function fechar(p, verifs, marcas, cfg, fEst) {

    p.forEach(function (x) { x.pts = x.max * x.f; base += x.pts; });

  }

  /* Ordena a lista no lugar. tipo: 'insuflamento' ou 'retorno'.
   * Chave: nota + bônus do selo "aprovado". No insuflamento, com a faixa de desempate ligada, cada uma

/* ==== js/motor/arranjos.js ==== */

 * (O posicionamento das grelhas de retorno está em retorno.js.) */

        if (!(nx === 1 && ny === 1) && (prop < a.proporcaoMin || prop > a.proporcaoMax)) continue;

   * ADE-1: cada linha junto ao início da sua faixa (afastamento a), jato para frente.

<script>
/* ==== js/motor/retorno.js ==== */

 * - campo de velocidade dos jatos de insuflamento no nível do teto (ASHRAE Fundamentals 2021

 * - posicionamento das grelhas fora dos jatos (zonas estagnadas), distribuídas pelos grupos de

<script>

    } else {
      res.alturaOk = res.xMax <= amb.xMaxAltura + 1e-9;

      vs.push(V.item({ id: 'parede', criterio: 'Alcance compatível com o vão (X ≤ 2·L; alerta se X < 0,5·L)', valor: regra75.max, valorTxt: 'X/L máx. ' + F.num(regra75.max, 2) + '; mín. ' + F.num(regra75.min, 2), limiteTxt: '0,5 a 2,0', tipo: 'info', situacao: regra75.max > 2 + 1e-9 ? 'reprova' : (regra75.min < 0.5 ? 'alerta' : 'atende'), fonte: 'Prática de projeto, sem norma (metodologia de referência, seção 6, regra dos 75 %)' }));

    vs.push(V.item({ id: 'registroFech', criterio: 'Registro junto à boca fechado no máximo 50 % do curso', valor: e.crit.registro === '25' ? 75 : (e.crit.registro === '50' ? 50 : 0), valorTxt: e.crit.registro === '25' ? '75 % fechado' : (e.crit.registro === '50' ? '50 % fechado' : 'aberto / sem registro'), limiteTxt: '≤ 50 %', tipo: 'info', situacao: e.crit.registro === '25' ? 'alerta' : 'atende', fonte: 'ABNT NBR 16401-1:2024, 10.6.2 (ruído difícil de controlar)' }));
    var dtOk = !fam.dtValido || (amb.dT >= 0 ? amb.dT <= fam.dtValido.resfriamento : -amb.dT <= fam.dtValido.aquecimento);
    vs.push(V.item({ id: 'dt', criterio: 'ΔT dentro da validade do catálogo TROX', valor: amb.dT, valorTxt: F.num(amb.dT, 1) + ' °C', limiteTxt: fam.dtValido ? '−' + fam.dtValido.resfriamento + ' a +' + fam.dtValido.aquecimento + ' °C (Δtz)' : '—', tipo: 'info', situacao: dtOk ? 'atende' : 'alerta', fonte: ai ? 'TROX ' + ai.fonte : 'TROX C2-005 págs. 2–3' }));

    } else vs.push(V.item({ id: 'pedireito', criterio: 'Altura de instalação compatível com a condição de ensaio (3 m)', valor: amb.Hinst, valorTxt: F.num(amb.Hinst, 2) + ' m', limiteTxt: fam3 ? '3,0 m ± ' + F.num(cfg().peDireitoTolerancia, 1) : '—', tipo: 'info', situacao: !fam3 || Math.abs(amb.Hinst - fam3) <= cfg().peDireitoTolerancia ? 'atende' : 'alerta', fonte: 'TROX ' + (cand.familia === 'ADLR' ? 'C2-006' : 'C2-007') + ' (nota das tabelas)' }));

  /* ---------- enumeração de candidatos de insuflamento ---------- */
  function candidatosInsuflamento(e, amb) {
    var out = [], c = cfg();
    var fams = e.familias || {};
    var grades = D.motor.arranjos.grades(amb.C, amb.W, c);
    if (fams.ADLQ) grades.forEach(function (g) { Object.keys(D.dados.trox.ADLQ.tamanhos).forEach(function (t) { out.push({ familia: 'ADLQ', tam: +t, arranjo: g }); }); });
    if (fams.ADLR) grades.forEach(function (g) { Object.keys(D.dados.trox.ADLR.tamanhos).forEach(function (t) { out.push({ familia: 'ADLR', tam: +t, arranjo: g }); }); });
    ['VD', 'FD', 'VDW'].forEach(function (f) {
      var fa = D.motor.altaInducao.familia(f);
      if (fams[f] && fa) grades.forEach(function (g) { Object.keys(fa.tamanhos).forEach(function (t) { out.push({ familia: f, tam: t, arranjo: g }); }); });
    });
    T.familiasTeste().forEach(function (f) { // só existem quando registradas por testes.js
      if (fams[f]) grades.forEach(function (g) { Object.keys(T.familiaTeste(f).tamanhos).forEach(function (t) { out.push({ familia: f, tam: t, arranjo: g }); }); });
    });
    var ade = D.dados.trox.ADE, comps = ade.comprimentos.concat([1500, 2000]);
    ['ADE-1', 'ADE-2'].forEach(function (variante) {
      if (!fams[variante === 'ADE-1' ? 'ADE1' : 'ADE2']) return;
      var abs = Object.keys(ade.alturas[variante === 'ADE-1' ? 'ade1' : 'ade2']).map(Number);
      comps.forEach(function (comp) {
        D.motor.arranjos.linhasLineares(amb.C, amb.W, variante, comp, c).forEach(function (arr) {
          abs.forEach(function (ab) { out.push({ familia: 'ADE', variante: variante, ab: ab, comp: comp, arranjo: arr }); });
        });
      });
    });
    return out;
  }

  /* ---------- retorno ---------- */
  function contextoRetorno(e, amb, sup) {
    var c = cfg(), posicao = e.retorno.posicao || 'forro';
    var ctx = { sup: sup, posicao: posicao, altoNivel: retornoAlto(e), campo: RT.campoJato(sup), cache: {} };
    ctx.cand = RT.candidatos(amb, posicao, c);
    ctx.cand.forEach(function (p) { p.v = ctx.altoNivel ? ctx.campo(p) : 0; });
    ctx.posicoes = function (n) { if (!ctx.cache[n]) ctx.cache[n] = RT.posicionar(n, sup, amb, posicao, c, ctx.cand); return ctx.cache[n]; };
    var nDif = sup ? sup.n : 0;
    ctx.nDif = nDif;
    ctx.nMinDif = nDif ? Math.ceil(nDif / c.retorno.difusoresPorGrelha) : 1;
    ctx.nMinArea = c.retorno.areaMaxPorGrelha > 0 ? Math.ceil(amb.area / c.retorno.areaMaxPorGrelha) : 1;
    ctx.nMinRegra = Math.max(1, ctx.nMinDif, ctx.nMinArea);
    ctx.nMin = Math.min(ctx.nMinRegra, c.retorno.maxPecas); // acima do máximo configurado: alerta, não reprovação em massa
    ctx.nRecMax = Math.max(ctx.nMin, nDif || 1);
    return ctx;
  }

  function avaliarRetorno(cand, e, amb, ctx, completo, posManual) {
    var r = completo ? new Rastro() : new RastroLeve();
    var base = D.dados.trox.grelhasRetorno, n = cand.n, Qp = amb.Qret / n, c = cfg().retorno;
    var HL = cand.chave.split('x'), H = +HL[0], L = +HL[1];
    var res = { cand: cand, n: n, rastro: r, verifs: [], Qp: Qp, H: H, L: L };
    r.passo({ grupo: 'produto', titulo: 'Vazão por grelha', formula: 'Q_p = Q_r / n', subst: 'Q_p = ' + F.num(amb.Qret, 0) + ' / ' + n, valor: Qp, unidade: 'm³/h', casas: 0, fonte: 'Arranjo de retorno com ' + n + ' grelha(s)' });
    var t = T.grelha(cand.familia, cand.chave, Qp, r);
    if (!t) return null;
    res.dp = t.dp; res.ln = t.ln; res.fonte = t.fonte;

    res.areaBruta = areaBruta;
    res.vFace = Qp / 3600 / areaBruta;
    r.passo({ grupo: 'produto', titulo: 'Velocidade de face (área bruta)', formula: 'v_f = Q_p / (3600 · H · L)', subst: 'v_f = ' + F.num(Qp, 0) + ' / (3600 · ' + F.num(areaBruta, 4) + ')', valor: res.vFace, unidade: 'm/s', casas: 2, fonte: 'Continuidade sobre a área nominal H×L (a TROX não publica a área efetiva das grelhas)' });
    var pos = ctx.posicao, faixa = D.dados.normas.bocas.retornoFace[pos];

    var dist = ctx.altoNivel ? Math.max(0.7, amb.Hinst - cfg().alturaOuvido) : 1.0;
    r.passo({ grupo: 'acustica', titulo: 'Distância da grelha ao ouvinte', formula: '—', subst: 'r = ' + F.num(dist, 2) + ' m (' + faixa.nome + ')', valor: dist, unidade: 'm', casas: 2, fonte: 'Posição da grelha' });
    var At = D.motor.acustica.atenuacao(dist, amb.volume, e.crit.tratamento || 'normal', r);
    res.lp = D.motor.acustica.pressaoAmbiente(res.ln, n, At, r, 'retorno');
    // insuflamento e retorno soam ao mesmo tempo: o nível do ambiente é a soma das duas parcelas
    res.lpSup = ctx.sup && ctx.sup.lp != null && !isNaN(ctx.sup.lp) ? ctx.sup.lp : null;

    // posições e métricas de distribuição
    res.pos = posManual || ctx.posicoes(n);

    res.maxDist = m.maxDist; res.vJato = m.vJato; res.grupos = m.grupos; res.espMin = m.espMin;
