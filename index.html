    res.areaPorGrelha = amb.area / n;
    res.modularPenal = !!(e.retorno.modular && c.modularPreferidos.indexOf(cand.chave) < 0);
    r.passo({ grupo: 'produto', titulo: 'Número mínimo de grelhas (distribuição do retorno)', formula: 'n_mín = máx(1; ⌈n_dif / ' + c.difusoresPorGrelha + '⌉; ⌈A / ' + c.areaMaxPorGrelha + ' m²⌉)', subst: 'n_mín = máx(1; ⌈' + ctx.nDif + '/' + c.difusoresPorGrelha + '⌉ = ' + ctx.nMinDif + '; ⌈' + F.num(amb.area, 0) + '/' + c.areaMaxPorGrelha + '⌉ = ' + ctx.nMinArea + ')', valor: ctx.nMin, unidade: 'grelhas', casas: 0, fonte: 'Regra de projeto (decisão do projetista); NBR 16401-1:2024, 9.1.2 (evitar curto-circuito), 10.1.2 e 10.6.2 (balanceamento por ramal)' });
    r.passo({ grupo: 'produto', titulo: 'Posição das grelhas', formula: 'pontos de menor velocidade de jato, distribuídos pelos grupos de difusores', subst: res.pos.map(function (p, i) { return 'R' + (i + 1) + ' (' + F.num(p.x, 2) + '; ' + F.num(p.y, 2) + ')'; }).join('; ') + (posManual ? ' — ajustadas manualmente' : ''), valor: null, fonte: 'ASHRAE Fundamentals 2021 cap. 20 (zona 4: fim do jato a 0,25 m/s); NBR 16401-1:2024, 9.1.2' });
    if (m.maxDist != null) r.passo({ grupo: 'produto', titulo: 'Difusor mais afastado da grelha mais próxima', formula: 'máx_i mín_j dist(difusor_i, grelha_j)', subst: 'd_máx = ' + F.num(m.maxDist, 2) + ' m; difusores por grelha: ' + m.grupos.join(' / '), valor: m.maxDist, unidade: 'm', casas: 2, fonte: 'Regra de projeto (cobertura do retorno)' });
    if (ctx.altoNivel && ctx.sup) r.passo({ grupo: 'produto', titulo: 'Velocidade do jato de insuflamento na posição da grelha (pior caso)', formula: 'v = v_t · X_vt / dist  (Eq. 4, por setor de descarga)', subst: 'v_jato = ' + F.num(m.vJato, 3) + ' m/s' + (m.iPior >= 0 ? ' (grelha R' + (m.iPior + 1) + ')' : ''), valor: m.vJato, unidade: 'm/s', casas: 2, fonte: 'ASHRAE Fundamentals 2021 cap. 20, Eq. (4) e zona 4; NBR 16401-1:2024, 9.1.2' });
    var ezRes = N.ez({ aquecimento: amb.dT < 0, dT: Math.abs(amb.dT), retornoAlto: ctx.altoNivel, v14: ctx.sup ? ctx.sup.v14 : null }, r);
    res.ez = ezRes;

    // verificações

    if (res.lpTotal !== null) vs.push(V.item({ id: 'acusticaTotal', criterio: 'Nível sonoro somado de insuflamento e retorno (' + lim.rotulo + ')', valor: res.lpTotal, limite: e.crit.dbaMax, tipo: 'max', casas: 1, unidade: 'dB(A)', fonte: lim.fonte + '; soma logarítmica de duas fontes', obs: 'Insuflamento ' + F.num(res.lpSup, 1) + ' + retorno ' + F.num(res.lp, 1) + ' dB(A); cada parcela no ponto mais desfavorável (ouvinte sob o terminal), a favor da segurança' }));
    vs.push(V.item({ id: 'dp', criterio: 'Perda de carga', valor: res.dp, limite: e.crit.dpMax, tipo: 'max', casas: 2, unidade: 'mmCA', fonte: 'Limite de projeto' }));
    if (faixa.min !== undefined) vs.push(V.item({ id: 'face', criterio: 'Velocidade de face recomendada — ' + faixa.nome, valor: res.vFace, min: faixa.min, max: faixa.max, tipo: 'faixa', casas: 2, unidade: 'm/s', falhaAcima: 'reprova', falhaAbaixo: 'alerta', fonte: D.dados.normas.bocas.retornoFace.fonte }));
    else vs.push(V.item({ id: 'face', criterio: 'Velocidade de face recomendada — ' + faixa.nome, valor: res.vFace, limite: faixa.max, tipo: 'max', casas: 2, unidade: 'm/s', falha: 'alerta', fonte: D.dados.normas.bocas.retornoFace.fonte, obs: faixa.nota }));
    vs.push(V.item({ id: 'nGrelhas', criterio: 'Número de grelhas ≥ mínimo (1 por ' + c.difusoresPorGrelha + ' difusores; ' + c.areaMaxPorGrelha + ' m² por grelha)', valor: n, limite: ctx.nMin, tipo: 'min', casas: 0, unidade: '', fonte: 'Regra de projeto; NBR 16401-1:2024, 9.1.2, 10.1.2 e 10.6.2', obs: F.num(res.areaPorGrelha, 0) + ' m² por grelha; ' + ctx.nDif + ' difusor(es)' }));
    if (ctx.nMinRegra > ctx.nMin) r.alerta('A regra de distribuição pede ' + ctx.nMinRegra + ' grelhas, acima do máximo configurado (' + c.maxPecas + '): aumente "Máximo de grelhas" em Projeto, Mais opções, ou divida o retorno');
    if (m.maxDist != null) vs.push(V.item({ id: 'distMax', criterio: 'Difusor mais afastado a ≤ ' + F.num(c.distMaxDifusor, 0) + ' m da grelha mais próxima', valor: m.maxDist, limite: c.distMaxDifusor, tipo: 'max', casas: 2, unidade: 'm', falha: 'alerta', fonte: 'Regra de projeto (cobertura do retorno; caminhos de ar semelhantes)' }));
    if (n > 1.5 * ctx.nRecMax) vs.push(V.item({ id: 'fragment', criterio: 'Número de grelhas excessivo (fragmentação do retorno)', valor: n, valorTxt: n + ' grelhas', limiteTxt: '≤ ' + Math.floor(1.5 * ctx.nRecMax), tipo: 'info', situacao: 'alerta', fonte: 'Regra de projeto (custo e ramais)' }));

  }

  function candidatosRetorno(e, amb) {
    var out = [], base = D.dados.trox.grelhasRetorno, fams = e.retorno.familias || {};
    Object.keys(base.dados).forEach(function (f) {

<script>
/* ==== js/util/adaptador.js ==== */
/* Adaptador de ambiente (v3.0.0). O projeto novo guarda { projeto, ambientes[] } (formato de arquivo 4); o motor continua
 * recebendo a entrada `e` de um ambiente só, como na v2.1.3. Aqui ficam as duas conversões e o cálculo por ambiente:
 *   ambienteParaEntrada(amb, projeto) → e          o que selecao.selecionar(e) recebe
 *   entradaParaAmbiente(e, original)  → amb        usado ao abrir arquivo (formatos 1 a 3 e validação do 4)
 *   pendencias(e)                     → { campo: texto }   as regras de preenchimento da tela da v2.1.3 (entradas.validar)
 *   calcular(amb, projeto)            → { e, erros, avisos, res, sup, ret }   com memória por entrada + configuração
 * Regras de "acompanha o padrão" (valor vazio no ambiente): zona ocupada = altura da postura; limite de ruído = o da
 * aplicação; temperatura operativa = padrão de dados\normas\nbr16401-1.js; umidade relativa = 50 %.
 * Perda de carga máxima: o ambiente guarda Pa (crit.dpMaxPa); o motor recebe mmCA (crit.dpMax), 1 mmCA = 9,80665 Pa.
 * Nenhum número do motor muda aqui. Sem DOM. */
(function (D) {
  'use strict';
  var PA_POR_MMCA = 9.80665, UR_PADRAO = 50;
  var FAMILIAS = ['ADLQ', 'ADLR', 'ADE1', 'ADE2', 'FD', 'VDW', 'VD'], FAMILIAS_RET = ['AT_VAT', 'AR', 'AGS_T', 'AE'];

  function vazio(v) { return v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v)); }
  function nn(v) { return vazio(v) ? NaN : v; }          // vazio do projeto → NaN, como a tela antiga entregava ao motor
  function nulo(v) { return vazio(v) ? null : v; }       // vazio da entrada → null, que o JSON guarda
  function mapa(o, chaves) { var r = {}; o = o || {}; chaves.forEach(function (k) { r[k] = o[k]; }); return r; }

  function alturaPostura(postura) { var z = D.dados.normas.nbr16401_2.zonaOcupada; return postura === 'sentado' ? z.alturaSentado : z.alturaEmPe; }
  function aplicacao(id) { return D.dados.normas.nbr10152.aplicacoes.filter(function (a) { return a.id === id; })[0] || null; }
  function limiteRuido(id) { var a = aplicacao(id); return a ? a.dba : NaN; }
  function toPadrao(dT) { var ci = D.dados.normas.nbr16401_1.condicoesInternas; return dT < 0 ? ci.toPadraoAquecimento : ci.toPadraoResfriamento; }
  // 9 casas em mmCA devolvem o valor de origem (4 mmCA → 39,2266 Pa → 4 mmCA); 6 casas em Pa deixam o arquivo legível
  function paParaMmca(pa) { return vazio(pa) ? NaN : Math.round(pa / PA_POR_MMCA * 1e9) / 1e9; }
  function mmcaParaPa(mm) { return vazio(mm) ? null : Math.round(mm * PA_POR_MMCA * 1e6) / 1e6; }

  function ambienteParaEntrada(amb, projeto) {
    var g = amb.geo || {}, a = amb.ar || {}, c = amb.crit || {}, r = amb.retorno || {}, p = projeto || {};
    return {
      projeto: { nome: p.nome || '', ambiente: amb.nome || '', responsavel: p.responsavel || '' },
      geo: { C: nn(g.C), W: nn(g.W), H: nn(g.H), Hinst: nn(g.Hinst), zo: vazio(g.zo) ? alturaPostura(g.postura) : g.zo, postura: g.postura, montagem: g.montagem,
        paredesExternas: mapa(g.paredesExternas, ['x0', 'xC', 'y0', 'yW']) },
      ar: { modo: a.modo, Q: nn(a.Q), qs: nn(a.qs), dT: nn(a.dT), to: vazio(a.to) ? toPadrao(a.dT) : a.to, ur: vazio(a.ur) ? UR_PADRAO : a.ur, z: nn(p.altitude) || 0, retornoPct: nn(a.retornoPct) },
      crit: { aplicacao: c.aplicacao, dbaMax: vazio(c.dbaMax) ? limiteRuido(c.aplicacao) : c.dbaMax, dpMax: paParaMmca(c.dpMaxPa), vzoModo: c.vzoModo, vzoMax: nn(c.vzoMax),
        controleLocal: c.controleLocal, registro: c.registro, regulagemRamal: c.regulagemRamal, entradaAI: c.entradaAI, acessorio: c.acessorio, tratamento: c.tratamento },
      retorno: { posicao: r.posicao, tipo: r.tipo, hMax: nulo(r.hMax), lMax: nulo(r.lMax), modular: r.modular, familias: mapa(r.familias, FAMILIAS_RET) },
      familias: mapa(amb.familias, FAMILIAS)
    };
  }

  /* `original`: o ambiente de onde `e` saiu (abertura de arquivo do formato 4). Com ele, a perda de carga em Pa volta
   * como estava gravada, sem passar duas vezes pela conversão de unidade. */
  function entradaParaAmbiente(e, original) {
    var g = e.geo || {}, a = e.ar || {}, c = e.crit || {}, r = e.retorno || {}, oc = (original && original.crit) || {};
    var zo = nulo(g.zo), dba = nulo(c.dbaMax), to = nulo(a.to), ur = nulo(a.ur);
    if (zo !== null && (!(zo > 0) || Math.abs(zo - alturaPostura(g.postura)) <= 1e-6)) zo = null;   // mesma regra da tela da v2.1.3 (zona "automática")
    if (dba !== null && dba === limiteRuido(c.aplicacao)) dba = null;
    if (to !== null && to === toPadrao(a.dT)) to = null;
    if (ur !== null && ur === UR_PADRAO) ur = null;
    var pa = !vazio(oc.dpMaxPa) && paParaMmca(oc.dpMaxPa) === c.dpMax ? oc.dpMaxPa : mmcaParaPa(c.dpMax);
    return {
      nome: (e.projeto && e.projeto.ambiente) || '',
      geo: { C: nulo(g.C), W: nulo(g.W), H: nulo(g.H), Hinst: nulo(g.Hinst), postura: g.postura, zo: zo, montagem: g.montagem, paredesExternas: mapa(g.paredesExternas, ['x0', 'xC', 'y0', 'yW']) },
      ar: { modo: a.modo, Q: nulo(a.Q), qs: nulo(a.qs), dT: nulo(a.dT), to: to, ur: ur, retornoPct: nulo(a.retornoPct) },
      crit: { aplicacao: c.aplicacao, dbaMax: dba, dpMaxPa: pa, vzoModo: c.vzoModo, vzoMax: nulo(c.vzoMax), controleLocal: c.controleLocal, registro: c.registro, regulagemRamal: c.regulagemRamal,
        entradaAI: c.entradaAI, acessorio: c.acessorio, tratamento: c.tratamento },
      retorno: { posicao: r.posicao, tipo: r.tipo, hMax: nulo(r.hMax), lMax: nulo(r.lMax), modular: r.modular, familias: mapa(r.familias, FAMILIAS_RET) },
      familias: mapa(e.familias, FAMILIAS),
      manual: null, manualRet: null
    };
  }

  // Rótulo de cada campo de `e`, para listar o que falta preencher
  var ROTULO = { 'geo.C': 'Comprimento', 'geo.W': 'Largura', 'geo.H': 'Pé-direito', 'geo.Hinst': 'Altura de instalação', 'geo.zo': 'Zona ocupada', 'ar.Q': 'Vazão total de insuflamento',
    'ar.qs': 'Calor sensível do ambiente', 'ar.dT': 'ΔT de insuflamento', 'ar.to': 'Temperatura operativa de projeto', 'ar.ur': 'Umidade relativa do ambiente', 'ar.retornoPct': 'Vazão de retorno',
    'crit.dbaMax': 'Limite de ruído no ambiente', 'crit.dpMax': 'Perda de carga máxima no difusor', 'crit.vzoOutro': 'Limite de velocidade do ar na zona ocupada', 'familias.ADLQ': 'Famílias de insuflamento' };

  // As mesmas regras e mensagens de entradas.validar (tela da v2.1.3)
  function pendencias(e) {
    var erros = {};
    function req(id, cond, msg) { if (!cond) erros[id] = msg; }
    req('geo.C', e.geo.C > 0, 'Informe o comprimento.'); req('geo.W', e.geo.W > 0, 'Informe a largura.');
    req('geo.H', e.geo.H > 0, 'Informe o pé-direito.');
    req('geo.Hinst', e.geo.Hinst > 0 && e.geo.Hinst <= e.geo.H + 1e-9, 'Deve ser maior que zero e não maior que o pé-direito.');
    req('geo.zo', e.geo.zo > 0 && e.geo.zo < e.geo.Hinst, 'Deve ser menor que a altura de instalação.');
    if (e.ar.modo === 'carga') { req('ar.qs', e.ar.qs > 0, 'Informe o calor sensível do ambiente.'); }
    else req('ar.Q', e.ar.Q > 0, 'Informe a vazão.');
    req('ar.dT', !isNaN(e.ar.dT) && e.ar.dT !== 0, 'Informe o ΔT (diferente de zero).');
    req('ar.to', !isNaN(e.ar.to) && e.ar.to >= 15 && e.ar.to <= 35, 'Informe a temperatura operativa (15 a 35 °C).');
    req('ar.ur', e.ar.ur > 0 && e.ar.ur <= 100, 'Informe a umidade relativa (1 a 100 %).');
    req('ar.retornoPct', e.ar.retornoPct >= 0 && e.ar.retornoPct <= 100, 'Entre 0 e 100%.');
    req('crit.dbaMax', e.crit.dbaMax > 0, 'Informe o limite em dB(A).'); req('crit.dpMax', e.crit.dpMax > 0, 'Informe a Δp máxima.');
    if (e.crit.vzoModo === 'projeto') req('crit.vzoOutro', e.crit.vzoMax > 0, 'Informe a velocidade limite.');
    var fam = e.familias; req('familias.ADLQ', fam.ADLQ || fam.ADLR || fam.ADE1 || fam.ADE2 || fam.FD || fam.VDW || fam.VD, 'Marque pelo menos uma família de insuflamento.');
    return erros;
  }

  /* Cálculo de um ambiente, pelo mesmo caminho de app.recalcular da v2.1.3: pendências de preenchimento, avisos do núcleo
   * (os de nível "erro" impedem o cálculo) e selecao.selecionar. O motor lê D.motor.config: recebe a do projeto antes de cada cálculo. */
  var memoria = {}, ordem = [], MAX_MEMORIA = 40;
  function calcular(amb, projeto) {
    var e = ambienteParaEntrada(amb, projeto), chave = JSON.stringify([e, projeto.config]);
    if (memoria[chave]) return memoria[chave];
    var r = { e: e, erros: pendencias(e), avisos: [], res: null, sup: null, ret: null };
    D.motor.config = projeto.config;
    r.avisos = D.motor.avisos(e);
    r.avisos.forEach(function (a) { if (a.nivel === 'erro' && !r.erros[a.campo]) r.erros[a.campo] = a.texto; });
    if (!Object.keys(r.erros).length) {
      var res = D.motor.selecao.selecionar(e);
      if (res.bloqueado) res.avisos.forEach(function (a) { r.erros[a.campo] = a.texto; });
      else { r.res = res; r.sup = res.insuflamento[0] || null; r.ret = res.retorno[0] || null; }
    }
    memoria[chave] = r; ordem.push(chave);
    if (ordem.length > MAX_MEMORIA) delete memoria[ordem.shift()];
    return r;
  }

  // "4 × ADLQ 500": o mesmo texto da lista de alternativas da v2.1.3
  function rotuloSolucao(s) { return s ? s.n + ' × ' + String(s.modelo).split(' — ')[0] + ' ' + s.dimensao : ''; }

  D.util.adaptador = { ambienteParaEntrada: ambienteParaEntrada, entradaParaAmbiente: entradaParaAmbiente, pendencias: pendencias, calcular: calcular, rotuloSolucao: rotuloSolucao,
    alturaPostura: alturaPostura, aplicacao: aplicacao, limiteRuido: limiteRuido, toPadrao: toPadrao, paParaMmca: paParaMmca, mmcaParaPa: mmcaParaPa,
    ROTULO: ROTULO, FAMILIAS: FAMILIAS, FAMILIAS_RET: FAMILIAS_RET, UR_PADRAO: UR_PADRAO, PA_POR_MMCA: PA_POR_MMCA };
})(window.Difusores);

</script>
<script>
/* ==== js/util/escolha.js ==== */
/* Alternativa adotada e posições ajustadas à mão (v3.0.0, sessão T2). Sem DOM.
 * O ambiente guarda a escolha de quem projeta pela identidade da peça e do arranjo, não pela posição na lista:
 *   amb.manual    = null | { cand: { familia, tam } ou { familia: 'ADE', variante, ab, comp },
 *                            arranjo: { tipo: 'grade', nx, ny } ou { tipo: 'linear', orient, nr, m },
 *                            pos: null | [{ x, y }],            (pos nulo = posições do arranjo)
 *                            seguir: true }                     (só quando a 1ª opção do app foi arrastada sem ser adotada:
 *                                                                as posições valem enquanto ela for a 1ª opção)
 *   amb.manualRet = null | { cand: { familia, chave, n }, pos: null | [{ x, y, parede }] }
 * null = segue a 1ª opção do app. Trocar ou mover o insuflamento refaz o retorno e limpa a escolha de retorno, como na
 * v2.1.3 (o retorno é dimensionado para os jatos do insuflamento adotado).
 * Aqui nenhum número é calculado: tudo vem de D.motor.selecao (candidatosInsuflamento, avaliarInsuflamento,
 * selecionarRetorno, avaliarRetorno) e de D.motor.indice.ordenar, chamados como selecao.selecionar os chama.
 *   resolver(amb, projeto)      → { r, primeira, sup, ret, retLista, totalRetorno, ctxRet, adotada, ajustada, retAdotada, retAjustada, avisos }
 *   listaCompleta(amb, projeto) → todas as combinações viáveis, na ordem do motor (as primeiras são as de selecionar)
 *   equivalentes, melhorPorFamilia, porQuantidade → as listas da tela Seleção
 *   adotar, adotarRet, voltarPrimeira, restaurar, restaurarRet, mover, moverRet → alteram amb.manual e amb.manualRet
 *   deLegado(amb, projeto)      → converte { selSup, pos } e { selRet, pos } dos formatos 1 a 3 */
(function (D) {
  'use strict';
  var AD = D.util.adaptador, SEL = D.motor.selecao;

  function ehObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }
  function inteiro(v) { return typeof v === 'number' && isFinite(v) && v >= 1 && v === Math.floor(v); }
  function comConfig(projeto) { D.motor.config = projeto.config; }   // o motor lê D.motor.config; AD.calcular só a aplica quando calcula de fato

  // ---------------------------------------------------------------- identidade
  function idCand(c) { return c.familia === 'ADE' ? { familia: 'ADE', variante: c.variante, ab: +c.ab, comp: +c.comp } : { familia: c.familia, tam: String(c.tam) }; }
  function idArranjo(a) { return a.tipo === 'linear' ? { tipo: 'linear', orient: a.orient, nr: +a.nr, m: +a.m } : { tipo: 'grade', nx: +a.nx, ny: +a.ny }; }
  function chaveIns(cand) { return { cand: idCand(cand), arranjo: idArranjo(cand.arranjo) }; }      // cand: candidato do motor
  function chaveRet(cand) { return { familia: cand.familia, chave: cand.chave, n: +cand.n }; }
  function sCand(c) { return c.familia === 'ADE' ? ['ADE', c.variante, +c.ab, +c.comp].join('|') : [c.familia, String(c.tam)].join('|'); }
  function sArr(a) { return a.tipo === 'linear' ? ['linear', a.orient, +a.nr, +a.m].join('|') : ['grade', +a.nx, +a.ny].join('|'); }
  function sIns(k) { return sCand(k.cand) + '#' + sArr(k.arranjo); }                               // k: { cand, arranjo } (identidade)
  function sRet(c) { return [c.familia, c.chave, +c.n].join('|'); }
  function familiaDe(cand) { return cand.familia === 'ADE' ? cand.variante : cand.familia; }       // 'ADLQ', 'ADE-1', 'VDW'…

  function posValida(pos, comParede) {
    if (pos === null || pos === undefined) return null;
    if (!Array.isArray(pos) || !pos.length) return undefined;
    var ok = pos.every(function (q) { return ehObj(q) && typeof q.x === 'number' && isFinite(q.x) && typeof q.y === 'number' && isFinite(q.y); });
    if (!ok) return undefined;
    return pos.map(function (q) { var o = { x: q.x, y: q.y }; if (comParede) o.parede = typeof q.parede === 'string' ? q.parede : null; return o; });
  }
  // Registro do arquivo → registro limpo, ou null quando não serve (o chamador avisa)
  function validarIns(m) {
    if (!ehObj(m) || !ehObj(m.cand) || !ehObj(m.arranjo)) return null;
    var c = m.cand, a = m.arranjo, pos = posValida(m.pos, false);
    if (typeof c.familia !== 'string' || pos === undefined) return null;
    if (c.familia === 'ADE') { if (typeof c.variante !== 'string' || !isFinite(+c.ab) || !isFinite(+c.comp)) return null; }
    else if (typeof c.tam !== 'string' && typeof c.tam !== 'number') return null;
    if (a.tipo === 'linear') { if ((a.orient !== 'x' && a.orient !== 'y') || !inteiro(a.nr) || !inteiro(a.m)) return null; }
    else if (a.tipo !== 'grade' || !inteiro(a.nx) || !inteiro(a.ny)) return null;
    var out = { cand: idCand(c), arranjo: idArranjo(a), pos: pos };
    if (m.seguir === true && pos) out.seguir = true;
    return out;
  }
  function validarRet(m) {
    if (!ehObj(m) || !ehObj(m.cand)) return null;
    var c = m.cand, pos = posValida(m.pos, true);
    if (typeof c.familia !== 'string' || typeof c.chave !== 'string' || !inteiro(c.n) || pos === undefined) return null;
    return { cand: chaveRet(c), pos: pos };
  }
  function ehLegado(m, chave) { return ehObj(m) && !ehObj(m.cand) && Object.prototype.hasOwnProperty.call(m, chave); }

  // "ADLQ tam. 8, 3 × 2" a partir da identidade gravada (para os avisos)
  function rotuloIns(k) {
    var c = k.cand, a = k.arranjo;
    return (c.familia === 'ADE' ? c.variante + ' ' + c.ab + ' abertura(s), ' + c.comp + ' mm' : c.familia + ' tam. ' + c.tam) + ', ' +
      (a.tipo === 'linear' ? a.nr + ' linha(s) × ' + a.m + ' peça(s)' : a.nx + ' × ' + a.ny);

  // Cópia do candidato com as posições ajustadas, como app.moverDifusor da v2.1.3
  function candComPos(cand, pos) {
    var arr = {}, c = {};
    Object.keys(cand.arranjo).forEach(function (k) { arr[k] = cand.arranjo[k]; });
    arr.pos = pos.map(function (p) { return { x: p.x, y: p.y }; });
    if (String(arr.descricao).indexOf('ajustado') < 0) arr.descricao += ' (ajustado manualmente)';
    Object.keys(cand).forEach(function (k) { c[k] = cand[k]; });
    c.arranjo = arr;
    return c;
  }

  // ---------------------------------------------------------------- solução adotada de um ambiente
  /* Guarda o resultado no próprio `r` de AD.calcular (que já tem memória por entrada + configuração), por escolha. */
  function resolver(amb, projeto) {
    var r = AD.calcular(amb, projeto), k = JSON.stringify([amb.manual || null, amb.manualRet || null]);

    var v = { r: r, primeira: primeira, sup: primeira, ret: r.ret, retLista: res ? res.retorno : [], totalRetorno: res ? res.totalRetorno : 0, ctxRet: res ? res.ctxRet : null,
      adotada: false, ajustada: false, retAdotada: false, retAjustada: false, avisos: [] };
    if (res && primeira) {

      var e = r.e, a = res.amb, m = validarIns(amb.manual), mr = validarRet(amb.manualRet);
      if (m && m.seguir && sIns(chaveIns(primeira.cand)) !== sIns(m)) {
        v.avisos.push('As posições ajustadas valiam para outra 1ª opção (' + rotuloIns(m) + '): valem as posições do arranjo atual.');
        m = null; mr = null;
      }

        else {

          s = cand ? SEL.avaliarInsuflamento(cand, e, a, true) : null;
        }
        if (!s) v.avisos.push('A alternativa adotada (' + rotuloIns(m) + ') não está mais entre as combinações deste ambiente: vale a 1ª opção do app.');
        else {
          v.adotada = s !== primeira;

            var s2 = m.pos.length === s.n ? SEL.avaliarInsuflamento(candComPos(s.cand, m.pos), e, a, true) : null;

      }

        if (!sr) {

          sr = cr ? SEL.avaliarRetorno(cr, e, a, v.ctxRet, true) : null;
        }
        if (!sr) v.avisos.push('A grelha de retorno adotada (' + rotuloRet(mr.cand) + ') não está mais entre as combinações deste ambiente: vale a 1ª opção de retorno.');
        else {
          v.retAdotada = sRet(sr.cand) !== sRet(v.ret.cand);
          if (mr.pos) {
            var sr2 = mr.pos.length === sr.n ? SEL.avaliarRetorno(sr.cand, e, a, v.ctxRet, true, mr.pos.map(function (p) { return { x: p.x, y: p.y, parede: p.parede || null }; })) : null;
            if (sr2) { sr = sr2; v.retAjustada = true; }
            else v.avisos.push('As posições ajustadas das grelhas não servem mais a esta solução: valem as posições automáticas.');

  // ---------------------------------------------------------------- listas da tela
  /* Todas as combinações viáveis na ordem do motor: os mesmos três passos de selecao.selecionar. Guarda só a do último

    comConfig(projeto);
    var e = r.e, a = r.res.amb, sup = [];
    SEL.candidatosInsuflamento(e, a).forEach(function (c) { var s = SEL.avaliarInsuflamento(c, e, a, false); if (s) sup.push(s); });
    D.motor.indice.ordenar(sup, 'insuflamento');
    ultima = { r: r, lista: sup };
    return sup;
  }

  /* Combinações com nota a até `faixa` pontos da maior nota (a faixa do desempate do índice), na ordem do motor. */
  function equivalentes(amb, projeto, max) {
    var lista = listaCompleta(amb, projeto), d = projeto.config.indice.desempate, faixa = d && d.faixa > 0 ? d.faixa : 0, topo = -Infinity;
    lista.forEach(function (s) { if (s.indice.total > topo) topo = s.indice.total; });

  /* A combinação mais bem colocada de cada família marcada; `s` nulo = nenhuma combinação dentro do catálogo. */

    [['ADLQ', 'ADLQ'], ['ADLR', 'ADLR'], ['ADE1', 'ADE-1'], ['ADE2', 'ADE-2'], ['FD', 'FD'], ['VDW', 'VDW'], ['VD', 'VD']].forEach(function (x) {

  /* "Por que N peças?": o modelo adotado (família e tamanho), uma linha por quantidade viável; em cada quantidade, o

  // ---------------------------------------------------------------- alterações (quem chama grava o projeto)
  function adotar(amb, projeto, cand) {

    amb.manualRet = null;
  }
  function adotarRet(amb, projeto, cand) {
    var v = resolver(amb, projeto), k = chaveRet(cand), prim = v.retLista[0];
    amb.manualRet = prim && sRet(prim.cand) === sRet(k) ? null : { cand: k, pos: null };
  }
  function voltarPrimeira(amb) { amb.manual = null; amb.manualRet = null; }
  function restaurar(amb, projeto) {
    var m = validarIns(amb.manual), r = AD.calcular(amb, projeto);
    amb.manual = m && !m.seguir && !(r.sup && sIns(chaveIns(r.sup.cand)) === sIns(m)) ? { cand: m.cand, arranjo: m.arranjo, pos: null } : null;
    amb.manualRet = null;
  }
  /* Depois de qualquer alteração de entrada ou de configuração: a alternativa adotada fica (se deixar de existir, resolver
   * avisa e volta à 1ª opção); as posições arrastadas são descartadas, porque valiam para a geometria e os jatos de antes. */
  function aoAlterarEntrada(amb) {
    var m = validarIns(amb.manual), mr = validarRet(amb.manualRet);
    amb.manual = m && !m.seguir ? { cand: m.cand, arranjo: m.arranjo, pos: null } : null;
    amb.manualRet = mr && amb.manual ? { cand: mr.cand, pos: null } : (mr && !m ? { cand: mr.cand, pos: null } : null);
  }
  function restaurarRet(amb) {
    var m = validarRet(amb.manualRet);
    amb.manualRet = m ? { cand: m.cand, pos: null } : null;
  }
  // Arraste de um difusor: só grava se o motor avalia o arranjo com a nova posição (como app.moverDifusor da v2.1.3)
  function mover(amb, projeto, idx, x, y) {
    var v = resolver(amb, projeto), s = v.sup;
    if (!s) return false;
    var pos = s.cand.arranjo.pos.map(function (p) { return { x: p.x, y: p.y }; });
    if (!(idx >= 0 && idx < pos.length)) return false;
    pos[idx] = { x: x, y: y };
    comConfig(projeto);
    if (!SEL.avaliarInsuflamento(candComPos(s.cand, pos), v.r.e, v.r.res.amb, true)) return false;
    var k = chaveIns(s.cand), antes = validarIns(amb.manual);

    if (!v.adotada && (!antes || antes.seguir)) amb.manual.seguir = true;   // a 1ª opção do app, só arrastada
    amb.manualRet = null;
    return true;
  }
  // Arraste de uma grelha (como app.moverRetorno da v2.1.3: dentro do ambiente; grelha de parede fica na parede mais próxima)
  function moverRet(amb, projeto, idx, x, y) {
    var v = resolver(amb, projeto), s = v.ret, ctx = v.ctxRet;
    if (!s || !ctx) return false;
    var a = v.r.res.amb, pos = s.pos.map(function (p) { return { x: p.x, y: p.y, parede: p.parede || null }; });
    if (!(idx >= 0 && idx < pos.length)) return false;
    var q = { x: Math.min(Math.max(x, 0), a.C), y: Math.min(Math.max(y, 0), a.W), parede: null };
    if (ctx.posicao !== 'forro') q = D.motor.retorno.encaixarParede(q, a);
    pos[idx] = q;
    comConfig(projeto);
    if (!SEL.avaliarRetorno(s.cand, v.r.e, a, ctx, true, pos)) return false;
    amb.manualRet = { cand: chaveRet(s.cand), pos: pos };

  }

  // ---------------------------------------------------------------- formatos 1 a 3
  /* Os arquivos da v2.1.x gravavam a posição na lista ({ selSup, pos } e { selRet, pos }). Aqui a posição vira identidade,
   * com o ambiente calculado pela configuração do arquivo. Devolve { manual, manualRet, linhas } (linhas do relatório de
   * importação, sem o campo `onde`). Não altera `amb` nem deixa D.motor.config trocada. */

    function linha(nivel, campo, noArquivo, adotado, motivo) { out.linhas.push({ nivel: nivel, campo: campo, valorArquivo: noArquivo, valorAdotado: adotado, motivo: motivo }); }
    if (!legIns && !legRet) { out.manual = validarIns(m); out.manualRet = validarRet(mr); return out; }
    try {
      var r = AD.calcular(amb, projeto), tmp = {}, CI = 'Alternativa adotada e posições dos difusores', CR = 'Grelha adotada e posições das grelhas';
      Object.keys(amb).forEach(function (k) { tmp[k] = amb[k]; });
      tmp.manual = legIns ? null : validarIns(m); tmp.manualRet = null;
      if (legIns) {
        var s = r.res ? r.res.insuflamento[m.selSup] : null;
        if (!s) linha('substituido', CI, 'alternativa nº ' + (m.selSup + 1) + ' da lista', '1ª opção do app', 'a lista deste ambiente não tem mais essa posição: as posições ajustadas foram descartadas');
        else {
          var k = chaveIns(s.cand), pos = posValida(m.pos, false);
          tmp.manual = { cand: k.cand, arranjo: k.arranjo, pos: pos && pos.length === s.n ? pos : null };
          if (m.selSup === 0) { if (tmp.manual.pos) tmp.manual.seguir = true; else tmp.manual = null; }   // a 1ª opção, só arrastada
          linha('convertido', CI, 'alternativa nº ' + (m.selSup + 1) + ' da lista' + (tmp.manual.pos ? ', com posições ajustadas' : ''), rotuloIns(k) + (tmp.manual.pos ? ', com as mesmas posições' : ''),
            'a escolha passa a ser gravada pela peça e pelo arranjo, não pela posição na lista');

        else {

          linha('convertido', CR, 'grelha nº ' + (mr.selRet + 1) + ' da lista' + (tmp.manualRet.pos ? ', com posições ajustadas' : ''), rotuloRet(tmp.manualRet.cand) + (tmp.manualRet.pos ? ', com as mesmas posições' : ''),
            'a escolha passa a ser gravada pela grelha e pela quantidade, não pela posição na lista');
        }
      } else tmp.manualRet = validarRet(mr);
      out.manual = tmp.manual; out.manualRet = tmp.manualRet;
    } catch (err) {
      out.manual = null; out.manualRet = null; out.linhas = [];
      linha('substituido', 'Alternativa adotada e posições ajustadas', '(posição na lista)', '1ª opção do app', 'não foi possível converter a escolha gravada: vale a 1ª opção do app');
    }
    D.motor.config = antes;
    return out;
  }

  D.util.escolha = { resolver: resolver, listaCompleta: listaCompleta, equivalentes: equivalentes, melhorPorFamilia: melhorPorFamilia, porQuantidade: porQuantidade,
    adotar: adotar, adotarRet: adotarRet, voltarPrimeira: voltarPrimeira, restaurar: restaurar, restaurarRet: restaurarRet, mover: mover, moverRet: moverRet,
    aoAlterarEntrada: aoAlterarEntrada,
    deLegado: deLegado, validarIns: validarIns, validarRet: validarRet, chaveIns: chaveIns, chaveRet: chaveRet, sIns: sIns, sRet: sRet, familiaDe: familiaDe,
    rotuloIns: rotuloIns, rotuloRet: rotuloRet };
})(window.Difusores);

<script>
/* ==== js/util/emissao.js ==== */
/* Antes de emitir (v3.0.0, sessão T3): o que falta ou merece conferência antes de gerar o memorial, e o quantitativo de peças.
 * Sem DOM. Nenhum número é calculado aqui: tudo vem do resultado do motor e da solução adotada (D.util.escolha.resolver);
 * a única conta é a soma da contagem de peças do quantitativo.
 *   pendencias(E)        → [{ nivel, amb, onde, texto, detalhes, rota }]   nivel: 'impede' | 'conferir' | 'info'
 *                          Ordem: por nível (impede, conferir, info); dentro do nível, o projeto primeiro e depois os ambientes na ordem do projeto.
 *   configAlteradas(p)   → [{ cam, valor, padrao }]   folhas numéricas de projeto.config diferentes de D.motor.configPadrao()
 *   quantitativo(E)      → { ins: [{ item, n, ambientes }], ret: [...], totalIns, totalRet, semSolucao }
 * E = { projeto, ambientes[] }. Especificação: sessão T3, seção 1.1. */
(function (D) {
  'use strict';
  var AD = D.util.adaptador, ESC = D.util.escolha;
  var NIVEIS = { impede: 0, conferir: 1, info: 2 };

  function nomeDe(amb) { return amb.nome || 'Ambiente sem nome'; }
  function txtNum(v) { return typeof v === 'number' ? String(v).replace('.', ',') : '—'; }
  function curto(s) { return String(s.modelo).split(' — ')[0] + ' ' + s.dimensao; }              // o rótulo de AD.rotuloSolucao sem a quantidade
  function itemRet(rt) { return rt.modelo + ' ' + rt.H + '×' + rt.L; }
  function rotuloRet(rt) { return rt.n + ' × ' + itemRet(rt); }

  // ---------------------------------------------------------------- configurações alteradas
  function configAlteradas(projeto) {
    var padrao = D.motor.configPadrao(), cfg = (projeto && projeto.config) || {}, out = [];
    function percorrer(p, c, pref) {
      Object.keys(p).forEach(function (k) {
        var cam = pref ? pref + '.' + k : k, pv = p[k], cv = c === null || c === undefined ? undefined : c[k];
        if (typeof pv === 'number') { if (cv !== pv) out.push({ cam: cam, valor: cv, padrao: pv }); }
        else if (pv !== null && typeof pv === 'object' && !Array.isArray(pv)) percorrer(pv, cv, cam);
      });
    }
    percorrer(padrao, cfg, '');
    return out;
  }

  // ---------------------------------------------------------------- pendências
  function reprovados(s) {
    return s.verifs.filter(function (x) { return x.situacao === 'reprova'; }).map(function (x) { return x.criterio; });
  }
  function ressalvasDe(r) { return (r.estimados || []).concat(r.estendidos || [], r.alertas || []); }
  // Solução aprovada que ainda traz alerta: os alertas do rastro e as verificações em situação "alerta"
  function alertasDe(s) {
    return ((s.rastro && s.rastro.alertas) || []).concat(s.verifs.filter(function (x) { return x.situacao === 'alerta'; }).map(function (x) { return 'Verificação em alerta: ' + x.criterio; }));
  }

  /* `rotuloCfg(cam)`: opcional, devolve o rótulo de uma configuração para o texto dos detalhes (a tela passa o de H.ui.cat). */
  function pendencias(E, rotuloCfg) {
    var lista = [], seq = 0, projeto = E.projeto || {};
    function add(nivel, amb, onde, texto, detalhes, rota) {
      lista.push({ nivel: nivel, amb: amb, onde: onde, texto: texto, detalhes: detalhes || [], rota: rota, _ordem: seq++ });
    }

    if (!projeto.nome) add('info', null, 'Projeto', 'Projeto sem nome', [], '#/projeto');
    if (!projeto.responsavel) add('info', null, 'Projeto', 'Responsável não informado', [], '#/projeto');
    var alt = configAlteradas(projeto);
    if (alt.length) {
      add('info', null, 'Projeto', alt.length + (alt.length === 1 ? ' configuração alterada' : ' configurações alteradas') + ' em relação ao padrão do app',
        alt.map(function (c) { return (rotuloCfg ? rotuloCfg(c.cam) : c.cam) + ': ' + txtNum(c.valor) + ' (padrão do app: ' + txtNum(c.padrao) + ')'; }), '#/projeto');
    }

    (E.ambientes || []).forEach(function (amb, i) {
      var onde = nomeDe(amb), v = ESC.resolver(amb, projeto), r = v.r, s = v.sup, rt = v.ret, a = r.res ? r.res.amb : null;
      var rotaAmb = '#/ambiente/' + i, rotaSel = '#/selecao/' + i, erros = Object.keys(r.erros);

      if (erros.length) {
        add('impede', i, onde, 'Para selecionar, falta: ' + erros.map(function (k) { return AD.ROTULO[k] || k; }).join(', '), [], rotaAmb);
      } else if (!s) {
        add('impede', i, onde, 'Nenhuma combinação das famílias marcadas atende ao domínio publicado nos catálogos para esta vazão e geometria.', [], rotaAmb);
      }

      if (s) {
        if (s.selo === 'reprovado') add('conferir', i, onde, 'Insuflamento reprovado: ' + reprovados(s).join('; '), [], rotaSel);
        if (r.res && r.res.semAprovada) add('conferir', i, onde, 'Nenhuma alternativa de insuflamento gerada é aprovada.', [r.res.semAprovada.texto], rotaSel);
        if (s.selo === 'ressalva') add('conferir', i, onde, 'Insuflamento aprovado com ressalva', ressalvasDe(s.rastro), rotaSel);
        if (s.selo === 'aprovado' && alertasDe(s).length) add('conferir', i, onde, 'Insuflamento aprovado, com alerta', alertasDe(s), rotaSel);
        if (a && a.Qret > 0 && !rt) add('conferir', i, onde, 'Retorno sem solução dentro do catálogo.', [], rotaSel);
        if (rt && rt.selo === 'reprovado') add('conferir', i, onde, 'Retorno reprovado: ' + reprovados(rt).join('; '), [], rotaSel);
        if (rt && rt.selo === 'ressalva') add('conferir', i, onde, 'Retorno aprovado com ressalva', ressalvasDe(rt.rastro), rotaSel);
        if (rt && rt.selo === 'aprovado' && alertasDe(rt).length) add('conferir', i, onde, 'Retorno aprovado, com alerta', alertasDe(rt), rotaSel);
      }
      r.avisos.filter(function (x) { return x.nivel !== 'erro'; }).forEach(function (x) { add('conferir', i, onde, 'Aviso de entrada: ' + x.texto, [], rotaAmb); });
      v.avisos.forEach(function (t) { add('conferir', i, onde, t, [], rotaSel); });

      if (s && v.adotada) add('info', i, onde, 'Insuflamento adotado por você: ' + AD.rotuloSolucao(s) + ' (a 1ª opção do app é ' + AD.rotuloSolucao(v.primeira) + ')', [], rotaSel);
      if (rt && v.retAdotada) add('info', i, onde, 'Retorno adotado por você: ' + rotuloRet(rt), [], rotaSel);
      if (v.ajustada) add('info', i, onde, 'Posições dos difusores ajustadas na planta', [], rotaSel);
      if (v.retAjustada) add('info', i, onde, 'Posições das grelhas ajustadas na planta', [], rotaSel);
      // "Dado interpretado do catálogo na solução adotada": o motor não guarda lista própria desses dados no rastro
      // (entram em `alertas`, com o texto "Dado do catálogo interpretado (…)", terminais.js); o item fica de fora e os
      // alertas já aparecem nos detalhes de "Insuflamento aprovado com ressalva".
    });

    lista.sort(function (x, y) {
      return (NIVEIS[x.nivel] - NIVEIS[y.nivel]) || ((x.amb === null ? -1 : x.amb) - (y.amb === null ? -1 : y.amb)) || (x._ordem - y._ordem);
    });
    lista.forEach(function (x) { delete x._ordem; });
    return lista;
  }

  // ---------------------------------------------------------------- quantitativo
  function quantitativo(E) {
    var ins = {}, ret = {}, semSolucao = [], totalIns = 0, totalRet = 0;
    function soma(mapa, item, n, nome) {
      var x = mapa[item] || (mapa[item] = { item: item, n: 0, ambientes: [] });
      x.n += n; x.ambientes.push(nome);
    }
    (E.ambientes || []).forEach(function (amb) {
      var v = ESC.resolver(amb, E.projeto), s = v.sup, rt = v.ret, nome = nomeDe(amb);
      if (!s) { semSolucao.push(nome); return; }
      soma(ins, curto(s), s.n, nome); totalIns += s.n;
      if (rt) { soma(ret, itemRet(rt), rt.n, nome); totalRet += rt.n; }
    });
    function ordenar(mapa) {
      return Object.keys(mapa).sort(function (a, b) { return a < b ? -1 : a > b ? 1 : 0; }).map(function (k) { return mapa[k]; });
    }
    return { ins: ordenar(ins), ret: ordenar(ret), totalIns: totalIns, totalRet: totalRet, semSolucao: semSolucao };
  }

  D.util.emissao = { pendencias: pendencias, configAlteradas: configAlteradas, quantitativo: quantitativo };
})(window.Difusores);

</script>
<script>
/* ==== js/util/formato4.js ==== */
/* Arquivo de projeto (*.difusores.json), formato 4 (v3.0.0): envelope comum da plataforma, com vários ambientes.
 *   { formato: 'hvac-difusores', versaoFormato: 4, versaoApp,
 *     projeto:   { nome, responsavel, revisao, altitude, padroes: { familias, retornoFamilias }, config },
 *     ambientes: [ { nome, geo, ar, crit, retorno, familias, manual, manualRet, areaCT? } ] }
 *   areaCT (opcional): área da carga térmica em m², só dica para sugerir a largura; o motor não a recebe.
 *   manual e manualRet: a alternativa adotada e as posições ajustadas, pela identidade da peça e do arranjo (util\escolha.js);
 *   null = segue a 1ª opção do app.
 * abrir(texto ou objeto) nunca lança erro e devolve { ok, projeto, relatorio, versaoOrigem, versaoAppOrigem, motivo }:
 *   - formatos 1, 2 e 3 (um ambiente, chave `entrada`): passam por D.util.projeto.abrir, que converte e valida como na
 *     v2.1.3, e viram projeto de um ambiente. O nome do ambiente, a altitude e as configurações mudam de lugar; a perda
 *     de carga máxima passa de mmCA a Pa; valor igual ao padrão passa a acompanhar o padrão (ver util\adaptador.js);
 *   - formato 4: cada ambiente vira a entrada do motor (adaptador), é validado pelas mesmas regras de D.util.projeto.abrir
 *     e volta ao ambiente; as configurações são validadas uma vez.
 * Campo novo de entrada ou chave nova de configuração exige: padrão aqui (ou em util\projeto.js), linha no relatório e teste. */
(function (D) {
  'use strict';
  var FORMATO = 'hvac-difusores', VERSAO_FORMATO = 4, APP3 = 'Difusores TROX';
  var A = D.util.adaptador, P3 = D.util.projeto, F = D.util.fmt;
  var FAM_PADRAO = { ADLQ: true, ADLR: true, ADE1: true, ADE2: true, FD: false, VDW: false, VD: false };   // o mesmo padrão de util\projeto.js

  function tem(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function ehObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }
  function clonar(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }
  function str(v) { return typeof v === 'string' ? v : ''; }
  function recusa(m) { return { ok: false, projeto: null, relatorio: [], versaoOrigem: 0, versaoAppOrigem: '', motivo: m }; }
  function linha(rel, nivel, onde, campo, valorArquivo, valorAdotado, motivo) {
    rel.push({ nivel: nivel, onde: onde, campo: campo, valorArquivo: String(valorArquivo), valorAdotado: String(valorAdotado), motivo: motivo });
  }
  function ondeAmb(nome) { return 'Ambiente: ' + nome; }
  // As linhas de D.util.projeto.abrir falam em "Entradas" e "Planta": aqui passam a dizer de qual ambiente
  function trocarOnde(rel, nome) {
    return rel.map(function (x) {
      var y = clonar(x);
      if (y.onde === 'Entradas') y.onde = ondeAmb(nome); else if (y.onde === 'Planta') y.onde = ondeAmb(nome) + ' (planta)';
      return y;
    });
  }
  function familiasBool(o, chaves, padrao) {
    var r = {}; o = ehObj(o) ? o : {};
    chaves.forEach(function (k) { r[k] = typeof o[k] === 'boolean' ? o[k] : (typeof padrao === 'boolean' ? padrao : padrao[k]); });
    return r;
  }

  function montar(projeto, ambientes) { return { formato: FORMATO, versaoFormato: VERSAO_FORMATO, versaoApp: D.versao, projeto: projeto, ambientes: ambientes }; }

  // Projeto de um ambiente a partir de uma entrada do motor (formatos 1 a 3, exemplo)
  function deEntrada(e, config, manual, manualRet, nomeProjeto) {
    var amb = A.entradaParaAmbiente(e, null), p = e.projeto || {};
    amb.nome = amb.nome || 'Ambiente 1';
    amb.manual = manual || null; amb.manualRet = manualRet || null;
    return montar({ nome: nomeProjeto || p.nome || '', responsavel: p.responsavel || '', revisao: '0', altitude: vazio(e.ar.z) ? 0 : e.ar.z,
      padroes: { familias: clonar(amb.familias), retornoFamilias: clonar(amb.retorno.familias) }, config: config }, [amb]);
  }

  // O exemplo da v2.1.3 (app.exemplo da tela antiga), com a umidade relativa que a tela preenchia (50 %)
  function entradaExemplo() {
    return { projeto: { nome: 'Exemplo', ambiente: 'Sala 6 × 3 m', responsavel: '' },
      geo: { C: 6, W: 3, H: 2.7, Hinst: 2.7, zo: 1.8, postura: 'emPe', montagem: 'forro', paredesExternas: {} },
      ar: { modo: 'vazao', Q: 500, qs: 1842, dT: 11, to: 24, ur: 50, z: 0, retornoPct: 90 },
      crit: { aplicacao: 'escritorioPrivado', dbaMax: 40, dpMax: 4, vzoModo: 'nbr', vzoMax: 0.25, controleLocal: false, registro: 'sem', regulagemRamal: true, entradaAI: 'H', acessorio: 'nenhum', tratamento: 'normal' },
      retorno: { posicao: 'forro', tipo: 'dutado', hMax: null, lMax: null, modular: false, familias: { AT_VAT: true, AR: true, AGS_T: true, AE: true } },
      familias: { ADLQ: true, ADLR: true, ADE1: true, ADE2: true, FD: false, VDW: false, VD: false } };
  }
  function exemplo() {
    var r = P3.abrir({ app: APP3, versaoFormato: 3, entrada: entradaExemplo() });   // passa pela mesma validação de um arquivo
    return deEntrada(r.projeto.entrada, r.projeto.config, null, null, 'Exemplo');
  }

  // Ambiente novo: como app.vazio da v2.1.3 (faltam comprimento, largura e vazão), com as famílias padrão do projeto
  function novoAmbiente(projeto, nome) {
    var amb = exemplo().ambientes[0], pd = (projeto && projeto.padroes) || {};
    amb.nome = nome || 'Ambiente novo';
    amb.geo.C = null; amb.geo.W = null; amb.ar.Q = null; amb.ar.qs = null;
    amb.familias = familiasBool(pd.familias, A.FAMILIAS, FAM_PADRAO);
    amb.retorno.familias = familiasBool(pd.retornoFamilias, A.FAMILIAS_RET, true);
    return amb;
  }
  /* Altitude com que um projeto novo começa: Brasília, 1.060 m (o valor da base de clima do app de carga térmica,
   * carga-termica-web\codigo\dados\nbr16401-1_A_clima_brasilia.csv). É valor inicial da tela, não padrão de arquivo: arquivo
   * sem altitude continua abrindo ao nível do mar (0 m), e o exemplo da v2.1.3 segue a 0 m. */
  var ALTITUDE_PADRAO = 1060;
  function novoProjeto() {
    var p = exemplo();
    p.projeto.nome = ''; p.projeto.altitude = ALTITUDE_PADRAO; p.ambientes = [novoAmbiente(p.projeto, 'Ambiente 1')];
    return p;
  }

  function num(v, casas, unidade) { return F.num(v, casas).replace(/,0+$/, '') + (unidade ? ' ' + unidade : ''); }

  /* Alternativa adotada e posições ajustadas (util\escolha.js). Os formatos 1 a 3 gravavam a posição na lista
   * ({ selSup, pos }, { selRet, pos }): aqui ela vira a identidade da peça e do arranjo, com o ambiente calculado pela
   * configuração do arquivo. Devolve as linhas do relatório; `projeto` já tem de trazer a configuração validada. */
  function ehEscolha(m) { return ehObj(m) && ehObj(m.cand); }
  function converterEscolha(amb, projeto) {
    var rel = [], m = amb.manual, mr = amb.manualRet;
    if (!(ehObj(m) && tem(m, 'selSup')) && !(ehObj(mr) && tem(mr, 'selRet'))) return rel;
    var conv = D.util.escolha.deLegado(amb, projeto);
    amb.manual = conv.manual; amb.manualRet = conv.manualRet;
    conv.linhas.forEach(function (x) { linha(rel, x.nivel, ondeAmb(amb.nome) + ' (planta)', x.campo, x.valorArquivo, x.valorAdotado, x.motivo); });
    return rel;
  }

  /* Formatos 1, 2 e 3: r3 = o devolvido por D.util.projeto.abrir (já convertido ao formato 3 e validado). */
  function deFormato3(r3) {
    var p = r3.projeto, e = p.entrada, rel = [], proj = deEntrada(e, p.config, p.manual, p.manualRet, p.nome), amb = proj.ambientes[0], onde = ondeAmb(amb.nome);
    linha(rel, 'info', 'Arquivo', 'Formato', 'versão ' + r3.versaoOrigem + (r3.versaoAppOrigem ? ' (app v' + r3.versaoAppOrigem + ')' : ''), 'versão ' + VERSAO_FORMATO,
      'Na v3.0.0 o projeto guarda vários ambientes: este arquivo abre como projeto de um ambiente ("' + amb.nome + '"). O nome do ambiente, a altitude e as configurações ' +
      'mudam de lugar (o nome vai para o ambiente; a altitude e as configurações, para o projeto). Nenhum valor de cálculo muda por causa disso.');
    rel = rel.concat(trocarOnde(r3.relatorio, amb.nome));
    if (e.crit.dpMax > 0) linha(rel, 'convertido', onde, 'Perda de carga máxima no difusor', num(e.crit.dpMax, 3, 'mmCA'), num(amb.crit.dpMaxPa, 2, 'Pa'),
      'a tela passa a usar Pa (1 mmCA = 9,80665 Pa); o limite é o mesmo');
    if (amb.geo.zo === null && e.geo.zo > 0) linha(rel, 'info', onde, 'Zona ocupada', num(e.geo.zo, 2, 'm'), 'acompanha a postura (' + num(e.geo.zo, 2, 'm') + ')',
      'igual à altura da postura escolhida: passa a acompanhá-la (mudar a postura muda a zona ocupada)');
    if (amb.crit.dbaMax === null && e.crit.dbaMax > 0) linha(rel, 'info', onde, 'Limite de ruído no ambiente', num(e.crit.dbaMax, 1, 'dB(A)'), 'acompanha a aplicação (' + num(e.crit.dbaMax, 1, 'dB(A)') + ')',
      'igual ao valor da aplicação escolhida: passa a acompanhá-la (mudar a aplicação muda o limite)');
    if (amb.ar.to === null && !vazio(e.ar.to)) linha(rel, 'info', onde, 'Temperatura operativa de projeto', num(e.ar.to, 1, '°C'), 'acompanha o padrão (' + num(e.ar.to, 1, '°C') + ')', 'igual ao padrão do app: passa a acompanhá-lo');
    if (amb.ar.ur === null && !vazio(e.ar.ur)) linha(rel, 'info', onde, 'Umidade relativa do ambiente', num(e.ar.ur, 0, '%'), 'acompanha o padrão (' + num(e.ar.ur, 0, '%') + ')', 'igual ao padrão do app: passa a acompanhá-lo');
    rel = rel.concat(converterEscolha(amb, proj.projeto));
    return { ok: true, projeto: proj, relatorio: rel, versaoOrigem: r3.versaoOrigem, versaoAppOrigem: r3.versaoAppOrigem, motivo: '' };
  }

  /* Formato 4. Cada ambiente passa pela validação de D.util.projeto.abrir, na forma da entrada do motor. */
  function deFormato4(obj) {
    var rel = [], pr = ehObj(obj.projeto) ? obj.projeto : {}, vApp = str(obj.versaoApp), cfg = null;
    var proj = { nome: str(pr.nome), responsavel: str(pr.responsavel), revisao: typeof pr.revisao === 'number' ? String(pr.revisao) : (str(pr.revisao) || '0'), altitude: 0, padroes: null, config: null };
    var alt = typeof pr.altitude === 'string' ? F.ler(pr.altitude) : pr.altitude;
    if (vazio(pr.altitude)) proj.altitude = 0;
    else if (typeof alt === 'number' && isFinite(alt) && alt >= 0) proj.altitude = alt;
    else linha(rel, 'substituido', 'Projeto', 'Altitude', JSON.stringify(pr.altitude), '0 m', 'valor inválido: adotado o nível do mar');
    var pd = ehObj(pr.padroes) ? pr.padroes : {};
    proj.padroes = { familias: familiasBool(pd.familias, A.FAMILIAS, FAM_PADRAO), retornoFamilias: familiasBool(pd.retornoFamilias, A.FAMILIAS_RET, true) };

    var lista = obj.ambientes.filter(ehObj), ambientes = [];
    if (lista.length < obj.ambientes.length) linha(rel, 'substituido', 'Ambientes', 'Lista de ambientes', obj.ambientes.length + ' itens', lista.length + ' ambientes', 'itens que não são ambientes foram descartados');
    if (!lista.length) { linha(rel, 'substituido', 'Ambientes', 'Lista de ambientes', '(vazia)', 'Ambiente 1 (a preencher)', 'o projeto precisa de pelo menos um ambiente'); lista = [novoAmbiente(proj, 'Ambiente 1')]; }
    lista.forEach(function (bruto, i) {
      var amb = clonar(bruto), nome = str(amb.nome) || 'Ambiente ' + (i + 1);
      ['geo', 'ar', 'crit', 'retorno', 'familias'].forEach(function (k) { if (!ehObj(amb[k])) amb[k] = {}; });
      amb.nome = nome;
      // a escolha gravada pela identidade (T2) é validada aqui; a gravada pela posição na lista segue pela validação da v2.1.3
      var novoIns = ehEscolha(amb.manual), novoRet = ehEscolha(amb.manualRet);
      var r3 = P3.abrir({ app: APP3, versaoFormato: 3, versaoApp: vApp, entrada: A.ambienteParaEntrada(amb, proj), config: cfg || pr.config,
        manual: novoIns ? null : amb.manual, manualRet: novoRet ? null : amb.manualRet });
      if (!r3.ok) { linha(rel, 'substituido', ondeAmb(nome), 'Ambiente', '(ilegível)', '(a preencher)', r3.motivo); ambientes.push(novoAmbiente(proj, nome)); return; }
      var lin = trocarOnde(r3.relatorio, nome);
      if (cfg) lin = lin.filter(function (x) { return x.onde !== 'Configurações'; });   // as configurações são do projeto: validadas com o 1º ambiente
      rel = rel.concat(lin);
      cfg = cfg || r3.projeto.config;
      var novo = A.entradaParaAmbiente(r3.projeto.entrada, amb);
      novo.nome = nome;
      if (typeof amb.areaCT === 'number' && isFinite(amb.areaCT) && amb.areaCT > 0) novo.areaCT = amb.areaCT;   // dica da importação da carga térmica; inválido: descartado em silêncio
      novo.manual = novoIns ? D.util.escolha.validarIns(amb.manual) : r3.projeto.manual;
      novo.manualRet = novoRet ? D.util.escolha.validarRet(amb.manualRet) : r3.projeto.manualRet;
      if (novoIns && !novo.manual) linha(rel, 'substituido', ondeAmb(nome) + ' (planta)', 'Alternativa adotada e posições dos difusores', '(registro ilegível)', '1ª opção do app', 'a escolha gravada no arquivo não pôde ser lida');
      if (novoRet && !novo.manualRet) linha(rel, 'substituido', ondeAmb(nome) + ' (planta)', 'Grelha adotada e posições das grelhas', '(registro ilegível)', '1ª opção de retorno', 'a escolha gravada no arquivo não pôde ser lida');
      ambientes.push(novo);
    });
    proj.config = cfg || D.motor.configPadrao();
    ambientes.forEach(function (amb) { rel = rel.concat(converterEscolha(amb, proj)); });
    return { ok: true, projeto: montar(proj, ambientes), relatorio: rel, versaoOrigem: VERSAO_FORMATO, versaoAppOrigem: vApp, motivo: '' };
  }

  /* Abre um projeto (texto do arquivo ou objeto já lido). Nunca lança erro. */
  function abrir(conteudo) {
    try {
      var obj = conteudo;
      if (typeof conteudo === 'string') {
        try { obj = JSON.parse(conteudo); } catch (e0) { return recusa('O arquivo não é um JSON válido (' + e0.message + ').'); }
      }
      if (!ehObj(obj)) return recusa('O arquivo não contém um projeto (esperado um objeto JSON).');
      if (Array.isArray(obj.ambientes)) {   // envelope comum (formato 4 em diante)
        if (tem(obj, 'formato') && obj.formato !== FORMATO) return recusa('O arquivo escolhido não é um projeto deste app (Difusores TROX).');
        var vf = vazio(obj.versaoFormato) ? VERSAO_FORMATO : Number(obj.versaoFormato);
        if (!(vf >= VERSAO_FORMATO)) return recusa('Versão de formato não reconhecida (' + String(obj.versaoFormato) + ').');
        if (vf > VERSAO_FORMATO) return recusa('Arquivo gravado por versão mais nova do app (formato ' + obj.versaoFormato + '). Atualize o app para abri-lo.');
        return deFormato4(obj);
      }
      var r3 = P3.abrir(obj);
      return r3.ok ? deFormato3(r3) : recusa(r3.motivo);
    } catch (err) {
      return recusa('Não foi possível ler o arquivo (' + (err && err.message ? err.message : err) + ').');
    }
  }

  function contar(rel, nivel) { var n = 0; (rel || []).forEach(function (x) { if (x.nivel === nivel) n++; }); return n; }
  var NIVEL = { convertido: 'CONVERTIDO', mantido: 'MANTIDO', substituido: 'SUBSTITUÍDO', info: 'INFO' };
  // Relatório de importação em texto puro (.txt); r = { relatorio, versaoOrigem } (o que a casca guarda da última abertura)
  function texto(r, nomeArquivo) {
    var NL = '\r\n', rel = r.relatorio || [];
    var s = 'Relatório de importação — Difusores TROX v' + D.versao + NL + 'Arquivo: ' + (nomeArquivo || '(sem nome)') + NL +
      'Formato de origem: versão ' + r.versaoOrigem + ' → versão ' + VERSAO_FORMATO + ' · ' + contar(rel, 'convertido') + ' conversões · ' + contar(rel, 'mantido') +
      ' valores seus mantidos · ' + contar(rel, 'substituido') + ' substituições' + NL + NL;
    if (!rel.length) return s + 'Nenhuma alteração.' + NL;
    rel.forEach(function (x) {
      s += '[' + (NIVEL[x.nivel] || x.nivel) + '] ' + x.onde + ' · ' + x.campo + NL + '  No arquivo: ' + x.valorArquivo + NL + '  Adotado: ' + x.valorAdotado + NL + '  Motivo: ' + x.motivo + NL + NL;
    });
    return s;
  }

  D.util.formato4 = { FORMATO: FORMATO, VERSAO_FORMATO: VERSAO_FORMATO, ALTITUDE_PADRAO: ALTITUDE_PADRAO, abrir: abrir, texto: texto, exemplo: exemplo, entradaExemplo: entradaExemplo, novoAmbiente: novoAmbiente, novoProjeto: novoProjeto,
    deEntrada: deEntrada, NIVEL: NIVEL };
})(window.Difusores);

</script>
<script>
/* ==== js/util/importa_ct.js ==== */
/* Importação de ambientes do app de carga térmica (v3.0.0, sessão T3, etapa 2b; calor sensível na D1, v3.0.1). Sem DOM.
 *   D.util.importaCT.importar(obj, E) → { ok, ambientes, relatorio, versaoOrigem, motivo }
 * Lê o arquivo do app de carga térmica (formato 'hvac-carga-termica', versões 1, 2 e 3) e devolve ambientes novos (a partir de
 * D.util.formato4.novoAmbiente) com nome, pé-direito, temperatura e umidade. Comprimento e largura ficam para digitar
 * (a área vai em amb.areaCT, só como dica para larguraSugerida).
 * Formato 3 em diante (carga térmica v0.5.1): lê resultados.ambientes[k] (k = posição do ambiente no arquivo) e grava amb.ar.qs com
 * o calor sensível do ambiente (sensivelAmbienteW como está no arquivo (1 casa decimal), sem novo arredondamento), com mês, dia e hora na linha do relatório. Não altera E: quem chama acrescenta os ambientes ao projeto. Linhas do relatório no formato de formato4.js:
 * { nivel ('info' | 'convertido' | 'substituido'), onde, campo, valorArquivo, valorAdotado, motivo }.
 * O ambiente importado fica em modo 'carga'; nos formatos 1 e 2, que não trazem resultado, com o calor sensível vazio. */
(function (D) {
  'use strict';
  var F = D.util.fmt, AD = D.util.adaptador, F4 = D.util.formato4;
  var FORMATO_CT = 'hvac-carga-termica', VERSAO_CONHECIDA = 3;

  function ehObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }
  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }
  function numero(x) {   // número, ou texto numérico (vírgula ou ponto); senão NaN
    if (typeof x === 'number') return isFinite(x) ? x : NaN;
    if (typeof x === 'string') { var n = F.ler(x); return typeof n === 'number' && isFinite(n) ? n : NaN; }
    return NaN;
  }
  function txt(v) {
    if (v === undefined) return '(ausente)';
    if (v === null || v === '') return '(vazio)';
    if (typeof v === 'number') return String(v).replace('.', ',');
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }
  function recusa(m) { return { ok: false, ambientes: [], relatorio: [], versaoOrigem: 0, motivo: m }; }
  function linha(rel, nivel, onde, campo, valorArquivo, valorAdotado, motivo) {
    rel.push({ nivel: nivel, onde: onde, campo: campo, valorArquivo: String(valorArquivo), valorAdotado: String(valorAdotado), motivo: motivo });
  }
  function ehAmbienteCT(a) { return ehObj(a) && typeof a.nome === 'string' && a.pd !== undefined; }

  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var DIAS = { tbs: 'dia de tbs máxima', tbu: 'dia de tbu máxima', umi: 'dia de umidade máxima' };
  function inteiroEm(x, a, b) { return typeof x === 'number' && isFinite(x) && Math.floor(x) === x && x >= a && x <= b; }

  // Calor sensível do ambiente de resultados.ambientes[k] (formato 3 em diante); grava amb.ar.qs e a linha do relatório
  function calorSensivel(rel, onde, amb, res, nomeOrig) {
    var CAMPO = 'Calor sensível do ambiente';
    if (!ehObj(res) || (typeof res.nome === 'string' ? res.nome.trim() : '') !== nomeOrig) {
      linha(rel, 'substituido', onde, CAMPO, ehObj(res) ? 'resultado de "' + (typeof res.nome === 'string' ? res.nome : '') + '"' : '(ausente)', '(vazio)',

    if (v <= 0) {
      linha(rel, 'substituido', onde, CAMPO, F.num(v, 1) + ' W', '(vazio)',
        'valor nulo ou negativo: o ambiente não tem ganho de calor sensível na janela de ocupação; digite o calor sensível do ambiente ou a vazão');
      return;
    }
    amb.ar.qs = v;
    var quando = inteiroEm(res.mes, 1, 12) && DIAS[res.dia] && inteiroEm(res.hora, 1, 24) ?
      MESES[res.mes - 1] + ', ' + DIAS[res.dia] + ', ' + res.hora + ' h' : 'mês, dia e hora não informados';
    linha(rel, 'info', onde, CAMPO, F.num(v, 1) + ' W (' + quando + ')', F.num(v, 1) + ' W',
      'maior valor do ano na janela de ocupação, com a infiltração sensível incluída, sem ar exterior, sem latente, sem calor ao retorno e sem fator de segurança; a vazão sai com a massa específica do ar na altitude deste projeto');
  }

  // Largura que, com o comprimento C, dá a área da carga térmica (m, arredondada a 0,01); null se faltar dado
  function larguraSugerida(area, C) {
    if (typeof area !== 'number' || typeof C !== 'number' || !isFinite(area) || !isFinite(C) || !(area > 0) || !(C > 0)) return null;
    return Math.round(area / C * 100) / 100;
  }

  // C × W fora de ± 1 % da área da carga térmica? (só decide se a frase da tela aparece; critério do app, sem norma)
  function areaDifere(area, C, W) {
    function pos(x) { return typeof x === 'number' && isFinite(x) && x > 0; }
    return pos(area) && pos(C) && pos(W) && Math.abs(C * W - area) > 0.01 * area;
  }

  function importar(obj, E) {
    try {
      var MOTIVO_OUTRO = 'Este arquivo não é um projeto do app de carga térmica.';
      if (!ehObj(obj) || !Array.isArray(obj.ambientes) || !obj.ambientes.length) return recusa(MOTIVO_OUTRO);
      var lista = [], posOrig = [];   // posOrig: posição de cada item de `lista` em obj.ambientes (os resultados seguem a posição do arquivo)
      obj.ambientes.forEach(function (x, i) { if (ehObj(x)) { lista.push(x); posOrig.push(i); } });
      if (!lista.length) return recusa(MOTIVO_OUTRO);
      // o formato 1 (v0.4.0) também grava formato 'hvac-carga-termica'; sem o campo, só passa o que tem ambientes com nome e pé-direito
      if (obj.formato !== FORMATO_CT && !(vazio(obj.formato) && lista.every(ehAmbienteCT))) return recusa(MOTIVO_OUTRO);
      var vf = vazio(obj.versaoFormato) ? 1 : Number(obj.versaoFormato);
      if (isNaN(vf)) vf = 1;
      var pj = ehObj(obj.projeto) ? obj.projeto : {}, rel = [], novos = [];
      var existentes = (E && Array.isArray(E.ambientes) ? E.ambientes : []).map(function (a) { return a.nome; });
      var projetoE = E && E.projeto ? E.projeto : null;
      var toPad = AD.toPadrao(1);
      var temBloco = vf >= 3 && ehObj(obj.resultados) && Array.isArray(obj.resultados.ambientes);

      if (vf > VERSAO_CONHECIDA) linha(rel, 'info', 'Arquivo', 'Formato', 'versão ' + vf, 'versão ' + VERSAO_CONHECIDA,
        'formato mais novo que o conhecido (' + VERSAO_CONHECIDA + '): lidos só nome, pé-direito, temperatura, umidade e calor sensível');

      lista.forEach(function (a, idx) {
        var nome = typeof a.nome === 'string' ? a.nome.trim() : '', nomeOrig = nome, usados = existentes.concat(novos.map(function (x) { return x.nome; })), final;
        if (!nome) nome = 'Ambiente importado ' + (idx + 1);
        final = nome;
        if (usados.indexOf(final) >= 0) {
          final = nome + ' (carga térmica)';

        }
        var onde = 'Ambiente: ' + final, amb = F4.novoAmbiente(projetoE, final);
        if (final !== nome) linha(rel, 'info', onde, 'Nome', nome, final, 'já existe um ambiente com este nome no projeto ou na importação');

        // pé-direito e altura de instalação
        var pd = numero(a.pd);
        if (pd > 0 && pd <= 50) {
          amb.geo.H = pd; amb.geo.Hinst = pd;
          linha(rel, 'info', onde, 'Altura de instalação', txt(a.pd) + ' m', txt(pd) + ' m', 'Altura de instalação igual ao pé-direito; ajuste se for outra');
        } else {
          amb.geo.H = null; amb.geo.Hinst = null;
          linha(rel, 'substituido', onde, 'Pé-direito', txt(a.pd), '(vazio)', 'valor inválido (esperado maior que 0 e até 50 m): digite o pé-direito');
        }
        // comprimento e largura: a carga térmica guarda só a área
        amb.geo.C = null; amb.geo.W = null;
        if (numero(a.area) > 0) amb.areaCT = numero(a.area);   // dica para a sugestão de largura; o motor não recebe
        linha(rel, 'info', onde, 'Comprimento e largura', typeof a.area === 'number' ? 'área ' + txt(a.area) + ' m²' : 'área não informada', '(vazio)',
          'a carga térmica guarda só a área: digite comprimento e largura que deem essa área');
        // temperatura operativa
        var ti = vazio(a.tInt) ? pj.tInt : a.tInt;
        amb.ar.to = null;
        if (!vazio(ti)) {
          var to = numero(ti);
          if (to >= 15 && to <= 35) {
            amb.ar.to = to === toPad ? null : to;
            linha(rel, 'info', onde, 'Temperatura operativa de projeto', txt(ti) + ' °C', amb.ar.to === null ? 'acompanha o padrão (' + txt(toPad) + ' °C)' : txt(to) + ' °C',
              'temperatura operativa = temperatura interna do ar da carga térmica (premissa: temperatura radiante média igual à do ar)');
          } else {
            linha(rel, 'substituido', onde, 'Temperatura operativa de projeto', txt(ti), 'acompanha o padrão (' + txt(toPad) + ' °C)', 'valor fora da faixa de 15 a 35 °C');
          }
        }
        // umidade relativa
        var ui = vazio(a.urInt) ? pj.urInt : a.urInt;
        amb.ar.ur = null;
        if (!vazio(ui)) {
          var ur = numero(ui);
          if (ur >= 1 && ur <= 100) amb.ar.ur = ur === AD.UR_PADRAO ? null : ur;
          else linha(rel, 'substituido', onde, 'Umidade relativa do ambiente', txt(ui), 'acompanha o padrão (' + txt(AD.UR_PADRAO) + ' %)', 'valor fora da faixa de 1 a 100 %');
        }
        amb.ar.modo = 'carga'; amb.ar.qs = null; amb.ar.Q = null;
        if (temBloco) calorSensivel(rel, onde, amb, obj.resultados.ambientes[posOrig[idx]], nomeOrig);
        novos.push(amb);
      });

      if (vf < 3) linha(rel, 'info', 'Projeto', 'Calor sensível do ambiente', '(ausente)', '(vazio)',
        'o arquivo da carga térmica não traz resultado: digite o calor sensível do ambiente (sem ar exterior, sem latente, sem calor ao retorno) ou a vazão');
      else if (!temBloco) linha(rel, 'info', 'Projeto', 'Calor sensível do ambiente', '(ausente)', '(vazio)',
        'arquivo do formato 3 sem o bloco de resultados (salvo por outra ferramenta ou editado): abra-o na carga térmica v0.5.1 ou mais nova, salve de novo e importe, ou digite o calor sensível do ambiente (sem ar exterior, sem latente, sem calor ao retorno) ou a vazão');
      if (projetoE && projetoE.altitude !== F4.ALTITUDE_PADRAO) {
        linha(rel, 'info', 'Projeto', 'Altitude', '1.060 m (Brasília)', F.num(projetoE.altitude, 0) + ' m',
          'a carga térmica calcula para Brasília (1.060 m); este projeto está a ' + F.num(projetoE.altitude, 0) + ' m e não foi alterado');
      }
      return { ok: true, ambientes: novos, relatorio: rel, versaoOrigem: vf, motivo: '' };
    } catch (err) {
      return recusa('Não foi possível ler o arquivo (' + (err && err.message ? err.message : err) + ').');
    }
  }

  // Relatório em texto puro (.txt), no desenho de formato4.texto
  var NIVEL = { convertido: 'CONVERTIDO', substituido: 'SUBSTITUÍDO', info: 'INFO' };
  function texto(r, nomeArquivo) {
    var NL = '\r\n', rel = r.relatorio || [];
    var s = 'Importação da carga térmica — Difusores TROX v' + D.versao + NL + 'Arquivo: ' + (nomeArquivo || '(sem nome)') + NL;
    if (!r.ok) return s + 'Arquivo recusado: ' + r.motivo + NL;
    s += r.ambientes.length + (r.ambientes.length === 1 ? ' ambiente acrescentado' : ' ambientes acrescentados') + NL + NL;
    rel.forEach(function (x) {
      s += '[' + (NIVEL[x.nivel] || x.nivel) + '] ' + x.onde + ' · ' + x.campo + NL + '  No arquivo: ' + x.valorArquivo + NL + '  Adotado: ' + x.valorAdotado + NL + '  Motivo: ' + x.motivo + NL + NL;
    });

  }

  D.util.importaCT = { importar: importar, texto: texto, larguraSugerida: larguraSugerida, areaDifere: areaDifere, FORMATO_CT: FORMATO_CT, VERSAO_CONHECIDA: VERSAO_CONHECIDA };
})(window.Difusores);

<!-- Plataforma: componentes e casca -->
<script>
/* ==== plataforma v0.4.1: js/interface/componentes.js ==== */
/* Plataforma HVAC. Componentes do guia de interface: campo com estado, selos, valor calculado, seletor, segmentado, passos,
   cabeçalho de tela, indicador, bloco recolhível, barras, tabela de passos e, desde a v0.4.0, a lista de cartões do celular.
   Só montam HTML; não conhecem app nem motor.
   O estado da tela (H.ui.U: erros, aprender, aberto) é da casca; sem ela (página avulsa), os componentes funcionam com o estado vazio. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc;
  function daTela() { return H.ui.U || {}; }   // estado da tela guardado pela casca

  function selo(tipo, texto, fonte) {
    if (fonte) return '<button type="button" class="selo ' + tipo + '" data-acao="fonte" data-fonte="' + esc(fonte) + '" title="Ver a fonte">' + esc(texto) + '</button>';
    return '<span class="selo ' + tipo + '">' + esc(texto) + '</span>';
  }

  /* Campo numérico. o = { id, caminho, rotulo, valor, unidade, casas, min, max, faixa (texto do aviso),
     padrao (valor da norma; undefined = sem padrão), alterado (bool), fonte, inteiro, fixo (texto do selo),
     negativo (bool: aceita número abaixo de zero, como temperatura), anulavel (bool: aceita vazio),
     erro (texto; quando ausente, vale o erro que a casca guardou para o id do campo) } */
  function campo(o) {
    var erro = o.erro !== undefined ? o.erro : (daTela().erros || {})[o.id], aviso = '';
    var casas = o.casas === undefined ? 2 : o.casas;
    if (!erro && !o.fixo && o.valor !== null && o.valor !== undefined &&
        ((o.min !== undefined && o.valor < o.min) || (o.max !== undefined && o.valor > o.max))) {
      aviso = o.faixa || ('Fora da faixa usual (' + f.num(o.min, casas) + ' a ' + f.num(o.max, casas) + (o.unidade ? ' ' + o.unidade : '') + '). Confira.');
    }
    var estado = '';
    if (o.fixo) estado = selo('demo', o.fixo, o.fonte);
    else if (o.padrao !== undefined) {
      estado = o.alterado
        ? selo('alterado', 'alterado por você') + '<button type="button" class="voltar" data-acao="voltar" data-caminho="' + o.caminho +
          '" title="' + esc(o.fonte || '') + '">voltar ao padrão (' + (o.textoPadrao || f.num(o.padrao, casas).replace(/,0+$/, '')) + ')</button>'
        : selo('norma', o.seloPadrao || 'padrão da norma', o.fonte);
    } else if (o.fonte) estado = selo('norma', 'fonte', o.fonte);
    return '<div class="campo' + (erro ? ' invalido' : '') + '">' +
      '<label for="' + o.id + '">' + esc(o.rotulo) + '</label>' +
      '<div class="entrada' + (o.fixo ? ' fixo' : '') + '">' +
        '<input class="num" id="' + o.id + '" type="text" inputmode="decimal" autocomplete="off" value="' + f.campo(o.valor, casas) + '"' +
        (o.fixo ? ' readonly' : ' data-caminho="' + o.caminho + '" data-tipo="' + (o.inteiro ? 'int' : 'num') + '"' + (o.padrao !== undefined || o.anulavel ? ' data-anulavel="1"' : '') +
          (o.negativo ? ' data-negativo="1"' : '')) + '>' +
        (o.unidade ? '<span class="un">' + esc(o.unidade) + '</span>' : '') +
      '</div>' +
      '<div class="estado">' + estado + '</div>' +
      (erro || aviso ? '<div class="msg" role="alert">' + esc(erro || aviso) + '</div>' : '') +
    '</div>';
  }

  function texto(o) {
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<input id="' + o.id + '" type="text" autocomplete="off" value="' + esc(o.valor) + '" placeholder="' + esc(o.dica || '') +
      '" data-caminho="' + o.caminho + '" data-tipo="txt"></div>' +
      (o.nota ? '<div class="fraco">' + esc(o.nota) + '</div>' : '') + '</div>';
  }

  function seletor(o) {
    var ops = o.opcoes.map(function (op) {
      var v = typeof op === 'string' ? op : op.v, t = typeof op === 'string' ? op : op.t;
      return '<option value="' + esc(v) + '"' + (v === o.valor ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<select id="' + o.id + '"' + (o.caminho ? ' data-caminho="' + o.caminho + '" data-tipo="sel"' : '') + (o.acaoSel ? ' data-acao-sel="' + o.acaoSel + '"' : '') + '>' + ops + '</select></div>' +
      '<div class="estado">' + (o.fonte ? selo('norma', o.seloTexto || 'fonte', o.fonte) : '') + '</div>' +
      (o.nota ? '<div class="fraco">' + esc(o.nota) + '</div>' : '') + '</div>';
  }

  function segmentado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div><div class="seg" role="group" aria-label="' + esc(o.rotulo) + '">' +
      o.opcoes.map(function (op) {
        return '<button type="button" data-acao="' + (o.acao || 'definir') + '" data-caminho="' + o.caminho + '"' + (o.campo ? ' data-campo="' + o.campo + '"' : '') + ' data-valor="' + esc(op.v) + '"' +
          (o.numerico ? ' data-numerico="1"' : '') + (o.booleano ? ' data-booleano="1"' : '') + ' aria-pressed="' + (op.v === o.valor) + '">' + esc(op.t) + '</button>';
      }).join('') + '</div></div>' + (o.fonte ? '<div class="estado">' + selo('norma', 'fonte', o.fonte) + '</div>' : '') + '</div>';
  }

  // Valor calculado: não se edita, e o clique abre a conta
  function calculado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div>' +
      '<button type="button" class="valor-calc num" data-acao="' + (o.chave ? 'conta' : 'fonte') + '"' +
      (o.chave ? ' data-chave="' + o.chave + '"' : ' data-fonte="' + esc(o.fonte || '') + '"') + '>' + esc(o.valor) +
      (o.unidade ? ' <small>' + esc(o.unidade) + '</small>' : '') + '</button></div>' +
      '<div class="estado">' + selo('calc', 'calculado') + (o.demo ? selo('demo', typeof o.demo === 'string' ? o.demo : 'valor do exemplo') : '') + '</div></div>';
  }

  function passos(lista) {
    return lista.map(function (p) {
      return '<div class="passo"><div class="q"><span>' + esc(p.passo) + '</span><span class="num">' + esc(p.resultado) + '</span></div>' +
        (p.formula ? '<div class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</div>' : '') +
        (p.fonte ? '<div class="fo">' + esc(p.fonte) + '</div>' : '') + '</div>';
    }).join('');
  }

  function aprender(html) {
    return daTela().aprender ? '<div class="aprender"><b>Por quê?</b> ' + html + '</div>' : '';
  }

  // Cabeçalho de tela: linha de contexto, título e texto de apoio (o texto aceita HTML do app)
  function cabeca(sobre, titulo, texto) {
    return '<div class="cabeca"><div class="sobre">' + esc(sobre) + '</div><h1>' + esc(titulo) + '</h1>' + (texto ? '<p>' + texto + '</p>' : '') + '</div>';
  }

  // Indicador: rótulo, valor e, se houver, uma linha de apoio
  function kpi(rotulo, valor, sub) {
    return '<div class="kpi-c"><span>' + rotulo + '</span><b class="num">' + valor + '</b>' + (sub ? '<span class="fraco">' + sub + '</span>' : '') + '</div>';
  }

  /* Bloco recolhível com frase-resumo. id (chave em U.aberto), n (número), titulo, frase, carga (valor à direita), rotuloCarga,
     corpo (função que devolve o HTML; só é chamada com o bloco aberto) */
  function bloco(id, n, titulo, frase, carga, rotuloCarga, corpo) {
    var aberto = !!(daTela().aberto || {})[id];
    return '<section class="bloco' + (aberto ? ' aberto' : '') + '" id="bloco-' + id + '">' +
      '<button type="button" class="bloco-cab" data-acao="bloco" data-bloco="' + id + '" aria-expanded="' + aberto + '">' +
        '<span class="n">' + n + '</span><span><span class="tit">' + titulo + '</span><span class="frase">' + esc(frase) + '</span></span>' +
        '<span class="carga num">' + carga + (rotuloCarga ? '<small>' + rotuloCarga + '</small>' : '') + '</span><span class="seta" aria-hidden="true">›</span>' +
      '</button>' + (aberto ? '<div class="bloco-corpo">' + corpo() + '</div>' : '') + '</section>';
  }

  /* Barras ordenadas da maior para a menor; cada linha abre a conta. lista = [{ chave, nome, valor }]; total = base do percentual;
     unidade = texto depois do valor; casas = casas decimais do valor (padrão 0) */
  function barras(lista, total, unidade, casas) {
    var max = 0, min = 0;
    lista.forEach(function (c) { max = Math.max(max, c.valor); min = Math.min(min, c.valor); });
    var faixa = (max - min) || 1, zero = (-min / faixa) * 100;
    var ordenado = lista.slice().sort(function (a, b) { return b.valor - a.valor; });
    return '<div class="barras">' + ordenado.map(function (c) {
      var larg = Math.abs(c.valor) / faixa * 100;
      var estilo = c.valor >= 0 ? 'left:' + zero.toFixed(2) + '%;width:' + larg.toFixed(2) + '%' : 'left:' + (zero - larg).toFixed(2) + '%;width:' + larg.toFixed(2) + '%';
      return '<div class="linha-b" data-acao="conta" data-chave="' + c.chave + '" role="button" tabindex="0" title="Abrir a conta">' +
        '<span class="nome">' + esc(c.nome) + '</span>' +
        '<span class="trilho"><span class="eixo" style="left:' + zero.toFixed(2) + '%"></span><span class="barra' + (c.valor < 0 ? ' neg' : '') + '" style="' + estilo + '"></span></span>' +
        '<span class="v">' + f.num(c.valor, casas || 0) + (unidade ? ' ' + unidade : '') + '</span><span class="p">' + f.num(c.valor / total * 100, 0) + ' %</span></div>';
    }).join('') + '</div>';
  }

  // Os mesmos passos da gaveta, em tabela, para a folha do memorial
  function tabPassos(lista) {
    return '<table class="passos-t"><thead><tr><th>Passo</th><th>Fórmula e valores</th><th class="num">Resultado</th><th>Fonte</th></tr></thead><tbody>' +
      lista.map(function (p) {
        return '<tr><td>' + esc(p.passo) + '</td><td class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</td><td class="num">' + esc(p.resultado) + '</td><td>' + esc(p.fonte) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* Lista de cartões do celular (v0.4.0): oculta no computador (o app desenha também a tabela, marcada com .so-computador).
     itens = [{ href (tela que o cartão abre; sem href o cartão não é link), titulo, sub (texto depois do título),
     valores: [{ r (rótulo), v (valor já formatado), u (unidade) }] (valor vazio ou "—" não aparece), situacao (HTML do app),
     destaque (bool: barra lateral, como o circuito crítico) }] */
  function cartoes(itens) {
    return '<ul class="cel-cartoes">' + itens.map(function (x) {

  });

  // Teclado aberto (C15): com um campo de digitação em foco, a barra de passos e a faixa somem (classe no body, só em tela estreita)
  function campoDeDigitar(el) {
    if (!el || el.readOnly || el.disabled) return false;
    if (el.tagName === 'TEXTAREA') return true;
    return el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|reset|range|color)$/i.test(el.type);

  document.addEventListener('focusin', function (ev) { if (celular() && campoDeDigitar(ev.target)) document.body.classList.add('cel-digitando'); });

  H.ui.projeto = function () { return E; };

  };

  // Topo: nome do app, rótulo de versão, ícone próprio (opcional) e botão de ajuda (só quando o manifesto traz itens de ajuda)
  function montarTopo() {

    for (k in A.estado || {}) if (tem(A.estado, k)) U[k] = A.estado[k];

 * do app, sem norma: servem para barrar erro de digitação, não para dizer o que é bom projeto.
 * Campo de configuração: { nivel, grupo, cam (caminho dentro de projeto.config), rot, un, casas, inteiro, min, max, aberto }

  // Nível 1
  add(1, N1, 'velocidadeMinBoca', 'Velocidade efetiva mínima na boca (abaixo: alerta de boca superdimensionada)', 'm/s', 2, 0, 10, ABERTO);

  add(2, G_ARR, 'arranjo.proporcaoMin', 'Proporção mínima da célula (sx/sy)', '', 2, 0.1, 1);
  add(2, G_ARR, 'arranjo.proporcaoMax', 'Proporção máxima da célula', '', 2, 1, 10);

  add(2, G_RET, 'retorno.areaMaxPorGrelha', 'Área máxima por grelha', 'm²', 0, 1, 500);
  add(2, G_RET, 'retorno.distMaxDifusor', 'Distância máx. difusor → grelha mais próxima', 'm', 1, 0.5, 50);
  add(2, G_RET, 'retorno.vJatoAlerta', 'Jato na grelha: alerta acima de', 'm/s', 2, 0.05, 2);
  add(2, G_RET, 'retorno.vJatoReprova', 'Jato na grelha: reprova acima de', 'm/s', 2, 0.05, 2);
  add(2, G_RET, 'retorno.margemParede', 'Margem às paredes', 'm', 2, 0, 5);

  add(2, G_RET, 'retorno.penalGrelhaExtra', 'Penalidade por grelha além do mínimo (fragmentação)', '', 2, 0, 1);
  add(2, G_RET, 'retorno.penalNaoModular', 'Fator para tamanho fora do forro modular', '', 2, 0, 1, ABERTO);
  // Nível 3
  [['t50L', 'Aderência T50/L'], ['acustica', 'Folga acústica'], ['dp', 'Folga de Δp'], ['zona', 'Zona ocupada e altura'], ['velocidade', 'Centralidade da velocidade na boca'], ['pecas', 'Economia de peças']]

   * vazio, texto e número negativo; aqui entram os limites próprios. As mensagens repetem as da tela da v2.1.3 onde havia. */
  var LIMITES = [
    [/^projeto\.altitude$/, 0, 5000, false, 'Digite uma altitude entre 0 e 5.000 m.'],

    [/\.ar\.qs$/, 0, 1e8, true, 'Informe o calor sensível do ambiente (maior que zero).'],
    [/\.ar\.dT$/, 0, 30, true, 'Informe o ΔT, maior que zero e até 30 °C (o app trata só resfriamento).'],
    [/\.ar\.to$/, 15, 35, false, 'Informe a temperatura operativa (15 a 35 °C).'],
    [/\.ar\.ur$/, 1, 100, false, 'Informe a umidade relativa (1 a 100 %).'],
    [/\.ar\.retornoPct$/, 0, 100, false, 'Entre 0 e 100%.'],
    [/\.crit\.dbaMax$/, 0, 120, true, 'Informe o limite em dB(A) (maior que zero).'],
    [/\.crit\.dpMaxPa$/, 0, 2000, true, 'Informe a perda de carga máxima, em Pa (maior que zero).'],
    [/\.crit\.vzoMax$/, 0, 2, true, 'Informe a velocidade limite (maior que zero e até 2 m/s).'],
    [/\.retorno\.(hMax|lMax)$/, 0, 5000, true, 'Digite um número maior que zero, em mm, ou deixe vazio (sem limite).']
