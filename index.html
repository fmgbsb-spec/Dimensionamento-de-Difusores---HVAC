    lista.forEach(function (o) { Object.keys(o).forEach(function (k) { if (cols.indexOf(k) < 0 && (excluir || []).indexOf(k) < 0 && typeof o[k] !== 'function') cols.push(k); }); });
    if (cols.indexOf('id') >= 0 && lista.every(function (o) { return typeof o.nome === 'string' || typeof o.texto === 'string'; })) cols.splice(cols.indexOf('id'), 1);   // o código interno sai quando a linha tem nome ou descrição
    return rolo('<table class="sel-tab"><thead><tr>' + cols.map(function (k) { return '<th>' + esc(rot(k)) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      lista.map(function (o) { return '<tr>' + cols.map(function (k) { return '<td>' + val(o[k]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
  }
  // Mapa de itens com nome ({ chave: { nome, min, max... } }): uma tabela, uma linha por item, com o código da chave
  function tabelaItens(mapa, chaves) {
    var lista = chaves.map(function (k) { var o = {}, s = mapa[k]; o.nome = s.nome; Object.keys(s).forEach(function (c) { if (c !== 'nome') o[c] = s[c]; }); o.__chave = k; return o; });
    var cols = ['nome'];
    lista.forEach(function (o) { Object.keys(o).forEach(function (k) { if (k !== '__chave' && cols.indexOf(k) < 0) cols.push(k); }); });
    return rolo('<table class="sel-tab"><thead><tr>' + cols.map(function (k) { return '<th>' + esc(rot(k)) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      lista.map(function (o) { return '<tr>' + cols.map(function (k) { return '<td>' + val(o[k]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
  }
  // Percorre o objeto inteiro: linhas de cabeçalho (edição, cláusula, fonte, fórmula, texto), tabela de campos simples,
  // tabela dos itens com nome, tabela das listas de objetos e um sub-bloco para cada objeto aninhado
  function blocoDado(titulo, obj, nivel, excluir) {
    var h = '<div class="ref-b">' + (titulo ? '<h' + nivel + '>' + titulo + '</h' + nivel + '>' : ''), usadas = {}, linhas = [], subs = '', itens = [], k;
    CAB.forEach(function (c) {
      if (typeof obj[c[0]] === 'string') { usadas[c[0]] = true; h += c[1] ? '<p class="ref-l"><b>' + c[1] + ':</b> ' + esc(obj[c[0]]) + '</p>' : '<p class="ref-l">' + esc(obj[c[0]]) + '</p>'; }
    });
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      if (usadas[k] || typeof v === 'function' || (excluir || []).indexOf(k) >= 0) return;
      if (isObj(v) && typeof v.nome === 'string' && !Object.keys(v).some(function (c) { return isObj(v[c]); })) itens.push(k);
      else if (isObj(v)) subs += blocoDado(esc(rot(k)), v, Math.min(nivel + 1, 4));
      else if (Array.isArray(v) && v.length && v.every(isObj)) subs += '<h' + Math.min(nivel + 1, 4) + '>' + esc(rot(k)) + '</h' + Math.min(nivel + 1, 4) + '>' + tabelaObjs(v);
      else linhas.push('<tr><td class="chave">' + esc(rot(k)) + '</td><td>' + val(v) + '</td></tr>');
    });
    if (linhas.length) h += rolo('<table class="sel-tab"><thead><tr><th>Campo</th><th>Valor</th></tr></thead><tbody>' + linhas.join('') + '</tbody></table>');
    if (itens.length) h += tabelaItens(obj, itens);
    return h + subs + '</div>';
  }

  function secao(s, corpo) {
    return '<section class="cartao ref-sec" id="' + s.id + '"><h2>' + esc(s.titulo) + '</h2>' + corpo + '</section>';
  }

  // Base TROX: o conteúdo de baseHtml da tela da v2.1.3 (retirada na v3.0.0; paineis.js), cada família em <details>
  function baseTrox() {
    var T = D.dados.trox, h = '<p class="fraco">' + esc(D.versaoBase) + ' · <button type="button" class="voltar" data-acao="exportar-base">exportar JSON</button></p>';
    [T.ADLQ, T.ADLR].forEach(function (q) {
      h += '<details><summary><b>' + esc(q.nome) + '</b> — ' + esc(q.fonte) + '</summary>';
      Object.keys(q.pontos).forEach(function (t) {
        var tm = q.tamanhos[t];
        h += '<h4>Tamanho ' + t + ' — Ø' + tm.D + ' mm, colarinho Ø' + tm.colarinho + ' mm, Feff ' + f.num(tm.feff, 4) + ' m²</h4>' + rolo('<table class="sel-tab"><thead><tr><th class="num">Q (m³/h)</th><th class="num">Veff (m/s)</th><th class="num">Δp (mmCA)</th><th class="num">LN dB(A)</th><th class="num">X a 0,5 m/s (m)</th><th class="num">X a 0,3 m/s (m)</th></tr></thead><tbody>' +
          q.pontos[t].map(function (p) { return '<tr>' + p.map(function (v, i) { return '<td class="num">' + f.num(v, i === 0 ? 0 : (i === 3 ? 0 : 2)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
      });
      h += '</details>';
    });
    var a = T.ADE;
    h += '<details><summary><b>' + esc(a.nome) + '</b> — ' + esc(a.fonte) + '</summary><p class="fraco">Por Veff (m/s): ' + a.veff.join(' / ') + ' → Δp (mmCA): ' + a.dp.join(' / ') + ' → dB(A): ' + a.db.join(' / ') + '</p>';
    Object.keys(a.tabela).forEach(function (ab) {
      h += '<h4>' + ab + ' aberturas</h4>' + rolo('<table class="sel-tab"><thead><tr><th>Comp. (mm)</th>' + a.veff.map(function (v) { return '<th class="num">' + v + ' m/s</th>'; }).join('') + '</tr></thead><tbody>' +
        Object.keys(a.tabela[ab]).map(function (c) { var l = a.tabela[ab][c]; return '<tr><td>' + c + '</td>' + l.q.map(function (qv, i) { return '<td class="num">' + (qv == null ? '—' : qv + ' m³/h<br><span class="fraco">' + (l.alc[i] ? l.alc[i][0] + '–' + l.alc[i][1] + ' m' : '') + '</span>') + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
    });
    h += '</details>';
    var g = T.grelhasRetorno;
    Object.keys(g.dados).forEach(function (fam) {
      h += '<details><summary><b>' + esc(g.familias[fam].nome) + '</b> — TROX ' + esc(g.familias[fam].catalogo) + ' (' + Object.keys(g.dados[fam]).length + ' tamanhos)</summary>' +
        rolo('<table class="sel-tab"><thead><tr><th>H × L (mm)</th><th class="num">Q mín–máx (m³/h)</th><th>Pontos Q (m³/h) → Δp (mmCA) / dB(A)</th></tr></thead><tbody>' +
        Object.keys(g.dados[fam]).sort(function (x, y) { var a1 = x.split('x').map(Number), b1 = y.split('x').map(Number); return a1[0] - b1[0] || a1[1] - b1[1]; }).map(function (k) {
          var p = g.dados[fam][k];
          return '<tr><td>' + k.replace('x', ' × ') + '</td><td class="num">' + p[0][0] + '–' + p[p.length - 1][0] + '</td><td class="fraco">' + p.map(function (x) { return x[0] + '→' + f.num(x[1], 2) + '/' + (x[2] == null ? '—' : x[2]); }).join(' · ') + '</td></tr>';
        }).join('') + '</tbody></table>') + '</details>';
    });
    var ai = T.altaInducao || {};
    Object.keys(ai).forEach(function (fam) {
      var fa = ai[fam], un = fa.un === 'ls' ? 'l/s' : 'm³/h';
      h += '<details><summary><b>' + esc(fa.nome) + '</b> — TROX ' + esc(fa.fonte) + ' (diagramas digitalizados: ' + esc(fa.pagJato) + '; ' + esc(fa.pagAcustica) + ')</summary>' +
        rolo('<table class="sel-tab"><thead><tr><th>Tamanho</th><th class="num">Vazão (' + un + ')</th><th class="num">Aeff (m²)</th><th class="num">K de v_L·L/V</th><th>Δpt (Pa), entrada H</th><th>Δpt (Pa), entrada V</th><th class="num">V com LWA ' + fa.lRef + ' dB(A): H / V</th></tr></thead><tbody>' +
        Object.keys(fa.tamanhos).map(function (k) {
          var t = fa.tamanhos[k]; function dp(e) { return f.num(e.dp[0], 2) + '·(V/' + f.num(e.dp[1], 1) + ')^' + f.num(e.dp[2], 2); }
          return '<tr><td>' + esc(t.rotulo) + '</td><td class="num">' + t.vMin + '–' + t.vMax + '</td><td class="num">' + (t.aeff ? f.num(t.aeff, 4) : '—') + '</td><td class="num">' + f.num(t.K, 5) + '</td><td>' + dp(t.ent.H) + '</td><td>' + dp(t.ent.V) + '</td><td class="num">' + f.num(t.ent.H.l40 || t.ent.H.l35, 0) + ' / ' + f.num(t.ent.V.l40 || t.ent.V.l35, 0) + '</td></tr>';
        }).join('') + '</tbody></table>') +
        '<p class="fraco">Parede: v_L = K·V·f_mont·f_A / L, com L = distância horizontal + H1; f_A: ' + fa.fA.map(function (p) { return 'A ' + (p === fa.fA[fa.fA.length - 1] ? '≥ ' : '') + f.num(p[0], 1) + ' m → ' + f.num(p[1], 2); }).join('; ') + '. Montagem: ' + esc(fa.notaMontagem) + '. Entre difusores: curvas v_H1 × espaçamento dos diagramas (tabelas em alta-inducao.js). Altura de aplicação: ' + (fa.alturaMax ? f.num(fa.alturaMin, 2) + ' a ' + f.num(fa.alturaMax, 2) + ' m' : '≥ ' + f.num(fa.alturaMin, 2) + ' m') + '.</p></details>';
    });
    h += '<h3>Dados do catálogo interpretados (premissa declarada)</h3>' + rolo('<table class="sel-tab"><thead><tr><th>Família</th><th>Ponto</th><th>Campo</th><th>Impresso</th><th>Adotado</th><th>Motivo</th></tr></thead><tbody>' +
      T.ADLQ.aConfirmar.map(function (c) { return '<tr><td>ADLQ</td><td>tam. ' + c.tam + ', ' + c.q + ' m³/h</td><td>' + c.campo + '</td><td>' + esc(c.original) + '</td><td>' + esc(String(c.usado)) + '</td><td>' + esc(c.motivo) + '</td></tr>'; }).join('') +
      T.ADE.aConfirmar.map(function (c) { return '<tr><td>ADE</td><td>' + c.ab + ' ab., ' + c.comp + ' mm, ' + c.veff + ' m/s</td><td>' + c.campo + '</td><td>' + esc(c.original) + '</td><td>' + esc(String(c.usado)) + '</td><td>' + esc(c.motivo) + '</td></tr>'; }).join('') +
      T.ADLR.aConfirmar.map(function (c) { return '<tr><td>ADLR</td><td>tam. ' + c.tam + ', ' + c.q + ' m³/h</td><td>' + c.campo + '</td><td>' + esc(c.original) + '</td><td>' + esc(String(c.usado)) + '</td><td>' + esc(c.motivo) + '</td></tr>'; }).join('') +
      g.aConfirmar.map(function (c) { return '<tr><td>' + c.familia.replace('_', '/') + '</td><td>' + c.q + ' m³/h (' + c.ref + ')</td><td>' + c.campo + '</td><td>' + esc(c.original) + '</td><td>' + esc(String(c.usado)) + '</td><td>' + esc(c.motivo) + '</td></tr>'; }).join('') + '</tbody></table>');
    var lista = T.ADLQ.celulasNaoMonotonas.concat(g.celulasNaoMonotonas);
    h += '<h3 id="celulas-nao-monotonas">Células não monótonas do catálogo, usadas como impressas (' + lista.length + ')</h3><p class="fraco">Células em que o valor impresso diminui quando a vazão aumenta. Desde a v2.1.2 nenhuma é corrigida: o cálculo usa o valor impresso. ' +
      'A coluna "tendência dos vizinhos" não entra no cálculo; serve só de referência para ver o tamanho do desvio. Nas grelhas, a mesma coluna do catálogo vale para vários tamanhos de área equivalente, por isso uma célula impressa aparece em mais de uma linha.</p>' +
      rolo('<table class="sel-tab"><thead><tr><th>Tabela</th><th class="num">Q (m³/h)</th><th>Campo</th><th class="num">Impresso (usado)</th><th class="num">Tendência dos vizinhos</th></tr></thead><tbody>' +
      lista.map(function (c) { return '<tr><td>' + esc(c.tabela) + '</td><td class="num">' + c.x + '</td><td>' + c.campo + '</td><td class="num">' + f.num(c.impresso, 2) + '</td><td class="num">' + f.num(c.tendencia, 2) + '</td></tr>'; }).join('') + '</tbody></table>');
    return h;
  }

  function premissas() {
    return rolo('<table class="sel-tab"><thead><tr><th>Item</th><th>O que o app adota</th><th>Fonte</th><th>Situação</th></tr></thead><tbody>' + D.motor.premissas().map(function (p) {
      return '<tr data-premissa="' + esc(p.id) + '"><td>' + esc(p.titulo) + '</td><td>' + esc(p.texto) + '</td><td class="fonte">' + esc(p.fonte) + '</td><td>' + esc(p.situacao) + '</td></tr>';
    }).join('') + '</tbody></table>');
  }

  // As regras de distribuição do retorno e de arranjo são configurações do projeto: valor em uso e padrão do app
  function regras(E) {
    var CAT = H.ui.cat, lin = CAT.config.filter(function (c) { return /^(retorno|arranjo)\./.test(c.cam); });
    function txt(c, v) { return typeof v === 'number' ? numTxt(v) + (c.un ? ' ' + esc(c.un) : '') : '—'; }
    return rolo('<table class="sel-tab"><thead><tr><th>Regra</th><th class="num">Valor em uso</th><th class="num">Padrão do app</th></tr></thead><tbody>' + lin.map(function (c) {
      return '<tr><td>' + esc(c.rot) + '</td><td class="num">' + txt(c, CAT.ler(E.projeto.config, c.cam)) + '</td><td class="num">' + txt(c, CAT.padraoConfig(c.cam)) + '</td></tr>';
    }).join('') + '</tbody></table>') + '<p class="fraco">Editáveis em Projeto, Mais opções.</p>';
  }

  function tela(E) {
    D.motor.config = E.projeto.config;
    var N = D.dados.normas, S = {};
    SECOES.forEach(function (s) { S[s.id] = s; });
    var s = H.ui.c.cabeca('Referências', 'Referências', 'Tabelas de norma e de prática que o app usa, só para leitura, cada uma com a fonte.');
    s += '<nav class="ref-nav" aria-label="Seções de Referências">' + SECOES.map(function (x) { return '<button type="button" class="botao leve" data-acao="ir-referencia" data-ref="' + x.id + '">' + esc(x.titulo) + '</button>'; }).join('') + '</nav>';
    s += secao(S['ref-normas'], '<p class="fraco">Base técnica principal: ABNT NBR 16401-1, -2 e -3:2024 e ASHRAE Handbook — Fundamentals 2021 (cap. 20 Space Air Diffusion, cap. 9 Thermal Comfort). Cada verificação do app cita a cláusula. Os textos das normas não são reproduzidos: a tabela resume cada cláusula na forma usada pelo app. Conferir sempre com as edições vigentes.</p>' + rolo(tabelaNormas()));
    s += secao(S['ref-ruido'], blocoDado(null, N.nbr10152, 3));
    s += secao(S['ref-conforto'], blocoDado(null, N.nbr16401_2, 3));
    s += secao(S['ref-ez'], blocoDado(null, N.nbr16401_3, 3));
    s += secao(S['ref-rede'], blocoDado(null, N.nbr16401_1, 3));
    s += secao(S['ref-pratica'], blocoDado('Velocidades nas bocas de ar (prática de projeto)', N.bocas, 3) + blocoDado('ASHRAE Handbook — Fundamentals 2021 (alcance ÷ comprimento característico e demais dados)', N.ashrae, 3) +
      '<div class="ref-b"><h3>Regras de distribuição do retorno e de arranjo</h3>' + regras(E) + '</div>');
    s += secao(S['ref-trox'], baseTrox());
    s += secao(S['ref-premissas'], '<p class="fraco">O que o cálculo adota sem documento-fonte primário na biblioteca (fonte secundária, CONFERIR ou premissa declarada com o efeito medido), por prática de projeto ou por critério do app. A mesma lista vai ao memorial.</p>' + premissas());
    s += secao(S['ref-local'], '<p>Projeto novo começa na altitude de Brasília: <b>' + f.num(D.util.formato4.ALTITUDE_PADRAO, 0) + ' m</b> (ABNT NBR 16401-1:2024, Anexo A, Tabela A.2, Dados locais das cidades: Brasília, DF; o ASHRAE Handbook — Fundamentals 2021, cap. 14, lista a estação de Brasília com a mesma elevação). Altitude em uso neste projeto: <b>' +
      f.num(E.projeto.altitude, 0) + ' m</b> (Projeto, bloco Local).</p>');
    return s;
  }

  // Vai à tela e rola até a seção (a paleta e os botões de seção usam)
  function ir(id) {
    function rola() { var el = document.getElementById(id); if (el && el.scrollIntoView) el.scrollIntoView(); }
    if (location.hash !== '#/referencias') location.hash = '#/referencias';
    setTimeout(rola, 120);
  }

  H.ui.telaReferencias = { NORMAS: NORMAS, tabelaNormas: tabelaNormas, SECOES: SECOES, tela: tela, ir: ir };
})(window.HVAC, window.Difusores);

</script>
<script>
/* ==== js/interface/memorial3.js ==== */
/* Memorial de cálculo e "Antes de emitir" (v3.0.0, sessão T3, etapa 1). Rotas #/memorial (projeto inteiro) e #/memorial/N (só o ambiente N).
   A tela não calcula nada: todo número vem do resultado do motor ou do rastro (D.util.escolha.resolver); as contas de tela são só
   mmCA → Pa e m³/h → L/s, como na Seleção. As frases e as tabelas da Seleção vêm de H.ui.telaSelecao.pecas, sem mudar o que devolvem;
   o que só existia na tela da v2.1.3 (retirada na v3.0.0; memorial.js, resultados.js, planta.js) é copiado aqui com as trocas aprovadas (nomes no lugar
   das siglas, °C, "Projeto, Mais opções" no lugar de "Configurações"). Dentro da folha nada depende da cor do tema (difusores.css).
   As marcas data-g das colunas do gabarito são as da Seleção e aparecem uma vez por ambiente, na subseção "Solução adotada".
   Especificação: sessão T3, seção 1.3. */
(function (H, D) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, AD = D.util.adaptador, ESC = D.util.escolha, EM = D.util.emissao, TS = H.ui.telaSelecao, P = TS.pecas, PA = AD.PA_POR_MMCA;
  var SELO = P.SELO, POSTURA = { emPe: 'em pé', sentado: 'sentado' };
  var GRUPOS = { ambiente: 'Ambiente e vazões', ar: 'Propriedades do ar', produto: 'Dados do terminal (catálogo TROX)', alcance: 'Alcance e comprimento característico', zona: 'Zona ocupada, conforto e eficácia da distribuição', acustica: 'Acústica' };
  var ORDEM = ['ambiente', 'ar', 'produto', 'alcance', 'zona', 'acustica'];

  // ---------------------------------------------------------------- auxiliares
  function ok(v) { return v !== null && v !== undefined && v !== '' && !isNaN(v); }
  function nomeDe(amb) { return amb.nome || 'Ambiente sem nome'; }
  function dataHoje() { var d = new Date(); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
  function mesmaIns(x, s) { return ESC.sIns(ESC.chaveIns(x.cand)) === ESC.sIns(ESC.chaveIns(s.cand)); }
  function nPend(r) { return Object.keys(r.erros).length; }
  function rotuloCfg(cam) { var c = H.ui.cat.porCam[cam]; return c ? c.rot : cam; }
  function cfgTxt(cam, v) { var c = H.ui.cat.porCam[cam]; return (typeof v === 'number' ? String(v).replace('.', ',') : '—') + (c && c.un ? ' ' + c.un : ''); }

  // Na folha a situação e a fonte vão em texto: o selo colorido e o botão "fonte" da Seleção viram texto do mesmo campo
  function emTexto(html) {
    return html.replace(/<span class="selo sit sit-[a-z]+">([^<]*)<\/span>/g, '<span class="sit-t">$1</span>')
      .replace(/<button type="button" class="selo norma" data-acao="fonte" data-fonte="([^"]*)" title="Ver a fonte">[^<]*<\/button>/g, '<span class="fonte-m">$1</span>');
  }
  function sitTxt(s) { return '<span class="sit-t">' + esc(SELO[s.selo] || s.selo) + '</span>'; }
  function linhaCV(c, val) { return '<tr><td class="chave">' + esc(c) + '</td><td>' + val + '</td></tr>'; }
  function tabCV(linhas) { return '<table class="sel-tab"><tbody>' + linhas.join('') + '</tbody></table>'; }
  function lista(itens) { return '<ul class="lista-m">' + itens.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>'; }

  // Texto de regulagem, de zona e de planta que só existiam na tela da v2.1.3 (retirada na v3.0.0; resultados.js, planta.js)
  function regTxt(e) { var r = e.crit.registro; return r === 'sem' ? 'sem registro na peça' : r === 'aberto' ? 'registro 100 % aberto' : 'registro ' + r + ' % aberto'; }
  function recuosTxt(a) { var r = a.zona.recuo; return 'x = 0: ' + f.num(r['-x'], 1) + ' m · x = C: ' + f.num(r['+x'], 1) + ' m · y = 0: ' + f.num(r['-y'], 1) + ' m · y = L: ' + f.num(r['+y'], 1) + ' m'; }
  var PAREDE_NOME = H.ui.planta3 && H.ui.planta3.PAREDE_NOME ? H.ui.planta3.PAREDE_NOME : { x0: 'parede x = 0', xC: 'parede x = C', y0: 'parede y = 0', yW: 'parede y = L' };

  // ---------------------------------------------------------------- tabelas copiadas da tela da v2.1.3 (retirada na v3.0.0; memorial.js)
  function tabelaPassos(passos, prefixo) {
    var h = '', n = 0, vistos = {};
    function grupo(g, titulo) {
      var l = passos.filter(function (p) { return p.grupo === g; });
      if (!l.length) return;
      h += '<h4>' + esc(titulo) + '</h4><table class="passos-m"><thead><tr><th>Item</th><th>Grandeza</th><th>Fórmula</th><th>Substituição</th><th class="num">Resultado</th><th>Fonte</th></tr></thead><tbody>';
      l.forEach(function (p) {
        n++;
        var val = p.valor === null || p.valor === undefined ? '—' : f.numU(p.valor, p.casas === undefined ? 2 : p.casas, p.unidade);
        h += '<tr><td>' + prefixo + '.' + n + '</td><td>' + esc(p.titulo) + '</td><td class="f">' + esc(p.formula) + '</td><td class="f">' + esc(p.subst) + '</td><td class="num"><b>' + esc(val) + '</b></td><td class="fonte">' + esc(p.fonte) + '</td></tr>';
      });
      h += '</tbody></table>';
    }
    ORDEM.forEach(function (g) { vistos[g] = true; grupo(g, GRUPOS[g]); });
    passos.forEach(function (p) { if (p.grupo && !vistos[p.grupo]) { vistos[p.grupo] = true; grupo(p.grupo, p.grupo); } });   // grupo fora da lista conhecida: não se perde

  }

  // De onde vem o limite de ruído do ambiente: a mesma regra de limiteAcustico do motor (finalidade sem valor na norma) e o caso do limite digitado

  // Recomendações de rede e balanceamento (NBR 16401-1:2024, seções 10 e 17): secaoRede da tela da v2.1.3 (retirada na v3.0.0)
  function itensRede(e, a, s, r) {
    var n1 = D.dados.normas.nbr16401_1, tol = n1.tab.tolerancia, it = [];
    if (s) {
      it.push('<b>Insuflamento:</b> ' + s.n + ' boca(s) de ' + f.num(s.Qp, 0) + ' m³/h. Cada boca em ramal próprio derivado do duto-tronco (10.1.2 e 10.1.3 — bocas não diretamente no tronco, salvo ambiente único); registro de regulagem em cada ramal (10.6.1): ' + (e.crit.regulagemRamal ? 'previsto' : '<b>não previsto — recomenda-se prever</b>') + '. Registro na peça: ' + esc(regTxt(e)) + (e.crit.registro === '25' ? ' — <b>fechado 75 %, acima dos 50 % recomendados (10.6.2, ruído)</b>' : '') + '. Registros de lâminas múltiplas de ação oposta (10.6.3). A distribuição correta deve resultar do projeto; os registros servem só para pequenos ajustes (10.6.2).');
      it.push('<b>Tolerância de balanceamento (17.6.3):</b> ±' + f.num(tol * 100, 0) + ' % por boca e ramal → cada difusor entre ' + f.num(s.Qp * (1 - tol), 0) + ' e ' + f.num(s.Qp * (1 + tol), 0) + ' m³/h; ±' + f.num(n1.tab.toleranciaTronco * 100, 0) + ' % nos dutos principais.');
    }
    if (r && a.Qret > 0) {
      if (e.retorno.tipo === 'plenum') it.push('<b>Retorno por plenum:</b> ' + r.n + ' grelha(s) iguais de ' + f.num(r.Qp, 0) + ' m³/h. Sem ramais: o entreforro é o caminho do ar e a distribuição das grelhas (seção anterior) define o escoamento; rota de ar acessível e passível de limpeza e higienização (NBR 16401-3:2024, 7.5.1 a 7.5.3); regulagem na própria grelha (9.1.2).');
      else it.push('<b>Retorno dutado:</b> ' + r.n + ' ramal(is) iguais de ' + f.num(r.Qp, 0) + ' m³/h, um por grelha, com registro (10.6.1); fechamento ≤ 50 % (10.6.2); tolerância ±10 % → ' + f.num(r.Qp * (1 - tol), 0) + ' a ' + f.num(r.Qp * (1 + tol), 0) + ' m³/h por grelha (17.6.3).');

    }
    it.push('<b>Perda de carga unitária dos dutos (10.2.3.1):</b> recomendada ' + f.num(n1.perdaUnitaria.recomendada[0], 1) + ' a ' + f.num(n1.perdaUnitaria.recomendada[1], 1) + ' Pa/m (faixa ' + f.num(n1.perdaUnitaria.faixa[0], 1) + ' a ' + f.num(n1.perdaUnitaria.faixa[1], 1) + ' Pa/m) — o dimensionamento dos dutos está fora do escopo deste memorial.');
    it.push('<b>Vazão variável (9.2.2):</b> em sistemas VAV, repetir a seleção na vazão mínima (alcance e velocidade do ar na zona ocupada caem com a vazão).');
    it.push('<b>Ruído (7.4.1, 10.9.4):</b> limite ' + f.num(e.crit.dbaMax, 0) + ' dB(A) (' + origemRuido(e) + ')' + (e.crit.dbaMax < n1.especialista.dbaEquivalente ? ' — sistemas críticos que exijam nível de ruído inferior a NC 30 (equivalência do app: ≈ abaixo de 35 dB(A)): projeto de tratamento acústico com a assistência de um especialista' : '') + '.');

  // ---------------------------------------------------------------- seções do fim (copiadas de memorial.js, com as trocas)

  // ---------------------------------------------------------------- CSV das alternativas
  function csv(E, i) {
    var F = D.util.fmt, sep = ';', S = P, cab = ['Ambiente', '#', 'Tipo', 'Alternativa', 'Peças', 'Q por peça (m³/h)', 'Velocidade (m/s)', 'Δp (mmCA)', 'LN (dB(A))', 'Ruído no ambiente (dB(A))', 'Alcance mín (m)', 'Alcance máx (m)',

    E.ambientes.forEach(function (amb, k) {
      if (typeof i === 'number' && k !== i) return;
      var r = ESC.resolver(amb, E.projeto).r, res = r.res, nome = nomeDe(amb);
      if (!res) return;
      res.insuflamento.forEach(function (s, j) { lin.push([nome, j + 1, 'Insuflamento', s.titulo, s.n, F.num(s.Qp, 0), F.num(s.vFace, 2), F.num(s.dp, 2), F.num(s.ln, 1), F.num(s.lp, 1), F.num(s.xMin, 2), F.num(s.xMax, 2), F.num(s.t50L, 2), F.num(s.vzo, 3), F.num(s.draft, 1), F.num(s.ez.valor, 1), '', S.SELO[s.selo], F.num(s.indice.total, 1), S.motivos(s)]); });
      res.retorno.forEach(function (s, j) { lin.push([nome, j + 1, 'Retorno', s.titulo, s.n, F.num(s.Qp, 0), F.num(s.vFace, 2), F.num(s.dp, 2), F.num(s.ln, 1), F.num(s.lp, 1), '', '', '', '', '', F.num(s.ez.valor, 1), F.num(s.vJato, 2), S.SELO[s.selo], F.num(s.indice.total, 1), S.motivos(s)]); });
    });
    var txt = String.fromCharCode(65279) + lin.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(sep); }).join('\r\n');

  // 1. Solução adotada: as mesmas expressões e marcas data-g de secResposta, secNumeros e secRetorno da Seleção
  function subResposta(E, i, v, n) {
    var amb = E.ambientes[i], s = v.sup, rt = v.ret, a = v.r.res.amb, e = v.r.e, comRet = !!(rt && typeof rt.lpTotal === 'number');

    var L = [
      linhaCV('Solução adotada', esc(AD.rotuloSolucao(s))),
      linhaCV('Arranjo', '<span data-g="ins_arranjo">' + esc(s.cand.arranjo.descricao) + '</span>'),
      linhaCV('Vazão por peça', '<span data-g="ins_m3h_por_peca">' + f.num(s.Qp, 0) + '</span> m³/h (' + f.num(s.Qp / 3.6, 0) + ' L/s)'),

      linhaCV('Alcance a 0,25 m/s ÷ comprimento característico (T50/L)', t50 + ' · ' + apT50)

      L.push(linhaCV('Vazão por grelha', f.num(rt.Qp, 0) + ' m³/h (' + f.num(rt.Qp / 3.6, 0) + ' L/s) · ' + rt.n + (rt.n === 1 ? ' grelha' : ' grelhas')));
      L.push(linhaCV('Velocidade de face', '<span data-g="ret_vFace">' + f.num(rt.vFace, 2) + '</span> m/s · área bruta ' + f.num(rt.areaBruta, 3) + ' m² · recomendado ≤ ' + f.num(rt.faixaFace.max, 1)));

    return h;
  }

  function semPartes(html) { return html || '<p class="nota">Nenhum.</p>'; }

  function subInsuflamento(v, n) {
    var s = v.sup, e = v.r.e;
    return subtitulo(n, 4, 'Insuflamento') + '<p><b>' + esc(AD.rotuloSolucao(s)) + '</b> · ' + sitTxt(s) + ' · nota da solução ' + f.num(s.indice.total, 1) + ' de 100</p>' +
      '<h4>Contas</h4>' + tabelaPassos(s.rastro.passos, n + '.4') +
      '<h4>Verificações</h4>' + emTexto(P.tabelaVerifs(s.verifs, e)) +
      '<h4>Nota da solução, parcela a parcela</h4>' + tabelaIndice(s.indice) +
      '<h4>Ressalvas, alertas e notas de método</h4>' + semPartes(P.ressalvas(s.rastro, '') + P.metodos(s.rastro, ''));
  }

  function cabAlt(comFamilia) {
    return '<thead><tr><th>' + (comFamilia ? 'Família e solução' : 'Solução') + '</th><th class="num">Vazão por peça</th><th class="num">Ruído do insuflamento</th><th class="num">Perda de carga</th><th class="num">Velocidade do ar na zona ocupada</th><th class="num">Alcance ÷ L</th><th>Situação</th><th class="num">Nota da solução</th></tr></thead>';
  }
  function linhaAlt(v, s, familia) {
    var adot = mesmaIns(s, v.sup), prim = v.primeira && mesmaIns(s, v.primeira), marcas = [];
    if (adot) marcas.push('adotada'); if (prim) marcas.push('1ª opção do app');
    return '<tr' + (adot ? ' class="adotada"' : '') + '><td class="sol">' + esc(AD.rotuloSolucao(s)) + '<div class="sub">' + (familia !== undefined ? esc(familia) + ' · ' : '') + esc(s.cand.arranjo.descricao) + (marcas.length ? ' · ' + marcas.join(' · ') : '') + '</div></td>' +
      '<td class="num">' + P.vaz(s.Qp) + '</td><td class="num">' + P.dB(s.lp) + '</td><td class="num">' + P.dpTxt(s.dp) + '</td><td class="num">' + f.num(s.vzo, 2) + ' m/s</td><td class="num">' + f.num(s.t50L, 2) + '</td>' +
      '<td>' + sitTxt(s) + '</td><td class="num">' + f.num(s.indice.total, 0) + '</td></tr>';
  }
  function subAlternativas(E, i, v, n) {
    var amb = E.ambientes[i], eq = ESC.equivalentes(amb, E.projeto), fam = ESC.melhorPorFamilia(amb, E.projeto), F0 = f.num(eq.faixa, 0);
    return subtitulo(n, 5, 'Alternativas de insuflamento') + '<p>' + v.r.res.totalInsuflamento + ' combinações avaliadas. A nota não distingue soluções a menos de ' + F0 + ' pontos: dentro dessa faixa, o app põe antes a de menos peças, e a escolha é de projeto.</p>' +
      '<h4>Equivalentes (a até ' + F0 + ' pontos)' + (eq.total > eq.itens.length ? ' · as ' + eq.itens.length + ' primeiras de ' + eq.total : '') + '</h4>' +
      '<table class="sel-tab">' + cabAlt(false) + '<tbody>' + eq.itens.map(function (s) { return linhaAlt(v, s); }).join('') + '</tbody></table>' +
      '<h4>Melhor de cada família</h4><table class="sel-tab">' + cabAlt(true) + '<tbody>' + fam.map(function (x) {
        return x.s ? linhaAlt(v, x.s, x.familia) : '<tr><td class="sol">' + esc(x.familia) + '</td><td colspan="7"><span class="sub">sem combinação dentro do catálogo para esta vazão e geometria</span></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function subRetorno(v, n) {
    var rt = v.ret, a = v.r.res.amb, e = v.r.e, cfg = D.motor.config.retorno;
    var h = subtitulo(n, 6, 'Retorno');
    if (!rt) return h + '<p>Nenhuma grelha das famílias marcadas atende ao domínio publicado para ' + f.num(a.Qret, 0) + ' m³/h com até ' + cfg.maxPecas + ' grelhas.</p>';
    var alto = !!(v.ctxRet && v.ctxRet.altoNivel && v.ctxRet.sup);
    var balanc = e.retorno.tipo === 'plenum' ? 'plenum acessível e limpo no entreforro; grelhas iguais, distribuídas para definir o caminho do ar; regulagem na própria grelha (NBR 16401-1, 9.1.2)' :
      rt.n + ' ramal(is) iguais com registro (10.6.1), fechamento ≤ 50 % (10.6.2); TAB ±10 % por boca (17.6.3)';
    h += '<p><b>' + esc(P.retTxt(rt)) + '</b>, ' + esc(P.minuscula(rt.faixaFace.nome)) + ' · ' + sitTxt(rt) + ' · nota da solução ' + f.num(rt.indice.total, 1) + ' de 100</p>';
    h += tabCV([
      linhaCV('Posição e tipo', esc(rt.faixaFace.nome) + ' · ' + (e.retorno.tipo === 'plenum' ? 'retorno por plenum' : 'retorno dutado, um ramal por grelha')),
      linhaCV('Distribuição', (rt.grupos ? 'difusores atendidos por grelha: ' + esc(rt.grupos.join(' / ')) : 'sem difusores de referência') + (rt.maxDist != null ? ' · difusor mais afastado a ' + f.num(rt.maxDist, 2) + ' m da grelha mais próxima (limite ' + f.num(rt.dMax, 0) + ' m)' : '') + (rt.espMin != null ? ' · espaçamento mínimo entre grelhas ' + f.num(rt.espMin, 2) + ' m' : '')),
      linhaCV('Balanceamento', esc(balanc)), linhaCV('Fonte dos dados', esc(rt.fonte))]);
    h += '<h4>Contas</h4>' + tabelaPassos(rt.rastro.passos, n + '.6') +
      '<h4>Verificações</h4>' + emTexto(P.tabelaVerifs(rt.verifs, e)) +
      '<h4>Nota da solução, parcela a parcela</h4>' + tabelaIndice(rt.indice) +
      '<h4>Ressalvas, alertas e notas de método</h4>' + semPartes(P.ressalvas(rt.rastro, 'Retorno') + P.metodos(rt.rastro, 'Retorno'));
    if (v.retLista.length > 1) {
      h += '<h4>Alternativas de retorno</h4><table class="sel-tab"><thead><tr><th>Solução</th><th class="num">Vazão por grelha</th><th class="num">Velocidade de face</th><th class="num">Perda de carga</th><th class="num">Ruído do retorno</th><th class="num">Área por grelha</th>' +
        (alto ? '<th class="num">Jato na grelha</th>' : '') + '<th>Situação</th><th class="num">Nota da solução</th></tr></thead><tbody>' + v.retLista.map(function (x) {
          var adot = ESC.sRet(x.cand) === ESC.sRet(rt.cand);
          return '<tr' + (adot ? ' class="adotada"' : '') + '><td>' + esc(x.titulo) + (adot ? '<div class="sub">adotada</div>' : '') + '</td><td class="num">' + P.vaz(x.Qp) + '</td><td class="num">' + f.num(x.vFace, 2) + ' m/s</td><td class="num">' + P.dpTxt(x.dp) + '</td><td class="num">' + P.dB(x.lp) +
            '</td><td class="num">' + f.num(x.areaPorGrelha, 0) + ' m²</td>' + (alto ? '<td class="num">' + f.num(x.vJato, 2) + ' m/s</td>' : '') + '<td>' + sitTxt(x) + '<div class="sub">' + esc(P.motivos(x)) + '</div></td><td class="num">' + f.num(x.indice.total, 0) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    return h;
  }

  function subPlanta(v, n) {
    var s = v.sup, a = v.r.res.amb, PL = H.ui.planta3;
    return subtitulo(n, 7, 'Planta') + '<p class="nota">' + f.num(a.C, 2) + ' × ' + f.num(a.W, 2) + ' m · ' + f.num(a.area, 1) + ' m²</p><div class="planta">' + PL.svg(s, v.ret, a, v.ctxRet, false) + PL.legenda(s, v.ret, a, v.ctxRet) + '</div>' + PL.tabelaCoordenadas(s, v.ret, a, v.ctxRet);
  }

  function subRede(v, n) {
    var e = v.r.e, a = v.r.res.amb;
    return subtitulo(n, 8, 'Rede de dutos e balanceamento — recomendações da NBR 16401-1:2024') + lista(itensRede(e, a, v.sup, v.ret));
  }

  function secaoAmbiente(E, i, num) {
    var amb = E.ambientes[i], v = ESC.resolver(amb, E.projeto), r = v.r, s = v.sup, h = '<h2>' + num + '. ' + esc(nomeDe(amb)) + '</h2>';
    if (nPend(r)) {
      return h + '<p><b>Para selecionar, falta:</b></p>' + lista(Object.keys(r.erros).map(function (k) { return '<b>' + esc(AD.ROTULO[k] || k) + '</b>: ' + esc(r.erros[k]); }));
    }
    if (!s) {
      var erros = r.avisos.filter(function (x) { return x.nivel === 'erro'; });
      if (!r.res && erros.length) return h + '<p class="aviso-m">' + erros.map(function (x) { return esc(x.texto); }).join('<br>') + '</p>';
      return h + '<p class="aviso-m">' + esc(P.FRASE_SEM_SOLUCAO) + '</p>';
    }
    var e = r.e, a = r.res.amb;
    h += subResposta(E, i, v, num);
    h += subtitulo(num, 2, 'Dados de entrada') + entradasTabela(e, a);
    h += subtitulo(num, 3, 'Ambiente, zona ocupada e limites') + tabelaPassos(r.res.rastroAmb.passos, num + '.3');
    h += subInsuflamento(v, num);
    h += subAlternativas(E, i, v, num);
    if (a.Qret > 0) h += subRetorno(v, num);
    h += subPlanta(v, num);
    h += subRede(v, num);
    return h;
  }

  // ---------------------------------------------------------------- resumo e quantitativo
  function secaoResumo(E, indices, num) {
    var linhas = indices.map(function (i) {
      var amb = E.ambientes[i], v = ESC.resolver(amb, E.projeto), s = v.sup, rt = v.ret, a = v.r.res ? v.r.res.amb : null;
      if (!s) return '<tr><td>' + esc(nomeDe(amb)) + '</td><td colspan="7">' + esc(P.opcaoTxt(v.r)) + '</td></tr>';
      return '<tr><td>' + esc(nomeDe(amb)) + '</td><td>' + esc(AD.rotuloSolucao(s)) + '</td><td class="num">' + P.vaz(s.Qp) + '</td><td class="num">' + P.dB(TS.ruido(v)) + '</td><td class="num">' + P.dpTxt(s.dp) + '</td>' +
        '<td>' + (a && a.Qret <= 0 ? 'sem retorno' : (rt ? esc(P.retTxt(rt)) : 'sem grelha')) + '</td><td>' + sitTxt(s) + '</td><td>' + (v.adotada ? 'adotada por você' : '1ª opção do app') + '</td></tr>';
    }).join('');
    var q = EM.quantitativo({ projeto: E.projeto, ambientes: indices.map(function (i) { return E.ambientes[i]; }) });
    function grupo(titulo, itens, rotuloTotal, total) {
      return '<tr class="grupo-q"><td colspan="3"><b>' + titulo + '</b></td></tr>' +
        (itens.length ? itens.map(function (x) { return '<tr><td>' + esc(x.item) + '</td><td class="num">' + x.n + '</td><td>' + esc(x.ambientes.join(', ')) + '</td></tr>'; }).join('') : '<tr><td colspan="3"><span class="sub">nenhum</span></td></tr>') +
        '<tr class="total-q"><td><b>' + rotuloTotal + '</b></td><td class="num"><b>' + total + '</b></td><td></td></tr>';
    }
    return '<h2>' + num + '. Resumo do projeto</h2><table class="sel-tab"><thead><tr><th>Ambiente</th><th>Solução adotada</th><th class="num">Vazão por peça</th><th class="num">Ruído no ambiente</th><th class="num">Perda de carga</th><th>Retorno</th><th>Situação</th><th>Origem</th></tr></thead><tbody>' + linhas + '</tbody></table>' +
      '<h3>Quantitativo</h3><table class="sel-tab"><thead><tr><th>Item</th><th class="num">Peças</th><th>Ambientes</th></tr></thead><tbody>' +
      grupo('Insuflamento', q.ins, 'Total de difusores', q.totalIns) + grupo('Retorno', q.ret, 'Total de grelhas', q.totalRet) + '</tbody></table>' +
      (q.semSolucao.length ? '<p class="nota">Sem solução, fora do quantitativo: ' + esc(q.semSolucao.join(', ')) + '.</p>' : '');
  }

  function secaoBases(E) {
    var alt = EM.configAlteradas(E.projeto), cfg;
    if (!alt.length) cfg = 'Todas no padrão do app.';
    else cfg = alt.length + (alt.length === 1 ? ' alterada' : ' alteradas') + ' em relação ao padrão do app:<table class="sel-tab cfg-m"><thead><tr><th>Configuração</th><th class="num">Valor em uso</th><th class="num">Padrão do app</th></tr></thead><tbody>' +
      alt.map(function (c) { return '<tr><td>' + esc(rotuloCfg(c.cam)) + '</td><td class="num">' + esc(cfgTxt(c.cam, c.valor)) + '</td><td class="num">' + esc(cfgTxt(c.cam, c.padrao)) + '</td></tr>'; }).join('') + '</tbody></table>';
    return '<h2>1. Bases de cálculo</h2>' + tabCV([linhaCV('Normas', esc(BASE_NORMAS)), linhaCV('Método', esc(METODO)),
      linhaCV('Altitude', f.num(E.projeto.altitude, 0) + ' m'), linhaCV('Configurações', cfg)]);
  }

  function secaoPendencias(E, i, num) {
    var l = pendenciasDe(E, i).filter(function (x) { return x.nivel !== 'info'; });
    var h = '<h2>' + num + '. Pendências na emissão</h2>';
    if (!l.length) return h + '<p>Nenhuma pendência de nível “impede” ou “conferir” na data da emissão.</p>';
    return h + '<table class="sel-tab"><thead><tr><th>Onde</th><th>Pendência</th></tr></thead><tbody>' + l.map(function (x) {
      return '<tr><td>' + esc(x.onde) + '</td><td>' + esc(x.texto) + (x.detalhes.length ? '<ul class="lista-m">' + x.detalhes.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') + '</td></tr>';
    }).join('') + '</tbody></table>';
  }

  // ---------------------------------------------------------------- tela
  function tela(E, U, R) {
    var i = U.temIndice ? U.amb : null, p = E.projeto, N = E.ambientes.length;
    if (i !== null && !E.ambientes[i]) i = null;
    D.motor.config = p.config;
    var indices = i === null ? E.ambientes.map(function (a, k) { return k; }) : [i];

    var fora = '<div class="nao-imprime">' + C.cabeca('Passo 4 de 4', 'Memorial', 'É este o documento que sai em PDF. Ele é montado a partir do que está nas telas, sem redigitação.') +
      '<div class="acoes mem-acoes"><button type="button" class="botao prim" data-acao="pdf">Gerar PDF</button><button type="button" class="botao" data-acao="salvar">Salvar arquivo do projeto</button>' +
      '<button type="button" class="botao" data-acao="csv-alternativas"' + (i !== null ? ' data-amb="' + i + '"' : '') + '>Exportar alternativas (CSV)</button>' +
      '<span class="fraco">No diálogo de impressão, escolha “Salvar como PDF”.</span></div>';
    if (N > 1) {
      fora += '<nav class="amb-nav mem-nav" aria-label="Escopo do memorial"><a href="#/memorial"' + (i === null ? ' aria-current="page"' : '') + '>Projeto inteiro</a>' +
        E.ambientes.map(function (a, k) { return '<a href="#/memorial/' + k + '"' + (i === k ? ' aria-current="page"' : '') + '>' + esc(nomeDe(a)) + '</a>'; }).join('') + '</nav>';
    }
    fora += antesDeEmitir(E, i === null ? undefined : i) + '</div>';

    var s = '<div class="cab-f"><div><h1>Memorial de cálculo: seleção de difusores e grelhas</h1><div>' + esc(p.nome || 'Projeto sem nome') + '</div></div>' +
      '<div>Revisão ' + esc(p.revisao) + '<br>' + dataHoje() + '<br>' + (p.responsavel ? esc(p.responsavel) : '<em>responsável não informado</em>') + '</div></div>' +
      '<p class="nota">Gerado pelo app Seleção de Difusores e Grelhas TROX v' + esc(H.versao) + ' · base de dados ' + esc(D.versaoBase) + '</p>';
    s += secaoBases(E) + secaoResumo(E, indices, 2);
    var num = 2;
    indices.forEach(function (k) { num++; s += secaoAmbiente(E, k, num); });
    s += secaoReferencias(++num) + secaoPremissas(++num) + secaoLimites(++num) + secaoPendencias(E, i === null ? undefined : i, ++num);

    return fora + '<article class="folha">' + s + '</article>';
  }

  H.ui.telaMemorial = { tela: tela, antesDeEmitir: antesDeEmitir, csv: csv };
})(window.HVAC, window.Difusores);

</script>
<script>
/* ==== js/interface/manifesto.js ==== */
/* Manifesto dos difusores para a casca comum (_plataforma-hvac, casca.js; contrato em docs\GUIA_INTERFACE.md de lá).
   Aqui fica só o que é deste app: rotas e trilha, faixa de resultado, arquivo de projeto (formato 4), limites dos campos e
   ações de ambiente, de famílias e de configuração. Estado, armazenamento, gaveta, paleta, tema e eventos são da casca.
   O motor continua em window.Difusores (D): a casca não o conhece; `calcular` passa cada ambiente pelo adaptador
   (D.util.adaptador) e devolve às telas R = { amb: [{ e, erros, avisos, res, sup, ret }] }, na ordem de E.ambientes. */
(function (H, D) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, T = H.ui.telas, TS = H.ui.telaSelecao, TM = H.ui.telaMemorial, K = H.ui.api, U = H.ui.U, CAT = H.ui.cat, AD = D.util.adaptador, F4 = D.util.formato4, ESC = D.util.escolha;
  var SELO = { aprovado: 'Aprovado', ressalva: 'Aprovado com ressalva', reprovado: 'Reprovado' };
  function proj() { return K.projeto(); }      // projeto aberto (o mesmo objeto que a casca guarda)
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
  function nPend(r) { return Object.keys(r.erros).length; }
  function adotada(E, i) { return ESC.resolver(E.ambientes[i], E.projeto); }   // a solução adotada do ambiente (a 1ª opção do app, enquanto nada for adotado)
  // "#/selecao" é o conjunto e "#/selecao/N" é o ambiente N; com um ambiente só, "#/selecao" já abre a Seleção dele
  function selecaoDeUm(E) { return E.ambientes.length === 1 || U.temIndice; }
  function ambDaAcao(el) { var E = proj(), i = +el.getAttribute('data-amb'); return { E: E, i: i, amb: E.ambientes[i] || null }; }
  // O candidato de uma linha das listas da Seleção: data-lista = 'equiv' | 'fam' | 'qtd', data-i = posição na lista
  function candDaLista(amb, E, lista, i) {
    var x;
    if (lista === 'equiv') { x = ESC.equivalentes(amb, E.projeto).itens[i]; return x ? x.cand : null; }
    if (lista === 'fam') { x = ESC.melhorPorFamilia(amb, E.projeto)[i]; return x && x.s ? x.s.cand : null; }
    if (lista === 'qtd') { x = ESC.porQuantidade(amb, E.projeto)[i]; return x ? x.s.cand : null; }
    return null;
  }
  function txtDelta(d) { if (!d || isNaN(d)) return ''; return plural(Math.abs(d), 'peça', 'peças') + (d < 0 ? ' a menos' : ' a mais'); }

  /* Planta da Seleção: a casca redesenha a tela inteira e chama depoisDeDesenhar (H.app) ao terminar; o arraste é ligado aqui, toda vez
     que uma planta nova entra na tela. Cada arraste aceito pelo motor grava as posições no ambiente e redesenha. */
  function ligarPlanta() {
    var alvo = document.querySelector('#tela .planta[data-amb]');
    if (!alvo) { H.ui.planta3.movendo = false; return; }   // "Mover difusores" (celular, M4) vale até sair da Seleção
    if (alvo.getAttribute('data-ligada')) return;
    alvo.setAttribute('data-ligada', '1');
    var E = proj(), amb = E.ambientes[+alvo.getAttribute('data-amb')], v = amb ? ESC.resolver(amb, E.projeto) : null;
    if (!v || !v.sup) return;
    H.ui.planta3.ligarArraste(alvo, v.sup, v.r.res.amb,
      function (idx, x, y) { if (ESC.mover(amb, E.projeto, idx, x, y)) K.guardar(); K.desenhar(); },
      v.ret ? function (idx, x, y) { if (ESC.moverRet(amb, E.projeto, idx, x, y)) K.guardar(); K.desenhar(); } : null);
  }

  function duplicar(i) {
    var E = proj(), copia = JSON.parse(JSON.stringify(E.ambientes[i]));
    copia.nome = copia.nome + ' (cópia)';
    E.ambientes.splice(i + 1, 0, copia);
    K.guardar();
    location.hash = '#/ambiente/' + (i + 1);
  }
  function novoAmbiente() {
    var E = proj();
    E.ambientes.push(F4.novoAmbiente(E.projeto, 'Ambiente ' + (E.ambientes.length + 1)));
    U.aberto = { geo: true }; K.guardar();
    location.hash = '#/ambiente/' + (E.ambientes.length - 1);
  }
  // Alteração de entrada: a alternativa adotada fica; as posições ajustadas à mão valiam para a seleção que estava na tela e são descartadas
  function descartarManual(amb) { ESC.aoAlterarEntrada(amb); }

  /* Importação de ambientes da carga térmica (D.util.importaCT): o arquivo é lido por um campo próprio, os ambientes entram no fim da lista
     e o relatório abre numa janela da casca (K.relatorio). A casca limpa a janela a cada troca de rota; com { manter: true } ela
     sobrevive à troca para #/ambientes. */
  function janelaCT(titulo, nome, corpo) {
    return '<h2>' + esc(titulo) + '</h2><p class="suave" style="margin-bottom:10px">Arquivo <b>' + esc(nome) + '</b></p>' + corpo +
      '<div class="acoes" style="margin-top:12px"><button type="button" class="botao prim" data-acao="fechar">Fechar</button></div>';
  }
  // Arquivo recusado: janela própria com "Fechar" (sem relatório nem botão de salvar)
  function recusarCT(html) {
    var mudar = location.hash !== '#/ambientes';
    K.janela(html, { manter: mudar });
    if (mudar) location.hash = '#/ambientes'; else K.desenhar();
  }
  function importarCT(texto, nome) {
    var E = proj(), obj, r, mudar;
    try { obj = JSON.parse(texto); } catch (e) { obj = undefined; r = { ok: false, ambientes: [], relatorio: [], versaoOrigem: 0, motivo: 'O arquivo não é um JSON válido (' + e.message + ').' }; }
    if (!r) r = D.util.importaCT.importar(obj, E);
    if (!r.ok) { recusarCT(janelaCT('Importação da carga térmica', nome, '<p>' + esc(r.motivo) + '</p>')); return; }
    r.ambientes.forEach(function (a) { E.ambientes.push(a); });
    K.guardar();
    mudar = location.hash !== '#/ambientes';
    K.relatorio({ titulo: 'Importação da carga térmica', nome: nome, resumo: plural(r.ambientes.length, 'ambiente acrescentado', 'ambientes acrescentados'),

  H.app = {
    id: 'difusores',

      { r: 'ambientes', t: 'Ambientes', s: function (E, R) { var n = R.amb.filter(nPend).length; return plural(E.ambientes.length, 'ambiente', 'ambientes') + (n ? ' · ' + n + ' a completar' : ''); },
        pend: function (E, R) { return R.amb.some(nPend); } },
      { r: 'selecao', t: 'Seleção', s: function (E) { var n = E.ambientes.filter(function (a, i) { var s = adotada(E, i).sup; return s && s.selo !== 'reprovado'; }).length; return n + ' de ' + E.ambientes.length + ' com solução aprovada'; } },
      { r: 'memorial', t: 'Memorial', s: function (E) { return 'revisão ' + E.projeto.revisao; } }
    ],

    calcular: function (E) { return { amb: E.ambientes.map(function (a) { return AD.calcular(a, E.projeto); }) }; },

    /* O número cuja variação a faixa mostra depois de cada alteração: as peças de insuflamento da solução adotada

    medida: function (E) {

        var link = { href: '#/selecao/' + U.amb, texto: 'Ver seleção' }, rot = v.adotada ? 'Adotada por você' : '1ª opção';

    ajuda: [

        '<li>Verificações: ruído no ambiente (NBR 10152 via 16401-1 7.4.1), velocidade efetiva na boca (prática de projeto), Δp, alcance ÷ comprimento característico (T50/L), velocidade do ar na zona ocupada (NBR 16401-2), draft, alcance ≤ 1,5·altura, compatibilidade com o vão, Ez, regulagem de vazão (9.1.2), registro ≤ 50 % (10.6.2), validade de ΔT e de pé-direito do catálogo.</li>' +

      { titulo: 'O que o app não calcula (limites declarados)', html: '<ul class="lista-avisos">' +
        '<li>T50 (alcance a 0,25 m/s): a TROX publica alcances a 0,5/0,3 m/s (ADLQ e ADLR) e 0,5 m/s (ADE); o T50 é estimado pelo decaimento v ∝ 1/x e é um limite superior, declarado como nota de método (não muda o selo nem a nota). ADPI numérico não é apresentado.</li>' +

    acoes: {
