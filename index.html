      nmAH = nmAH.concat(D.util.sanear.naoMonotonas(ah.pontos[k], 0, 1, 'loglog', rot, 2, 'Δp'), D.util.sanear.naoMonotonas(ah.pontos[k], 0, 2, 'semilog', rot, 0, 'dB(A)'));
    });
    var lista = T.ADLQ.celulasNaoMonotonas.concat(g.celulasNaoMonotonas, nmAH);
    h += '<h3 id="celulas-nao-monotonas">Células não monótonas do catálogo, usadas como impressas (' + lista.length + ')</h3><p class="fraco">Células em que o valor impresso diminui quando a vazão aumenta. Desde a v2.1.2 nenhuma é corrigida: o cálculo usa o valor impresso. ' +
      'A coluna "tendência dos vizinhos" não entra no cálculo; serve só de referência para ver o tamanho do desvio. Nas grelhas, a mesma coluna do catálogo vale para vários tamanhos de área equivalente, por isso uma célula impressa aparece em mais de uma linha.</p>' +
      rolo('<table class="sel-tab"><thead><tr><th>Tabela</th><th class="num">Q (m³/h)</th><th>Campo</th><th class="num">Impresso (usado)</th><th class="num">Tendência dos vizinhos</th></tr></thead><tbody>' +
      lista.map(function (c) { return '<tr><td>' + esc(c.tabela) + '</td><td class="num">' + c.x + '</td><td>' + c.campo + '</td><td class="num">' + f.num(c.impresso, 2) + '</td><td class="num">' + f.num(c.tendencia, 2) + '</td></tr>'; }).join('') + '</tbody></table>');
    return h;
  }

  function premissas() {
    return rolo('<table class="sel-tab"><thead><tr><th>Item</th><th>O que o app adota</th><th>Fonte</th><th>Situação</th></tr></thead><tbody>' + D.motor.premissas().map(function (p) {
      return '<tr data-premissa="' + esc(p.id) + '"><td>' + esc(p.titulo) + '</td><td>' + esc(p.texto) + '</td><td class="fonte">' + esc(p.fonte) + '</td><td>' + esc(p.situacao) + '</td></tr>';
    }).join('') + '</tbody></table>');
  }

  // As regras de distribuição do retorno e de arranjo são configurações do projeto: valor em uso e padrão do app
  function regras(E) {
    var CAT = H.ui.cat, lin = CAT.config.filter(function (c) { return /^(retorno|arranjo)\./.test(c.cam); });
    function txt(c, v) { return typeof v === 'number' ? numTxt(v) + (c.un ? ' ' + esc(c.un) : '') : '—'; }
    return rolo('<table class="sel-tab"><thead><tr><th>Regra</th><th class="num">Valor em uso</th><th class="num">Padrão do app</th></tr></thead><tbody>' + lin.map(function (c) {
      return '<tr><td>' + esc(c.rot) + '</td><td class="num">' + txt(c, CAT.ler(E.projeto.config, c.cam)) + '</td><td class="num">' + txt(c, CAT.padraoConfig(c.cam)) + '</td></tr>';
    }).join('') + '</tbody></table>') + '<p class="fraco">Editáveis em Projeto, Mais opções.</p>';
  }

  function tela(E) {
    D.motor.config = E.projeto.config;
    var N = D.dados.normas, S = {};
    SECOES.forEach(function (s) { S[s.id] = s; });
    var s = H.ui.c.cabeca('Referências', 'Referências', 'Tabelas de norma e de prática que o app usa, só para leitura, cada uma com a fonte.');
    s += '<p class="fraco">p. = página impressa do documento; l. = linha do corpo do texto, contada de cima para baixo (em página de duas colunas, a esquerda e depois a direita).</p>';
    s += '<nav class="ref-nav" aria-label="Seções de Referências">' + SECOES.map(function (x) { return '<button type="button" class="botao leve" data-acao="ir-referencia" data-ref="' + x.id + '">' + esc(x.titulo) + '</button>'; }).join('') + '</nav>';
    s += secao(S['ref-normas'], '<p class="fraco">Base técnica principal: NBR 16401-1, -2 e -3 e ASHRAE Fundamentals 2021. Cada verificação do app cita a cláusula. Os textos das normas não são reproduzidos: a tabela resume cada cláusula na forma usada pelo app. Conferir sempre com as edições vigentes.</p>' + rolo(tabelaNormas()));
    s += secao(S['ref-ruido'], blocoDado(null, N.nbr10152, 3));
    s += secao(S['ref-conforto'], blocoDado(null, N.nbr16401_2, 3));
    s += secao(S['ref-ez'], blocoDado(null, N.nbr16401_3, 3));
    s += secao(S['ref-rede'], blocoDado(null, N.nbr16401_1, 3));
    s += secao(S['ref-pratica'], blocoDado('Velocidades nas bocas de ar (prática de projeto)', N.bocas, 3) + blocoDado('ASHRAE Fundamentals 2021 (alcance ÷ comprimento característico e demais dados)', N.ashrae, 3) +
      '<div class="ref-b"><h3>Regras de distribuição do retorno e de arranjo</h3>' + regras(E) + '</div>');
    s += secao(S['ref-trox'], baseTrox());
    s += secao(S['ref-premissas'], '<p class="fraco">O que o cálculo adota sem documento-fonte primário na biblioteca (fonte secundária, CONFERIR ou premissa declarada com o efeito medido), por prática de projeto ou por critério do app. A mesma lista vai ao memorial.</p>' + premissas());
    s += secao(S['ref-local'], '<p>Projeto novo começa na altitude de Brasília: <b>' + f.num(D.util.formato4.ALTITUDE_PADRAO, 0) + ' m</b>. ' + esc(D.util.formato4.ALTITUDE_FONTE) + ' Até a v3.3.0 o app usava 1.060 m (NBR 16401-1, p. 39, l. 1; NBR 16401-1, p. 40, l. 1): arquivo gravado com 1.060 m abre com 1.060 m. Altitude em uso neste projeto: <b>' +
      f.num(E.projeto.altitude, 0) + ' m</b> (Projeto, bloco Local).</p>');
    return s;
  }

  // Vai à tela e rola até a seção (a paleta e os botões de seção usam)
  function ir(id) {
    function rola() { var el = document.getElementById(id); if (el && el.scrollIntoView) el.scrollIntoView(); }
    if (location.hash !== '#/referencias') location.hash = '#/referencias';
    setTimeout(rola, 120);
  }

  H.ui.telaReferencias = { NORMAS: NORMAS, tabelaNormas: tabelaNormas, SECOES: SECOES, tela: tela, ir: ir };
})(window.HVAC, window.Difusores);

</script>
<script>
/* ==== js/interface/memorial3.js ==== */
/* Memorial de cálculo e "Antes de emitir" (v3.0.0, sessão T3, etapa 1). Rotas #/memorial (projeto inteiro) e #/memorial/N (só o ambiente N).
   A tela não calcula nada: todo número vem do resultado do motor ou do rastro (D.util.escolha.resolver); as contas de tela são só
   mmCA → Pa e m³/h → L/s, como na Seleção. As frases e as tabelas da Seleção vêm de H.ui.telaSelecao.pecas, sem mudar o que devolvem;
   o que só existia na tela da v2.1.3 (retirada na v3.0.0; memorial.js, resultados.js, planta.js) é copiado aqui com as trocas aprovadas (nomes no lugar
   das siglas, °C, "Projeto, Mais opções" no lugar de "Configurações"). Dentro da folha nada depende da cor do tema (difusores.css).
   As marcas data-g das colunas do gabarito são as da Seleção e aparecem uma vez por ambiente, na subseção "Solução adotada".
   Especificação: sessão T3, seção 1.3. */
(function (H, D) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, AD = D.util.adaptador, ESC = D.util.escolha, EM = D.util.emissao, TS = H.ui.telaSelecao, P = TS.pecas, PA = AD.PA_POR_MMCA;
  var SELO = P.SELO, POSTURA = { emPe: 'em pé', sentado: 'sentado' };
  var GRUPOS = { ambiente: 'Ambiente e vazões', ar: 'Propriedades do ar', produto: 'Dados do terminal (catálogo TROX)', alcance: 'Alcance e comprimento característico', zona: 'Zona ocupada, conforto e eficácia da distribuição', acustica: 'Acústica' };
  var ORDEM = ['ambiente', 'ar', 'produto', 'alcance', 'zona', 'acustica'];

  // ---------------------------------------------------------------- auxiliares
  function ok(v) { return v !== null && v !== undefined && v !== '' && !isNaN(v); }
  function nomeDe(amb) { return amb.nome || 'Ambiente sem nome'; }
  function dataHoje() { var d = new Date(); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
  function mesmaIns(x, s) { return ESC.sIns(ESC.chaveIns(x.cand)) === ESC.sIns(ESC.chaveIns(s.cand)); }
  function nPend(r) { return Object.keys(r.erros).length; }
  function rotuloCfg(cam) { var c = H.ui.cat.porCam[cam]; return c ? c.rot : cam; }
  function cfgTxt(cam, v) { var c = H.ui.cat.porCam[cam]; return (typeof v === 'number' ? String(v).replace('.', ',') : '—') + (c && c.un ? ' ' + c.un : ''); }

  // Na folha a situação e a fonte vão em texto: o selo colorido e o botão "fonte" da Seleção viram texto do mesmo campo
  function emTexto(html) {
    return html.replace(/<span class="selo sit sit-[a-z]+">([^<]*)<\/span>/g, '<span class="sit-t">$1</span>')
      .replace(/<button type="button" class="selo norma" data-acao="fonte" data-fonte="([^"]*)" title="Ver a fonte">[^<]*<\/button>/g, '<span class="fonte-m">$1</span>');
  }
  function sitTxt(s) { return '<span class="sit-t">' + esc(SELO[s.selo] || s.selo) + '</span>'; }
  function linhaCV(c, val) { return '<tr><td class="chave">' + esc(c) + '</td><td>' + val + '</td></tr>'; }
  function tabCV(linhas) { return '<table class="sel-tab"><tbody>' + linhas.join('') + '</tbody></table>'; }
  function lista(itens) { return '<ul class="lista-m">' + itens.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>'; }

  // Texto de regulagem, de zona e de planta que só existiam na tela da v2.1.3 (retirada na v3.0.0; resultados.js, planta.js)
  function regTxt(e) { var r = e.crit.registro; return r === 'sem' ? 'sem registro na peça' : r === 'aberto' ? 'registro 100 % aberto' : 'registro ' + r + ' % aberto'; }
  function recuosTxt(a) { var r = a.zona.recuo; return 'x = 0: ' + f.num(r['-x'], 1) + ' m · x = C: ' + f.num(r['+x'], 1) + ' m · y = 0: ' + f.num(r['-y'], 1) + ' m · y = L: ' + f.num(r['+y'], 1) + ' m'; }
  var PAREDE_NOME = H.ui.planta3 && H.ui.planta3.PAREDE_NOME ? H.ui.planta3.PAREDE_NOME : { x0: 'parede x = 0', xC: 'parede x = C', y0: 'parede y = 0', yW: 'parede y = L' };

  // ---------------------------------------------------------------- tabelas copiadas da tela da v2.1.3 (retirada na v3.0.0; memorial.js)
  function tabelaPassos(passos, prefixo) {
    var h = '', n = 0, vistos = {};
    function grupo(g, titulo) {
      var l = passos.filter(function (p) { return p.grupo === g; });
      if (!l.length) return;
      h += '<h4>' + esc(titulo) + '</h4><table class="passos-m"><thead><tr><th>Item</th><th>Grandeza</th><th>Fórmula</th><th>Substituição</th><th class="num">Resultado</th><th>Fonte</th></tr></thead><tbody>';
      l.forEach(function (p) {
        n++;
        var val = p.valor === null || p.valor === undefined ? '—' : f.numU(p.valor, p.casas === undefined ? 2 : p.casas, p.unidade);
        h += '<tr><td>' + prefixo + '.' + n + '</td><td>' + esc(p.titulo) + '</td><td class="f">' + esc(p.formula) + '</td><td class="f">' + esc(p.subst) + '</td><td class="num"><b>' + esc(val) + '</b></td><td class="fonte">' + esc(p.fonte) + '</td></tr>';
      });
      h += '</tbody></table>';
    }
    ORDEM.forEach(function (g) { vistos[g] = true; grupo(g, GRUPOS[g]); });
    passos.forEach(function (p) { if (p.grupo && !vistos[p.grupo]) { vistos[p.grupo] = true; grupo(p.grupo, p.grupo); } });   // grupo fora da lista conhecida: não se perde
    return h;
  }

  function tabelaIndice(ind) {
    var h = '<table class="sel-tab"><thead><tr><th>Critério</th><th>Avaliação</th><th class="num">Fator</th><th class="num">Máx.</th><th class="num">Pontos</th></tr></thead><tbody>';
    ind.parcelas.forEach(function (p) { h += '<tr><td>' + esc(p.nome) + '</td><td>' + esc(p.det) + '</td><td class="num">' + f.num(p.f, 2) + '</td><td class="num">' + p.max + '</td><td class="num">' + f.num(p.pts, 1) + '</td></tr>'; });
    h += '<tr><td colspan="4"><b>Soma</b></td><td class="num"><b>' + f.num(ind.base, 1) + '</b></td></tr>';
    ind.fatores.forEach(function (x) { h += '<tr><td colspan="4">× ' + esc(x.nome) + '</td><td class="num">× ' + f.num(x.fator, 2) + '</td></tr>'; });
    return h + '<tr><td colspan="4"><b>Nota da solução</b></td><td class="num"><b>' + f.num(ind.total, 1) + '</b></td></tr></tbody></table>';
  }

  // De onde vem o limite de ruído do ambiente: a mesma regra de limiteAcustico do motor (finalidade sem valor na norma) e o caso do limite digitado
  function origemRuido(e) {
    var apl = D.dados.normas.nbr10152.porId(e.crit.aplicacao), ap = AD.limiteRuido(e.crit.aplicacao);
    if (apl && apl.semNorma) return 'valor de projeto';
    if (!isNaN(ap) && ap !== e.crit.dbaMax) return 'limite informado no ambiente; a NBR 10152 dá ' + f.num(ap, 0) + ' dB(A) para a aplicação';
    return 'NBR 10152';
  }

  function entradasTabela(e, a) {
    var cl = D.motor.selecao.classeVelocidade(e), rf = D.dados.normas.bocas.retornoFace[e.retorno.posicao], pe = e.geo.paredesExternas || {};
    var ext = ['x0', 'xC', 'y0', 'yW'].filter(function (k) { return pe[k]; }).map(function (k) { return PAREDE_NOME[k]; });
    var vent = e.ar.modo === 'ventilacao', soE = vent && !(a.Q > 0), X = sai(a);
    var it = [
      ['Comprimento × largura × pé-direito', f.num(e.geo.C, 2) + ' × ' + f.num(e.geo.W, 2) + ' × ' + f.num(e.geo.H, 2) + ' m'],
      ['Altura de instalação / montagem', f.num(e.geo.Hinst, 2) + ' m / ' + (e.geo.montagem === 'forro' ? 'rente ao forro' : 'suspenso, alcance × 0,707 (ASHRAE Fundamentals 2021, p. 20.7, l. 20)') +
        (e.familias.ATVAT || e.familias.AHAF ? '; grelha de parede ' + (e.geo.montagemGrelha === 'afastada' ? 'afastada do forro, alcance × 0,71 (TROX C1-006, p. 3)' : 'junto ao forro') : '')],
      ['Zona ocupada (NBR 16401-2, p. 8, l. 11)', 'até ' + f.num(a.zo, 2) + ' m (' + POSTURA[e.geo.postura] + '); paredes externas: ' + (ext.length ? ext.join(', ') : 'nenhuma') + '; recuos ' + recuosTxt(a)],
      ['Vazão de insuflamento', f.num(a.Q, 0) + ' m³/h (' + (e.ar.modo === 'carga' ? 'calor sensível do ambiente ' + f.num(e.ar.qs, 0) + ' W' : (vent ? 'vazões da ventilação' : 'informada')) + ')'],
      ['ΔT de insuflamento / temperatura operativa / umidade relativa / altitude', (soE ? 'sem insuflamento' : (a.isotermico ? 'ar insuflado isotérmico (à temperatura do ambiente)' : f.num(e.ar.dT, 1) + ' °C')) + ' / ' + f.num(a.to, 1) + ' °C (NBR 16401-1, p. 12, l. 6) / ' + f.num(a.ur, 0) + ' % / ' + f.num(e.ar.z, 0) + ' m'],
      vent ? ['Vazão de ' + X.nome, f.num(a.Qret, 0) + ' m³/h; grelhas: ' + rf.nome + '; ' + (e.retorno.tipo === 'plenum' ? X.nome + ' por plenum' : X.dutado) + (e.retorno.modular ? '; forro modular 625 mm' : '')]
        : ['Vazão de retorno', f.num(e.ar.retornoPct, 0) + ' % = ' + f.num(a.Qret, 0) + ' m³/h; grelhas: ' + rf.nome + '; ' + (e.retorno.tipo === 'plenum' ? 'retorno por plenum' : 'retorno dutado') + (e.retorno.modular ? '; forro modular 625 mm' : '')],
      ['Aplicação', (D.dados.normas.nbr10152.porId(e.crit.aplicacao) || { nome: '—' }).nome + ' — velocidade na boca: ' + cl.nome + ' (' + f.num(cl.min, 1) + '–' + f.num(cl.max, 1) + ' m/s)'],
      ['Limites', 'ruído ' + f.num(e.crit.dbaMax, 0) + ' dB(A) (' + origemRuido(e) + '); perda de carga máxima ' + f.num(e.crit.dpMax * PA, 1) + ' Pa (' + f.num(e.crit.dpMax, 2) + ' mmCA); velocidade do ar na zona ocupada: ' +
        (e.crit.vzoModo === 'projeto' ? 'limite de projeto ' + f.num(e.crit.vzoMax, 2) + ' m/s' : 'pela temperatura operativa (NBR 16401-2, p. 21, l. 25)') + (e.crit.controleLocal ? '; ocupantes com controle local da velocidade (6.3.2.3)' : '')],
      ['Regulagem / registro / acessório / acústica do ambiente', (e.crit.regulagemRamal ? 'registro no ramal' : 'sem registro no ramal') + ' / ' + regTxt(e) + ' / ' + e.crit.acessorio + ' / ' + e.crit.tratamento],
      ['Famílias consideradas', (soE ? '' : Object.keys(e.familias).filter(function (k) { return e.familias[k]; }).join(', ') + ' · ') + X.nome + ': ' + Object.keys(e.retorno.familias).filter(function (k) { return e.retorno.familias[k]; }).join(', ')]
    ];
    return tabCV(it.map(function (r) { return linhaCV(r[0], esc(r[1])); }));
  }

  // v3.6.0: nome da saída de ar (retorno ou exaustão), pelo papel que o motor gravou no ambiente
  function sai(a) {
    return a && a.papelSaida === 'exaustao' ? { exa: true, nome: 'exaustão', Cap: 'Exaustão', doDa: 'da exaustão', o: 'a', dutado: 'exaustão dutada' }
      : { exa: false, nome: 'retorno', Cap: 'Retorno', doDa: 'do retorno', o: 'o', dutado: 'retorno dutado' };
  }
  function soExaustao(v) { return !!(v && v.r && v.r.res && v.r.e.ar.modo === 'ventilacao' && !(v.r.res.amb.Q > 0)); }

  // v3.3.4 (pedido do Francisco, 2026-11-17: memorial só com contas, resultados e fontes): na folha, a 2ª linha das
  // verificações fica só com dado (Ez, número de grelhas, limite acústico) e o limite perde a qualificação; a tela Seleção mantém tudo
  var OBS_FOLHA = { nGrelhas: true, ez: true, acusticaTotal: true };
  function verifsFolha(vs) {
    return vs.map(function (x) {
      var y = {}; Object.keys(x).forEach(function (k) { y[k] = x[k]; });
      y.obs = OBS_FOLHA[x.id] && x.obs ? String(x.obs).split('; cada parcela')[0] : '';
      if (typeof y.limiteTxt === 'string') y.limiteTxt = y.limiteTxt.replace('; prática de projeto, sem norma', '').replace(' (critério do app)', '');
      return y;
    });
  }

  // Balanceamento: n bocas, faixa de TAB e registro no ramal (NBR 16401-1, p. 38, l. 16 e p. 22, l. 19)
  function subBalanceamento(v, n, k) {
    var e = v.r.e, a = v.r.res.amb, s = v.sup, r = v.ret, tol = D.dados.normas.nbr16401_1.tab.tolerancia, l = [], X = sai(a);
    function faixa(q) { return 'faixa de TAB ±' + f.num(tol * 100, 0) + ' %: ' + f.num(q * (1 - tol), 0) + ' a ' + f.num(q * (1 + tol), 0) + ' m³/h (NBR 16401-1, p. 38, l. 16)'; }
    if (s) l.push(linhaCV('Insuflamento', esc(s.n + (s.n === 1 ? ' boca' : ' bocas') + ' de ' + f.num(s.Qp, 0) + ' m³/h; ' + faixa(s.Qp) + '; registro no ramal: ' + (e.crit.regulagemRamal ? 'previsto' : 'não previsto') + ' (NBR 16401-1, p. 29, l. 32)')));
    if (r && a.Qret > 0) l.push(linhaCV(X.Cap, esc(r.n + (r.n === 1 ? ' grelha' : ' grelhas') + ' de ' + f.num(r.Qp, 0) + ' m³/h; ' + faixa(r.Qp) +
      (e.retorno.tipo === 'plenum' ? '; regulagem na própria grelha (NBR 16401-1, p. 22, l. 19)' : '; registro no ramal (NBR 16401-1, p. 29, l. 32)'))));
    return subtitulo(n, k || 8, 'Balanceamento') + tabCV(l);
  }

  // ---------------------------------------------------------------- bases e premissas
  var BASE_NORMAS = 'NBR 16401-1, -2 e -3; NBR 10152; ASHRAE Fundamentals 2021';
  var METODO = 'Interpolação nas tabelas dos catálogos TROX, sem extrapolação; verificações de ruído, perda de carga, velocidade na zona ocupada e T50/L; alternativas em ordem de nota';

  // Premissas curtas, uma linha cada com a fonte (lista aprovada C1–C16); C6 e C16 só quando algum ambiente do escopo usa
  function secaoPremissas(E, indices) {
    var susp = false, ruidoProj = [], parede = false, paredeJunto = false, paredeAfastada = false, catParede = {};
    indices.forEach(function (i) {
      var v = ESC.resolver(E.ambientes[i], E.projeto), e = v.r && v.r.e;
      if (!e) return;
      if (e.geo.montagem === 'suspenso') susp = true;
      if (v.sup && v.sup.grelhaParede) { parede = true; if (v.sup.afastada) paredeAfastada = true; else paredeJunto = true; catParede[v.sup.cand.familia] = true; }
      var apl = D.dados.normas.nbr10152.porId(e.crit.aplicacao);
      if (apl && apl.semNorma) { var t = f.num(e.crit.dbaMax, 0) + ' dB(A) em ' + P.minuscula(apl.nome.replace(/ \(valor de projeto\)$/, '')) + ': valor de projeto.'; if (ruidoProj.indexOf(t) < 0) ruidoProj.push(t); }
    });
    var l = [

    comandos: function (E, U) {
      var lista = [];
      E.ambientes.forEach(function (amb, i) { lista.push({ t: 'Abrir ambiente: ' + amb.nome, fn: function () { location.hash = '#/ambiente/' + i; } }); });
      lista.push({ t: 'Criar ambiente', fn: novoAmbiente });
      if (U.tela === 'ambiente') lista.push({ t: 'Duplicar o ambiente aberto', k: 'Ctrl D', fn: function () { duplicar(U.amb); } });
      H.ui.telaReferencias.SECOES.forEach(function (s) { lista.push({ t: 'Referências: ' + s.titulo, fn: function () { H.ui.telaReferencias.ir(s.id); } }); });
      return lista;
    },

    /* Ajuda (botão do topo): os dois textos de limites são os da aba Ajuda da tela da v2.1.3 (retirada na v3.0.0; paineis.js, renderAjuda), com as trocas
       aprovadas (nomes no lugar das siglas, "nota da solução", "Referências"); "Como usar" é texto novo, com os nomes dos blocos de telas.js. */
    ajuda: [
      { titulo: 'Como usar', html: '<ol class="lista-avisos">' +
        '<li><b>Projeto</b>: nome, responsável e altitude (projeto novo começa em Brasília).</li>' +
        '<li><b>Ambientes</b>: crie um ambiente e preencha os blocos (Geometria e montagem, Ar, Ruído e conforto, Produtos). A faixa no rodapé mostra a solução a cada alteração.</li>' +
        '<li><b>Seleção</b>: a solução adotada, a conta de cada número (clique no número), as alternativas com “adotar” e a planta (arraste um difusor ou uma grelha para ajustar a posição).</li>' +
        '<li><b>Memorial</b>: confira “Antes de emitir” e gere o PDF.</li>' +
        '<li>Salve o arquivo do projeto. Ctrl+K abre a paleta de comandos; Referências traz as tabelas e as fontes.</li></ol>' },
      { titulo: 'O que o app calcula', html: '<ul class="lista-avisos">' +
        '<li>Vazão pelo calor sensível do ambiente, sem ar exterior, sem latente e sem calor ao retorno (Q = Qs·3600/(ρ·cp·ΔT)), com ρ pela altitude e cp do ar úmido; zona ocupada pela postura e pelas paredes externas (NBR 16401-2, p. 8, l. 11); limite de velocidade na zona ocupada pela temperatura operativa (6.3.2.4, F.4) ou sem limite com controle local (6.3.2.3).</li>' +
        '<li>Para cada arranjo (grades n×m; linhas de difusores lineares) e cada tamanho TROX no domínio publicado: velocidade efetiva e no colarinho, Δp, ruído (LN → pressão sonora no ambiente), alcances (mín./máx.; × 0,707 em jato livre — ASHRAE Eq. 12), T50 estimado, comprimento característico L por direção, alcance ÷ comprimento característico (T50/L, ASHRAE), velocidade do ar na zona ocupada (decaimento 1/x — ASHRAE Eq. 4 — e gráfico de jatos opostos da TROX), draft (ASHRAE Fundamentals 2021) e Ez (NBR 16401-3, p. 12, l. 9).</li>' +
        '<li>Verificações: ruído no ambiente (NBR 10152 via 16401-1 7.4.1), velocidade efetiva na boca (prática de projeto), Δp, alcance ÷ comprimento característico (T50/L), velocidade do ar na zona ocupada (NBR 16401-2), draft, alcance ≤ 1,5·altura, compatibilidade com o vão, Ez, regulagem de vazão (9.1.2), registro ≤ 50 % (10.6.2), validade de ΔT e de pé-direito do catálogo.</li>' +
        '<li>Retorno com engenharia: número mínimo de grelhas (1 por 2 difusores; 40 m² por grelha), posicionamento fora dos jatos de insuflamento (campo de velocidade no teto, curto-circuito — NBR 16401-1, p. 22, l. 19), cobertura (difusor a ≤ 7 m da grelha), espaçamento, formato, forro modular, velocidade de face por posição, Ez com o retorno alto ou baixo, balanceamento (um ramal por grelha, TAB ±10 %).</li>' +
        '<li>Nota da solução de 0 a 100 com pesos editáveis; fatores por reprovação, dado estimado e regra estendida; ranking com faixa de equivalência.</li></ul>' },
      { titulo: 'O que o app não calcula (limites declarados)', html: '<ul class="lista-avisos">' +
        '<li>T50 (alcance a 0,25 m/s): a TROX publica alcances a 0,5/0,3 m/s (ADLQ e ADLR) e 0,5 m/s (ADE); o T50 é estimado pelo decaimento v ∝ 1/x e é um limite superior, declarado como nota de método (não muda o selo nem a nota). ADPI numérico não é apresentado.</li>' +
        '<li>Correção do alcance por ΔT e por altura de instalação: não publicadas pela TROX — não aplicadas (alerta quando a instalação difere de 3 m).</li>' +
        '<li>Área efetiva das grelhas de retorno (não publicada): velocidade sobre a área bruta, com as faixas definidas para área bruta.</li>' +
        '<li>Alta indução (FD, VDW, VD): os catálogos só trazem diagramas — os dados são digitalizados (VD e FD dos traços vetoriais do PDF; VDW da imagem, ±5 %, até +6 % em dois tamanhos). VD apenas em resfriamento (descarga horizontal); correções de registro parcial e ajuste dos anéis de lâminas do VDW não aplicadas. XARTO fora do app: a ficha não publica dados de jato.</li>' +
        '<li>ADLR: tabela de seleção TROX C2-006; quatro células com erro de impressão e a célula do tamanho 2 a 400 m³/h (Δp e dB(A) iguais aos de 450 m³/h, mantidos como impressos) são interpretadas como premissa declarada, com o valor do gráfico ou dos vizinhos ao lado: aparecem em Referências, Base TROX, e geram alerta na alternativa que as usa. ADLQ e grelhas: as células em que o valor impresso cai com a vazão entram como impressas e estão listadas em Referências, Base TROX. Registro parcial, captor e plenum: correções lidas dos gráficos da C2-005 (estimadas). ALS: a tabela da C2-006 (p. 2) ainda não é usada pelo app — não selecionável.</li>' +
        '<li>PMV/SET, velocidade no tornozelo, gradiente vertical e assimetria radiante (NBR 16401-2), vazão de ar exterior (NBR 16401-3), dimensionamento de dutos e ruído de dutos (NBR 16401-1) — ver Referências.</li>' +
        '<li>Fora do domínio publicado nas tabelas, o resultado é “sem solução” — não há extrapolação.</li></ul>' +
        '<p class="fraco">Os parâmetros das normas (NBR 16401-2/-3, ASHRAE) foram lidos das edições de 2024/2021 e ficam em Referências, só para leitura; os da NBR 10152 foram conferidos com a edição 2017 (versão corrigida 2020), Tabela 3; as classes de velocidade das bocas são prática de projeto, a conferir.</p>' }
    ],
    atalhos: [
      { tecla: 'd', quando: function (U) { return U.tela === 'ambiente'; }, fn: function (E, U) { duplicar(U.amb); } }
    ],

    // A casca avisa quando a tela acabou de ser refeita: liga o arraste da planta (?clicar= é da casca)
    depoisDeDesenhar: function () { ligarPlanta(); },

    // Parâmetro de teste (conferir.ps1), como o ?importar= da casca
    parametros: {
      // ?importar-ct=<base64 de um JSON em UTF-8>: roda a importação da carga térmica depois do 1º desenho e vai a #/ambientes
      'importar-ct': function (valor) {
        setTimeout(function () {
          var texto;
          try { texto = base64Utf8(decodeURIComponent(valor)); } catch (e) { recusarCT(janelaCT('Importação da carga térmica', '(parâmetro ?importar-ct=)', '<p>O parâmetro ?importar-ct= não contém um JSON em base64.</p>')); return; }
          importarCT(texto, '(parâmetro ?importar-ct=)');
        }, 0);
      },
      // ?importar-vent=<base64 de um JSON em UTF-8>: idem, com a importação da ventilação (v3.6.0)
      'importar-vent': function (valor) {
        setTimeout(function () {
          var texto;
          try { texto = base64Utf8(decodeURIComponent(valor)); } catch (e) { recusarCT(janelaCT('Importação da ventilação', '(parâmetro ?importar-vent=)', '<p>O parâmetro ?importar-vent= não contém um JSON em base64.</p>')); return; }
          importarVent(texto, '(parâmetro ?importar-vent=)');
        }, 0);
      }
    },

    validar: function (caminho, v, E) { return CAT.validar(caminho, v, E); },

    aoAlterar: function (caminho, E) {
      var m = /^amb\.(\d+)\.(.+)$/.exec(caminho), amb;
      if (m) {
        amb = E.ambientes[+m[1]];
        if (m[2] === 'geo.postura') amb.geo.zo = null;            // trocar a postura volta a zona ocupada à altura da postura (como na v2.1.3)
        if (m[2] === 'crit.aplicacao') amb.crit.dbaMax = null;    // trocar a aplicação volta o limite de ruído ao da aplicação (idem)
        if (m[2] !== 'nome') descartarManual(amb);
        return;
      }
      if (/^projeto\.config\./.test(caminho)) {                   // configuração não fica vazia: campo apagado volta ao padrão
        var cam = caminho.slice('projeto.config.'.length), v = CAT.ler(E.projeto.config, cam);
        if (v === null || v === undefined) CAT.gravar(E.projeto.config, cam, CAT.padraoConfig(cam));
      }
      // altitude não fica vazia: campo apagado volta à de Brasília, o padrão do projeto novo
      if (caminho === 'projeto.altitude' && (E.projeto.altitude === null || E.projeto.altitude === undefined)) E.projeto.altitude = F4.ALTITUDE_PADRAO;
      if (/^projeto\.(config\.|altitude$)/.test(caminho)) E.ambientes.forEach(descartarManual);
    },

    acoes: {
      // Liga e desliga um valor verdadeiro/falso (família, parede externa, opção de marcar)
      alternar: function (el) { K.alterar(el.getAttribute('data-caminho'), function (t) { t.o[t.k] = !t.o[t.k]; }); },
      // Marca ou limpa um grupo de famílias: data-caminho aponta uma chave do grupo; data-valor = 'sim' | 'nao'
      marcar: function (el) {
        var v = el.getAttribute('data-valor') === 'sim';
        K.alterar(el.getAttribute('data-caminho'), function (t) { Object.keys(t.o).forEach(function (k) { t.o[k] = v; }); });
      },
      // "voltar ao padrão": nas configurações o padrão é um número (o da v2.1.3); nos demais campos, vazio = acompanha o padrão
      voltar: function (el) {
        var caminho = el.getAttribute('data-caminho');
        if (!/^projeto\.config\./.test(caminho)) return K.acoes.voltar(el);
        K.alterar(caminho, function (t) { t.o[t.k] = CAT.padraoConfig(caminho.slice('projeto.config.'.length)); });
        return null;
      },
      'config-padrao': function (el) {
        var E = proj(), n = +el.getAttribute('data-nivel') || 0;
        if (!window.confirm(n ? 'Voltar ao padrão todas as configurações deste nível?' : 'Voltar ao padrão todas as configurações do projeto?')) return;
        K.alterar('projeto.config.alternativas', function () { CAT.restaurar(E.projeto.config, n); });
      },
      // Seleção: adotar uma alternativa (o retorno é refeito para ela), voltar à 1ª opção do app e desfazer os arrastes da planta
      adotar: function (el) {
        var x = ambDaAcao(el), c = x.amb ? candDaLista(x.amb, x.E, el.getAttribute('data-lista'), +el.getAttribute('data-i')) : null;
        if (c) { ESC.adotar(x.amb, x.E.projeto, c); K.guardar(); }
      },
      'adotar-ret': function (el) {
        var x = ambDaAcao(el), s = x.amb ? ESC.resolver(x.amb, x.E.projeto).retLista[+el.getAttribute('data-i')] : null;
        if (s) { ESC.adotarRet(x.amb, x.E.projeto, s.cand); K.guardar(); }
      },
      'voltar-primeira': function (el) { var x = ambDaAcao(el); if (x.amb) { ESC.voltarPrimeira(x.amb); K.guardar(); } },
      'restaurar-pos': function (el) { var x = ambDaAcao(el); if (x.amb) { ESC.restaurar(x.amb, x.E.projeto); K.guardar(); } },
      'restaurar-ret': function (el) { var x = ambDaAcao(el); if (x.amb) { ESC.restaurarRet(x.amb); K.guardar(); } },
      // Celular (M4, F4): liga e desliga o arraste na planta; a tela é redesenhada com o botão e a planta no estado novo
      'mover-planta': function () { H.ui.planta3.movendo = !H.ui.planta3.movendo; },
      // Memorial: baixa as alternativas em CSV (todos os ambientes, ou só o de data-amb)
      'csv-alternativas': function (el) { var a = el.getAttribute('data-amb'); TM.csv(proj(), a === null || a === '' ? undefined : +a); return null; },
      // Referências: botão de seção (rola até o id) e exportação da base TROX em JSON
      'ir-referencia': function (el) { H.ui.telaReferencias.ir(el.getAttribute('data-ref')); return null; },
      'exportar-base': function () { D.util.projeto.baixar('base-trox.json', JSON.stringify(D.dados, null, 1)); return null; },
      // Ambientes: importar ambientes de um arquivo da carga térmica (campo de arquivo próprio); o relatório salva pelo botão da casca
      'importar-ct': function () {
        var campo = document.createElement('input');
        campo.type = 'file'; campo.accept = '.json,application/json'; campo.style.display = 'none';
        campo.addEventListener('change', function () {
          var arq = campo.files && campo.files[0];
          if (!arq) { campo.remove(); return; }
          var leitor = new FileReader();
          leitor.onload = function () { importarCT(String(leitor.result).replace(/^\uFEFF/, ''), arq.name); campo.remove(); };
          leitor.readAsText(arq);
        });
        document.body.appendChild(campo);
        campo.click();
        return null;
      },
      // Ambientes: importar as vazões de um arquivo "Exportar vazões" do app de Ventilação (v3.6.0)
      'importar-vent': function () { escolherJson(importarVent); return null; },
      // Ambiente importado: grava no campo Largura a sugestão (área da carga térmica ou da ventilação ÷ comprimento), pelo caminho de um campo digitado
      'usar-largura': function (el) {
        var x = ambDaAcao(el), A = x.amb ? (x.amb.areaCT > 0 ? x.amb.areaCT : x.amb.areaVent) : null, w = x.amb ? D.util.importaCT.larguraSugerida(A, x.amb.geo.C) : null;
        if (w !== null) K.alterar('amb.' + x.i + '.geo.W', function (t) { t.o[t.k] = w; });
        return null;
      },
      'novo-amb': novoAmbiente,
      duplicar: function (el) { duplicar(+el.getAttribute('data-amb')); },
      excluir: function (el) {
        var E = proj(), i = +el.getAttribute('data-amb');
        if (E.ambientes.length > 1 && window.confirm('Excluir o ambiente “' + E.ambientes[i].nome + '”?')) { E.ambientes.splice(i, 1); U.delta = 0; K.guardar(); }
      },
      'novo-projeto': function () {
        if (!window.confirm('Começar um projeto novo? O projeto aberto sai da tela (salve o arquivo antes, se quiser guardá-lo).')) return;
        var E = proj(), novo = F4.novoProjeto();
        E.projeto = novo.projeto; E.ambientes = novo.ambientes; U.erros = {}; U.importacao = null; K.guardar();
        location.hash = '#/projeto';
      }
    }
  };
})(window.HVAC, window.Difusores);

</script>
<script>window.HVAC.ui.iniciar();</script>
</body>
</html>
